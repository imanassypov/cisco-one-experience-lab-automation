---
# Static Ansible inventory — the only inventory source for this project.
# Every stage talks to Catalyst Center over its API, so localhost is the only
# host. Stage 12 used to SSH to the Site 105 switches; it now collects their
# CLI through Catalyst Center Command Runner, so no device credentials or
# reachability to 198.18.128.x are needed from the control node.
# MCP bastion/Splunk: utils/mcp-ssh-server/inventory/static_hosts.yml (not Ansible).
all:
  children:
    # Host name must differ from the group name, otherwise Ansible warns
    # "Found both group and host with same name". Playbooks target the group.
    catalyst_center:
      hosts:
        catalyst_center_api:
          ansible_host: localhost
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
