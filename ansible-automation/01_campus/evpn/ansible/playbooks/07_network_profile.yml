---
# =============================================================================
# 07_network_profile.yml  —  Pipeline stage 07
# =============================================================================
# Creates the network profiles that join a SITE to the TEMPLATES from stage 06.
# Without a profile, stage 08 provisioning has nothing to push.
#
# Three things are built here, in order, because each needs the one before:
#   wireless design   SSIDs and FlexConnect settings — a profile cannot
#                     reference an SSID that does not exist yet
#   switching profile binds the Day-N template to the site
#   wireless profile  binds the SSID to the site. A controller cannot manage a
#                     site's APs until this exists (stage 08 fails without it)
#
# The SSID name carries a {POD} token that is replaced from lab.yml at load
# time, so pod 12 becomes PSEUDOCO-POD12. The WLC is SHARED between students:
# changing your pod number after running this leaves the old SSID behind.
#
# Two FlexConnect settings are written with raw REST because the design module
# has no field for them: the native VLAN and the AAA VLAN-name override.
#
# Depends on: stage 06
# Run: ansible-playbook playbooks/07_network_profile.yml
# =============================================================================
- name: Create and Assign Network Profiles from settings.json
  hosts: catalyst_center
  gather_facts: false
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  module_defaults:
    cisco.dnac.network_profile_switching_workflow_manager:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
      dnac_log_level: "{{ dnac_log_level }}"
      dnac_log: "{{ dnac_log }}"
    cisco.dnac.wireless_design_workflow_manager:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
      dnac_log_level: "{{ dnac_log_level }}"
      dnac_log: "{{ dnac_log }}"
    cisco.dnac.network_profile_wireless_workflow_manager:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
      dnac_log_level: "{{ dnac_log_level }}"
      dnac_log: "{{ dnac_log }}"
    cisco.catalystcenter.sites_info:
      catalystcenter_host: "{{ catc_host }}"
      catalystcenter_username: "{{ catc_username }}"
      catalystcenter_password: "{{ catc_password }}"
      catalystcenter_verify: "{{ catc_verify }}"
      catalystcenter_port: "{{ catc_port }}"
      catalystcenter_version: "{{ catc_version }}"
      catalystcenter_debug: "{{ catc_debug }}"
  pre_tasks:
    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: network_profile
