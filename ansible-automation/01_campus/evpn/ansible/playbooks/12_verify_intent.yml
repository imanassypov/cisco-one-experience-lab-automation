---
# =============================================================================
# 12_verify_intent.yml  —  Pipeline stage 12
# =============================================================================
# Checks that what the fabric is RUNNING matches what the pipeline DECLARED,
# and writes a report. Read-only: it issues GETs and show commands, nothing
# else.
#
#   what was declared                    what is running
#   ─────────────────                    ───────────────
#   settings.json  SSID, VLANs, APs      show vrf / vlan / nve peers /
#   DEFN-*.j2      VRFs, VNIs, ports     bgp summary / ap summary …
#            │                                   │
#            └─────────►  compare  ◄──────────┘
#                            evidence/stage12-verification.{md,html}
#
# The templates are read from Catalyst Center, NOT from this checkout, so a
# template you edited locally and never synced cannot produce a false pass.
#
# Device output comes through Catalyst Center Command Runner, so this stage
# needs no SSH to any switch, and is parsed with Genie rather than matched as
# text — the checks assert on operational state (is the tunnel up) rather than
# on configuration lines (was it configured).
#
# A mismatch is REPORTED, not fatal: the run ends successfully with the verdict
# as its last line. Add -e verify_fail_on_mismatch=true to gate a pipeline.
#
# Depends on: stages 01-10. Run it after stage 09, never during — a fabric
# mid-reload fails every check.
#
# Run: ansible-playbook playbooks/12_verify_intent.yml
# =============================================================================
- name: Verify deployed fabric against declared intent
  hosts: catalyst_center
  gather_facts: false
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  pre_tasks:
    - name: Obtain Catalyst Center auth token
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: auth_token

    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: verify_intent
