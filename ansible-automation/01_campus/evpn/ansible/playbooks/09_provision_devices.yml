---
# =============================================================================
# 09_provision_devices.yml  —  Pipeline stage 09
# =============================================================================
# Provisions fabric devices to their sites in two passes.
#
# Wired devices go through the SDA provisionDevices API, applying the network
# settings from stage 02 and the profile from stage 08. Wireless controllers
# cannot use that API — it has no way to set a wireless DeviceInfo role and
# answers NCWL10092 — so they are deferred to a second pass built on
# provision_workflow_manager, which also assigns their managed AP locations.
#
# Role: provision_devices
#   wired    — roles/provision_devices/tasks/provision_site.yml (per site)
#   wireless — roles/provision_devices/tasks/provision_wireless.yml (once)
#
# The wired pass calls the Catalyst Center REST API directly with a bearer
# token; module_defaults below apply only to the wireless pass, which uses a
# workflow manager module and therefore needs per-module credentials.
#
# Sourced (pre_tasks, order matters):
#   catc_common tasks_from: auth_token    → _catc_token (X-Auth-Token for raw uri calls)
#   catc_common tasks_from: load_settings → settings_data
#   settings.json → settings_data.project[]:
#     device_list — comma-separated management IPs
#     HierarchyParent/Area/Bldg/Floor — composed into the target site path
#     wireless_controller — optional; managed_ap_locations, skip_ap_provision,
#                           rolling_ap_upgrade for the WLC in that row
#   connection.yml:
#     force_reprovision (false) — set true to re-provision already-provisioned
#       devices; also drives force_provisioning on the wireless pass
#     wireless_provision_enabled (true) — set false to leave WLCs alone
#     task_poll_retries (60), task_poll_delay (10) — async task polling
#     dnac_host/port/version/verify
#   Lab Topology/lab_access.yml (vault): Catalyst Center username/password
#
# Produced:
#   _site_device_map       — { "<site path>": ["198.19.1.3", "198.19.1.4"] }
#   _wlc_provision_config  — one provision_workflow_manager entry per controller
#   In Catalyst Center: devices in PROVISIONED state with site settings and the
#   switching profile applied — the precondition for stage 10 template deploy —
#   and controllers provisioned with the AP locations they serve.
#
# Provisioning a controller reboots its APs when the managed AP locations
# change; the lab documents a 1-3 minute rejoin.
#
# Depends on: stages 01, 02, 05 and 08
# Modules: cisco.dnac.provision_workflow_manager (wireless pass only)
#
# Run: ansible-playbook playbooks/09_provision_devices.yml
#      ansible-playbook playbooks/09_provision_devices.yml -e force_reprovision=true
#      ansible-playbook playbooks/09_provision_devices.yml -e wireless_provision_enabled=false
# =============================================================================
- name: Provision Devices to Site in Catalyst Center from settings.json
  hosts: catalyst_center
  gather_facts: false
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  module_defaults:
    cisco.dnac.provision_workflow_manager:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
      dnac_log_level: "{{ dnac_log_level }}"
      dnac_log: "{{ dnac_log }}"
  pre_tasks:
    - name: Obtain Catalyst Center auth token
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: auth_token

    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: provision_devices
