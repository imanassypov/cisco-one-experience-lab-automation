---
# =============================================================================
# 01_site_hierarchy.yml  —  Pipeline stage 01
# =============================================================================
# Builds the Catalyst Center site tree: area → building → floor.
#
# Run this first. Every later stage finds its devices by site path, so nothing
# downstream resolves until these paths exist.
#
#   settings.json project[]              role: site_hierarchy
#   ─────────────────────────────────  ───────────────────
#   HierarchyParent / Area / Bldg / Floor  ──►  create each missing site,
#   HierarchyBldgAddress / Lat / Long          parents before children
#
# EXISTING SITES ARE SKIPPED, NOT UPDATED. The lab appliance already ships this
# tree, so a clean run reports "Created 0, updated 0, skipped 16" with
# changed=0 — that is success, not a no-op failure. Opt in to updating existing
# buildings and floors with -e site_hierarchy_update_existing=true.
#
# -e state=deleted removes the tree instead, children first. It refuses to run
# if a targeted parent holds a site this pipeline does not manage.
#
# Run: ansible-playbook playbooks/01_site_hierarchy.yml
# =============================================================================
- name: Build Catalyst Center Site Hierarchy from settings.json
  hosts: catalyst_center
  gather_facts: false
  module_defaults:
    cisco.catalystcenter.sites_info: &catc_auth
      catalystcenter_host: "{{ catc_host }}"
      catalystcenter_username: "{{ catc_username }}"
      catalystcenter_password: "{{ catc_password }}"
      catalystcenter_verify: "{{ catc_verify }}"
      catalystcenter_port: "{{ catc_port }}"
      catalystcenter_version: "{{ catc_version }}"
      catalystcenter_debug: "{{ catc_debug }}"
    cisco.catalystcenter.site_workflow_manager: *catc_auth
  pre_tasks:
    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: site_hierarchy
