---
# =============================================================================
# 09_swim.yml  —  Pipeline stage 09
# =============================================================================
# Software Image Management for the campus fabric, so the switches run an image
# whose YANG coverage matches what assurance expects.
#
# Images are declared once in settings.json under the top-level swim_catalog;
# each project names the catalog ids it wants. Nothing is passed on the command
# line except the safety gates.
#
# Phases (role: swim):
#   09.1 preflight       resync inventory, baseline IMAGE compliance  read-only
#   09.2 import_and_tag  pull the image, mark it golden               CatC only
#   09.3 distribute      copy to device flash, no reload              safe
#   09.4 activate        reload onto the new image                    DISRUPTIVE
#   09.5 postcheck       IMAGE compliance after activation            read-only
#   09.6 rollback        re-tag previous image and activate it        DISRUPTIVE
#
# *** A DEFAULT RUN RELOADS THE FABRIC. ***
# Phases 09.1-09.5 all run with no extra flags, so one command performs the
# whole upgrade. Add -e swim_activate=false to stage the image in flash and stop
# before the reload — that is the safe business-hours run.
#
# *** THE WIRELESS CONTROLLER IS IN SCOPE. ***
# DC-Site-10 upgrades the C9800-CL, which serves the Site-105 access points. In
# a full 00_site_deploy.yml build that reload lands before stage 11 waits for
# the APs, so the wait absorbs it. Running stage 09 on its own AFTER the APs
# have joined will drop them until they rejoin.
#
# Rollback is the exception and stays gated behind three explicit flags: making
# a downgrade as easy as an upgrade is how a fabric gets reverted by accident.
#
# Import source is `remote`: Catalyst Center pulls each .bin over HTTP from the
# script server, published on port 8080 by 00_scriptserver_bootstrap. The `CCO`
# source is supported by the role but refused by this cluster — every image
# comes back NCSW10375 "not the latest or suggested image from cisco", even
# builds its own catalogue flags as recommended.
#
# Sourced:
#   Lab Topology/lab_access.yml (vault) — Catalyst Center username/password
#   settings.json (via catc_common.load_settings)
#     settings_data.swim_catalog
#       {import_source, image_base_url, images[]}
#       images[]: {id, image_file, image_version, rollback_image_file,
#                  rollback_image_version, device_role,
#                  device_image_family_name, device_family_name,
#                  device_series_name, activate_lower_image_version,
#                  device_upgrade_mode, distribute_if_needed}
#     settings_data.project[].swim = {enabled, images[]}
#       The site scopes are DERIVED from the project's Hierarchy* fields:
#       the building is the golden-tag scope, the floor is the upgrade target.
#
# Produced:
#   evidence/<run_id>-09_swim-<phase>.json per phase
#   In Catalyst Center: image imported, tagged golden, distributed, optionally
#   activated.
#
# gather_facts is true — ansible_date_time supplies swim_run_id.
# Modules: cisco.catalystcenter.swim_workflow_manager, inventory_workflow_manager,
#          network_compliance_workflow_manager, and the read-only *_info lookups
#          the role asserts on (sites_info, site_wise_product_names_info,
#          swim_image_details_info, network_device_images_info).
#
# cisco.catalystcenter rather than cisco.dnac, which every other stage uses.
# cisco.dnac 6.46.0 crashes golden tagging with
#   TypeError: 'NoneType' object is not iterable
# at swim_workflow_manager.py:3380, because it does
# tagging_details.get("device_tags") with no default and then iterates it.
# cisco.catalystcenter 2.11.0 fixed exactly that (line 4280 defaults to []
# and skips device-tag filtering when empty).
#
# Depends on: stages 01-08. Every SWIM call targets devices by site plus
# family/series/role, so devices must already be discovered, managed and
# assigned to the site.
#
# Runs before stage 10 on purpose: the switches should be on their intended
# image before EVPN and telemetry configuration is pushed onto them.
#
# Included in 00_site_deploy.yml, which means a full site build reloads the
# fabric here. Build without an image change using:
#   ansible-playbook playbooks/00_site_deploy.yml -e swim_activate=false
#
# Run — full upgrade, RELOADS every device (default):
#   ansible-playbook playbooks/09_swim.yml
#
# Run — stage the image in flash only, no reload (safe any time):
#   ansible-playbook playbooks/09_swim.yml -e swim_activate=false
#
# Run — one device type only, by swim_catalog id (switches without the WLC):
#   ansible-playbook playbooks/09_swim.yml -e swim_images=c9300-26.01.02
#
# Run — emergency rollback to the previous image (RELOADS every device):
#   ansible-playbook playbooks/09_swim.yml \
#     -e swim_rollback=true -e swim_rollback_confirm=YES -e swim_reload_ack=RELOAD_OK
#
# Run — a single phase:
#   ansible-playbook playbooks/09_swim.yml --tags swim_distribute
#   ansible-playbook playbooks/09_swim.yml -e catc_debug=true
# =============================================================================
- name: Campus fabric software image management
  hosts: catalyst_center
  gather_facts: true
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  module_defaults:
    # Read-only lookups the role asserts on. This collection ships no
    # module_defaults action group, so each one has to be named — and the
    # auto-generated *_info modules REJECT catalystcenter_log and
    # catalystcenter_log_level, so those two cannot be in the shared anchor.
    cisco.catalystcenter.sites_info: &catc_read
      catalystcenter_host: "{{ catc_host }}"
      catalystcenter_username: "{{ catc_username }}"
      catalystcenter_password: "{{ catc_password }}"
      catalystcenter_verify: "{{ catc_verify }}"
      catalystcenter_port: "{{ catc_port }}"
      catalystcenter_version: "{{ catc_version }}"
      catalystcenter_debug: "{{ catc_debug }}"
    cisco.catalystcenter.site_wise_product_names_info: *catc_read
    cisco.catalystcenter.swim_image_details_info: *catc_read
    cisco.catalystcenter.network_device_images_info: *catc_read
    cisco.catalystcenter.swim_workflow_manager: &catc_conn
      <<: *catc_read
      catalystcenter_log_level: "{{ dnac_log_level }}"
      catalystcenter_log: "{{ dnac_log }}"
    cisco.catalystcenter.inventory_workflow_manager: *catc_conn
    cisco.catalystcenter.network_compliance_workflow_manager: *catc_conn
  pre_tasks:
    # tags: always — a tag-filtered run such as --tags swim_import would
    # otherwise skip this, leaving settings_data unset and the role failing
    # with "No project in settings.json has swim.enabled = true".
    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
      tags: [always]
  roles:
    - role: swim
