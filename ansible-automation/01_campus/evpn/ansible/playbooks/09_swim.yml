---
# =============================================================================
# 09_swim.yml  —  Pipeline stage 09: software image management (SWIM)
# =============================================================================
# Upgrades the campus devices onto the IOS-XE image declared in settings.json.
#
# Ansible never touches a switch here. It tells Catalyst Center which image
# should be the standard for a site, and Catalyst Center does the work.
#
#   settings.json                  role: swim              Catalyst Center
#   ─────────────                  ──────────              ───────────────
#   swim_catalog.images[]  ──┐
#     the .bin files to use  ├──►  build a job per  ──►  1 import   .bin into the
#   project[].swim.images  ──┘     (site x image),         image repository
#     which site wants which       then run phases    ──►  2 tag      golden for the site
#                                  1-3 in order       ──►  3 distribute into flash
#                                                     ──►  4 activate  = RELOAD
#
# Each job also needs two Catalyst Center site paths, and the role derives both
# from the project's Hierarchy* fields: the BUILDING is where the image is
# tagged as the site standard, the FLOOR is where the devices to upgrade live.
#
# *** A PLAIN RUN RELOADS EVERY DEVICE IT UPGRADES. ***
# That includes the wireless controller, so its access points drop and rejoin.
# `-e swim_activate=false` stops after the flash copy: nothing on a device
# changes, so it is safe to run at any time.
#
# Run it:
#   ansible-playbook playbooks/09_swim.yml                         # upgrade, RELOADS
#   ansible-playbook playbooks/09_swim.yml -e swim_activate=false  # stage only, safe
#   ansible-playbook playbooks/09_swim.yml -e swim_images=c9300-26.01.02
#
# Prerequisites, rollback, every knob and what each failure means: see the
# "Stage 09" section of ../README.md.
#
# Uses cisco.catalystcenter rather than the cisco.dnac the other stages use:
# dnac 6.46.0 crashes golden tagging when a config has no device_tags.
# =============================================================================
- name: Campus fabric software image management
  hosts: catalyst_center
  gather_facts: false
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  module_defaults:
    # Read-only lookups the role asserts on. This collection ships no
    # module_defaults action group, so each one has to be named — and the
    # auto-generated *_info modules REJECT catalystcenter_log and
    # catalystcenter_log_level, so those two cannot be in the shared anchor.
    cisco.catalystcenter.sites_info: &catc_read
      catalystcenter_host: "{{ catc_host }}"
      catalystcenter_username: "{{ catc_username }}"
      catalystcenter_password: "{{ catc_password }}"
      catalystcenter_verify: "{{ catc_verify }}"
      catalystcenter_port: "{{ catc_port }}"
      catalystcenter_version: "{{ catc_version }}"
      catalystcenter_debug: "{{ catc_debug }}"
    cisco.catalystcenter.site_wise_product_names_info: *catc_read
    cisco.catalystcenter.swim_image_details_info: *catc_read
    cisco.catalystcenter.network_device_images_info: *catc_read
    cisco.catalystcenter.swim_workflow_manager:
      <<: *catc_read
      catalystcenter_log_level: "{{ dnac_log_level }}"
      catalystcenter_log: "{{ dnac_log }}"
  pre_tasks:
    # tags: always — a tag-filtered run such as --tags swim_import would
    # otherwise skip this, leaving settings_data unset and the role failing
    # with "No project in settings.json has swim.enabled = true".
    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
      tags: [always]
  roles:
    - role: swim
