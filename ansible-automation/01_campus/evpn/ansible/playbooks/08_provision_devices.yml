---
# =============================================================================
# 08_provision_devices.yml  —  Pipeline stage 08
# =============================================================================
# Provisions fabric devices to their sites in three passes.
#
# Wired devices go through the SDA provisionDevices API, applying the network
# settings from stage 02 and the profile from stage 07. Wireless controllers
# cannot use that API — it has no way to set a wireless DeviceInfo role and
# answers NCWL10092 — so they are deferred to a second pass built on
# provision_workflow_manager, which also assigns their managed AP locations.
# Access points follow in a third pass that names them and assigns them to
# their site, which is what makes Catalyst Center push a policy and site tag
# for them; there is no way to set either tag directly.
#
# Role: provision_devices
#   wired    — roles/provision_devices/tasks/provision_site.yml (per site)
#   wireless — roles/provision_devices/tasks/provision_wireless.yml (once)
#   APs      — roles/provision_devices/tasks/provision_accesspoints.yml (once)
#
# The wired pass calls the Catalyst Center REST API directly with a bearer
# token; module_defaults below apply to the two wireless passes, which use
# workflow manager modules and therefore need per-module credentials.
#
# Sourced (pre_tasks, order matters):
#   catc_common tasks_from: auth_token    → _catc_token (X-Auth-Token for raw uri calls)
#   catc_common tasks_from: load_settings → settings_data
#   settings.json → settings_data.project[]:
#     device_list — comma-separated management IPs
#     HierarchyParent/Area/Bldg/Floor — composed into the target site path
#     wireless_controller — optional; managed_ap_locations, skip_ap_provision,
#                           rolling_ap_upgrade for the WLC in that row
#     access_points — optional; name, location, mode and site per AP, keyed by
#                     the AP's Ethernet MAC from lab.yml via an {APn_MAC} token
#   connection.yml:
#     force_reprovision (false) — set true to re-provision already-provisioned
#       devices; also drives force_provisioning on the wireless pass
#     wireless_provision_enabled (true) — set false to leave WLCs alone
#     ap_provision_enabled (true) — set false to leave APs alone
#     task_poll_retries (60), task_poll_delay (10) — async task polling
#     dnac_host/port/version/verify
#   Lab Topology/lab_access.yml (vault): Catalyst Center username/password
#
# Produced:
#   _site_device_map       — { "<site path>": ["198.19.1.3", "198.19.1.4"] }
#   _wlc_provision_config  — one provision_workflow_manager entry per controller
#   _ap_config             — one accesspoint_workflow_manager entry per AP
#   _ap_provision_config   — one wireless_access_points_provision call per site
#   In Catalyst Center: devices in PROVISIONED state with site settings and the
#   switching profile applied — the precondition for stage 09 template deploy —
#   controllers provisioned with the AP locations they serve, and APs named,
#   assigned to their site, and provisioned so their policy and site tags exist
#   and they actually broadcast the SSID.
#
# Provisioning a controller reboots its APs when the managed AP locations
# change, and assigning an AP to a new site reboots that AP; the lab documents
# a 1-3 minute rejoin for both.
#
# Depends on: stages 01, 02, 05 and 07
# Modules: cisco.dnac.provision_workflow_manager (wireless pass)
#          cisco.dnac.accesspoint_workflow_manager (AP pass, naming only)
#          cisco.dnac.site_info + assign_device_to_site (AP site assignment)
#          cisco.catalystcenter.wireless_access_points_provision (AP provision;
#            needs collection 2.11.0+, and the cisco.dnac module of the same
#            name will not work — see provision_accesspoints.yml Step G)
#
# Run: ansible-playbook playbooks/08_provision_devices.yml
#      ansible-playbook playbooks/08_provision_devices.yml -e force_reprovision=true
#      ansible-playbook playbooks/08_provision_devices.yml -e wireless_provision_enabled=false
#      ansible-playbook playbooks/08_provision_devices.yml -e ap_provision_enabled=false
# =============================================================================
- name: Provision Devices to Site in Catalyst Center from settings.json
  hosts: catalyst_center
  gather_facts: false
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  module_defaults:
    cisco.dnac.provision_workflow_manager:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
      dnac_log_level: "{{ dnac_log_level }}"
      dnac_log: "{{ dnac_log }}"
    cisco.dnac.accesspoint_workflow_manager:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
      dnac_log_level: "{{ dnac_log_level }}"
      dnac_log: "{{ dnac_log }}"
    cisco.dnac.site_info:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
    cisco.dnac.assign_device_to_site:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
    # The AP provision step is the one task on the cisco.catalystcenter
    # collection, so it takes catalystcenter_* parameter names. Values are the
    # same connection; catalystcenter_debug is fed from dnac_debug rather than
    # catc_debug because this play redefines catc_debug as its own verbose-output
    # switch.
    cisco.catalystcenter.wireless_access_points_provision:
      catalystcenter_host: "{{ catc_host }}"
      catalystcenter_username: "{{ catc_username }}"
      catalystcenter_password: "{{ catc_password }}"
      catalystcenter_verify: "{{ catc_verify }}"
      catalystcenter_port: "{{ catc_port }}"
      catalystcenter_version: "{{ catc_version }}"
      catalystcenter_debug: "{{ dnac_debug }}"
  pre_tasks:
    - name: Obtain Catalyst Center auth token
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: auth_token

    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: provision_devices
