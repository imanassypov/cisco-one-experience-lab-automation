---
# =============================================================================
# 08_provision_devices.yml  —  Pipeline stage 08
# =============================================================================
# Provisions devices: applies the stage 02 settings and the stage 07 profile to
# each device, at its site.
#
# THREE PASSES, because Catalyst Center treats the device types differently:
#   wired     provision_switches.yml     the SDA provision API
#   wireless  provision_wireless.yml     a different API — the SDA one cannot
#                                        express a controller and rejects it
#   APs       provision_accesspoints.yml name it, assign it to a site, provision
#                                        it — which is the only way Catalyst
#                                        Center creates its policy and site tags
#
# Each pass can be turned off: -e wireless_provision_enabled=false,
# -e ap_provision_enabled=false.
#
# ⚠ Provisioning a controller REBOOTS the access points it manages, and
# assigning an AP to a new site reboots that AP. Expect a 1-3 minute rejoin.
# The controller is shared between students, so prefer the -e flags above over
# re-provisioning it by hand in the UI.
#
# On the FIRST run leave lab_ap_macs empty: no AP has joined yet, because the
# switch port it hangs off is not configured until stage 10. Stage 11 fills the
# MACs in and runs the AP pass for you.
#
# Depends on: stages 01, 02, 05 and 07
# Run: ansible-playbook playbooks/08_provision_devices.yml
# =============================================================================
- name: Provision Devices to Site in Catalyst Center from settings.json
  hosts: catalyst_center
  gather_facts: false
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  module_defaults:
    cisco.dnac.provision_workflow_manager:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
      dnac_log_level: "{{ dnac_log_level }}"
      dnac_log: "{{ dnac_log }}"
    cisco.dnac.accesspoint_workflow_manager:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
      dnac_log_level: "{{ dnac_log_level }}"
      dnac_log: "{{ dnac_log }}"
    cisco.dnac.site_info:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
    cisco.dnac.assign_device_to_site:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
    # The two modules below are resource modules, not workflow managers: their
    # argument spec is dnac_argument_spec(), which has no logging parameters.
    cisco.dnac.wireless_controllers_assign_managed_ap_locations:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
    cisco.dnac.wireless_controllers_managed_ap_locations_count_info:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
  pre_tasks:
    - name: Obtain Catalyst Center auth token
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: auth_token

    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: provision_devices
