---
# =============================================================================
# 00_site_deploy.yml  —  Full pipeline orchestrator (stages 01–12)
# =============================================================================
# Builds a Catalyst Center deployment end-to-end by importing each stage
# playbook in dependency order. The orchestrator itself declares no vars and
# calls no roles — every stage loads its own vault and settings.json.
#
# Sourced (indirectly, per imported stage):
#   CICD Pipeline/Settings/settings.json      — declarative source of truth
#   inventory/group_vars/catalyst_center/     — connection.yml
#   Lab Topology/lab_access.yml               — CatC username/password (vault)
#
# Produced (cumulative state in Catalyst Center):
#   site hierarchy → network settings → credentials → discovered devices →
#   site assignments → synced templates → network profiles → provisioned
#   devices → upgraded images → deployed Day-N composite templates →
#   provisioned access points → verification evidence
#
# Order is significant — each stage consumes objects created by the previous:
#   01 hierarchy → 02 settings → 03 credentials → 04 discovery → 05 assign
#   → 06 templates → 07 profiles → 08 provision → 09 SWIM → 10 composite deploy
#   → 11 access points → 12 verify
#
# Stage 09 sits before the composite deploy on purpose: the switches should be
# running their intended image before EVPN and telemetry configuration is
# pushed onto them, not after.
#
# 🛑 Stage 09 RELOADS the switches. Activation is default-on, so a plain run of
# this orchestrator upgrades and reboots the fabric between stages 08 and 10.
# To build the site without an image change:
#   ansible-playbook playbooks/00_site_deploy.yml -e swim_activate=false
#
# ⏳ Stage 11 BLOCKS. A physical access point cannot join until stage 10 turns
# Gi1/0/2 into an AP trunk, so 11 polls Catalyst Center for up to 10 minutes
# (ap_wait_retries × ap_wait_delay) waiting for one to appear, then asserts.
# A pod with no access point cabled will therefore fail here, after the fabric
# is already built. Skip the wait and provision the AP later with:
#   ansible-playbook playbooks/00_site_deploy.yml -e ap_expected_count=0
#
# Stage 12 is read-only, but it fails the run on any mismatch
# (verify_fail_on_mismatch defaults to true). To end with a report instead of
# a failure:
#   ansible-playbook playbooks/00_site_deploy.yml -e verify_fail_on_mismatch=false
#
# Run: ansible-playbook playbooks/00_site_deploy.yml
# =============================================================================
- name: Stage 01 - Site hierarchy
  import_playbook: 01_site_hierarchy.yml

- name: Stage 02 - Network settings
  import_playbook: 02_network_settings.yml

- name: Stage 03 - Credentials
  import_playbook: 03_credentials.yml

- name: Stage 04 - Device discovery
  import_playbook: 04_device_discovery.yml

- name: Stage 05 - Assign devices to site
  import_playbook: 05_assign_to_site.yml

- name: Stage 06 - Template sync
  import_playbook: 06_template_sync.yml

- name: Stage 07 - Network profiles
  import_playbook: 07_network_profile.yml

- name: Stage 08 - Provision devices
  import_playbook: 08_provision_devices.yml

- name: Stage 09 - Software image management
  import_playbook: 09_swim.yml

- name: Stage 10 - Deploy composite templates
  import_playbook: 10_deploy_composite.yml

- name: Stage 11 - Await and provision access points
  import_playbook: 11_await_access_points.yml

- name: Stage 12 - Verify intent against the fabric
  import_playbook: 12_verify_intent.yml
