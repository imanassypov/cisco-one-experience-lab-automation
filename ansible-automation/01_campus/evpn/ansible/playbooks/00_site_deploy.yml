---
# =============================================================================
# 00_site_deploy.yml  —  Full pipeline orchestrator (stages 01–12)
# =============================================================================
# Runs every stage in order, start to finish. It declares nothing of its own —
# each imported playbook loads its own settings and credentials.
#
# Order matters: each stage consumes what the previous one created.
#
#   01 hierarchy ─► 02 settings ─► 03 credentials ─► 04 discovery ─► 05 assign
#      ─► 06 templates ─► 07 profiles ─► 08 provision ─► 09 image upgrade
#      ─► 10 deploy the fabric config ─► 11 access points ─► 12 verify
#
# Stage 09 comes before stage 10 on purpose: get the switches onto their
# intended image before pushing EVPN and telemetry configuration onto them.
#
# 🛑 Stage 09 RELOADS the switches, between stages 08 and 10. To build the site
#    without an image change:  -e swim_activate=false
#
# ⏳ Stage 11 BLOCKS for up to 10 minutes waiting for an access point to join,
#    and fails if none appears — after the fabric is already built. A pod with
#    no AP cabled should skip it with:  -e ap_expected_count=0
#
# Stage 12 reports rather than polices: a mismatch is printed and recorded, and
# the run still succeeds. To gate on it:  -e verify_fail_on_mismatch=true
#
# First time through, run the stages ONE AT A TIME instead. You can check
# Catalyst Center after each, and a failure belongs to a single stage.
#
# Run: ansible-playbook playbooks/00_site_deploy.yml
# =============================================================================
- name: Stage 01 - Site hierarchy
  import_playbook: 01_site_hierarchy.yml

- name: Stage 02 - Network settings
  import_playbook: 02_network_settings.yml

- name: Stage 03 - Credentials
  import_playbook: 03_credentials.yml

- name: Stage 04 - Device discovery
  import_playbook: 04_device_discovery.yml

- name: Stage 05 - Assign devices to site
  import_playbook: 05_assign_to_site.yml

- name: Stage 06 - Template sync
  import_playbook: 06_template_sync.yml

- name: Stage 07 - Network profiles
  import_playbook: 07_network_profile.yml

- name: Stage 08 - Provision devices
  import_playbook: 08_provision_devices.yml

- name: Stage 09 - Software image management
  import_playbook: 09_swim.yml

- name: Stage 10 - Deploy composite templates
  import_playbook: 10_deploy_composite.yml

- name: Stage 11 - Await and provision access points
  import_playbook: 11_await_access_points.yml

- name: Stage 12 - Verify intent against the fabric
  import_playbook: 12_verify_intent.yml
