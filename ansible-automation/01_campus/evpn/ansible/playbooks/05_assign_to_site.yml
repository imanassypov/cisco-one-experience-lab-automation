---
# =============================================================================
# 05_assign_to_site.yml  —  Pipeline stage 05
# =============================================================================
# Moves discovered devices out of Global and into their site.
#
# Site membership is what later stages key on — provisioning, templates and
# image management all target devices by site, never by IP.
#
#   settings.json project[].device_list  ──►  role: assign_to_site  ──►  one
#     + the Hierarchy* fields                  resolve the site UUID        call
#                                              once, then assign its devices
#
# This only assigns devices that are still unassigned. It will NOT move a
# device that is already sitting in the wrong site — fix that in the UI first.
#
# Depends on: stages 01 and 04
# Run: ansible-playbook playbooks/05_assign_to_site.yml
# =============================================================================
- name: Assign Devices to Site in Catalyst Center from settings.json
  hosts: catalyst_center
  gather_facts: false
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  module_defaults:
    cisco.dnac.site_info:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
    cisco.dnac.assign_device_to_site:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
  pre_tasks:
    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: assign_to_site
