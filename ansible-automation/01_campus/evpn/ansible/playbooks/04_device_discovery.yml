---
# =============================================================================
# 04_device_discovery.yml  —  Pipeline stage 04
# =============================================================================
# Tells Catalyst Center to go and find the devices, so they appear in its
# inventory. Until a device is in inventory, no later stage can touch it.
#
#   settings.json project[].discovery  ──►  role: device_discovery  ──►  one
#     IP range, protocol order,              discovery job per project row
#     credential DESCRIPTIONS                that declares one
#
# The job names the stage 03 credentials by description, which is why those
# descriptions must be unique.
#
# Re-running DELETES the job of the same name and starts a new one, so both
# items report "changed" even when the devices are already in inventory.
#
# A successful play means the jobs were submitted and completed — not that
# every IP answered. Check Tools > Discovery for the per-device result.
#
# Depends on: stage 03
# Run: ansible-playbook playbooks/04_device_discovery.yml
# =============================================================================
- name: Discover Devices in Catalyst Center from settings.json
  hosts: catalyst_center
  gather_facts: false
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  module_defaults:
    cisco.dnac.discovery_workflow_manager:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
      dnac_log_level: "{{ dnac_log_level }}"
      dnac_log: "{{ dnac_log }}"
  pre_tasks:
    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: device_discovery
