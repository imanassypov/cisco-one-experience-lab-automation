---
# =============================================================================
# 06_template_sync.yml  —  Pipeline stage 06
# =============================================================================
# Uploads the EVPN Jinja templates into Catalyst Center. It does NOT configure
# anything — stage 10 is what renders and deploys them.
#
#   .j2 + composite YAML            role: template_sync        Catalyst Center
#   ───────────────────────            ───────────────────        ───────────────
#   a local folder, or GitHub  ──►  one subfolder at a   ──►  one CLI project
#   (template_source)               time, file by file          per subfolder
#
# ONE CLI PROJECT PER SITE, because the templates are site-specific: FABRIC
# templates `{% include %}` that site's DEFN helpers by project name, so they
# must live together. A second campus needs its own folder and project_name.
#
# The source is set by `template_source` in group_vars (this lab uses `local`).
# A private GitHub repo also needs `git_token`; never commit one.
#
# Depends on: nothing in Catalyst Center — this only loads templates
# Run: ansible-playbook playbooks/06_template_sync.yml
#      ansible-playbook playbooks/06_template_sync.yml -e template_source=git
# =============================================================================
- name: Template Synchronization from Git using Template Workflow Manager
  hosts: catalyst_center
  gather_facts: true
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  module_defaults:
    cisco.dnac.template_workflow_manager:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
      dnac_log_level: "{{ dnac_log_level }}"
      dnac_log: "{{ dnac_log }}"
  pre_tasks:
    # Only telemetry.splunk is read here; everything else stage 06 needs comes
    # from connection.yml.
    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: template_sync
