---
# =============================================================================
# 10_deploy_composite.yml  —  Pipeline stage 10
# =============================================================================
# THE STAGE THAT CONFIGURES THE FABRIC. Catalyst Center renders the composite
# template for each switch and copies the result onto the device. Everything
# before this was design; this is the first stage that changes a running config.
#
#   settings.json network_profile          role: deploy_composite
#     .DayNTemplateNames[]        ──►  for each entry with DeployTemplate true:
#       TemplateName, Project            look up the template version, resolve
#       TemplateTarget[]  the switches    each target IP to a device UUID,
#       DeployTemplate    true/false      deploy, then poll the task
#
# It also programs the AP-facing switch ports. Until this runs, an access point
# cannot get an address or reach the controller — which is why no AP exists in
# inventory before stage 10 and why stage 11 comes after it.
#
# A Catalyst Center "SUCCESS" means the job finished, not that the fabric is
# healthy. Stage 12 is what actually checks the result.
#
# Depends on: stages 06 and 08
# Run: ansible-playbook playbooks/10_deploy_composite.yml
# =============================================================================
- name: Deploy Composite Templates to Managed Devices from settings.json
  hosts: catalyst_center
  gather_facts: false
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  module_defaults:
    cisco.dnac.configuration_template_deploy_v2:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
  pre_tasks:
    - name: Obtain Catalyst Center auth token
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: auth_token

    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: deploy_composite
