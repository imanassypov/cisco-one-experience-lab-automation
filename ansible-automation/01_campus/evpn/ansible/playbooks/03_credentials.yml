---
# =============================================================================
# 03_credentials.yml  —  Pipeline stage 03
# =============================================================================
# Ensures live CatC Design globals exist (create only if missing) and binds
# them to each site so stage 04 discovery can reference them by description.
# Role: credentials, in three phases:
#   A — CLI + SNMP via cisco.dnac.device_credential_workflow_manager
#   B — NETCONF via raw REST (202 async; not covered by the collection module)
#   C — NETCONF delete when state=deleted
#
# Sourced:
#   settings.json → settings_data.project[] (via catc_common.load_settings):
#     device_credentials: { cli_credential{description, username, password,
#                             enable_password},
#                           snmp_v2c_read{description, read_community},
#                           snmp_v2c_write{description, write_community},
#                           netconf{description, port} }
#     assign_credentials: { site_name[] }  (one MAIN path per project row;
#                           CLI/SNMP names come from that row's device_credentials)
#   connection.yml: catc_host, catc_port, catc_version, catc_verify, catc_debug
#   Lab Topology/lab_access.yml (vault): Catalyst Center username/password
#
# Produced:
#   wfm_config — unique missing globals (if any), then one
#     assign_credentials_to_site item per site (CLI Admin, SNMPv2c Read/Write).
#   In Catalyst Center: live Design globals bound to each MAIN floor.
#
# Auth note: module_defaults maps the catc_* vars onto the cisco.dnac dnac_*
# parameter names — same appliance, different collection parameter spelling.
#
# Play var: state = merged (default) | deleted
#
# Run: ansible-playbook playbooks/03_credentials.yml
#      ansible-playbook playbooks/03_credentials.yml -e state=deleted
# =============================================================================
- name: Apply Device Credentials from settings.json
  hosts: catalyst_center
  gather_facts: false
  module_defaults:
    cisco.dnac.device_credential_workflow_manager: &catc_auth
      dnac_host: "{{ catc_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ catc_verify }}"
      dnac_port: "{{ catc_port }}"
      dnac_version: "{{ catc_version }}"
      dnac_debug: "{{ catc_debug }}"
    cisco.dnac.global_credential_info: *catc_auth
    cisco.dnac.netconf_credential: *catc_auth
    cisco.dnac.global_credential_delete: *catc_auth
  pre_tasks:
    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: credentials
