---
# =============================================================================
# 03_credentials.yml  —  Pipeline stage 03
# =============================================================================
# Creates the Catalyst Center credentials used to log in to devices — CLI,
# SNMP, HTTPS, NETCONF — and binds them to each site.
#
# Stage 04 refers to these by DESCRIPTION, not by id, so the role reuses an
# existing credential rather than creating a second one with the same name. A
# duplicate description would break that lookup.
#
# Three phases, because no single module covers all four types:
#   A  CLI + SNMP + HTTPS  cisco.dnac.device_credential_workflow_manager
#   B  NETCONF             raw REST — the appliance answers 202 with a task id
#                          and the module mishandles it, so the role polls
#   C  NETCONF delete      only when state=deleted
#
# NETCONF existence is keyed on PORT, not description: Catalyst Center allows
# only one NETCONF credential per port.
#
# Depends on: stage 01
# Run: ansible-playbook playbooks/03_credentials.yml
#      ansible-playbook playbooks/03_credentials.yml -e state=deleted
# =============================================================================
- name: Apply Device Credentials from settings.json
  hosts: catalyst_center
  gather_facts: false
  module_defaults:
    cisco.dnac.device_credential_workflow_manager: &catc_auth
      dnac_host: "{{ catc_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ catc_verify }}"
      dnac_port: "{{ catc_port }}"
      dnac_version: "{{ catc_version }}"
      dnac_debug: "{{ catc_debug }}"
    cisco.dnac.global_credential_info: *catc_auth
    cisco.dnac.netconf_credential: *catc_auth
    cisco.dnac.global_credential_delete: *catc_auth
  pre_tasks:
    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: credentials
