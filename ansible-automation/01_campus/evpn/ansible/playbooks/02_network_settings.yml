---
# =============================================================================
# 02_network_settings.yml  —  Pipeline stage 02
# =============================================================================
# Attaches the shared network services — DHCP, DNS, NTP, syslog, SNMP, NetFlow,
# AAA, login banner — to each site stage 01 created.
#
# This is INTENT only. Nothing reaches a device here; devices pick these
# settings up when they are provisioned in stage 08.
#
#   settings.json project[].network_settings  ──►  role: network_settings
#                                                  resolve site UUID, then one
#                                                  composite PUT per site
#
# A value that already matches the Global default stays INHERITED instead of
# becoming a site override — Catalyst Center only stores what differs. A lock
# icon in the UI is therefore success, not a failed apply. Compare timezone and
# banner, which do differ per site. See ../README.md for the full explanation.
#
# Depends on: stage 01
# Run: ansible-playbook playbooks/02_network_settings.yml
# =============================================================================
- name: Apply Network Settings from settings.json
  hosts: catalyst_center
  gather_facts: false
  module_defaults:
    cisco.catalystcenter.sites_info:
      catalystcenter_host: "{{ catc_host }}"
      catalystcenter_username: "{{ catc_username }}"
      catalystcenter_password: "{{ catc_password }}"
      catalystcenter_verify: "{{ catc_verify }}"
      catalystcenter_port: "{{ catc_port }}"
      catalystcenter_version: "{{ catc_version }}"
      catalystcenter_debug: "{{ catc_debug }}"
  pre_tasks:
    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: network_settings
