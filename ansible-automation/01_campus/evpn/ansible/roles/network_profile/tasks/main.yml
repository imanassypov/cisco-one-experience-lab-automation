---
# =============================================================================
# network_profile / main.yml  —  Pipeline stage 7.0
# =============================================================================
# Creates or updates Catalyst Center network profiles and binds them to sites.
# Maps the settings.json network_profile block to
# network_profile_switching_workflow_manager, the optional wireless_design
# block to wireless_design_workflow_manager, and the optional wireless_profile
# block to network_profile_wireless_workflow_manager.
#
# Order matters: a wireless profile can only reference an SSID that already
# exists, so the design pass runs before the profile pass.
#
# A site may carry both. DC-Site-10 holds a C9800 today and is expected to gain
# switches, so it defines HQ-Switching and HQ-Wireless side by side. Rows with
# no wireless_profile key skip the wireless pass entirely.
#
# Prerequisites: catc_common.load_settings → settings_data
#                Stage 6 templates synced (Day0/Day-N template names referenced)
# =============================================================================

# Transforms the PascalCase JSON block into the string lists the switching WFM
# expects. site_names is derived from the hierarchy fields (deepest level wins).
# Example
#   In : settings_data.project[0] = {
#          "HierarchyParent": "Global/PODS", "HierarchyArea": "POD 0",
#          "HierarchyBldg": "Building P0",   "HierarchyFloor": "Floor 1",
#          "network_profile": {
#            "profile_name": "BGP-EVPN-Switching",
#            "DayNTemplateNames": [
#              { "TemplateName": "BGP-EVPN-BUILD.j2", "TemplateTag": "DEMO",
#                "Project": "Building P0",
#                "TemplateTarget": ["198.19.1.1", "198.19.1.2", "198.19.1.3",
#                                   "198.19.1.4", "198.19.1.5", "198.19.1.6"],
#                "DeployTemplate": true } ],
#            "Day0TemplateNames": [
#              { "TemplateName": null, "Project": null, "TemplateTarget": [],
#                "DeployTemplate": null } ]
#          } }
#   Out: profile_list = [{
#          "profile_name": "BGP-EVPN-Switching",
#          "site_names": ["Global/PODS/POD 0/Building P0/Floor 1"],
#          "day_n_templates": ["BGP-EVPN-BUILD.j2"]
#        }]
#   Only TemplateName survives — TemplateTag/Project/TemplateTarget/DeployTemplate
#   are consumed by stage 09 (deploy composite), not by profile binding.
#   The Day0 placeholder row has TemplateName: null, so selectattr('ne', none)
#   empties the list and onboarding_templates is omitted from the config
#   entirely rather than sent as [].
- name: Build network profile config list
  ansible.builtin.set_fact:
    profile_list: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for entry in settings_data.project -%}
        {%- if entry.network_profile is defined and entry.network_profile -%}
          {%- set prof = entry.network_profile -%}
          {%- set parent = entry.HierarchyParent | default('Global') -%}
          {%- set area   = entry.HierarchyArea   | default('') -%}
          {%- set bldg   = entry.HierarchyBldg   | default('') -%}
          {%- set floor  = entry.HierarchyFloor  | default('') -%}
          {%- if floor -%}
            {%- set site_path = parent + '/' + area + '/' + bldg + '/' + floor -%}
          {%- elif bldg -%}
            {%- set site_path = parent + '/' + area + '/' + bldg -%}
          {%- elif area -%}
            {%- set site_path = parent + '/' + area -%}
          {%- else -%}
            {%- set site_path = parent -%}
          {%- endif -%}
          {%- set cfg = {'profile_name': prof.profile_name, 'site_names': [site_path]} -%}
          {%- if prof.DayNTemplateNames is defined and prof.DayNTemplateNames -%}
            {%- set tnames = prof.DayNTemplateNames
                | selectattr('TemplateName', 'defined')
                | selectattr('TemplateName', 'ne', none)
                | map(attribute='TemplateName') | list -%}
            {%- if tnames | length > 0 -%}
              {%- set cfg = cfg | combine({'day_n_templates': tnames}) -%}
            {%- endif -%}
          {%- endif -%}
          {%- if prof.Day0TemplateNames is defined and prof.Day0TemplateNames -%}
            {%- set tnames0 = prof.Day0TemplateNames
                | selectattr('TemplateName', 'defined')
                | selectattr('TemplateName', 'ne', none)
                | map(attribute='TemplateName') | list -%}
            {%- if tnames0 | length > 0 -%}
              {%- set cfg = cfg | combine({'onboarding_templates': tnames0}) -%}
            {%- endif -%}
          {%- endif -%}
          {%- set ns.result = ns.result + [cfg] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Network profile config list
  when: catc_debug | default(false) | bool
  ansible.builtin.debug:
    msg: "{{ profile_list }}"

- name: Validate profile list is non-empty
  ansible.builtin.assert:
    that: profile_list | length > 0
    fail_msg: "No entries with network_profile found in input JSON."
    success_msg: "{{ profile_list | length }} network profile(s) to create/update."

# Task: Create/update switching network profile
# Pre:  profile_list as above
# Post: profile_results — dnac_response from WFM (profile UUID, assignment status)
- name: Create/update switching network profile
  cisco.dnac.network_profile_switching_workflow_manager:
    state: merged
    config: "{{ profile_list }}"
  register: profile_results

- name: --DEBUG-- Profile results
  when: catc_debug | default(false) | bool
  ansible.builtin.debug:
    msg: "{{ profile_results }}"

- name: Switching network profile creation complete
  ansible.builtin.debug:
    msg:
      - "Switching network profile(s) created/updated successfully"
      - "Profiles processed: {{ profile_list | map(attribute='profile_name') | join(', ') }}"

# ── Wireless design ───────────────────────────────────────────────────────
#
# SSIDs and FlexConnect settings are design objects, and a wireless profile can
# only reference an SSID that already exists — so this runs before the profile
# binding below, not after.
#
# The wireless_design block is mostly snake_case and 1:1 with the design WFM.
# Only WFM keys are copied: interfaces, ssids, flex_connect_configuration.
# flex_connect_aaa_override is a sibling we PUT ourselves — the collection has
# no field for it, and passing it through would fail argspec.
# Unlike the profile builders, no site path is derived here: FlexConnect names
# its own site_name_hierarchy, and an SSID is global until a profile binds it.
#
# Example
#   In : settings_data.project[0].wireless_design = {
#          "ssids": [{ "ssid_name": "PSEUDOCO-POD12", "ssid_type": "Enterprise",
#                      "wlan_profile_name": "PSEUDOCO-FLEX-Profile", ... }],
#          "flex_connect_configuration": [
#            { "site_name_hierarchy": "Global/NORTH CAROLINA/Durham/Site-105/MAIN",
#              "vlan_id": 10 }],
#          "flex_connect_aaa_override": [
#            { "site_name_hierarchy": ".../Site-105/MAIN",
#              "vlans": [{ "vlan_name": "Main", "vlan_id": 10 }, ...] }] }
#   Out: wireless_design_list = [ interfaces + ssids + flex_connect_configuration ]
#        flex_aaa_override_list is built separately for the URI PUT
#   ssid_name arrives already substituted — settings.json carries
#   "PSEUDOCO-POD{POD}" and catc_common.load_settings resolves {POD} from
#   lab_pod_id before any role sees the data.
- name: Build wireless design config list
  ansible.builtin.set_fact:
    wireless_design_list: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for entry in settings_data.project -%}
        {%- if entry.wireless_design is defined and entry.wireless_design -%}
          {%- set src = entry.wireless_design -%}
          {%- set cfg = {} -%}
          {%- if src.interfaces is defined and src.interfaces -%}
            {%- set cfg = cfg | combine({'interfaces': src.interfaces}) -%}
          {%- endif -%}
          {%- if src.ssids is defined and src.ssids -%}
            {%- set cfg = cfg | combine({'ssids': src.ssids}) -%}
          {%- endif -%}
          {%- if src.flex_connect_configuration is defined and src.flex_connect_configuration -%}
            {%- set cfg = cfg | combine({'flex_connect_configuration': src.flex_connect_configuration}) -%}
          {%- endif -%}
          {%- if cfg -%}
            {%- set ns.result = ns.result + [cfg] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Wireless design config list
  when: catc_debug | default(false) | bool
  ansible.builtin.debug:
    msg: "{{ wireless_design_list }}"

# An unresolved {POD} would create an SSID literally named PSEUDOCO-POD{POD},
# which no WLC group policy matches and which then has to be deleted by hand.
# Catching it here is cheaper than catching it on the controller.
- name: Assert every designed SSID name resolved
  when: wireless_design_list | length > 0
  ansible.builtin.assert:
    that: "'{' not in item"
    fail_msg: >-
      SSID name '{{ item }}' still contains an unresolved token. Check that
      lab_pod_id is set in inventory/group_vars/all/lab.yml.
    success_msg: "SSID name '{{ item }}' resolved."
  loop: >-
    {{ wireless_design_list | map(attribute='ssids') | select('defined')
       | flatten | map(attribute='ssid_name') | list }}

- name: Report that no site declares a wireless design
  when: wireless_design_list | length == 0
  ansible.builtin.debug:
    msg: "No wireless_design block in settings.json — skipping SSID/FlexConnect design."

# Task: Create/update wireless design objects
# Pre:  wireless_design_list as above
# Post: wireless_design_results — dnac_response from WFM (SSID and FlexConnect state)
- name: Create/update wireless design objects
  when: wireless_design_list | length > 0
  cisco.dnac.wireless_design_workflow_manager:
    state: merged
    config: "{{ wireless_design_list }}"
  register: wireless_design_results

- name: --DEBUG-- Wireless design results
  when:
    - catc_debug | default(false) | bool
    - wireless_design_list | length > 0
  ansible.builtin.debug:
    msg: "{{ wireless_design_results }}"

- name: Wireless design complete
  when: wireless_design_list | length > 0
  ansible.builtin.debug:
    msg:
      - "Wireless design object(s) created/updated successfully"
      - >-
        SSIDs: {{ wireless_design_list | map(attribute='ssids') | select('defined')
                  | flatten | map(attribute='ssid_name') | join(', ') }}

# ── FlexConnect native VLAN and AAA-override VLAN names ───────────────────
#
# wireless_design_workflow_manager.flex_connect_configuration maps to
# PUT /sites/{siteId}/wirelessSettings/flexConnectNativeVlan, but the
# collection will only UPDATE an override that already exists. When Site-105
# has none, it logs "Creation is not supported — skipping" and the play still
# reports success. The generated Flex profile then keeps native VLAN 1, which
# does not match the AP trunk (Gi1/0/2 native 10). PUT the override ourselves
# and GET-assert it, so a skip cannot silently ship native VLAN 1.
#
# AAA-override VLAN names are a different CatC object: the sibling
# /wirelessSettings/flexConnectAaaOverride. The design WFM has no field for
# it. wireless_profile.additional_interfaces lands on HQ-Wireless as extra
# WLC interfaces and is NOT copied into the Flex vlan-name table — that is
# why 07/08 stored Main/PROD/IOT on the profile and the WLC Flex map still
# only had PSEUDOCO-VLAN10. PUT this list and GET-assert it.
- name: Build FlexConnect native VLAN apply list
  ansible.builtin.set_fact:
    flex_native_vlan_list: >-
      {{ wireless_design_list
         | map(attribute='flex_connect_configuration')
         | select('defined')
         | flatten
         | selectattr('site_name_hierarchy', 'defined')
         | selectattr('vlan_id', 'defined')
         | list }}

- name: Build FlexConnect AAA-override VLAN apply list
  ansible.builtin.set_fact:
    flex_aaa_override_list: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for entry in settings_data.project -%}
        {%- set rows = (entry.wireless_design | default({})).flex_connect_aaa_override | default([]) -%}
        {%- for item in rows -%}
          {%- if item.site_name_hierarchy is defined and item.vlans | default([]) | length > 0 -%}
            {%- set ns.result = ns.result + [item] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- FlexConnect AAA-override apply list
  when: catc_debug | default(false) | bool
  ansible.builtin.debug:
    msg: "{{ flex_aaa_override_list }}"

- name: Detect whether any designed SSID enables AAA override
  ansible.builtin.set_fact:
    _wireless_aaa_override: >-
      {{ true in (
           wireless_design_list
           | map(attribute='ssids')
           | select('defined')
           | flatten
           | map(attribute='aaa')
           | select('defined')
           | map(attribute='aaa_override')
           | list
         ) }}

- name: Assert AAA-override SSIDs have site Flex VLAN-name maps
  when: _wireless_aaa_override | bool
  ansible.builtin.assert:
    that: >-
      {{ flex_aaa_override_list
         | selectattr('vlans', 'defined')
         | map(attribute='vlans')
         | reject('eq', [])
         | list | length > 0 }}
    fail_msg: >-
      Designed SSIDs enable aaa_override, but wireless_design.flex_connect_aaa_override
      is empty. ISE VLAN names never reach the WLC Flex profile and clients fail
      with VLAN Failure. Add Main/PROD/IOT (10/101/102) under
      flex_connect_aaa_override for the AP site.
    success_msg: >-
      {{ flex_aaa_override_list | length }} site(s) declare Flex AAA-override
      VLAN names.

- name: Authenticate for FlexConnect REST
  when: (flex_native_vlan_list | length > 0) or (flex_aaa_override_list | length > 0)
  ansible.builtin.import_role:
    name: catc_common
    tasks_from: auth_token

- name: Resolve site UUIDs for FlexConnect REST
  when: (flex_native_vlan_list | length > 0) or (flex_aaa_override_list | length > 0)
  ansible.builtin.import_role:
    name: catc_common
    tasks_from: build_site_id_map

- name: Apply FlexConnect native VLAN overrides
  when: flex_native_vlan_list | length > 0
  ansible.builtin.include_tasks: apply_flex_native_vlan.yml
  loop: "{{ flex_native_vlan_list }}"
  loop_control:
    loop_var: flex_native
    label: "{{ flex_native.site_name_hierarchy }} vlan {{ flex_native.vlan_id }}"

- name: Apply FlexConnect AAA-override VLAN maps
  when: flex_aaa_override_list | length > 0
  ansible.builtin.include_tasks: apply_flex_aaa_override.yml
  loop: "{{ flex_aaa_override_list }}"
  loop_control:
    loop_var: flex_aaa
    label: "{{ flex_aaa.site_name_hierarchy }} ({{ flex_aaa.vlans | map(attribute='vlan_name') | join(', ') }})"

# ── Wireless profile ──────────────────────────────────────────────────────
#
# Wireless profiles are optional — only rows that declare a wireless_profile
# block produce an entry, so wireless_profile_list is empty for sites with no
# WLC and the module call below is skipped rather than asserted on.
#
# Binding a profile to a site is what lets a controller manage that site's APs:
# provisioning a WLC whose managed AP locations include an unbound site fails
# with NCWL10001 in stage 08.
#
# An explicit site_names wins over the row's own hierarchy. A wireless profile
# is unlike a switching one here: the row that owns the controller is not
# usually the site whose APs it serves, and it is the served site that has to
# carry the binding. Deriving the path from the row would bind HQ-Wireless to
# DC-Site-10 — where the C9800 lives — and leave Site-105 unbound, which is
# what makes stage 08 fail with NCWL10001.
#
# The fallback derivation repeats the switching builder above rather than
# sharing a fact: the switching pass is live against the lab and is left
# byte-identical.
#
# ssid_details and additional_interfaces pass through verbatim (snake_case,
# 1:1 with the module schema). additional_interfaces becomes CatC
# additionalInterfaces — extra WLC interfaces, not the Flex vlan-name table.
# ISE AAA-override names (Main/PROD/IOT) are PUT as flex_connect_aaa_override.
# DayNTemplateNames keeps the PascalCase shape of its switching sibling so
# stage 09 can consume TemplateTarget/DeployTemplate later; only TemplateName
# survives into the profile binding.
# Example - explicit site_names, as DC-Site-10 uses
#   In : settings_data.project[0] = {
#          "HierarchyParent": "Global/CALIFORNIA", "HierarchyArea": "San Jose",
#          "HierarchyBldg": "DC-Site-10", "HierarchyFloor": "MAIN",
#          "wireless_profile": {
#            "profile_name": "HQ-Wireless",
#            "site_names": ["Global/NORTH CAROLINA/Durham/Site-105/MAIN"],
#            "ssid_details": [{ "ssid_name": "PSEUDOCO-POD12",
#                               "enable_fabric": false, "local_to_vlan": 10 }],
#            "additional_interfaces": [
#              { "interface_name": "Main", "vlan_id": 10 },
#              { "interface_name": "PROD", "vlan_id": 101 },
#              { "interface_name": "IOT",  "vlan_id": 102 }],
#            "DayNTemplateNames": [{ "TemplateName": null, ... }] } }
#   Out: wireless_profile_list = [{
#          "profile_name": "HQ-Wireless",
#          "site_names": ["Global/NORTH CAROLINA/Durham/Site-105/MAIN"],
#          "ssid_details": [{ "ssid_name": "PSEUDOCO-POD12",
#                             "enable_fabric": false, "local_to_vlan": 10 }],
#          "additional_interfaces": [
#            { "interface_name": "Main", "vlan_id": 10 },
#            { "interface_name": "PROD", "vlan_id": 101 },
#            { "interface_name": "IOT",  "vlan_id": 102 }]
#        }]
#
# Example - no site_names, controller and APs in the same building
#   In : same row without the site_names key
#   Out: site_names falls back to ["Global/CALIFORNIA/San Jose/DC-Site-10/MAIN"]
#   Empty ssid_details and an all-null DayNTemplateNames row are dropped, so
#   CatC receives a name + site binding only.
- name: Build wireless network profile config list
  ansible.builtin.set_fact:
    wireless_profile_list: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for entry in settings_data.project -%}
        {%- if entry.wireless_profile is defined and entry.wireless_profile -%}
          {%- set prof = entry.wireless_profile -%}
          {%- set parent = entry.HierarchyParent | default('Global') -%}
          {%- set area   = entry.HierarchyArea   | default('') -%}
          {%- set bldg   = entry.HierarchyBldg   | default('') -%}
          {%- set floor  = entry.HierarchyFloor  | default('') -%}
          {%- if floor -%}
            {%- set site_path = parent + '/' + area + '/' + bldg + '/' + floor -%}
          {%- elif bldg -%}
            {%- set site_path = parent + '/' + area + '/' + bldg -%}
          {%- elif area -%}
            {%- set site_path = parent + '/' + area -%}
          {%- else -%}
            {%- set site_path = parent -%}
          {%- endif -%}
          {%- set cfg = {'profile_name': prof.profile_name,
                         'site_names': prof.site_names | default([site_path], true)} -%}
          {%- if prof.ssid_details is defined and prof.ssid_details -%}
            {%- set cfg = cfg | combine({'ssid_details': prof.ssid_details}) -%}
          {%- endif -%}
          {%- if prof.additional_interfaces is defined and prof.additional_interfaces -%}
            {%- set cfg = cfg | combine({'additional_interfaces': prof.additional_interfaces}) -%}
          {%- endif -%}
          {%- if prof.DayNTemplateNames is defined and prof.DayNTemplateNames -%}
            {%- set wtnames = prof.DayNTemplateNames
                | selectattr('TemplateName', 'defined')
                | selectattr('TemplateName', 'ne', none)
                | map(attribute='TemplateName') | list -%}
            {%- if wtnames | length > 0 -%}
              {%- set cfg = cfg | combine({'day_n_templates': wtnames}) -%}
            {%- endif -%}
          {%- endif -%}
          {%- set ns.result = ns.result + [cfg] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Wireless profile config list
  when: catc_debug | default(false) | bool
  ansible.builtin.debug:
    msg: "{{ wireless_profile_list }}"

- name: Report that no site declares a wireless profile
  when: wireless_profile_list | length == 0
  ansible.builtin.debug:
    msg: "No wireless_profile block in settings.json — skipping wireless profile stage."

# Task: Create/update wireless network profile
# Pre:  wireless_profile_list as above
# Post: wireless_profile_results — dnac_response from WFM (profile UUID, site assignment)
- name: Create/update wireless network profile
  when: wireless_profile_list | length > 0
  cisco.dnac.network_profile_wireless_workflow_manager:
    state: merged
    config: "{{ wireless_profile_list }}"
  register: wireless_profile_results

- name: --DEBUG-- Wireless profile results
  when:
    - catc_debug | default(false) | bool
    - wireless_profile_list | length > 0
  ansible.builtin.debug:
    msg: "{{ wireless_profile_results }}"

- name: Wireless network profile creation complete
  when: wireless_profile_list | length > 0
  ansible.builtin.debug:
    msg:
      - "Wireless network profile(s) created/updated successfully"
      - "Profiles processed: {{ wireless_profile_list | map(attribute='profile_name') | join(', ') }}"
