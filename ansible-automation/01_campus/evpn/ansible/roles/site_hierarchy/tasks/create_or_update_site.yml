---
- name: "Extract type / name / parent  | {{ site_config.site_type }}"
  ansible.builtin.set_fact:
    _type: "{{ site_config.site_type }}"
    _name: "{{ site_config.site[site_config.site_type].name }}"
    _parent: "{{ site_config.site[site_config.site_type].parent_name }}"

- name: "Derive path / exists  | {{ _parent ~ '/' ~ _name }}"
  ansible.builtin.set_fact:
    _path: "{{ _parent + '/' + _name }}"
    _exists: "{{ (_parent + '/' + _name) in site_id_map }}"

# Preserve the no-write default for existing buildings/floors and never update
# existing areas: their name and parent already match by full-path lookup.
- name: "Site | MERGE | {{ _path }}"
  cisco.catalystcenter.site_workflow_manager:
    state: merged
    config_verify: true
    config: "{{ [site_config] }}"
  register: _site_merge
  when: >-
    not _exists or
    (_type in ['building', 'floor'] and
     site_hierarchy_update_existing | default(false) | bool)

- name: "DEBUG | Site MERGE result"
  ansible.builtin.debug:
    var: _site_merge
  when: catc_debug | default(false) | bool

# Resolve each new UUID before processing its children and retain the map used
# for existence guards and per-path reporting.
- name: "Query ID for newly created site  | {{ _path }}"
  cisco.catalystcenter.sites_info:
    nameHierarchy: "{{ _path }}"
  register: _new_site_info
  until: >-
    _new_site_info.catalystcenter_response is defined and
    _new_site_info.catalystcenter_response.response is defined and
    _new_site_info.catalystcenter_response.response | length > 0
  retries: 10
  delay: 3
  when: not _exists

- name: "Add to site_id_map  | {{ _path }}"
  ansible.builtin.set_fact:
    site_id_map: >-
      {{ site_id_map | combine(
           { _path: _new_site_info.catalystcenter_response.response[0].id }
         ) }}
  when: not _exists

- name: "Record outcome  | {{ _path }}"
  ansible.builtin.set_fact:
    site_hierarchy_results: "{{ site_hierarchy_results | default([]) + [_site_hierarchy_row] }}"
  vars:
    _site_hierarchy_action: >-
      {{ 'created' if not (_exists | bool) else
         ('updated' if _site_merge is changed else 'skipped') }}
    _site_hierarchy_row:
      action: "{{ _site_hierarchy_action }}"
      line: "{{ _site_hierarchy_action }}  {{ _path }}"
