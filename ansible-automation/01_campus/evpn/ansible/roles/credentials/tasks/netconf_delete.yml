---
# =============================================================================
# credentials / netconf_delete.yml
# =============================================================================
# Deletes ONE NETCONF credential. Loop variable: netconf_config
#
# A credential that was not found earlier is skipped, so this is safe to run
# repeatedly.
#
# ⚠ Deleting a NETCONF credential still bound to sites or in use by managed
# devices interrupts device management. Only run with state=deleted once the
# devices are decommissioned.
# =============================================================================

# ── Step 1: Derive existence flag and UUID ────────────────────────────────────
# Example — credential present (DELETE fires)
#   In : netconf_config = { "description": "NETCONF-netadmin", "netconf_port": "830" }
#        netconf_id_map = { "NETCONF-netadmin": "aaaa-1111",
#                           "defaultNetConfPort": "bbbb-2222" }
#   Out: _nc_exists = true, _nc_id = "aaaa-1111"
#
# Example — already gone (second delete run)
#   In : netconf_id_map = { "defaultNetConfPort": "bbbb-2222" }
#   Out: _nc_exists = false, _nc_id = ""   → DELETE skipped, no failure
- name: "Derive exists / id  | {{ netconf_config.description }}"
  ansible.builtin.set_fact:
    _nc_exists: "{{ netconf_config.description in netconf_id_map }}"
    _nc_id: "{{ netconf_id_map.get(netconf_config.description, '') }}"

- name: "DEBUG | Step 1 — NETCONF description lookup result"
  ansible.builtin.debug:
    msg:
      description: "{{ netconf_config.description }}"
      exists: "{{ _nc_exists }}"
      id: "{{ _nc_id }}"
  when: catc_debug | default(false) | bool

# ── DELETE NETCONF credential ─────────────────────────────────────────────────
# DELETE /dna/intent/api/v1/global-credential/{globalCredentialId}
- name: "NETCONF | DELETE  | {{ netconf_config.description }}"
  cisco.dnac.global_credential_delete:
    globalCredentialId: "{{ _nc_id }}"
  register: _nc_delete
  when: _nc_exists

- name: "DEBUG | DELETE result  | {{ netconf_config.description }}"
  ansible.builtin.debug:
    var: _nc_delete
  when:
    - catc_debug | default(false) | bool
    - _nc_exists
