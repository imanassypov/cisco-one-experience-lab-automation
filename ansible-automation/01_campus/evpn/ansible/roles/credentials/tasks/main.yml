---
# =============================================================================
# credentials / main.yml  —  Pipeline stage 3.0
# =============================================================================
# Provisions global device credentials in Catalyst Center from
# settings_data.project[].device_credentials and assign_credentials.
#
# Phase A — CLI + SNMP via device_credential_workflow_manager (cisco.dnac)
# Phase B — NETCONF via raw REST (202 async; collection module limitation)
# Phase C — NETCONF delete when state=deleted
#
# Play var state: merged (default) | deleted
#
# Prerequisites: catc_common.load_settings → settings_data
# =============================================================================

# WFM config is split so globals are created once and then assigned
# per site. Four identical project rows must not POST CLI/SNMP four times.
# netconf_credential is not a WFM type — see netconf_list below.
# assign_credentials_to_site is omitted when state=deleted.
#
# Example
#   In : four project rows share live globals CLI Admin / SNMPv2c Read/Write
#        and each has assign_credentials.site_name = that site's MAIN path
#   Out: wfm_config = [
#          { assign_credentials_to_site: { site_name: [path],
#              cli_credential: {description, username},
#              snmp_v2c_read:  {description},
#              snmp_v2c_write: {description} } },
#          ... one item per site ...
#        ]
#        global_credential_details is added only for descriptions absent
#        from CatC (one unique set, never repeated).

- name: Query existing CLI credentials
  cisco.dnac.global_credential_info:
    credentialSubType: CLI
  register: _exist_cli
  when: (state | default('merged')) == 'merged'

- name: Query existing SNMP v2c read credentials
  cisco.dnac.global_credential_info:
    credentialSubType: SNMPV2_READ_COMMUNITY
  register: _exist_snmp_read
  when: (state | default('merged')) == 'merged'

- name: Query existing SNMP v2c write credentials
  cisco.dnac.global_credential_info:
    credentialSubType: SNMPV2_WRITE_COMMUNITY
  register: _exist_snmp_write
  when: (state | default('merged')) == 'merged'

- name: Collect existing global credential descriptions
  ansible.builtin.set_fact:
    existing_cli_descriptions: "{{ _exist_cli.dnac_response.response | default([]) | map(attribute='description') | list }}"
    existing_snmp_read_descriptions: "{{ _exist_snmp_read.dnac_response.response | default([]) | map(attribute='description') | list }}"
    existing_snmp_write_descriptions: "{{ _exist_snmp_write.dnac_response.response | default([]) | map(attribute='description') | list }}"
  when: (state | default('merged')) == 'merged'

- name: Treat all globals as absent when deleting
  ansible.builtin.set_fact:
    existing_cli_descriptions: []
    existing_snmp_read_descriptions: []
    existing_snmp_write_descriptions: []
  when: (state | default('merged')) == 'deleted'

- name: Build unique missing global credentials
  ansible.builtin.set_fact:
    wfm_globals: >-
      {%- set ns = namespace(cli=[], read=[], write=[], seen_cli=[], seen_read=[], seen_write=[]) -%}
      {%- for entry in settings_data.project -%}
        {%- set dc = entry.device_credentials | default({}) -%}
        {%- set cli = dc.cli_credential | default({}) -%}
        {%- set rd = dc.snmp_v2c_read | default({}) -%}
        {%- set wr = dc.snmp_v2c_write | default({}) -%}
        {%- if cli.description | default('')
             and cli.description not in existing_cli_descriptions
             and cli.description not in ns.seen_cli -%}
          {%- set ns.seen_cli = ns.seen_cli + [cli.description] -%}
          {%- set ns.cli = ns.cli + [cli] -%}
        {%- endif -%}
        {%- if rd.description | default('')
             and rd.description not in existing_snmp_read_descriptions
             and rd.description not in ns.seen_read -%}
          {%- set ns.seen_read = ns.seen_read + [rd.description] -%}
          {%- set ns.read = ns.read + [rd] -%}
        {%- endif -%}
        {%- if wr.description | default('')
             and wr.description not in existing_snmp_write_descriptions
             and wr.description not in ns.seen_write -%}
          {%- set ns.seen_write = ns.seen_write + [wr.description] -%}
          {%- set ns.write = ns.write + [wr] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set gcd = {} -%}
      {%- if ns.cli -%}{%- set gcd = gcd | combine({'cli_credential': ns.cli}) -%}{%- endif -%}
      {%- if ns.read -%}{%- set gcd = gcd | combine({'snmp_v2c_read': ns.read}) -%}{%- endif -%}
      {%- if ns.write -%}{%- set gcd = gcd | combine({'snmp_v2c_write': ns.write}) -%}{%- endif -%}
      {{ gcd }}

- name: Build per-site credential assignments
  ansible.builtin.set_fact:
    wfm_assigns: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for entry in settings_data.project -%}
        {%- set dc = entry.device_credentials | default({}) -%}
        {%- set ac = entry.assign_credentials | default({}) -%}
        {%- if ac.site_name | default([]) | length > 0 -%}
          {%- set sites = ac.site_name -%}
        {%- elif entry.HierarchyFloor | default('') -%}
          {%- set sites = [entry.HierarchyParent + '/' + entry.HierarchyArea + '/' + entry.HierarchyBldg + '/' + entry.HierarchyFloor] -%}
        {%- elif entry.HierarchyBldg | default('') -%}
          {%- set sites = [entry.HierarchyParent + '/' + entry.HierarchyArea + '/' + entry.HierarchyBldg] -%}
        {%- elif entry.HierarchyArea | default('') -%}
          {%- set sites = [entry.HierarchyParent + '/' + entry.HierarchyArea] -%}
        {%- else -%}
          {%- set sites = [entry.HierarchyParent] -%}
        {%- endif -%}
        {%- set acsite = {'site_name': sites} -%}
        {%- set cli = ac.cli_credential | default(dc.cli_credential | default({}), true) -%}
        {%- set rd = ac.snmp_v2c_read | default(dc.snmp_v2c_read | default({}), true) -%}
        {%- set wr = ac.snmp_v2c_write | default(dc.snmp_v2c_write | default({}), true) -%}
        {%- if cli.description | default('') -%}
          {%- set acsite = acsite | combine({'cli_credential': {'description': cli.description, 'username': cli.username | default('admin')}}) -%}
        {%- endif -%}
        {%- if rd.description | default('') -%}
          {%- set acsite = acsite | combine({'snmp_v2c_read': {'description': rd.description}}) -%}
        {%- endif -%}
        {%- if wr.description | default('') -%}
          {%- set acsite = acsite | combine({'snmp_v2c_write': {'description': wr.description}}) -%}
        {%- endif -%}
        {%- set ns.result = ns.result + [acsite] -%}
      {%- endfor -%}
      {{ ns.result }}

- name: Compose wfm_config (unique globals, then one assign per site)
  ansible.builtin.set_fact:
    wfm_config: >-
      {%- set ns = namespace(result=[]) -%}
      {%- if wfm_globals | length > 0 -%}
        {%- set ns.result = ns.result + [{'global_credential_details': wfm_globals}] -%}
      {%- endif -%}
      {%- if (state | default('merged')) == 'merged' -%}
        {%- for a in wfm_assigns -%}
          {%- set ns.result = ns.result + [{'assign_credentials_to_site': a}] -%}
        {%- endfor -%}
      {%- endif -%}
      {{ ns.result }}

- name: "DEBUG | wfm_config"
  ansible.builtin.debug:
    var: wfm_config
  when: catc_debug | default(false) | bool

- name: Display CLI/SNMP credentials to be processed
  ansible.builtin.debug:
    msg: >-
      {{ wfm_assigns | default([]) | length }} site assignment(s),
      {{ wfm_globals | default({}) | length }} missing global type(s),
      state={{ state | default('merged') }}

# ── Step 3: Build NETCONF credential list ─────────────────────────────────
#
# NETCONF credentials are extracted separately because
# device_credential_workflow_manager does not support the NETCONF type.
# Handled by Phase C (create/update) and Phase D (delete) below.
#
# Example
#   In : settings_data.project[*].device_credentials.netconf_credential = {
#          "description": "NETCONF-netadmin", "netconf_port": "830" }
#   Out: netconf_list = [
#          { "description": "NETCONF-netadmin", "netconf_port": "830" } ]
#   De-duplicated by description via ns.seen, so N project rows sharing one
#   NETCONF credential produce a single entry. netconf_port is cast to a
#   string because CatC returns it as an int and the port map below is
#   string-keyed.
#
- name: Build netconf_list from device_credentials
  ansible.builtin.set_fact:
    netconf_list: >-
      {%- set ns = namespace(result=[], seen=[]) -%}
      {%- for entry in settings_data.project -%}
        {%- set dc = entry.device_credentials | default(none) -%}
        {%- if dc and dc.netconf_credential is defined and dc.netconf_credential -%}
          {%- set nc = dc.netconf_credential -%}
          {%- if nc.description is defined and nc.description not in ns.seen -%}
            {%- set ns.seen = ns.seen + [nc.description] -%}
            {%- set ns.result = ns.result + [{
              'description':  nc.description,
              'netconf_port': nc.netconf_port | string
            }] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: "DEBUG | netconf_list"
  ansible.builtin.debug:
    var: netconf_list
  when: catc_debug | default(false) | bool

- name: Display NETCONF credentials to be processed
  ansible.builtin.debug:
    msg: "{{ netconf_list | length }} total: {{ netconf_list | map(attribute='description') | list }}"

# ── Phase A: Create / Update / Delete CLI + SNMP v2c credentials ──────────
#
# device_credential_workflow_manager is idempotent: it internally queries
# existing credentials, creates missing ones, and updates changed ones
# (state=merged) or deletes them by description (state=deleted).  No manual
# UUID mapping or create-vs-update splitting is required.
#
# config_verify: true triggers a post-apply re-query and diff check —
# enabled automatically when catc_debug is true.
#
# assign_credentials_to_site is only present in wfm_config when
# state=merged (one item per site). Delete runs carry only unique
# global_credential_details so the module targets the right credentials.
#
- name: "Phase A — Manage CLI+SNMP credentials"
  cisco.dnac.device_credential_workflow_manager:
    state:         "{{ state | default('merged') }}"
    config_verify: "{{ catc_debug | default(false) | bool }}"
    config:        "{{ wfm_config }}"
  register: _wfm_result
  when: wfm_config | length > 0

- name: "DEBUG | Phase A — workflow manager result"
  ansible.builtin.debug:
    var: _wfm_result
  when:
    - catc_debug | default(false) | bool
    - wfm_config | length > 0

# ── Phase B: Create / update NETCONF credentials (state=merged) ───────────
#
# CatC enforces one credential per NETCONF port (not per description).
# Existence is therefore keyed by port — not description — to avoid
# false-negative duplicate failures when the port already exists under a
# different name (e.g. the factory 'defaultNetConfPort').
#
# Behaviour:
#   port absent         → POST (create)
#   port present, same description  → skip (idempotent)
#   port present, diff description  → PUT (rename)
#
# POST and PUT both return HTTP 202 + async task ID; the cisco.dnac
# netconf_credential module mishandles the 202 response body, so
# ansible.builtin.uri + task polling is used instead.
# A raw bearer token is acquired here for those URI calls.
#
# include_tasks (not a plain loop) ensures set_fact inside the task file
# updates netconf_port_map before the next iteration starts.
#
# API paths:
#   GET  /dna/intent/api/v1/global-credential?credentialSubType=NETCONF
#   POST /dna/intent/api/v1/global-credential/netconf   ← create (202)
#   PUT  /dna/intent/api/v1/global-credential/netconf   ← update (202)
#   GET  /api/v1/task/{taskId}                          ← poll
#
- name: Phase B — Query existing NETCONF credentials
  cisco.dnac.global_credential_info:
    credentialSubType: NETCONF
  register: _netconf_info
  when:
    - (state | default('merged')) == 'merged'
    - netconf_list | length > 0

- name: "DEBUG | Phase B — raw NETCONF credential info"
  ansible.builtin.debug:
    var: _netconf_info
  when:
    - catc_debug | default(false) | bool
    - (state | default('merged')) == 'merged'
    - netconf_list | length > 0

- name: Phase B — Build netconf_port_map (port → {id, description})
  # Keyed by port string so the task file detects existing credentials
  # even when the stored description differs from the desired one.
  #
  # Example
  #   In : _netconf_info.dnac_response.response = [
  #          { "id": "aaaa-1111", "description": "defaultNetConfPort",
  #            "netconfPort": 830, "credentialSubType": "NETCONF" } ]
  #   Out: netconf_port_map = {
  #          "830": { "id": "aaaa-1111", "description": "defaultNetConfPort" } }
  #   Desired description is "NETCONF-netadmin" but port 830 is already taken,
  #   so netconf_create_or_update.yml issues a PUT (rename) rather than a POST
  #   that CatC would reject as a duplicate port.
  ansible.builtin.set_fact:
    netconf_port_map: >-
      {%- set m = {} -%}
      {%- for cred in _netconf_info.dnac_response.response | default([]) -%}
        {%- set _ = m.update({cred.netconfPort | string: {'id': cred.id, 'description': cred.description}}) -%}
      {%- endfor -%}
      {{ m }}
  when:
    - (state | default('merged')) == 'merged'
    - netconf_list | length > 0

- name: "Phase B — netconf_port_map summary"
  ansible.builtin.debug:
    msg: "{{ netconf_port_map | default({}) | length }} existing: {{ netconf_port_map | default({}) }}"
  when:
    - (state | default('merged')) == 'merged'
    - netconf_list | length > 0

- name: Phase B — Authenticate for NETCONF raw API calls
  # ansible.builtin.uri is used for CREATE/UPDATE because the
  # cisco.dnac.netconf_credential module mishandles the 202 async
  # task response.  A raw bearer token is required for those calls.
  ansible.builtin.uri:
    url: "https://{{ catc_host }}:{{ catc_port }}/dna/system/api/v1/auth/token"
    method: POST
    user: "{{ catc_username }}"
    password: "{{ catc_password }}"
    force_basic_auth: true
    validate_certs: "{{ catc_verify }}"
    status_code: 200
  register: _netconf_auth
  no_log: true
  when:
    - (state | default('merged')) == 'merged'
    - netconf_list | length > 0

# Example
#   In : _netconf_auth.json = {
#          "Token": "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI2NTNhMWIyYyIsImV4cCI6MTc4NTkzNjEyN30.Qp7mR3xK9vL2sN4tY6uZ8wA1bC5dE0fG"
#        }
#   Out: _catc_token =
#          "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI2NTNhMWIyYyIsImV4cCI6MTc4NTkzNjEyN30.Qp7mR3xK9vL2sN4tY6uZ8wA1bC5dE0fG"
#        consumed by netconf_create_or_update.yml as X-Auth-Token.
- name: Phase B — Store auth token for NETCONF raw calls
  ansible.builtin.set_fact:
    _catc_token: "{{ _netconf_auth.json.Token }}"
  no_log: true
  when:
    - (state | default('merged')) == 'merged'
    - netconf_list | length > 0

- name: "Phase B — Create/update NETCONF credentials"
  ansible.builtin.include_tasks: netconf_create_or_update.yml
  loop: "{{ netconf_list }}"
  loop_control:
    loop_var: netconf_config
    label: "{{ netconf_config.description }}"
  when:
    - (state | default('merged')) == 'merged'
    - netconf_list | length > 0

# ── Phase C: Delete NETCONF credentials (state=deleted) ───────────────────
#
# Phase A (device_credential_workflow_manager) handles CLI and
# SNMP v2c deletion.  This phase deletes NETCONF credentials by UUID via
# global_credential_delete.  Credentials absent from netconf_id_map (not
# found in CatC) are silently skipped inside tasks/netconf_delete.yml.
#
# WARNING: Deleting credentials still assigned to sites or used by
# discovered devices will interrupt device management in Catalyst Center.
# Confirm all devices are decommissioned before running with state=deleted.
#
# API path:
#   DELETE /dna/intent/api/v1/global-credential/{globalCredentialId}
#
- name: Phase C — Query existing NETCONF credentials (for deletion)
  cisco.dnac.global_credential_info:
    credentialSubType: NETCONF
  register: _netconf_info
  when:
    - (state | default('merged')) == 'deleted'
    - netconf_list | length > 0

# Deletion is keyed by description (not port) because the caller names the
# credential it wants gone, and a rename may have left the port unchanged.
# Example
#   In : _netconf_info.dnac_response.response = [
#          { "id": "aaaa-1111", "description": "NETCONF-netadmin", "netconfPort": 830 },
#          { "id": "bbbb-2222", "description": "defaultNetConfPort", "netconfPort": 830 } ]
#   Out: netconf_id_map = { "NETCONF-netadmin":   "aaaa-1111",
#                           "defaultNetConfPort": "bbbb-2222" }
#   netconf_delete.yml skips any netconf_list entry whose description is
#   missing from this map, which is what makes repeat delete runs safe.
- name: Phase C — Build netconf_id_map (description → UUID)
  ansible.builtin.set_fact:
    netconf_id_map: >-
      {%- set m = {} -%}
      {%- for cred in _netconf_info.dnac_response.response | default([]) -%}
        {%- set _ = m.update({cred.description: cred.id}) -%}
      {%- endfor -%}
      {{ m }}
  when:
    - (state | default('merged')) == 'deleted'
    - netconf_list | length > 0

- name: "Phase C — Delete NETCONF credentials"
  ansible.builtin.include_tasks: netconf_delete.yml
  loop: "{{ netconf_list }}"
  loop_control:
    loop_var: netconf_config
    label: "{{ netconf_config.description }}"
  when:
    - (state | default('merged')) == 'deleted'
    - netconf_list | length > 0

# ── Summary ───────────────────────────────────────────────────────────────
- name: Device credentials provisioning complete
  ansible.builtin.debug:
    msg: >-
      {{ 'Deleted' if (state | default('merged')) == 'deleted' else 'Successfully provisioned' }}
      {{ wfm_assigns | default(wfm_config) | length }} CLI/SNMP site assignment(s)
