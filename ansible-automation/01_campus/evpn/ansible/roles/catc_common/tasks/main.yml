# =============================================================================
# catc_common / main.yml
# =============================================================================
# Deliberately empty. This role is a library, not a sequence — a playbook picks
# the one piece it needs:
#
#   load_settings.yml          settings.json  → settings_data
#   build_hierarchy_paths.yml  settings_data  → site_names[]
#   build_site_id_map.yml      Catalyst Center → site_id_map{}
#   auth_token.yml             Catalyst Center → _catc_token
#
# Use `import_role` with `tasks_from:` in pre_tasks. A plain `roles:` entry
# ignores tasks_from and silently runs this stub instead.
# =============================================================================

- name: No default action for catc_common
  ansible.builtin.debug:
    msg: "Use import_role with tasks_from: load_settings, build_hierarchy_paths, build_site_id_map, or auth_token."
