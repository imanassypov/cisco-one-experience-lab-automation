---
# =============================================================================
# assign_to_site / main.yml
# =============================================================================
# Associates each device, by management IP, with its site.
#
# IPs are grouped by site path first, so the site UUID is looked up once per
# site rather than once per device. Two project rows pointing at the same path
# are concatenated, not overwritten.
#
# Needs: settings_data, plus the hierarchy (stage 01) and the devices in
#        inventory (stage 04)
# =============================================================================
- name: Build per-site assignment map
  ansible.builtin.set_fact:
    site_device_map: >-
      {%- set ns = namespace(result={}) -%} {%- for entry in settings_data.project -%}
        {%- if entry.device_list -%}
          {%- set ips = entry.device_list.split(',') | map('trim') | list -%}
          {%- set parent = entry.HierarchyParent | default('Global') -%}
          {%- set area = entry.HierarchyArea | default('') -%}
          {%- set bldg = entry.HierarchyBldg | default('') -%}
          {%- set floor = entry.HierarchyFloor | default('') -%}
          {%- if floor -%}
            {%- set site = parent + '/' + area + '/' + bldg + '/' + floor -%}
          {%- elif bldg -%}
            {%- set site = parent + '/' + area + '/' + bldg -%}
          {%- elif area -%}
            {%- set site = parent + '/' + area -%}
          {%- else -%}
            {%- set site = parent -%}
          {%- endif -%}
          {%- if site in ns.result -%}
            {%- set ns.result = ns.result | combine({site: ns.result[site] + ips}) -%}
          {%- else -%}
            {%- set ns.result = ns.result | combine({site: ips}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%} {{ ns.result }}

- name: --DEBUG-- Per-site assignment map
  when: catc_debug | default(false) | bool
  ansible.builtin.debug:
    msg: "{{ site_device_map }}"

- name: Validate assignment map is non-empty
  ansible.builtin.assert:
    that: site_device_map | length > 0
    fail_msg: "No entries with device_list found in input JSON."
    success_msg: "{{ site_device_map | length }} site(s) to assign devices to."

# GET site by nameHierarchy → siteId for assign_device_to_site.
# Example
#   In : site_device_map | dict2items = [
#          { "key": "Global/PODS/POD 0/Building P0/Floor 1",
#            "value": ["198.19.1.1", "198.19.1.2", "198.19.1.3",
#                      "198.19.1.4", "198.19.1.5", "198.19.1.6"] } ]
#   Out: site_info_results.results = [{
#          "item": { "key":   "Global/PODS/POD 0/Building P0/Floor 1",
#                    "value": ["198.19.1.1", "198.19.1.2", "198.19.1.3",
#                              "198.19.1.4", "198.19.1.5", "198.19.1.6"] },
#          "dnac_response": { "response": [
#            { "id": "4444-4444",
#              "siteNameHierarchy": "Global/PODS/POD 0/Building P0/Floor 1" } ] }
#        }]
#   item.item.key in the next task is what carries the site path forward so
#   the IP list can be re-read from site_device_map.
- name: "Look up site UUIDs"
  cisco.dnac.site_info:
    name: "{{ item.key }}"
  loop: "{{ site_device_map | dict2items }}"
  register: site_info_results

- name: --DEBUG-- Site info results
  when: catc_debug | default(false) | bool
  ansible.builtin.debug:
    msg: "{{ site_info_results }}"

# POST assign API — binds each IP to the resolved siteId.
# Example (one loop iteration)
#   In : item.dnac_response.response[0].id = "4444-4444"
#        item.item.key = "Global/PODS/POD 0/Building P0/Floor 1"
#        site_device_map[item.item.key] = ["198.19.1.1", "198.19.1.2"]
#   Out: module args sent = {
#          "siteId": "4444-4444",
#          "device": [ { "ip": "198.19.1.1" }, { "ip": "198.19.1.2" } ] }
#        assignment_results.results[].dnac_response = async task IDs
#   The bare IP strings must be wrapped as {"ip": "198.19.1.1"} objects — the
#   API rejects
#   a plain string list.
- name: Assign devices to site
  cisco.dnac.assign_device_to_site:
    siteId: "{{ item.dnac_response.response[0].id }}"
    device: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for ip in site_device_map[item.item.key] -%}
        {%- set ns.result = ns.result + [{'ip': ip}] -%}
      {%- endfor -%}
      {{ ns.result }}
  loop: "{{ site_info_results.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  register: assignment_results

- name: --DEBUG-- Assignment results
  when: catc_debug | default(false) | bool
  ansible.builtin.debug:
    msg: "{{ assignment_results }}"

- name: Site assignment complete
  ansible.builtin.debug:
    msg:
      - "Device-to-site assignment submitted successfully"
      - "Sites processed: {{ site_device_map.keys() | list | join(', ') }}"
