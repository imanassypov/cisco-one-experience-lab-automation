---
# =============================================================================
# swim_for_assurance / tasks/distribute.yml  —  Stage 11.3
# =============================================================================
# Copy the golden image into each device's flash. No reload, no change to the
# running image — the device keeps forwarding throughout, which is why this
# phase is safe outside a maintenance window and runs by default.
#
# Catalyst Center runs its own prechecks per device before transferring:
# free flash space (cleaning older images when needed), reachability, NTP clock
# sanity, and a post-transfer checksum. A device that fails a precheck is
# reported and skipped rather than corrupting the transfer.
#
# Targeting here uses the INVENTORY family and series, not the SWIM identifier
# used for tagging in 11.2. See the header of import_and_tag.yml.
#
# Pre:  image tagged golden by 11.2
# Post: image staged in flash on every device matching site + role + family
# =============================================================================

- name: "11.3 | Distribute image to devices"
  cisco.dnac.swim_workflow_manager:
    state: merged
    dnac_api_task_timeout: "{{ swim_task_timeout }}"
    dnac_task_poll_interval: "{{ swim_task_poll_interval }}"
    config:
      - image_distribution_details:
          image_name: "{{ item.image_file }}"
          site_name: "{{ item.site_name }}"
          device_role: "{{ item.device_role | default('ALL') }}"
          # Inventory fields — "Switches and Hubs" / "Cisco Catalyst 9300
          # Series Switches", NOT the SWIM identifier.
          device_family_name: "{{ item.device_family_name }}"
          device_series_name: "{{ item.device_series_name }}"
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.image_file }} -> {{ item.site_name }}"
  register: _swim_distribute
  failed_when: false

- name: "--DEBUG-- Distribution detail"
  ansible.builtin.debug:
    var: _swim_distribute
  when: catc_debug | default(false) | bool

- name: "11.3 | Report distribution outcome"
  ansible.builtin.debug:
    msg: >-
      {{ item.item.image_file }} -> {{ item.item.site_name }}:
      {{ 'distributed / already in flash' if not (item.failed | default(false))
         else 'DISTRIBUTION FAILED — ' ~ (item.msg | default('see evidence')) }}
  loop: "{{ _swim_distribute.results }}"
  loop_control:
    label: "{{ item.item.site_name }}"

# Activation with distribute_if_needed would paper over a failure here, so stop
# instead: a distribute that failed on two of three devices must not turn into a
# partial reload.
- name: "11.3 | Fail if distribution did not complete"
  ansible.builtin.assert:
    that: not (item.failed | default(false))
    fail_msg: >-
      Could not distribute {{ item.item.image_file }} to {{ item.item.site_name }}.
      Common causes: insufficient flash, the device unreachable from Catalyst
      Center, or device_family_name / device_series_name not matching the
      inventory record (stage 11.1 resync refreshes those).
      Reported: {{ item.msg | default('no message') }}
  loop: "{{ _swim_distribute.results }}"
  loop_control:
    label: "{{ item.item.site_name }}"

- name: "11.3 | Write distribution evidence"
  ansible.builtin.copy:
    dest: "{{ swim_evidence_dir }}/{{ swim_run_id }}-11_swim-distribute.json"
    mode: "0644"
    content: "{{ _evidence | to_nice_json }}"
  vars:
    _evidence:
      phase: "11.3 distribute"
      run_id: "{{ swim_run_id }}"
      images: "{{ _swim_entries | map(attribute='image_file') | list }}"
      distribution: "{{ _swim_distribute.results | map(attribute='msg') | list }}"

- name: "11.3 | Distribution complete — no devices reloaded"
  ansible.builtin.debug:
    msg:
      - "Image is staged in flash. Nothing has reloaded and the fabric is unchanged."
      - "Activation was skipped because -e swim_activate=false was supplied."
      - "To activate, re-run without that flag:"
      - "  ansible-playbook playbooks/11_swim_for_assurance.yml"
  when: not (swim_activate | bool)
