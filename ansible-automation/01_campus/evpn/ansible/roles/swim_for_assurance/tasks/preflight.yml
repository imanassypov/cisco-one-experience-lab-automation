---
# =============================================================================
# swim_for_assurance / tasks/preflight.yml  —  Stage 11.1
# =============================================================================
# Resync inventory, then take a baseline IMAGE compliance reading.
#
# Both steps are read-only against the devices. The resync matters because every
# later phase targets devices by site_name + device_family_name + device_series_
# name, and those fields come from the Catalyst Center inventory record, not
# from the device. A stale record silently narrows the target set, which shows
# up as "no eligible devices" much later in distribute.
#
# The baseline reading is what makes the postcheck in 11.5 meaningful: without a
# before, an after tells you nothing about whether this stage changed anything.
#
# Pre:  _swim_entries — from tasks/main.yml
# Post: _swim_preflight_compliance — registered results, written to evidence
# =============================================================================

- name: "11.1 | Resync devices at the target site"
  cisco.catalystcenter.inventory_workflow_manager:
    state: merged
    catalystcenter_api_task_timeout: "{{ swim_task_timeout }}"
    catalystcenter_task_poll_interval: "{{ swim_task_poll_interval }}"
    config:
      - site_name: "{{ item.site_name }}"
        device_resync: true
        # force_sync queues a full collection and serialises behind other jobs;
        # the light resync is enough to refresh family/series/role.
        force_sync: false
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.site_name }}"
  register: _swim_resync
  # A resync failure is not fatal on its own — the inventory may already be
  # current. Surfacing it beats aborting, so the operator sees the reason.
  failed_when: false

- name: "11.1 | Report resync outcome"
  ansible.builtin.debug:
    msg: >-
      {{ item.item.site_name }}:
      {{ 'resynced' if not item.failed | default(false) else 'resync reported: ' ~ (item.msg | default('see evidence')) }}
  loop: "{{ _swim_resync.results }}"
  loop_control:
    label: "{{ item.item.site_name }}"

- name: "11.1 | Baseline IMAGE compliance"
  cisco.catalystcenter.network_compliance_workflow_manager:
    state: merged
    catalystcenter_api_task_timeout: "{{ swim_task_timeout }}"
    catalystcenter_task_poll_interval: "{{ swim_task_poll_interval }}"
    config:
      - site_name: "{{ item.site_name }}"
        run_compliance: true
        # IMAGE only. The other categories (INTENT, CONFIG, PSIRT, EOX) are
        # stage 12's business and would add minutes to every SWIM run.
        run_compliance_categories:
          - IMAGE
        sync_device_config: "{{ swim_sync_device_config }}"
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.site_name }}"
  register: _swim_preflight_compliance
  failed_when: false

- name: "--DEBUG-- Baseline compliance detail"
  ansible.builtin.debug:
    var: _swim_preflight_compliance
  when: catc_debug | default(false) | bool

- name: "11.1 | Write preflight evidence"
  ansible.builtin.copy:
    dest: "{{ swim_evidence_dir }}/{{ swim_run_id }}-11_swim-preflight.json"
    mode: "0644"
    content: "{{ _evidence | to_nice_json }}"
  vars:
    _evidence:
      phase: "11.1 preflight"
      run_id: "{{ swim_run_id }}"
      sites: "{{ _swim_entries | map(attribute='site_name') | list }}"
      resync: "{{ _swim_resync.results | map(attribute='msg') | list }}"
      baseline_compliance: "{{ _swim_preflight_compliance.results | map(attribute='msg') | list }}"
