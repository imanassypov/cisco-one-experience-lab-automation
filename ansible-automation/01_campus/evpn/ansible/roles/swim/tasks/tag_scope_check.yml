---
# =============================================================================
# swim / tasks/tag_scope_check.yml  —  step 1.7 pre-tag guard
# =============================================================================
# Refuses to tag at a FLOOR.
#
# The tagging API accepts a floor and reports success, but the Catalyst Center
# Images tab can only navigate to areas and buildings. The tag is then written,
# stored, and invisible: the family reads "missing standard image" at every
# scope an operator can select, with nowhere to click to remove it.
#
# Nothing else catches this, because the per-device view DOES see a floor tag —
# so every other check in this role passes. Measured on this pod 2026-10-29:
# the Site-105 building reported goldenImageCount 0, the floor below it 1.
#
# Also hands tag_verify.yml the siteId, so the two guards share one lookup.
#
# Pre:  _swim_entries
# Post: _swim_tag_site_ids — {tag_site_name: siteId}
# =============================================================================

- name: "1.7.1 | Resolve the golden-tag site"
  cisco.catalystcenter.sites_info:
    nameHierarchy: "{{ item }}"
  loop: "{{ _swim_entries | map(attribute='tag_site_name') | unique | list }}"
  loop_control:
    label: "{{ item }}"
  register: _swim_tag_sites_raw

# Collapse the results before asserting on them. A looped assert prints its
# whole `item`, so the thing looped over has to be small.
- name: "1.7.2 | Summarise the resolved tag sites"
  ansible.builtin.set_fact:
    _swim_tag_sites: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for r in _swim_tag_sites_raw.results -%}
      {%- set hits = r.catalystcenter_response.response | default([]) -%}
      {%- set ns.out = ns.out + [{
            'path': r.item,
            'matches': hits | length,
            'id': (hits | first | default({})).get('id'),
            'type': (hits | first | default({})).get('type')
          }] -%}
      {%- endfor -%}
      {{ ns.out }}

- name: "1.7.3 | Fail if the tag site does not exist"
  ansible.builtin.assert:
    that: item.matches == 1
    fail_msg: >-
      '{{ item.path }}' does not resolve to exactly one Catalyst Center site
      ({{ item.matches }} matches). The golden-tag scope is derived from the
      project's HierarchyParent / HierarchyArea / HierarchyBldg fields in
      settings.json, so one of those does not match the hierarchy stage 01
      built.
  loop: "{{ _swim_tag_sites }}"
  loop_control:
    label: "{{ item.path }}"

- name: "1.7.4 | Fail if the tag site is a floor"
  ansible.builtin.assert:
    that: item.type != 'floor'
    fail_msg: >-
      '{{ item.path }}' is a {{ item.type }}. Golden tagging must target an area
      or a building: Catalyst Center accepts a floor here and then cannot show
      or manage the tag anywhere in the Images tab, so the device family reads
      "missing standard image" forever while the devices themselves look
      correctly tagged.
      Tag at the building and let the floor inherit.
    success_msg: "{{ item.path }} is a {{ item.type }} — addressable in the Images tab"
  loop: "{{ _swim_tag_sites }}"
  loop_control:
    label: "{{ item.path }}"

- name: "1.7.5 | Index tag site ids"
  ansible.builtin.set_fact:
    _swim_tag_site_ids: "{{ dict(_swim_tag_sites | map(attribute='path') | zip(_swim_tag_sites | map(attribute='id'))) }}"
