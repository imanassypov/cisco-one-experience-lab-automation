---
# =============================================================================
# swim / tasks/main.yml  —  Pipeline stage 09
# =============================================================================
# Software Image Management for the Site-105 campus fabric, driven entirely from
# settings.json so the image is declared in the same place as everything else
# the pipeline builds.
#
# Why "for assurance": the EVPN telemetry subscriptions stage 10 deploys, and
# the Splunk assurance collection in 07_assurance that consumes them, depend on
# YANG models whose coverage moves between IOS-XE trains. Lifting the fabric to
# a known image is therefore part of standing up assurance, not a side errand.
#
# Phase order — each is a separate file and can be run alone with tags:
#   09.1 preflight       resync inventory, baseline IMAGE compliance   (read-only)
#   09.2 import_and_tag  pull image from CCO, mark it golden           (CatC only)
#   09.3 distribute      copy image to device flash, no reload         (safe)
#   09.4 activate        reload onto the new image                     (DISRUPTIVE)
#   09.5 postcheck       IMAGE compliance after activation             (read-only)
#   09.6 rollback        re-tag prior image and activate it            (DISRUPTIVE)
#
# Phases 09.1-09.5 run by default, including the reload in 09.4. 09.6 replaces
# them and stays locked behind explicit flags — see defaults/main.yml.
#
# Sourced:
#   settings_data.swim_catalog        — the images themselves (settings.json)
#   settings_data.project[].swim      — which catalog ids each site wants
#   catc_username / catc_password     — Lab Topology/lab_access.yml (vault)
#   catc_* connection vars            — inventory/group_vars/catalyst_center/
#
# Produced:
#   evidence/<run_id>-09_swim-<phase>.json per phase
#   In Catalyst Center: image in the repository, tagged golden for the site,
#   distributed to flash, and optionally activated.
#
# Module: cisco.catalystcenter.swim_workflow_manager, inventory_workflow_manager,
#         network_compliance_workflow_manager. Connection parameters come from
#         module_defaults in the playbook, matching every other stage.
#
# Depends on: stages 01-05 (devices must be discovered, managed and assigned to
# the site, because every SWIM call targets devices by site + role).
# =============================================================================

# ── Build the work list ──────────────────────────────────────────────────────
# Images live once in settings_data.swim_catalog; a project only names the ids
# it wants. One _swim_entries row per (project x referenced image), so two
# device types at one site are two rows rather than a second swim block.
#
# Each row carries TWO site paths, because tagging and upgrading are different
# questions:
#   tag_site_name  the BUILDING — golden tagging is a policy statement about a
#                  site, and the Catalyst Center Images tab can only address
#                  areas and buildings. A floor-scoped tag is accepted by the
#                  API and then invisible in the UI. See tag_scope_check.yml.
#   site_name      the FLOOR — where the devices actually sit, so resync,
#                  distribute and activate find them.
# Both are derived from the project's Hierarchy* fields, the same way
# catc_common/build_hierarchy_paths.yml does it, so no path is spelled twice.
#
# Example
#   In : swim_catalog.images = [ {id: "c9300-26.01.02", image_file: "cat9k_...bin", ...} ]
#        settings_data.project = [ {HierarchyParent: "Global/NORTH CAROLINA",
#          HierarchyArea: "Durham", HierarchyBldg: "Site-105",
#          HierarchyFloor: "MAIN", swim: {enabled: true, images: ["c9300-26.01.02"]}} ]
#   Out: _swim_entries = [ { image_file: "cat9k_...bin", ...,
#          project: "Site-105",
#          tag_site_name: "Global/NORTH CAROLINA/Durham/Site-105",
#          site_name:     "Global/NORTH CAROLINA/Durham/Site-105/MAIN" } ]
# tags: always on everything up to the phases. Every phase depends on
# _swim_entries, so a tag-filtered run like --tags swim_distribute would
# otherwise skip the setup and die on "'_swim_entries' is undefined". The reload
# gates must be unskippable for the same reason they exist at all.
- name: Index the SWIM catalog by image id
  ansible.builtin.set_fact:
    _swim_catalog_by_id: "{{ dict(_images | map(attribute='id') | zip(_images)) }}"
    # import_source and image_base_url are catalog-wide; an image may override.
    _swim_catalog_defaults:
      import_source: "{{ _catalog.import_source | default('CCO') }}"
      image_base_url: "{{ _catalog.image_base_url | default('') }}"
  vars:
    _catalog: "{{ settings_data.swim_catalog | default({}) }}"
    _images: "{{ _catalog.images | default([]) | selectattr('id', 'defined') | list }}"
  tags: [always]

- name: Build SWIM work list from settings.json
  ansible.builtin.set_fact:
    _swim_entries: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for p in _enabled -%}
      {%- set bldg = p.HierarchyParent ~ '/' ~ p.HierarchyArea ~ '/' ~ p.HierarchyBldg -%}
      {%- set floor = bldg ~ '/' ~ p.HierarchyFloor if p.HierarchyFloor else bldg -%}
      {%- for image_id in p.swim.images | default([]) -%}
      {%- if image_id in _swim_catalog_by_id -%}
      {%- set ns.out = ns.out + [
            _swim_catalog_defaults
            | combine(_swim_catalog_by_id[image_id])
            | combine({'project': p.HierarchyBldg,
                       'tag_site_name': bldg,
                       'site_name': floor})
          ] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ns.out }}
    _swim_projects: "{{ _enabled | map(attribute='HierarchyBldg') | list }}"
    # Named but absent from the catalog — a typo here would otherwise just
    # upgrade nothing and report success.
    _swim_unknown_ids: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for p in _enabled -%}
      {%- for image_id in p.swim.images | default([]) -%}
      {%- if image_id not in _swim_catalog_by_id -%}
      {%- set ns.out = ns.out + [p.HierarchyBldg ~ ' -> ' ~ image_id] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ns.out }}
    _swim_empty_refs: "{{ _enabled | rejectattr('swim.images', 'defined') | map(attribute='HierarchyBldg') | list
                          + (_enabled | selectattr('swim.images', 'defined')
                             | rejectattr('swim.images') | map(attribute='HierarchyBldg') | list) }}"
  vars:
    _enabled: >-
      {{
        settings_data.project
        | default([])
        | selectattr('swim', 'defined')
        | selectattr('swim.enabled', 'defined')
        | selectattr('swim.enabled')
        | list
      }}
  tags: [always]

- name: "--DEBUG-- SWIM work list"
  ansible.builtin.debug:
    var: _swim_entries
  when: catc_debug | default(false) | bool
  tags: [always]

- name: Assert every referenced catalog image exists
  ansible.builtin.assert:
    that: _swim_unknown_ids | length == 0
    fail_msg: >-
      settings.json references SWIM catalog images that do not exist:
      {{ _swim_unknown_ids | join(', ') }}.
      Available ids: {{ _swim_catalog_by_id.keys() | list | join(', ') | default('none — swim_catalog is missing or empty', true) }}
    success_msg: "All referenced catalog images resolved"
  tags: [always]

- name: Assert every swim-enabled project names at least one image
  ansible.builtin.assert:
    that: _swim_empty_refs | length == 0
    fail_msg: >-
      {{ _swim_empty_refs | join(', ') }} has swim.enabled = true but no
      swim.images, so this stage would silently upgrade nothing. Add the
      catalog id(s), or set enabled to false.
  tags: [always]

# A stage that silently does nothing is worse than one that fails: stage 12
# would then report the old version with no clue why. Fail loudly instead.
- name: Assert at least one project declares swim
  ansible.builtin.assert:
    that: _swim_entries | length > 0
    fail_msg: >-
      No project in settings.json has swim.enabled = true. Add a swim block to
      the project you want upgraded, or skip this stage.
    success_msg: "SWIM enabled for: {{ _swim_projects | join(', ') }}"
  tags: [always]

# image_state.yml keys its up-to-date verdict by image_file, so two entries
# sharing one .bin would overwrite each other's answer.
- name: Assert each image file appears once
  ansible.builtin.assert:
    that: _files | length == _files | unique | length
    fail_msg: >-
      The same image file is referenced by more than one catalog entry
      ({{ _files | join(', ') }}). Give each entry its own image_file.
  vars:
    _files: "{{ _swim_entries | map(attribute='image_file') | list }}"
  tags: [always]

# Every phase writes evidence; create the directory once rather than per phase.
- name: Ensure evidence directory exists
  ansible.builtin.file:
    path: "{{ swim_evidence_dir }}"
    state: directory
    mode: "0755"
  tags: [always]

# ── Reload gates ─────────────────────────────────────────────────────────────
# Activation is default-on and deliberately ungated, so stage 09 runs the whole
# upgrade in one command. The announcement below is the only warning an operator
# gets; `-e swim_activate=false` is the opt-out.
#
# Rollback stays gated. Making a downgrade as easy as an upgrade is how a fabric
# gets reverted by a stray --extra-var.
- name: Warn that a default run reloads the fabric
  ansible.builtin.debug:
    msg: "Stage 09 will ACTIVATE {{ item.image_file }} at {{ item.site_name }} — those devices WILL RELOAD."
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.site_name }}"
  when:
    - swim_activate | bool
    - not (swim_rollback | bool)
  tags: [always]

- name: Warn that a wireless controller is in scope
  ansible.builtin.debug:
    msg:
      - "A wireless controller is in scope. Every access point it manages drops and rejoins."
      - "To stage the images without reloading anything: -e swim_activate=false"
  when:
    - swim_activate | bool
    - not (swim_rollback | bool)
    - _swim_entries | selectattr('device_family_name', 'equalto', 'Wireless Controller') | list | length > 0
  tags: [always]

- name: Enforce rollback gates
  ansible.builtin.assert:
    that:
      - swim_rollback_confirm == "YES"
      - swim_reload_ack == "RELOAD_OK"
    fail_msg: >-
      Rollback re-tags the previous image and reloads every device. Re-run with
      all three flags if that is intended:
        -e swim_rollback=true -e swim_rollback_confirm=YES -e swim_reload_ack=RELOAD_OK
  when: swim_rollback | bool
  tags: [always]

# ── Phases ───────────────────────────────────────────────────────────────────
# Rollback is a recovery path, not a step in the normal sequence: when it is
# requested it runs alone, because importing and re-tagging the upgrade image on
# the way to a downgrade is exactly the wrong thing to do.
# apply: is required on every include below. A tag on include_tasks selects the
# include itself but not the tasks it pulls in, so --tags swim_import would run
# the include and nothing else.
- name: "Stage 09.6 | Rollback to the previous image"
  ansible.builtin.include_tasks:
    file: rollback.yml
    apply:
      tags: [swim_rollback]
  when: swim_rollback | bool
  tags: [swim_rollback]

- name: Run the forward upgrade phases
  when: not (swim_rollback | bool)
  block:
    - name: "Stage 09.1 | Preflight — resync and baseline compliance"
      ansible.builtin.include_tasks:
        file: preflight.yml
        apply:
          tags: [swim_preflight]
      when: swim_run_preflight | bool
      tags: [swim_preflight]

    - name: "Stage 09.2 | Import and tag golden"
      ansible.builtin.include_tasks:
        file: import_and_tag.yml
        apply:
          tags: [swim_import]
      when: swim_run_import | bool
      tags: [swim_import]

    - name: "Stage 09.3 | Distribute image to device flash"
      ansible.builtin.include_tasks:
        file: distribute.yml
        apply:
          tags: [swim_distribute]
      when: swim_run_distribute | bool
      tags: [swim_distribute]

    - name: "Stage 09.4 | Activate image (reloads devices)"
      ansible.builtin.include_tasks:
        file: activate.yml
        apply:
          tags: [swim_activate]
      when: swim_activate | bool
      tags: [swim_activate]

    - name: "Stage 09.5 | Post-activation compliance"
      ansible.builtin.include_tasks:
        file: postcheck.yml
        apply:
          tags: [swim_postcheck]
      when:
        - swim_activate | bool
        - swim_run_postcheck | bool
      tags: [swim_postcheck]

- name: Stage 09 summary
  ansible.builtin.debug:
    msg: >-
      {{
        ['SWIM stage 09 complete for: ' ~ (_swim_projects | join(', ')),
         'Mode          : ' ~ ('ROLLBACK' if swim_rollback | bool else 'upgrade'),
         'Activated     : ' ~ ('yes — devices reloaded' if swim_activate | bool or swim_rollback | bool
                               else 'no — image staged in flash only'),
         'Evidence      : ' ~ swim_evidence_dir]
        + (['Next          : ansible-playbook playbooks/12_verify_intent.yml']
           if swim_activate | bool or swim_rollback | bool
           else ['Next          : re-run without -e swim_activate=false '
                 ~ 'during a maintenance window to reload onto the new image'])
      }}
