---
# =============================================================================
# swim / tasks/02_distribute.yml  —  Phase 2
# =============================================================================
# Copy the image into each device's flash. No reload, and the running image is
# untouched, so the device keeps forwarding — which is why this phase runs by
# default and is safe outside a maintenance window.
#
# Catalyst Center prechecks each device first (free flash, reachability, clock)
# and verifies a checksum afterwards, skipping any device that fails rather
# than corrupting the transfer.
#
# Targeting here uses the INVENTORY family and series, not the SWIM identifier
# used for tagging in phase 1. See the header of 01_import_and_tag.yml.
#
# Pre:  image tagged as the site standard by phase 1
# Post: image in flash on every device matching site + role + family
# =============================================================================

- name: "2.1 | Distribute image to devices"
  cisco.catalystcenter.swim_workflow_manager:
    state: merged
    catalystcenter_api_task_timeout: "{{ swim_task_timeout }}"
    catalystcenter_task_poll_interval: "{{ swim_task_poll_interval }}"
    config:
      - image_distribution_details:
          image_name: "{{ item.image_file }}"
          site_name: "{{ item.site_name }}"
          device_role: "{{ item.device_role | default('ALL') }}"
          # Inventory fields — "Switches and Hubs" / "Cisco Catalyst 9300
          # Series Switches", NOT the SWIM identifier.
          device_family_name: "{{ item.device_family_name }}"
          device_series_name: "{{ item.device_series_name }}"
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.image_file }} -> {{ item.site_name }}"
  register: _swim_distribute
  failed_when: false

- name: "--DEBUG-- Distribution detail"
  ansible.builtin.debug:
    var: _swim_distribute
  when: catc_debug | default(false) | bool

- name: "2.2 | Report distribution outcome"
  ansible.builtin.debug:
    msg: >-
      {{ item.item.image_file }} -> {{ item.item.site_name }}:
      {{ 'distributed / already in flash' if not (item.failed | default(false))
         else 'DISTRIBUTION FAILED — ' ~ (item.msg | default('no message')) }}
  loop: "{{ _swim_distribute.results }}"
  loop_control:
    label: "{{ item.item.site_name }}"

# Activation with distribute_if_needed would paper over a failure here, so stop
# instead: a distribute that failed on two of three devices must not turn into a
# partial reload.
- name: "2.3 | Establish whether the image is already everywhere"
  ansible.builtin.include_tasks:
    file: image_state.yml
    apply:
      tags: [swim_distribute]
  vars:
    _swim_step: "2.3"

- name: "2.4 | Fail if distribution did not complete"
  ansible.builtin.assert:
    that:
      - not (item.failed | default(false))
      - _hits | length == 0 or (_only_no_eligible and _already_running)
    fail_msg: >-
      Could not distribute {{ item.item.image_file }} to {{ item.item.site_name }}.
      "No eligible devices" almost always means the image is missing from the
      repository or is not tagged golden for this site — check phase 1.
      Other causes: insufficient flash, the device unreachable from Catalyst
      Center, or device_family_name / device_series_name not matching the
      inventory record.
      This is NOT the harmless re-run case: Catalyst Center still reports at
      least one golden-tagged device that is not DEVICE_UP_TO_DATE, or no device
      is tagged golden for this image at all.
      Reported: {{ item.msg | default('no message') }}
    success_msg: >-
      {{ item.item.image_file }} -> {{ item.item.site_name }}:
      {{ 'already running everywhere it is golden — nothing to distribute'
         if (_hits | length > 0) else 'distributed' }}
  loop: "{{ _swim_distribute.results }}"
  loop_control:
    label: "{{ item.item.site_name }}"
  vars:
    _msg: "{{ item.msg | default('') | string | lower }}"
    _hits: "{{ swim_failure_signatures | select('in', _msg) | list }}"
    _only_no_eligible: "{{ _hits | reject('equalto', 'no eligible devices') | list | length == 0 }}"
    _already_running: "{{ swim_image_up_to_date[item.item.image_file] | default(false) }}"

- name: "2.5 | Distribution complete — no devices reloaded"
  ansible.builtin.debug:
    msg:
      - "Image is staged in flash. Nothing has reloaded and the fabric is unchanged."
      - "Activation was skipped because -e swim_activate=false was supplied."
      - "To activate, re-run without that flag:"
      - "  ansible-playbook playbooks/09_swim.yml"
  when: not (swim_activate | bool)
