---
# =============================================================================
# swim / tasks/image_state.yml  —  shared helper
# =============================================================================
# Answers one question for 09.2 and 09.3: is this image ALREADY running on every
# device it is tagged golden for?
#
# Both phases report "No eligible devices" for two opposite reasons:
#   nothing to do   — the fabric already runs the image (a clean re-run)
#   nothing worked  — the image is missing, untagged, or the family/series
#                     filters match no device
# The module returns `status: success` either way, so the message alone cannot
# tell them apart and the 09.x asserts used to fail a perfectly good re-run.
#
# Scoping comes free from golden tagging: `goldenImages` is populated only on
# devices this image is tagged for, so a device outside the entry's site or
# family drops out without a site-member lookup — including devices belonging to
# a different catalog entry, since the verdict is per image_file. A device
# tagged golden but NOT `DEVICE_UP_TO_DATE` is a real target that still needs
# work, which is what makes "nothing to do" safe to assert.
#
# Requiring at least one tagged device is deliberate: if golden tagging silently
# failed, zero devices are tagged, nothing is "stale", and a naive check would
# call that success — the exact failure this role already guards against in 09.1.
#
# _swim_step comes from the caller, because this file runs inside two different
# phases and the task numbering has to say which one. The index trails the name
# here, unlike every other task, and the step suffix is built inside the
# expression: ansible-lint name[template] requires the Jinja to be the very last
# thing in the string, because --start-at-task cannot resolve it.
#
# Pre:  _swim_entries, _swim_step
# Post: swim_image_up_to_date — {image_file: bool}
# =============================================================================

- name: "Read per-device image state | {{ _swim_step ~ '.1' }}"
  cisco.catalystcenter.network_device_images_info:
    limit: 500
    offset: 1
  register: _swim_device_images
  # Never block a phase on this: it only ever downgrades a failure to a pass,
  # so losing it just restores the old, stricter behaviour.
  failed_when: false

- name: "Record which images are already running everywhere they are golden | {{ _swim_step ~ '.2' }}"
  ansible.builtin.set_fact:
    swim_image_up_to_date: >-
      {{ swim_image_up_to_date | default({})
         | combine({item.image_file: (_verdict | trim | bool)}) }}
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.image_file }}"
  vars:
    _devices: "{{ _swim_device_images.catalystcenter_response.response | default([], true) }}"
    # goldenImages is ABSENT, not null, on untagged devices, so .get() is
    # required: d.goldenImages raises inside `or []` and that failure silently
    # leaves this whole fact undefined rather than erroring here.
    _verdict: >-
      {%- set tagged = [] -%}
      {%- set stale = [] -%}
      {%- for d in _devices -%}
      {%- set names = (d.get('goldenImages') or []) | selectattr('name', 'defined') | map(attribute='name') | list -%}
      {%- if item.image_file in names -%}
      {%- set _ = tagged.append(d.get('managementAddress')) -%}
      {%- if d.get('networkDeviceUpdateStatus') != 'DEVICE_UP_TO_DATE' -%}
      {%- set _ = stale.append(d.get('managementAddress')) -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ (tagged | length > 0) and (stale | length == 0) }}

- name: "--DEBUG-- Per-image up-to-date verdict"
  ansible.builtin.debug:
    var: swim_image_up_to_date
  when: catc_debug | default(false) | bool
