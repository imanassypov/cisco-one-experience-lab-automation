---
# =============================================================================
# swim / tasks/tag_verify.yml  —  09.1.11 post-tag guard
# =============================================================================
# Asks Catalyst Center the same question the Images tab asks: does this site
# have a standard image for this device family?
#
# The module reporting success is not evidence. A tag can be written into a
# scope the UI cannot read (see tag_scope_check.yml), and the per-device view
# will still look right, so this check deliberately queries by SITE rather than
# by device.
#
#   GET /dna/intent/api/v1/siteWiseProductNames?siteId=…
#   response[]: { id, productName, productNameOrdinal, networkDeviceCount,
#                 imageSummary: { installedImageCount, goldenImageCount,
#                                 installedImageAdvisorCount } }
#
# The count is nested under imageSummary, not top level. `id` and
# productNameOrdinal are the SWIM device family identifier, and productName is
# the SWIM family string — the same value settings.json carries as
# device_image_family_name, which is how an entry is matched to its record.
#
# Pre:  _swim_entries, _swim_tag_site_ids (tag_scope_check.yml)
# Post: nothing persisted; fails the stage if a tag is not visible at its site
# =============================================================================

- name: "09.1.11.1 | Read standard images per site"
  cisco.catalystcenter.site_wise_product_names_info:
    siteId: "{{ _swim_tag_site_ids[item.tag_site_name] }}"
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.device_image_family_name }} @ {{ item.tag_site_name }}"
  register: _swim_site_products_raw

# Unfiltered on purpose: productName would narrow the response to the family
# being checked, and the failure message needs the ones the site DOES know.
- name: "09.1.11.2 | Summarise the per-site standard images"
  ansible.builtin.set_fact:
    _swim_site_products: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for r in _swim_site_products_raw.results -%}
      {%- set records = r.catalystcenter_response.response | default([]) -%}
      {%- set match = records | selectattr('productName', 'equalto', r.item.device_image_family_name) | list -%}
      {%- set ns.out = ns.out + [{
            'site': r.item.tag_site_name,
            'family': r.item.device_image_family_name,
            'image_file': r.item.image_file,
            'golden': (match | first | default({})).get('imageSummary', {}).get('goldenImageCount', 0),
            'products': records | selectattr('productName', 'defined') | map(attribute='productName') | list
          }] -%}
      {%- endfor -%}
      {{ ns.out }}

- name: "09.1.11.3 | Fail if the site has no standard image for the family"
  ansible.builtin.assert:
    that: item.golden | int > 0
    fail_msg: >-
      {{ item.site }} reports no standard image for '{{ item.family }}', even
      though tagging {{ item.image_file }} reported success. This is what the
      Images tab shows as "missing standard image". Check that
      device_image_family_name matches a productName Catalyst Center knows at
      this site: {{ item.products | join(', ') | default('none', true) }}
    success_msg: "{{ item.site }}: standard image set for {{ item.family }}"
  loop: "{{ _swim_site_products }}"
  loop_control:
    label: "{{ item.site }}"
