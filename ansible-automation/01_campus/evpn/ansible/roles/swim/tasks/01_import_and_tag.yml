---
# =============================================================================
# swim / tasks/01_import_and_tag.yml  —  Phase 1
# =============================================================================
# Pull the image from Cisco Connection Online into the Catalyst Center image
# repository, then mark it golden for the site and role.
#
# Import source is chosen per project by settings.json swim.import_source:
#
#   remote  Catalyst Center pulls the .bin over HTTP from the script server,
#           which the 00_scriptserver_bootstrap collection publishes from
#           iosxe_images/. This is the working path in this pod and is not
#           limited to Cisco-suggested builds.
#   CCO     Catalyst Center downloads from cisco.com. Needs Cisco.com
#           credentials under System > Settings and egress to cisco.com.
#           Verified broken here on 2026-09-19: every image is refused with
#           NCSW10375 "not the latest or suggested image from cisco", including
#           ones CatC's own catalogue flags ciscoLatest / recommended=CISCO.
#
# The rollback image is imported here too, not at rollback time. If the upgrade
# goes wrong the recovery path must already have its target sitting in the
# repository — discovering mid-incident that the old image needs a download is
# the wrong moment to find out.
#
# Two different "family" names are in play and they are NOT interchangeable:
#   device_image_family_name — the SWIM identifier, used for tagging
#                              ("Cisco Catalyst 9300 Switch")
#   device_family_name       — the inventory family, used for distribute and
#                              activate ("Switches and Hubs")
# Swapping them yields "no eligible devices found" with no further explanation.
#
# Both steps are idempotent: an already-imported image and an already-golden tag
# both return ok / changed=false.
#
# Pre:  _swim_entries — from tasks/main.yml
# Post: image present in the CatC repository and tagged golden for the site
# =============================================================================

- name: "1.1 | Import upgrade image"
  cisco.catalystcenter.swim_workflow_manager:
    state: merged
    catalystcenter_api_task_timeout: "{{ swim_import_timeout }}"
    catalystcenter_task_poll_interval: "{{ swim_task_poll_interval }}"
    config:
      - import_image_details: "{{ _cco if _source == 'CCO' else _remote }}"
  vars:
    _source: "{{ item.import_source | default('CCO') | upper }}"
    _cco:
      type: CCO
      cco_image_details:
        image_name:
          - "{{ item.image_file }}"
    _remote:
      type: remote
      url_details:
        payload:
          - source_url:
              - "{{ item.image_base_url | default('') }}/{{ item.image_file }}"
            is_third_party: false
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.image_file }} via {{ item.import_source | default('CCO') }}"
  register: _swim_import
  failed_when: false

# Separate call from the upgrade image on purpose. Passing both in one
# cco_image_details.image_name list meant a problem with the rollback image
# failed the whole task and the upgrade image never imported either — observed
# 2026-09-19, where the error named 17.12.06 while 26.01.01 was the real target.
# The rollback image is also non-fatal: losing the recovery target should not
# stop an upgrade that is otherwise fine.
- name: "1.2 | Import rollback image"
  cisco.catalystcenter.swim_workflow_manager:
    state: merged
    catalystcenter_api_task_timeout: "{{ swim_import_timeout }}"
    catalystcenter_task_poll_interval: "{{ swim_task_poll_interval }}"
    config:
      - import_image_details: "{{ _cco if _source == 'CCO' else _remote }}"
  vars:
    _source: "{{ item.import_source | default('CCO') | upper }}"
    _cco:
      type: CCO
      cco_image_details:
        image_name:
          - "{{ item.rollback_image_file }}"
    _remote:
      type: remote
      url_details:
        payload:
          - source_url:
              - "{{ item.image_base_url | default('') }}/{{ item.rollback_image_file }}"
            is_third_party: false
  loop: "{{ _swim_entries | selectattr('rollback_image_file', 'defined') | list }}"
  loop_control:
    label: "{{ item.rollback_image_file }}"
  register: _swim_import_rollback
  failed_when: false

- name: "1.3 | Warn if the rollback image did not import"
  ansible.builtin.debug:
    msg: >-
      WARNING: rollback image {{ item.item.rollback_image_file }} did not import
      ({{ item.msg | default('no message') }}).
      The upgrade can proceed, but phase 4 has no recovery target until this
      image is in the repository.
  loop: "{{ _swim_import_rollback.results | default([]) }}"
  loop_control:
    label: "{{ item.item.rollback_image_file | default('n/a') }}"
  when:
    - item.failed | default(false) or (swim_failure_signatures | select('in', (item.msg | default('') | string | lower)) | list | length > 0)

# no_log is deliberately NOT used here. It censors the failure as well as the
# secret, and a silent SWIM import is indistinguishable from a successful one.
#
# _swim_soft_failed folds item.failed together with a msg scan, because the
# module returns failed=false while reporting "CCO image ... not found" in msg.
- name: "1.4 | Report import outcome"
  ansible.builtin.debug:
    msg: >-
      {{ item.item.image_file }}:
      {{ 'imported / already present' if not (item.failed | default(false) or _hit)
         else 'IMPORT FAILED — ' ~ (item.msg | default('see evidence')) }}
  vars:
    _hit: >-
      {{ swim_failure_signatures
         | select('in', (item.msg | default('') | string | lower))
         | list | length > 0 }}
  loop: "{{ _swim_import.results }}"
  loop_control:
    label: "{{ item.item.image_file }}"

# Authoritative check: ask the repository rather than believe the module.
- name: "1.5 | Confirm the image actually reached the repository"
  cisco.catalystcenter.swim_image_details_info:
    imageName: "{{ item.image_file }}"
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.image_file }}"
  register: _swim_repo_check

- name: "1.6 | Fail if the upgrade image is not in the repository"
  ansible.builtin.assert:
    that: item.present
    fail_msg: >-
      {{ item.image_file }} is NOT in the Catalyst Center image repository
      after the import phase, so nothing downstream can work.
      The image name must match a build Catalyst Center is offered by CCO
      exactly — a name that merely exists on cisco.com is not enough. List what
      this cluster can actually import with:
        GET /dna/intent/api/v1/images
      (note: offset/limit return an empty set on this build — call it plain).
    success_msg: "{{ item.image_file }} present in the repository"
  # Summarised rather than looped over the raw results: a looped assert prints
  # its whole item.
  vars:
    _summary: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for r in _swim_repo_check.results -%}
      {%- set ns.out = ns.out + [{'image_file': r.item.image_file,
                                  'present': (r.catalystcenter_response.response | default([]) | length > 0)}] -%}
      {%- endfor -%}
      {{ ns.out }}
  loop: "{{ _summary }}"
  loop_control:
    label: "{{ item.image_file }}"

# Golden tagging is scoped to the BUILDING, not the floor the devices sit on.
# tag_scope_check.yml explains why and enforces it.
# apply: on a nested include is required for the same reason it is in main.yml —
# an inherited tag reaches this include but not the tasks it pulls in.
- name: "1.7 | Check the tag scope is addressable"
  ansible.builtin.include_tasks:
    file: tag_scope_check.yml
    apply:
      tags: [swim_import]

- name: "1.8 | Tag the upgrade image golden for the site"
  cisco.catalystcenter.swim_workflow_manager:
    state: merged
    catalystcenter_api_task_timeout: "{{ swim_task_timeout }}"
    catalystcenter_task_poll_interval: "{{ swim_task_poll_interval }}"
    config:
      - tagging_details:
          image_name: "{{ item.image_file }}"
          device_role: "{{ item.device_role | default('ALL') }}"
          # SWIM identifier, not the inventory family — see header.
          device_image_family_name: "{{ item.device_image_family_name }}"
          site_name: "{{ item.tag_site_name }}"
          tagging: true
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.image_file }} @ {{ item.tag_site_name }}"
  register: _swim_tag
  failed_when: false

- name: "1.9 | Report tagging outcome"
  ansible.builtin.debug:
    msg: >-
      {{ item.item.image_file }} @ {{ item.item.tag_site_name }}:
      {{ 'golden' if not (item.failed | default(false))
         else 'TAG FAILED — ' ~ (item.msg | default('see evidence')) }}
  loop: "{{ _swim_tag.results }}"
  loop_control:
    label: "{{ item.item.image_file }}"

- name: "1.10 | Fail if the image could not be tagged golden"
  ansible.builtin.assert:
    that:
      - not (item.failed | default(false))
      - swim_failure_signatures | select('in', (item.msg | default('') | string | lower)) | list | length == 0
    fail_msg: >-
      Could not tag {{ item.item.image_file }} golden at
      {{ item.item.tag_site_name }}.
      Either the image is not in the repository, or device_image_family_name
      holds an inventory family ("Switches and Hubs") instead of the SWIM
      identifier (settings.json declares
      "{{ item.item.device_image_family_name }}").
      Reported: {{ item.msg | default('no message') }}
  loop: "{{ _swim_tag.results }}"
  loop_control:
    label: "{{ item.item.image_file }}"

- name: "1.11 | Confirm the tag is visible at the site scope"
  ansible.builtin.include_tasks:
    file: tag_verify.yml
    apply:
      tags: [swim_import]

- name: "1.12 | Write import and tag evidence"
  ansible.builtin.copy:
    dest: "{{ swim_evidence_dir }}/{{ swim_run_id }}-09_swim-import_and_tag.json"
    mode: "0644"
    content: "{{ _evidence | to_nice_json }}"
  vars:
    _evidence:
      phase: "1 import_and_tag"
      run_id: "{{ swim_run_id }}"
      images: "{{ _swim_entries | map(attribute='image_file') | list }}"
      tag_sites: "{{ _swim_entries | map(attribute='tag_site_name') | list }}"
      import: "{{ _swim_import.results | map(attribute='msg') | list }}"
      tagging: "{{ _swim_tag.results | map(attribute='msg') | list }}"
