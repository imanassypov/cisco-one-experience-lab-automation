---
# =============================================================================
# swim / tasks/04_rollback.yml  —  Phase 4
# =============================================================================
# DISRUPTIVE recovery path. Marks the previous image as the site standard again
# and reloads every targeted device back onto it.
#
# Replaces phases 1-3 rather than following them — main.yml branches on
# swim_rollback — and needs all three gates:
#   -e swim_rollback=true -e swim_rollback_confirm=YES -e swim_reload_ack=RELOAD_OK
#
# Needs nothing from the forward phases: phase 1 already imported
# rollback_image_file during the upgrade this is undoing.
#
# The one real difference from phase 3 is activate_lower_image_version: the
# target is older than what is running, and Catalyst Center refuses the
# downgrade without it.
#
# Pre:  rollback_image_file declared in settings.json and already imported
# Post: devices running the previous image
# =============================================================================

- name: "4.1 | Require a rollback image to be declared"
  ansible.builtin.assert:
    that: item.rollback_image_file is defined and item.rollback_image_file | length > 0
    fail_msg: >-
      {{ item.site_name }} has no swim.rollback_image_file in settings.json, so
      there is nothing to roll back to. Add the previously-running image name
      and re-run phase 1 to import it before attempting a rollback.
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.site_name }}"

- name: "4.2 | Announce the rollback"
  ansible.builtin.debug:
    msg:
      - "ROLLING BACK {{ item.site_name }} to {{ item.rollback_image_file }}"
      - "Devices WILL reload. Overlay connectivity drops until they return."
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.site_name }}"

- name: "4.3 | Re-tag the previous image as golden"
  cisco.catalystcenter.swim_workflow_manager:
    state: merged
    catalystcenter_api_task_timeout: "{{ swim_task_timeout }}"
    catalystcenter_task_poll_interval: "{{ swim_task_poll_interval }}"
    config:
      - tagging_details:
          image_name: "{{ item.rollback_image_file }}"
          device_role: "{{ item.device_role | default('ALL') }}"
          device_image_family_name: "{{ item.device_image_family_name }}"
          site_name: "{{ item.tag_site_name }}"
          tagging: true
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.rollback_image_file }} @ {{ item.tag_site_name }}"
  register: _swim_rollback_tag
  failed_when: false

- name: "4.4 | Fail if the rollback image could not be tagged"
  ansible.builtin.assert:
    that: not (item.failed | default(false))
    fail_msg: >-
      Could not tag {{ item.item.rollback_image_file }} golden at
      {{ item.item.tag_site_name }}. If the image is not in the repository,
      import it first: -e swim_rollback=false with swim.rollback_image_file set.
      Reported: {{ item.msg | default('no message') }}
  loop: "{{ _swim_rollback_tag.results }}"
  loop_control:
    label: "{{ item.item.site_name }}"

- name: "4.5 | Activate the previous image"
  cisco.catalystcenter.swim_workflow_manager:
    state: merged
    catalystcenter_api_task_timeout: "{{ swim_task_timeout }}"
    catalystcenter_task_poll_interval: "{{ swim_task_poll_interval }}"
    config:
      - image_activation_details:
          image_name: "{{ item.rollback_image_file }}"
          site_name: "{{ item.site_name }}"
          device_role: "{{ item.device_role | default('ALL') }}"
          device_family_name: "{{ item.device_family_name }}"
          device_series_name: "{{ item.device_series_name }}"
          # REQUIRED for a rollback — the target is older than what is running.
          activate_lower_image_version: true
          device_upgrade_mode: "{{ item.device_upgrade_mode | default('install') }}"
          distribute_if_needed: true
          schedule_validate: false
  loop: "{{ _swim_entries }}"
  loop_control:
    label: "{{ item.rollback_image_file }} @ {{ item.site_name }}"
  register: _swim_rollback_activate
  failed_when: false

- name: "--DEBUG-- Rollback activation detail"
  ansible.builtin.debug:
    var: _swim_rollback_activate
  when: catc_debug | default(false) | bool

- name: "4.6 | Fail if the rollback did not complete"
  ansible.builtin.assert:
    that: not (item.failed | default(false))
    fail_msg: >-
      Rollback to {{ item.item.rollback_image_file }} at {{ item.item.site_name }}
      did not complete. Devices may be in a mixed state — check `show version`
      and `show install summary` on each before retrying.
      Reported: {{ item.msg | default('no message') }}
  loop: "{{ _swim_rollback_activate.results }}"
  loop_control:
    label: "{{ item.item.site_name }}"

- name: "4.7 | Next step"
  ansible.builtin.debug:
    msg:
      - "Rollback complete. Confirm the fabric came back:"
      - "  ansible-playbook playbooks/12_verify_intent.yml"
      - "NOTE: the previous image is now the golden tag for this site. Stage"
      - "Phase 1 will re-tag the upgrade image the next time it runs."
