# =============================================================================
# verify_intent / defaults/main.yml
# =============================================================================
# Knobs for stage 11. Overridable with -e.
# =============================================================================
---
# Command Runner rejects more than five commands per request with
# "Maximum of 5 commands allowed per request" (verified 2026-09-15), so the
# collector chunks its command list.
verify_command_batch_size: 5

# Seconds Command Runner waits on the device. 0 lets Catalyst Center apply its
# own default (300s per the API docs).
verify_command_timeout: 0

# Set false to render the report and still exit 0 — useful when demonstrating a
# known-broken fabric to students.
verify_fail_on_mismatch: true

# Where the reports land. Relative to the playbook, so they follow the repo's
# existing evidence/ convention and stay gitignored. realpath collapses the
# playbooks/../evidence hop so the summary prints a path worth copying. NOTE:
# this is the filesystem of whatever host runs the play, which is normally the
# Kali script server, not the laptop.
verify_report_path: "{{ (playbook_dir ~ '/../evidence/stage11-verification.md') | realpath }}"

# Self-contained HTML version: indexed, colour-coded, filterable to failures.
# No external CSS or JS, so it opens from the script server or after an scp with
# no network.
verify_report_html_path: "{{ (playbook_dir ~ '/../evidence/stage11-verification.html') | realpath }}"

# Templates whose {% set %} blocks carry the fabric intent. Read from Catalyst
# Center, never from the repo checkout — stage 06 seeds CatC from git or a local
# folder, and stage 11 must verify what was actually deployed.
verify_defn_prefix: "DEFN-"
