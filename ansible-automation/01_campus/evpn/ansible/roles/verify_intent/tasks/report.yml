# ============================================================================
# verify_intent / tasks/report.yml  —  Stage 12.7
# ============================================================================
# Writes the markdown and HTML reports, prints the summary, and only THEN
# fails — so the operator gets the whole matrix, not the first mismatch.
#
# NOT_VERIFIED never fails the play: Command Runner refusing a command is not
# the fabric's fault. It is still counted and listed, so partial coverage is
# never mistaken for a clean run.
#
# Both reports land on whichever host ran the play — the script server, not
# your laptop.
# ============================================================================
---
- name: Ensure the evidence directory exists
  ansible.builtin.file:
    path: "{{ verify_report_path | dirname }}"
    state: directory
    mode: "0755"

- name: Write the verification report
  ansible.builtin.template:
    src: report.md.j2
    dest: "{{ verify_report_path }}"
    mode: "0644"

- name: Write the HTML verification report
  ansible.builtin.template:
    src: report.html.j2
    dest: "{{ verify_report_html_path }}"
    mode: "0644"

- name: Verification summary
  ansible.builtin.debug:
    msg: >-
      {{ ['┌─────────────────────────────────────────────────────────────────┐']
         + ['│ Devices       : ' + (_verify_devices | length) | string
            + '  (' + (_verify_devices | map(attribute='hostname')
            | map('regex_replace', '\..*$', '') | join(', ')) + ')']
         + ['│ Checks        : ' + (_verify_results | length) | string]
         + ['│ Pass          : ' + _verify_counts.pass | string]
         + ['│ Fail          : ' + _verify_counts.fail | string]
         + ['│ Not verified  : ' + _verify_counts.not_verified | string]
         + ['│ Not applicable: ' + _verify_counts.skipped | string]
         + (_verify_results | selectattr('status', 'equalto', 'FAIL')
            | map(attribute='title')
            | zip(_verify_results | selectattr('status', 'equalto', 'FAIL')
                  | map(attribute='device')
                  | map('regex_replace', '\..*$', ''))
            | map('join', ' on ') | map('regex_replace', '^', '│   FAIL: ')
            | list)
         + ['│ Report        : ' + verify_report_path]
         + ['│ HTML          : ' + verify_report_html_path]
         + ['├─────────────────────────────────────────────────────────────────┤']
         + ['│ Read it here  : less -R ' + verify_report_path]
         + ['│ Or in Firefox : xdg-open ' + verify_report_html_path]
         + ['│ Or on your laptop:']
         + ['│   scp ' + (lookup('env', 'USER') | default('cisco', true))
            + '@<script-server>:' + verify_report_html_path + ' . && open '
            + (verify_report_html_path | basename)]
         + ['└─────────────────────────────────────────────────────────────────┘'] }}

- name: Report that some checks had no verdict
  when: (_verify_counts.not_verified | int) > 0
  ansible.builtin.debug:
    msg: >-
      {{ _verify_counts.not_verified }} check(s) could not be evaluated because
      Catalyst Center returned no output for their command. They are listed
      under "Not verified" in {{ verify_report_path }} and do not fail this run.

- name: Verification verdict
  when: not (verify_fail_on_mismatch | bool)
  ansible.builtin.debug:
    msg: >-
      {{
        ('All ' ~ _verify_counts.pass ~ ' evaluated check(s) match the declared intent.')
        if (_verify_counts.fail | int) == 0 else
        (_verify_counts.fail ~ ' check(s) do not match the declared intent: '
         ~ (_verify_results | selectattr('status', 'equalto', 'FAIL')
            | map(attribute='id') | unique | join(', '))
         ~ '. Read the intended and observed values with "less -R '
         ~ verify_report_path ~ '", or open ' ~ verify_report_html_path
         ~ ' in a browser and use its failures-only filter.')
      }}

# Off by default: a mismatch is a finding in the report, not a broken run. Turn
# it on for a pipeline that gates on the exit code.
- name: Assert the fabric matches the declared intent
  when: verify_fail_on_mismatch | bool
  ansible.builtin.assert:
    that: (_verify_counts.fail | int) == 0
    fail_msg: >-
      {{ _verify_counts.fail }} check(s) do not match the declared intent:
      {{ _verify_results | selectattr('status', 'equalto', 'FAIL')
         | map(attribute='id') | unique | join(', ') }}.
      Read the intended and observed values with
      'less -R {{ verify_report_path }}', or open
      {{ verify_report_html_path }} in a browser and use its failures-only
      filter. This task only runs because verify_fail_on_mismatch was set true;
      the reports are written either way.
    success_msg: >-
      All {{ _verify_counts.pass }} evaluated check(s) match the declared
      intent. Report: {{ verify_report_path }}
