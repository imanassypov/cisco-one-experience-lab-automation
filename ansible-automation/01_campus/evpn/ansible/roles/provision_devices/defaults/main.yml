---
# =============================================================================
# provision_devices / defaults/main.yml
# =============================================================================
# Device families that POST/PUT /dna/intent/api/v1/sda/provisionDevices cannot
# handle, and which the wired pass in tasks/provision_site.yml therefore keeps
# out of its payloads.
#
# Matched as substrings against the family Catalyst Center reports for the
# device, so 'Wireless' covers 'Wireless Controller' and 'Wireless Sensor'
# without listing each. 'Unified AP' needs its own entry because an access
# point's family contains no such marker.
#
# A device matching any marker is reported and left alone by the wired pass.
# Controllers are then provisioned by tasks/provision_wireless.yml through
# provision_workflow_manager, and access points by
# tasks/provision_accesspoints.yml — neither of which touches the SDA API.
wireless_family_markers:
  - Wireless
  - Unified AP

# force_provisioning for the controller pass (tasks/provision_wireless.yml).
#
# Deliberately its own knob rather than the shared force_reprovision, which
# also switches on the wired PUT path — forcing the controller should not
# re-push the fabric switches alongside it.
#
# Defaults true because provision_workflow_manager short-circuits on
# 'already provisioned' without diffing intent, so with it false a changed
# managed_ap_locations or wireless profile binding is silently never applied.
# Forcing re-asserts the intent on every run. A re-provision that changes the
# controller's managed AP locations reboots the affected APs; re-asserting the
# same locations does not.
#
# Set false to make the pass a no-op against an already-provisioned controller:
#   -e force_wireless_provisioning=false
force_wireless_provisioning: true

# RF profile the AP pass (tasks/provision_accesspoints.yml) provisions an access
# point with when nothing more specific applies.
#
# Not optional at the API: POST /wirelessAccessPoints/provision rejects a
# payload without one, with NCWS14003 "RF Profile is required for default/empty
# AP Zone". The UI hides this by preselecting whichever profile is marked
# default under Design > Network Settings > Wireless > RF Profiles.
#
# Resolution order in the AP pass:
#   1. access_points[].rf_profile in settings.json, for a per-AP override
#   2. whichever profile Catalyst Center reports with defaultRfProfile true
#   3. this value
#
# Step 3 is what this lab actually uses: CatC ships LOW, TYPICAL and HIGH, and
# none of them is flagged as the default, so there is nothing to inherit.
# TYPICAL is the middle of the three and the sane pick for an indoor pod.
ap_default_rf_profile: TYPICAL
