---
# =============================================================================
# provision_devices / main.yml
# =============================================================================
# Provisions every device, in three passes — the wired one here, then
# controllers and access points, which cannot use the same API.
#
#   wired     provision_switches.yml      (per site)
#   wireless  provision_wireless.yml      (once)
#   APs       provision_accesspoints.yml  (once)
#
# Already-provisioned devices are skipped unless -e force_reprovision=true.
#
# Needs: _catc_token and settings_data from the playbook's pre_tasks
# =============================================================================

# ── Step 3: Build per-site device map ─────────────────────────────────────
#
# device_list is a comma-separated STRING in settings.json, not a list. Rows
# sharing a site path have their IPs concatenated, not overwritten, so the site
# UUID is resolved once per site rather than once per row.
- name: Build per-site device map
  ansible.builtin.set_fact:
    _site_device_map: >-
      {%- set ns = namespace(result={}) -%} {%- for entry in settings_data.project -%}
        {%- if entry.device_list is defined and entry.device_list -%}
          {%- set ips = entry.device_list.split(',') | map('trim') | reject('equalto', '') | list -%}
          {%- set parent = entry.HierarchyParent | default('Global') -%}
          {%- set area = entry.HierarchyArea | default('') -%}
          {%- set bldg = entry.HierarchyBldg | default('') -%}
          {%- set floor = entry.HierarchyFloor | default('') -%}
          {%- if floor -%}
            {%- set site_path = parent + '/' + area + '/' + bldg + '/' + floor -%}
          {%- elif bldg -%}
            {%- set site_path = parent + '/' + area + '/' + bldg -%}
          {%- elif area -%}
            {%- set site_path = parent + '/' + area -%}
          {%- else -%}
            {%- set site_path = parent -%}
          {%- endif -%}
          {%- if site_path in ns.result -%}
            {%- set ns.result = ns.result | combine({site_path: ns.result[site_path] + ips}) -%}
          {%- else -%}
            {%- set ns.result = ns.result | combine({site_path: ips}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%} {{ ns.result }}

- name: --DEBUG-- Per-site device map
  when: catc_debug | default(false) | bool
  ansible.builtin.debug:
    var: _site_device_map

- name: Validate site device map is non-empty
  ansible.builtin.assert:
    that: _site_device_map | length > 0
    fail_msg: "No entries with device_list found in input JSON."
    success_msg: >-
      {{ _site_device_map | length }} site(s) /
      {{ _site_device_map.values() | map('length') | sum }} device(s) to provision.

# ── Step 4: Process each site ─────────────────────────────────────────────
#
# For each site:
#   a. Resolve the site UUID via the Sites REST API.
#   b. Resolve device UUIDs for every target management IP.
#   c. Check which devices are already provisioned at the site.
#   d. Submit POST /dna/intent/api/v1/sda/provisionDevices for any that are not.
#   e. Poll the returned async task until completion and report status.
#
- name: Process device provisioning for each site
  ansible.builtin.include_tasks: provision_switches.yml
  loop: "{{ _site_device_map | dict2items }}"
  loop_control:
    loop_var: site_entry
    label: "{{ site_entry.key }}"

# ── Step 5: Provision wireless controllers ────────────────────────────────
#
# The loop above skips any device whose family contains 'Wireless' — the SDA
# provision API cannot set a wireless role and answers NCWL10092. Controllers
# are provisioned here instead, via provision_workflow_manager, which is also
# what assigns their managed AP locations.
#
# Runs once for all sites rather than per site: a controller commonly sits in
# one building and serves the APs of another, so the settings row, not the
# loop, decides the pairing. Tasks: tasks/provision_wireless.yml
#
# Gated by wireless_provision_enabled because this reboots APs whenever the
# managed AP locations change.
- name: Report that wireless provisioning is disabled
  when: not (wireless_provision_enabled | default(true) | bool)
  ansible.builtin.debug:
    msg: >-
      wireless_provision_enabled is false — leaving wireless controllers
      site-assigned but unprovisioned. Set it true to provision them.

- name: Provision wireless controllers
  when: wireless_provision_enabled | default(true) | bool
  ansible.builtin.include_tasks: provision_wireless.yml

# ── Step 6: Configure access points ───────────────────────────────────────
#
# Names each AP, assigns it to its floor, then provisions it. The provision is
# what creates the AP's policy and site tags — a site assignment alone leaves
# it on default tags, serving no SSID.
#
# Runs after the controller pass because the AP is provisioned against a floor
# the controller lists in primary_managed_ap_locations, which Step 5 sets.
# Tasks: tasks/provision_accesspoints.yml
#
# Gated by ap_provision_enabled because provisioning an AP can reboot it.
- name: Report that access point provisioning is disabled
  when: not (ap_provision_enabled | default(true) | bool)
  ansible.builtin.debug:
    msg: >-
      ap_provision_enabled is false — leaving access points on their current
      names and tags. Set it true to name, site-assign and provision them.

- name: Configure access points
  when: ap_provision_enabled | default(true) | bool
  ansible.builtin.include_tasks: provision_accesspoints.yml
