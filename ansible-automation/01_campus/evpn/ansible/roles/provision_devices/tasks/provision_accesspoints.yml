# ============================================================================
# tasks/provision_accesspoints.yml  —  Pipeline stage 8.2
# ============================================================================
# Names each access point and assigns it to the site whose APs the controller
# provisioned in stage 8.1 manages.
#
# Catalyst Center never provisions an access point directly, and nothing lets
# you hand one a policy tag or a site tag. Both are derived, in two moves: the
# AP is assigned to a site, then the controller managing that site is
# re-provisioned, at which point it takes the AP over and pushes the tags that
# the wireless profile bound to that site implies. An AP that has had neither
# done to it sits on default-site-tag and default-policy-tag, which map no
# WLAN, so it broadcasts nothing.
#
# Two modules, because neither does the whole job in a non-fabric deployment:
#
#   accesspoint_workflow_manager  names the AP and sets its location, but only
#     when the config carries no site key. Given a site it calls
#     verify_wlc_provision on the AP's controller, which asks the SDA endpoint
#     GET sda/get_device_info whether that controller is provisioned. This lab
#     is BGP EVPN with non-fabric wireless, so the WLC is provisioned but holds
#     no fabric role, the endpoint answers 400 "does not have any fabric role
#     assigned", and the module aborts the run.
#
#   assign_device_to_site  does the site assignment instead — the same module
#     stage 05 uses for the switches, and it does not care about fabric roles.
#     provision_workflow_manager is not an option here: it types a device by
#     family and maps only Wireless Controller, Switches and Hubs and Routers,
#     so a Unified AP falls through with no branch to handle it.
#
# The AP reboots when its tags change and takes 1-3 minutes to rejoin, so this
# is gated by ap_provision_enabled.
#
# Variables read from inventory / parent play scope:
#   settings_data   — settings.json (catc_common.load_settings), already token
#                     substituted, so access_points[].mac_address is a real MAC
#   _catc_token     — short-lived JWT for the inventory lookup
#   dnac_host / dnac_port / dnac_verify
# ============================================================================
---

# ── Step A: Collect the declared access points ────────────────────────────
#
# Every access_points entry across all project rows, flattened.
#
# An entry whose mac_address still holds a literal {APn_MAC} is dropped here.
# settings.json carries an entry per AP the site could have, while lab.yml
# lists only the MACs of the pod actually in front of the student, so the
# loader deliberately leaves the surplus tokens unresolved for this filter.
#
# Example - a two-AP site in a pod that has one AP
#   In : settings_data.project[2].access_points = [
#          { "mac_address": "04:5f:b9:ca:03:58", "ap_name": "SITE-105-AP-1",
#            "location": "Leaf1", "ap_mode": "Local",
#            "is_assigned_site_as_location": "Disabled",
#            "site": { "floor": { "name": "MAIN",
#                                 "parent_name": "Global/NORTH CAROLINA/Durham/Site-105" } } },
#          { "mac_address": "{AP2_MAC}", "ap_name": "SITE-105-AP-2", ... }
#        ]
#   Out: _ap_declared   = [ the SITE-105-AP-1 entry ]
#        _ap_unresolved = ["SITE-105-AP-2"]
- name: Build declared access point list
  ansible.builtin.set_fact:
    _ap_declared: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for entry in settings_data.project -%}
        {%- for ap in entry.access_points | default([]) -%}
          {%- if '{' not in (ap.mac_address | default('')) -%}
            {%- set ns.result = ns.result + [ap] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.result }}
    _ap_unresolved: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for entry in settings_data.project -%}
        {%- for ap in entry.access_points | default([]) -%}
          {%- if '{' in (ap.mac_address | default('')) -%}
            {%- set ns.result = ns.result + [ap.ap_name | default(ap.mac_address)] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Declared access point list
  when: catc_debug | default(false) | bool
  ansible.builtin.debug:
    var: _ap_declared

- name: Report access points this pod does not have
  when: _ap_unresolved | length > 0
  ansible.builtin.debug:
    msg: >-
      Skipping {{ _ap_unresolved | join(', ') }} — no matching entry in
      lab_ap_macs, so the {APn_MAC} token was never filled. Add the MAC to
      inventory/group_vars/all/lab.yml if this pod does have the AP.

- name: Report that no site declares an access point
  when: _ap_declared | length == 0
  ansible.builtin.debug:
    msg: >-
      No resolvable access_points entry in settings.json — nothing to name or
      assign. Controllers were handled by the wireless pass above.

# ── Step B: Look up what Catalyst Center knows about those APs ────────────
#
# lab.yml holds the Ethernet MAC, because that is what is printed on the AP
# and shown in the WLC's Ethernet MAC column, so it is the number a student
# can actually find. Catalyst Center indexes an AP by its radio base MAC
# instead: GET network-device?macAddress=<Ethernet MAC> returns zero devices,
# and accesspoint_workflow_manager resolves an AP by passing mac_address
# straight into that same query, so handing it the Ethernet MAC fails with
# "either invalid or not present in the Cisco Catalyst Center".
#
# Listing the Unified AP family once gives both translations this file needs —
# radio MAC to name the AP, management IP to assign it — and doubles as the
# presence check: an AP that has not joined the controller is simply absent
# from the response.
- name: List access points known to Catalyst Center
  when: _ap_declared | length > 0
  ansible.builtin.uri:
    url: "https://{{ dnac_host }}:{{ dnac_port }}/dna/intent/api/v1/network-device?family=Unified%20AP"
    method: GET
    headers:
      X-Auth-Token: "{{ _catc_token }}"
    validate_certs: "{{ dnac_verify }}"
    status_code: 200
  register: _ap_inventory_result

# Example
#   In : _ap_inventory_result.json.response = [
#          { "hostname": "SITE-105-AP-1",
#            "macAddress": "68:7d:b4:90:95:00",
#            "apEthernetMacAddress": "04:5f:b9:ca:03:58",
#            "managementIpAddress": "10.10.255.101",
#            "siteHierarchy": null }
#        ]
#   Out: _ap_inventory_map = {
#          "04:5f:b9:ca:03:58": { "radio_mac": "68:7d:b4:90:95:00",
#                                 "mgmt_ip":   "10.10.255.101",
#                                 "hostname":  "SITE-105-AP-1",
#                                 "site":      "" }
#        }
# Keys are lowercased on both sides so the comparison in Step C survives an
# inventory that answers in upper case.
- name: Build Ethernet MAC → inventory map
  when: _ap_declared | length > 0
  ansible.builtin.set_fact:
    _ap_inventory_map: >-
      {%- set ns = namespace(result={}) -%}
      {%- for d in (_ap_inventory_result.json.response | default([])) -%}
        {%- if d.apEthernetMacAddress is defined and d.apEthernetMacAddress -%}
          {%- set ns.result = ns.result | combine({
              d.apEthernetMacAddress | lower: {
                'radio_mac': d.macAddress           | default(''),
                'mgmt_ip':   d.managementIpAddress  | default(''),
                'hostname':  d.hostname             | default(''),
                'site':      d.siteHierarchy | default('') or ''
              }
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Ethernet MAC → inventory map
  when:
    - catc_debug | default(false) | bool
    - _ap_declared | length > 0
  ansible.builtin.debug:
    var: _ap_inventory_map

# ── Step C: Split the intent between the two modules ──────────────────────
#
# _ap_name_config carries everything accesspoint_workflow_manager accepts,
# with mac_address swapped for the radio MAC and the site key removed — see
# the header for why a site there aborts the run.
#
# _ap_site_map is the site assignment, grouped the way assign_device_to_site
# wants it: one entry per site path, holding the management IPs to assign. The
# path is composed from the same site.floor block, so settings.json still
# expresses the intent in one place.
#
# A declared AP missing from the inventory map has not joined the controller
# and is collected separately rather than sent, because the module fails the
# whole run on an unresolvable identifier.
#
# Example
#   In : _ap_declared      = [ { "mac_address": "04:5f:b9:ca:03:58",
#                               "ap_name": "SITE-105-AP-1", "location": "Leaf1",
#                               "ap_mode": "Local",
#                               "is_assigned_site_as_location": "Disabled",
#                               "site": { "floor": { "name": "MAIN",
#                                 "parent_name": "Global/NORTH CAROLINA/Durham/Site-105" } } } ]
#        _ap_inventory_map = { "04:5f:b9:ca:03:58": { "radio_mac": "68:7d:b4:90:95:00",
#                                                     "mgmt_ip": "10.10.255.101", ... } }
#   Out: _ap_name_config = [ { "mac_address": "68:7d:b4:90:95:00",
#                              "ap_name": "SITE-105-AP-1", "location": "Leaf1",
#                              "ap_mode": "Local",
#                              "is_assigned_site_as_location": "Disabled" } ]
#        _ap_site_map    = { "Global/NORTH CAROLINA/Durham/Site-105/MAIN":
#                              ["10.10.255.101"] }
#        _ap_absent      = []
- name: Build access point name and site configs
  when: _ap_declared | length > 0
  ansible.builtin.set_fact:
    _ap_name_config: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for ap in _ap_declared -%}
        {%- set eth = ap.mac_address | lower -%}
        {%- if eth in _ap_inventory_map -%}
          {%- set ns.result = ns.result
                + [ap | combine({'mac_address': _ap_inventory_map[eth].radio_mac})
                      | dict2items | rejectattr('key', 'equalto', 'site')
                      | list | items2dict] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}
    _ap_site_map: >-
      {%- set ns = namespace(result={}) -%}
      {%- for ap in _ap_declared -%}
        {%- set eth = ap.mac_address | lower -%}
        {%- if eth in _ap_inventory_map and ap.site is defined and ap.site.floor is defined -%}
          {%- set path = ap.site.floor.parent_name ~ '/' ~ ap.site.floor.name -%}
          {%- set ip = _ap_inventory_map[eth].mgmt_ip -%}
          {%- if path in ns.result -%}
            {%- set ns.result = ns.result | combine({path: ns.result[path] + [ip]}) -%}
          {%- else -%}
            {%- set ns.result = ns.result | combine({path: [ip]}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}
    _ap_absent: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for ap in _ap_declared -%}
        {%- if (ap.mac_address | lower) not in _ap_inventory_map -%}
          {%- set ns.result = ns.result
                + [(ap.ap_name | default('unnamed')) ~ ' (' ~ ap.mac_address ~ ')'] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Access point name and site configs
  when:
    - catc_debug | default(false) | bool
    - _ap_declared | length > 0
  ansible.builtin.debug:
    msg:
      name_config: "{{ _ap_name_config }}"
      site_map: "{{ _ap_site_map }}"

# A MAC in lab.yml that inventory has never seen is a typo or an AP that never
# joined. Failing here beats letting the module report an opaque "invalid or
# not present" for the whole batch.
- name: Assert every declared access point has joined the controller
  when: _ap_declared | length > 0
  ansible.builtin.assert:
    that: _ap_absent | length == 0
    fail_msg: >-
      Not found among the Unified AP devices in Catalyst Center:
      {{ _ap_absent | join(', ') }}.
      Check the Ethernet MAC in inventory/group_vars/all/lab.yml, and confirm
      the AP has joined the controller — 'show ap summary' on the WLC.
    success_msg: >-
      {{ _ap_name_config | length }} access point(s) to configure.

# Site assignment is the whole point of the stage; without it the AP is named
# and left on default tags, broadcasting nothing.
- name: Assert every access point resolved to a site
  when: _ap_declared | length > 0
  ansible.builtin.assert:
    that: _ap_site_map | length > 0
    fail_msg: >-
      No access point carries a site.floor block in settings.json. Without one
      Catalyst Center pushes no policy or site tag and the AP serves no SSID.

# ── Step D: Name the access points ────────────────────────────────────────
#
# Idempotent on name, location and mode. No site key here — see the header.
- name: Name and locate access points
  when: _ap_declared | length > 0
  cisco.dnac.accesspoint_workflow_manager:
    state: merged
    config: "{{ _ap_name_config }}"
  register: _ap_name_result

- name: --DEBUG-- Access point naming result
  when:
    - catc_debug | default(false) | bool
    - _ap_declared | length > 0
  ansible.builtin.debug:
    var: _ap_name_result

# ── Step E: Assign them to their site ─────────────────────────────────────
#
# Same two-step the switches take in stage 05: resolve the site path to a
# siteId, then post the assignment against it.
- name: Resolve access point site IDs
  when: _ap_declared | length > 0
  cisco.dnac.site_info:
    name: "{{ item.key }}"
  loop: "{{ _ap_site_map | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: _ap_site_info_results

# assign_device_to_site is a thin API wrapper and always reports changed=false,
# so it cannot tell us whether anything moved. Step F needs to know, because it
# reboots the AP. Reading current membership first gives a real answer, and
# skipping an assignment that would be a no-op keeps re-runs quiet.
#
# The AP's own network-device record is no help here: siteHierarchy stays null
# for a Unified AP even once it is a member, so membership has to be read from
# the site side.
- name: Read current site membership
  when: _ap_declared | length > 0
  ansible.builtin.uri:
    url: "https://{{ dnac_host }}:{{ dnac_port }}/dna/intent/api/v1/site-member/{{ item.dnac_response.response[0].id }}/member?memberType=networkdevice"
    method: GET
    headers:
      X-Auth-Token: "{{ _catc_token }}"
    validate_certs: "{{ dnac_verify }}"
    status_code: 200
  loop: "{{ _ap_site_info_results.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  register: _ap_member_results

# Example - the AP is not yet a member, the three switches are
#   In : _ap_site_map = { "Global/NORTH CAROLINA/Durham/Site-105/MAIN":
#                           ["10.10.255.101"] }
#        membership for that site = 172.30.255.1-3
#   Out: _ap_pending = { "Global/NORTH CAROLINA/Durham/Site-105/MAIN":
#                          ["10.10.255.101"] }
#
# Example - a re-run, with the AP already a member
#   Out: _ap_pending = {}   → Step E assigns nothing and Step F reboots nothing
- name: Determine which assignments are still pending
  when: _ap_declared | length > 0
  ansible.builtin.set_fact:
    _ap_pending: >-
      {%- set ns = namespace(result={}) -%}
      {%- for r in (_ap_member_results.results | default([])) -%}
        {%- set path = r.item.item.key -%}
        {%- set members = r.json.response | default([])
              | map(attribute='managementIpAddress') | list -%}
        {%- set missing = _ap_site_map[path] | difference(members) -%}
        {%- if missing | length > 0 -%}
          {%- set ns.result = ns.result | combine({path: missing}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Pending site assignments
  when:
    - catc_debug | default(false) | bool
    - _ap_declared | length > 0
  ansible.builtin.debug:
    var: _ap_pending

# The takeover in Step F is what actually gets the tags onto the AP, and it
# normally runs only when Step E moved something, so that a re-run does not
# reboot the APs for nothing.
#
# force_reprovision overrides that, for the case where the two halves have come
# apart: the AP is already a site member but the controller was never
# re-provisioned afterwards, so it still holds default tags and no amount of
# re-running will fix it on its own. This is the same flag that drives
# force_provisioning in stage 8.1, so one switch covers both.
- name: Decide whether the controller needs re-provisioning
  when: _ap_declared | length > 0
  ansible.builtin.set_fact:
    _ap_takeover_needed: >-
      {{ (_ap_pending | length > 0) or (force_reprovision | default(false) | bool) }}

- name: Report that every access point is already in its site
  when:
    - _ap_declared | length > 0
    - _ap_pending | length == 0
  ansible.builtin.debug:
    msg: >-
      All {{ _ap_name_config | length }} access point(s) already belong to
      their site, so nothing was assigned.
      {{ 'Re-provisioning the controller anyway because force_reprovision is set.'
         if _ap_takeover_needed | bool
         else 'The controller is left alone, so the APs are not rebooted. If an
               AP is a member but still shows default tags, re-run with
               -e force_reprovision=true to hand it over.' }}

# Example (one loop iteration)
#   In : item.dnac_response.response[0].id = "919ce2a1-39b7-4c1f-a7ec-c76e50170ab7"
#        item.item.key = "Global/NORTH CAROLINA/Durham/Site-105/MAIN"
#        _ap_pending[item.item.key] = ["10.10.255.101"]
#   Out: module args sent = { "siteId": "919ce2a1-...",
#                             "device": [ { "ip": "10.10.255.101" } ] }
- name: Assign access points to their site
  when:
    - _ap_declared | length > 0
    - item.item.key in _ap_pending
  cisco.dnac.assign_device_to_site:
    siteId: "{{ item.dnac_response.response[0].id }}"
    device: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for ip in _ap_pending[item.item.key] -%}
        {%- set ns.result = ns.result + [{'ip': ip}] -%}
      {%- endfor -%}
      {{ ns.result }}
  loop: "{{ _ap_site_info_results.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  register: _ap_assignment_results

- name: --DEBUG-- Access point assignment results
  when:
    - catc_debug | default(false) | bool
    - _ap_declared | length > 0
  ansible.builtin.debug:
    var: _ap_assignment_results

# ── Step F: Hand the access points to their controller ────────────────────
#
# Catalyst Center never provisions an AP directly. The controller takes one
# over when it is re-provisioned and finds a new AP in one of its managed AP
# locations, and that is also when the derived policy and site tags reach the
# device. So a site assignment on its own leaves the AP where it was, on
# default tags.
#
# force_provisioning is required: without it provision_workflow_manager
# short-circuits on "already provisioned" and never looks at what changed
# underneath. That is why _ap_takeover_needed gates this — normally only when
# Step E assigned something, since forcing on every run would reboot the APs
# every run, and additionally whenever force_reprovision is set.
#
# Only controllers whose managed AP locations cover a site one of these APs
# belongs to are re-provisioned. _wlc_provision_config comes from stage 8.1 and
# is absent when wireless_provision_enabled is false, leaving nothing to force.
#
# Example
#   In : _ap_site_map          = { "Global/NORTH CAROLINA/Durham/Site-105/MAIN": [...] }
#        _wlc_provision_config = [ { "management_ip_address": "198.18.5.103",
#                                    "site_name_hierarchy": ".../DC-Site-10/MAIN",
#                                    "managed_ap_locations":
#                                      ["Global/NORTH CAROLINA/Durham/Site-105/MAIN"],
#                                    "force_provisioning": false, ... } ]
#   Out: _ap_wlc_takeover = [ the same entry with force_provisioning: true ]
- name: Build controller takeover config
  when:
    - _ap_declared | length > 0
    - _ap_takeover_needed | bool
  ansible.builtin.set_fact:
    _ap_wlc_takeover: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for wlc in _wlc_provision_config | default([]) -%}
        {%- set covered = wlc.managed_ap_locations | default([])
              | intersect(_ap_site_map.keys() | list) -%}
        {%- if covered | length > 0 -%}
          {%- set ns.result = ns.result
                + [wlc | combine({'force_provisioning': true})] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Controller takeover config
  when:
    - catc_debug | default(false) | bool
    - _ap_declared | length > 0
    - _ap_takeover_needed | bool
  ansible.builtin.debug:
    var: _ap_wlc_takeover

# A newly assigned AP with no controller covering its site would stay on
# default tags however many times this runs, which is worth failing on rather
# than reporting success.
- name: Assert a controller manages every site an access point joined
  when:
    - _ap_declared | length > 0
    - _ap_takeover_needed | bool
  ansible.builtin.assert:
    that: _ap_wlc_takeover | length > 0
    fail_msg: >-
      Access points belong to {{ _ap_site_map.keys() | list | join(', ') }},
      but no controller lists any of those paths in managed_ap_locations, so
      nothing will take the APs over. Add the path to wireless_controller in
      settings.json, and check wireless_provision_enabled is true.
    success_msg: >-
      {{ _ap_wlc_takeover | length }} controller(s) to re-provision.

- name: Re-provision controllers to take over the new access points
  when:
    - _ap_declared | length > 0
    - _ap_takeover_needed | bool
  cisco.dnac.provision_workflow_manager:
    state: merged
    config: "{{ _ap_wlc_takeover }}"
  register: _ap_takeover_result

- name: --DEBUG-- Controller takeover result
  when:
    - catc_debug | default(false) | bool
    - _ap_declared | length > 0
    - _ap_takeover_needed | bool
  ansible.builtin.debug:
    var: _ap_takeover_result

# ── Step G: Summary ───────────────────────────────────────────────────────
- name: Access point provisioning summary
  when: _ap_declared | length > 0
  ansible.builtin.debug:
    msg: >-
      {{ ['┌─────────────────────────────────────────────────────────────────┐']
         + ['│ Access points : ' + (_ap_name_config | length) | string]
         + (_ap_name_config | map(attribute='ap_name')
            | zip(_ap_name_config | map(attribute='mac_address'))
            | map('join', ' → ') | map('regex_replace', '^', '│   ') | list)
         + ['│ Site          : ' + (_ap_site_map.keys() | list | join(', '))]
         + ['│ Skipped       : ' + (_ap_unresolved | join(', ') | default('none', true))]
         + ['│ Named changed : ' + (_ap_name_result.changed | default(false)) | string]
         + ['│ Newly joined  : ' + (_ap_pending.values() | flatten | join(', ')
                                    | default('none — already members', true))]
         + ['│ WLC takeover  : ' + (_ap_takeover_result.msg
                                    | default('not needed') | string)]
         + ['└─────────────────────────────────────────────────────────────────┘'] }}
