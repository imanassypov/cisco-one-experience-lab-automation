# ============================================================================
# tasks/provision_accesspoints.yml  —  Pipeline stage 8.2
# ============================================================================
# Names each access point, assigns it to its floor, and provisions it.
#
# Provisioning the AP is what puts the tags on. Provisioning the controller
# creates the WLAN and policy profiles; the policy and site tags that bind an
# AP to those profiles are written only when the AP itself is provisioned —
# Step 34 "Provision the AP" of "Provision a Cisco Catalyst 9800 Series
# Wireless Controller" in the Catalyst Center User Guide 3.1.x. An AP that is
# merely a site member sits on default-site-tag and default-policy-tag, which
# map no WLAN, so it broadcasts nothing however often the controller is
# re-pushed. Re-provisioning the controller is therefore not a substitute, and
# this file no longer does it — that only reboots every AP the controller owns,
# and 198.18.5.103 is shared across pods.
#
# Flow: resolve → name → assign to floor → provision → poll.
#
# Why each step uses what it uses:
#
#   accesspoint_workflow_manager  names the AP and sets its location. Its
#     config must carry NO site key. Given a site it calls verify_wlc_provision
#     on the AP's controller, which asks GET sda/get_device_info whether that
#     controller is provisioned; this lab is BGP EVPN with non-fabric wireless,
#     so the WLC holds no fabric role and that endpoint 400s, which the module
#     turns into check_return_status() and aborts the play.
#     Verified live 2026-09-15 against WLC 198.18.5.103:
#       GET /dna/intent/api/v1/business/sda/device?deviceManagementIpAddress=198.18.5.103
#       → HTTP 400, status=failed, "This device does not have any fabric role
#         assigned to it for deviceManagementIpAddress = 198.18.5.103"
#     That is also why it cannot do the provisioning in Step F, even though its
#     access_point_provision_new() builds the correct call — that helper is
#     only reachable through the site key that arms the gate.
#     Raised upstream 2026-09-15:
#     https://github.com/cisco-en-programmability/catalystcenter-ansible/issues/71
#     If that is fixed, Steps D-F can collapse into the one module.
#
#   assign_device_to_site  does the site assignment — the same module stage 05
#     uses for the switches, and it does not care about fabric roles.
#
#   a raw POST /dna/intent/api/v1/wirelessAccessPoints/provision  provisions
#     the AP, because no module does it correctly. See Step F.
#
# provision_workflow_manager, which stage 8.1 uses for the controller, cannot
# be used anywhere here: get_dev_type() maps only "Wireless Controller" and
# "Switches and Hubs"/"Routers", everything else falls to device_type = None,
# and the module contains no reference to ap_provision or wirelessAccessPoints
# at all. Its skip_ap_provision option is a flag on the CONTROLLER's payload
# (skipApProvision), not an AP action.
#
# Provisioning an AP can reboot it, with a 1-3 minute rejoin, so the whole pass
# is gated by ap_provision_enabled. There is no per-AP force flag: the API is
# documented as "Access Point Provision and ReProvision" and re-asserting is
# the only way to repair an AP that drifted back onto default tags.
#
# Variables read from inventory / parent play scope:
#   settings_data   — settings.json (catc_common.load_settings), already token
#                     substituted, so access_points[].mac_address is a real MAC
#   _catc_token     — short-lived JWT for the REST calls
#   dnac_host / dnac_port / dnac_verify
#   task_poll_retries / task_poll_delay
# ============================================================================
---

# ── Step A: Collect the declared access points ────────────────────────────
#
# Every access_points entry across all project rows, flattened.
#
# An entry whose mac_address still holds a literal {APn_MAC} is dropped here.
# settings.json carries an entry per AP the site could have, while lab.yml
# lists only the MACs of the pod actually in front of the student, so the
# loader deliberately leaves the surplus tokens unresolved for this filter.
#
# Example - a two-AP site in a pod that has one AP
#   In : settings_data.project[2].access_points = [
#          { "mac_address": "08:4f:a9:50:f0:28", "ap_name": "SITE-105-AP-1",
#            "location": "Leaf1", "ap_mode": "Local",
#            "is_assigned_site_as_location": "Disabled",
#            "site": { "floor": { "name": "MAIN",
#                                 "parent_name": "Global/NORTH CAROLINA/Durham/Site-105" } } },
#          { "mac_address": "{AP2_MAC}", "ap_name": "SITE-105-AP-2", ... }
#        ]
#   Out: _ap_declared   = [ the SITE-105-AP-1 entry ]
#        _ap_unresolved = ["SITE-105-AP-2"]
- name: Build declared access point list
  ansible.builtin.set_fact:
    _ap_declared: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for entry in settings_data.project -%}
        {%- for ap in entry.access_points | default([]) -%}
          {%- if '{' not in (ap.mac_address | default('')) -%}
            {%- set ns.result = ns.result + [ap] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.result }}
    _ap_unresolved: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for entry in settings_data.project -%}
        {%- for ap in entry.access_points | default([]) -%}
          {%- if '{' in (ap.mac_address | default('')) -%}
            {%- set ns.result = ns.result + [ap.ap_name | default(ap.mac_address)] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Declared access point list
  when: catc_debug | default(false) | bool
  ansible.builtin.debug:
    var: _ap_declared

- name: Report access points this pod does not have
  when: _ap_unresolved | length > 0
  ansible.builtin.debug:
    msg: >-
      Skipping {{ _ap_unresolved | join(', ') }} — no matching entry in
      lab_ap_macs, so the {APn_MAC} token was never filled. Add the MAC to
      inventory/group_vars/all/lab.yml if this pod does have the AP.

- name: Report that no site declares an access point
  when: _ap_declared | length == 0
  ansible.builtin.debug:
    msg: >-
      No resolvable access_points entry in settings.json — nothing to do.
      Controllers were handled by the wireless pass above.

# ── Step B: Look up what Catalyst Center knows about those APs ────────────
#
# lab.yml holds the Ethernet MAC, because that is what is printed on the AP
# and shown in the WLC's Ethernet MAC column, so it is the number a student
# can actually find. Catalyst Center indexes an AP by its radio base MAC
# instead: GET network-device?macAddress=<Ethernet MAC> returns zero devices.
#
# Listing the Unified AP family once gives every translation this file needs —
# radio MAC to name the AP, management IP to assign it, device UUID to
# provision it — and doubles as the presence check: an AP that has not joined
# the controller is simply absent from the response.
- name: List access points known to Catalyst Center
  when: _ap_declared | length > 0
  ansible.builtin.uri:
    url: "https://{{ dnac_host }}:{{ dnac_port }}/dna/intent/api/v1/network-device?family=Unified%20AP"
    method: GET
    headers:
      X-Auth-Token: "{{ _catc_token }}"
    validate_certs: "{{ dnac_verify }}"
    status_code: 200
  register: _ap_inventory_result

# Example
#   In : _ap_inventory_result.json.response = [
#          { "id": "c2627337-c197-4714-89f2-6fcaeac0f772",
#            "hostname": "SITE-105-AP-1",
#            "macAddress": "10:b3:d6:6c:c8:60",
#            "apEthernetMacAddress": "08:4f:a9:50:f0:28",
#            "managementIpAddress": "10.10.255.101" } ]
#   Out: _ap_inventory_map = {
#          "08:4f:a9:50:f0:28": { "id":        "c2627337-c197-4714-89f2-6fcaeac0f772",
#                                 "radio_mac": "10:b3:d6:6c:c8:60",
#                                 "mgmt_ip":   "10.10.255.101" } }
# Keys are lowercased on both sides so the comparison survives an inventory
# that answers in upper case.
- name: Build Ethernet MAC → inventory map
  when: _ap_declared | length > 0
  ansible.builtin.set_fact:
    _ap_inventory_map: >-
      {%- set ns = namespace(result={}) -%}
      {%- for d in (_ap_inventory_result.json.response | default([])) -%}
        {%- if d.apEthernetMacAddress is defined and d.apEthernetMacAddress -%}
          {%- set ns.result = ns.result | combine({
              d.apEthernetMacAddress | lower: {
                'id':        d.id                   | default(''),
                'radio_mac': d.macAddress           | default(''),
                'mgmt_ip':   d.managementIpAddress  | default('')
              }
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Ethernet MAC → inventory map
  when:
    - catc_debug | default(false) | bool
    - _ap_declared | length > 0
  ansible.builtin.debug:
    var: _ap_inventory_map

# ── Step C: Turn the declared intent into what each step needs ────────────
#
# _ap_name_config carries everything accesspoint_workflow_manager accepts, with
# mac_address swapped for the radio MAC and the site key removed — see the
# header for why a site there aborts the run.
#
# _ap_site_map is the site assignment, grouped the way assign_device_to_site
# wants it: one entry per floor path, holding the management IPs to assign.
#
# A declared AP missing from the inventory map has not joined the controller
# and is collected separately rather than sent, because the module fails the
# whole run on an unresolvable identifier.
#
# Example
#   Out: _ap_name_config = [ { "mac_address": "10:b3:d6:6c:c8:60",
#                              "ap_name": "SITE-105-AP-1", "location": "Leaf1",
#                              "ap_mode": "Local",
#                              "is_assigned_site_as_location": "Disabled" } ]
#        _ap_site_map    = { "Global/NORTH CAROLINA/Durham/Site-105/MAIN":
#                              ["10.10.255.101"] }
#        _ap_absent      = []
- name: Build access point name and site configs
  when: _ap_declared | length > 0
  ansible.builtin.set_fact:
    _ap_name_config: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for ap in _ap_declared -%}
        {%- set eth = ap.mac_address | lower -%}
        {%- if eth in _ap_inventory_map -%}
          {%- set ns.result = ns.result
                + [ap | combine({'mac_address': _ap_inventory_map[eth].radio_mac})
                      | dict2items | rejectattr('key', 'equalto', 'site')
                      | list | items2dict] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}
    _ap_site_map: >-
      {%- set ns = namespace(result={}) -%}
      {%- for ap in _ap_declared -%}
        {%- set eth = ap.mac_address | lower -%}
        {%- if eth in _ap_inventory_map and ap.site is defined and ap.site.floor is defined -%}
          {%- set path = ap.site.floor.parent_name ~ '/' ~ ap.site.floor.name -%}
          {%- set ip = _ap_inventory_map[eth].mgmt_ip -%}
          {%- if path in ns.result -%}
            {%- set ns.result = ns.result | combine({path: ns.result[path] + [ip]}) -%}
          {%- else -%}
            {%- set ns.result = ns.result | combine({path: [ip]}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}
    _ap_absent: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for ap in _ap_declared -%}
        {%- if (ap.mac_address | lower) not in _ap_inventory_map -%}
          {%- set ns.result = ns.result
                + [(ap.ap_name | default('unnamed')) ~ ' (' ~ ap.mac_address ~ ')'] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Access point name and site configs
  when:
    - catc_debug | default(false) | bool
    - _ap_declared | length > 0
  ansible.builtin.debug:
    msg:
      name_config: "{{ _ap_name_config }}"
      site_map: "{{ _ap_site_map }}"

# A MAC in lab.yml that inventory has never seen is a typo or an AP that never
# joined. Failing here beats letting the module report an opaque "invalid or
# not present" for the whole batch.
- name: Assert every declared access point has joined the controller
  when: _ap_declared | length > 0
  ansible.builtin.assert:
    that: _ap_absent | length == 0
    fail_msg: >-
      Not found among the Unified AP devices in Catalyst Center:
      {{ _ap_absent | join(', ') }}.
      Check the Ethernet MAC in inventory/group_vars/all/lab.yml, and confirm
      the AP has joined the controller — 'show ap summary' on the WLC.
    success_msg: >-
      {{ _ap_name_config | length }} access point(s) to configure.

# A floor is mandatory: the provision call takes a siteId, and the policy and
# site tags are derived from the wireless profile bound to that floor.
- name: Assert every access point resolved to a floor
  when: _ap_declared | length > 0
  ansible.builtin.assert:
    that: _ap_site_map | length > 0
    fail_msg: >-
      No access point carries a site.floor block in settings.json. Without one
      there is no siteId to provision against and no profile to derive tags
      from, so the AP would stay on default-policy-tag.

# ── Step D: Name the access points ────────────────────────────────────────
#
# Idempotent on name, location and mode. No site key here — see the header.
- name: Name and locate access points
  when: _ap_declared | length > 0
  cisco.dnac.accesspoint_workflow_manager:
    state: merged
    config: "{{ _ap_name_config }}"
  register: _ap_name_result

- name: --DEBUG-- Access point naming result
  when:
    - catc_debug | default(false) | bool
    - _ap_declared | length > 0
  ansible.builtin.debug:
    var: _ap_name_result

# ── Step E: Assign them to their floor ────────────────────────────────────
#
# Same two-step the switches take in stage 05: resolve the floor path to a
# siteId, then post the assignment against it.
- name: Resolve access point site IDs
  when: _ap_declared | length > 0
  cisco.dnac.site_info:
    name: "{{ item.key }}"
  loop: "{{ _ap_site_map | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: _ap_site_info_results

# Membership is read first only so an AP already in its floor is not
# re-assigned — moving an AP between sites reboots it. The AP's own
# network-device record is no help: siteHierarchy stays null for a Unified AP
# even once it is a member, so membership has to be read from the site side.
- name: Read current site membership
  when: _ap_declared | length > 0
  ansible.builtin.uri:
    url: "https://{{ dnac_host }}:{{ dnac_port }}/dna/intent/api/v1/site-member/{{ item.dnac_response.response[0].id }}/member?memberType=networkdevice"
    method: GET
    headers:
      X-Auth-Token: "{{ _catc_token }}"
    validate_certs: "{{ dnac_verify }}"
    status_code: 200
  loop: "{{ _ap_site_info_results.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  register: _ap_member_results

# Example - the AP is not yet a member, the three switches are
#   Out: _ap_pending = { "Global/NORTH CAROLINA/Durham/Site-105/MAIN":
#                          ["10.10.255.101"] }
# Example - a re-run, with the AP already a member
#   Out: _ap_pending = {}   → nothing is assigned and nothing is rebooted
- name: Determine which assignments are still pending
  when: _ap_declared | length > 0
  ansible.builtin.set_fact:
    _ap_pending: >-
      {%- set ns = namespace(result={}) -%}
      {%- for r in (_ap_member_results.results | default([])) -%}
        {%- set path = r.item.item.key -%}
        {%- set members = r.json.response | default([])
              | map(attribute='managementIpAddress') | list -%}
        {%- set missing = _ap_site_map[path] | difference(members) -%}
        {%- if missing | length > 0 -%}
          {%- set ns.result = ns.result | combine({path: missing}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Pending site assignments
  when:
    - catc_debug | default(false) | bool
    - _ap_declared | length > 0
  ansible.builtin.debug:
    var: _ap_pending

- name: Assign access points to their floor
  when:
    - _ap_declared | length > 0
    - item.item.key in _ap_pending
  cisco.dnac.assign_device_to_site:
    siteId: "{{ item.dnac_response.response[0].id }}"
    device: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for ip in _ap_pending[item.item.key] -%}
        {%- set ns.result = ns.result + [{'ip': ip}] -%}
      {%- endfor -%}
      {{ ns.result }}
  loop: "{{ _ap_site_info_results.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  register: _ap_assignment_results

# assign_device_to_site returns as soon as Catalyst Center accepts the request,
# but the AP-to-floor association is applied asynchronously. Provisioning
# straight after it fails the payload validation with
#   NCWS14015 "Site <id> is not associated with APs : [<id>].
#              Associate all APs to the same floor before provisioning."
# even though the assignment itself succeeded. Poll the same membership API the
# pending check used, so Step F only runs once the association is really there.
- name: Wait for the site assignment to take effect
  when:
    - _ap_declared | length > 0
    - item.item.key in _ap_pending
  ansible.builtin.uri:
    url: "https://{{ dnac_host }}:{{ dnac_port }}/dna/intent/api/v1/site-member/{{ item.dnac_response.response[0].id }}/member?memberType=networkdevice"
    method: GET
    headers:
      X-Auth-Token: "{{ _catc_token }}"
    validate_certs: "{{ dnac_verify }}"
    status_code: 200
  register: _ap_member_confirm
  until: >-
    (_ap_pending[item.item.key] | difference(
       _ap_member_confirm.json.response | default([])
       | map(attribute='managementIpAddress') | list
     )) | length == 0
  retries: "{{ ap_assign_confirm_retries }}"
  delay: "{{ ap_assign_confirm_delay }}"
  loop: "{{ _ap_site_info_results.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: --DEBUG-- Site membership after assignment
  when:
    - catc_debug | default(false) | bool
    - _ap_declared | length > 0
  ansible.builtin.debug:
    var: _ap_member_confirm

# ── Step F: Provision the access points ───────────────────────────────────
#
# This is the step that creates the AP's tags, and it runs every time: the API
# is documented as "Access Point Provision and ReProvision", and re-asserting
# is the only way to repair an AP that has drifted back onto default tags.
#
# The call is made with ansible.builtin.uri rather than a collection module,
# because no module does it correctly:
#   - accesspoint_workflow_manager is unreachable behind the SDA fabric gate
#     described in the header.
#   - provision_workflow_manager has no Unified AP branch at all.
#   - wireless_access_points_provision, in cisco.dnac through 6.51.0 and in
#     cisco.catalystcenter through at least 2.10.2, documents siteId and
#     networkDevices but its action plugin calls the SDK's
#     ap_provision_connectivity, whose signature is
#     (headers, payload, active_validation, **request_parameters). siteId,
#     rfProfileName and networkDevices therefore land in **request_parameters
#     and go out as URL query string, while the body is `payload or []` — an
#     empty JSON array. The request that reaches CatC is
#     POST /dna/intent/api/v1/wireless/ap-provision with a body of [], which
#     provisions nothing, and the module still reports ok / changed=false.
#     Kali was verified on 2026-09-15 to be running exactly that build, so
#     every AP provision this stage ever submitted was a silent no-op — the
#     reason stage 08 looked successful while the 9800 kept default tags, and
#     why provisioning the same AP from the CatC UI did write them.
# Posting the URL directly removes the collection-version dependency entirely.
# Do not swap a module back in.
#
# rfProfileName is not optional. Leaving it out returns NCWS14003 "RF Profile
# is required for default/empty AP Zone" — the wizard just hides that by
# preselecting the profile marked default under Design > Network Settings >
# Wireless > RF Profiles. See ap_default_rf_profile in defaults/main.yml.

# CatC ships LOW, TYPICAL and HIGH and flags none of them as the default, so
# this normally falls through to ap_default_rf_profile. The lookup is still
# worth doing: it picks up a custom profile marked default later without anyone
# having to edit the role.
- name: List RF profiles
  when: _ap_declared | length > 0
  ansible.builtin.uri:
    url: "https://{{ dnac_host }}:{{ dnac_port }}/dna/intent/api/v1/wireless/rf-profile"
    method: GET
    headers:
      X-Auth-Token: "{{ _catc_token }}"
    validate_certs: "{{ dnac_verify }}"
    status_code: 200
  register: _ap_rf_result

- name: Resolve the fallback RF profile
  when: _ap_declared | length > 0
  ansible.builtin.set_fact:
    _ap_rf_fallback: >-
      {{ (_ap_rf_result.json.response | default([]))
         | selectattr('defaultRfProfile', 'defined')
         | selectattr('defaultRfProfile')
         | map(attribute='name') | first
         | default(ap_default_rf_profile, true) }}

# Groups the work the way the API wants it: one call per floor and RF profile,
# carrying that floor's UUID and the device UUIDs of the APs to provision into
# it. Grouping on the profile as well as the path matters because rfProfileName
# is a property of the call, not of the device, so two APs on one floor with
# different profiles have to go in separate calls. ap_names is only for logging.
#
# Example
#   Out: _ap_provision_config = [
#          { "site_path":  "Global/NORTH CAROLINA/Durham/Site-105/MAIN",
#            "site_id":    "919ce2a1-39b7-4c1f-a7ec-c76e50170ab7",
#            "rf_profile": "TYPICAL",
#            "network_devices": [ { "deviceId": "c2627337-c197-4714-89f2-6fcaeac0f772" } ],
#            "ap_names":   ["SITE-105-AP-1"] } ]
- name: Build access point provisioning config
  when: _ap_declared | length > 0
  ansible.builtin.set_fact:
    _ap_provision_config: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for r in (_ap_site_info_results.results | default([])) -%}
        {%- set path = r.item.key -%}
        {%- set sid = r.dnac_response.response[0].id | default('') -%}
        {%- set groups = namespace(by_rf={}) -%}
        {%- for ap in _ap_declared -%}
          {%- set eth = ap.mac_address | lower -%}
          {%- if eth in _ap_inventory_map
               and ap.site is defined and ap.site.floor is defined
               and (ap.site.floor.parent_name ~ '/' ~ ap.site.floor.name) == path -%}
            {%- set rf = ap.rf_profile | default(_ap_rf_fallback, true) -%}
            {%- set entry = groups.by_rf.get(rf, {'devices': [], 'names': []}) -%}
            {%- set groups.by_rf = groups.by_rf | combine({rf: {
                  'devices': entry.devices + [{'deviceId': _ap_inventory_map[eth].id}],
                  'names':   entry.names   + [ap.ap_name | default(eth)] }}) -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if sid -%}
          {%- for rf, g in groups.by_rf.items() -%}
            {%- set ns.result = ns.result + [{'site_path': path, 'site_id': sid,
                                              'rf_profile': rf,
                                              'network_devices': g.devices,
                                              'ap_names': g.names}] -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Access point provisioning config
  when:
    - catc_debug | default(false) | bool
    - _ap_declared | length > 0
  ansible.builtin.debug:
    var: _ap_provision_config

- name: Provision the access points
  when: _ap_provision_config | default([]) | length > 0
  ansible.builtin.uri:
    url: "https://{{ dnac_host }}:{{ dnac_port }}/dna/intent/api/v1/wirelessAccessPoints/provision"
    method: POST
    headers:
      X-Auth-Token: "{{ _catc_token }}"
      Content-Type: application/json
    body_format: json
    body:
      siteId: "{{ item.site_id }}"
      rfProfileName: "{{ item.rf_profile }}"
      networkDevices: "{{ item.network_devices }}"
    validate_certs: "{{ dnac_verify }}"
    status_code: [200, 202]
  loop: "{{ _ap_provision_config }}"
  loop_control:
    label: "{{ item.ap_names | join(', ') }} → {{ item.site_path }} ({{ item.rf_profile }})"
  register: _ap_provision_result

- name: --DEBUG-- Access point provisioning result
  when:
    - catc_debug | default(false) | bool
    - _ap_provision_config | default([]) | length > 0
  ansible.builtin.debug:
    var: _ap_provision_result

# The POST only queues the work. Without polling, a rejected payload — a bad RF
# profile, an AP that is not a site member, an AP zone conflict — is reported
# only inside the task, and the stage would exit green with the AP still on
# default tags. That is exactly how the empty-body module call hid itself.
- name: Collect access point provisioning task IDs
  when: _ap_provision_config | default([]) | length > 0
  ansible.builtin.set_fact:
    _ap_provision_tasks: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for r in (_ap_provision_result.results | default([])) -%}
        {%- set tid = (r.json.response | default({})).taskId | default('') -%}
        {%- if tid -%}
          {%- set ns.result = ns.result
                + [{'id': tid, 'label': r.item.ap_names | join(', ')}] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: Assert every access point provisioning call returned a task ID
  when: _ap_provision_config | default([]) | length > 0
  ansible.builtin.assert:
    that: _ap_provision_tasks | length == _ap_provision_config | length
    fail_msg: >-
      POST /wirelessAccessPoints/provision returned no taskId for at least one
      call, so nothing was queued.
      Responses: {{ _ap_provision_result.results | default([])
                    | map(attribute='json') | list | to_json }}

- name: Poll access point provisioning tasks
  when: _ap_provision_config | default([]) | length > 0
  ansible.builtin.uri:
    url: "https://{{ dnac_host }}:{{ dnac_port }}/dna/intent/api/v1/task/{{ item.id }}"
    method: GET
    headers:
      X-Auth-Token: "{{ _catc_token }}"
    validate_certs: "{{ dnac_verify }}"
    status_code: 200
  loop: "{{ _ap_provision_tasks }}"
  loop_control:
    label: "{{ item.label }}"
  register: _ap_provision_task_results
  until: >-
    (_ap_provision_task_results.json.response | default({})).endTime is defined
    or (_ap_provision_task_results.json.response | default({})).isError | default(false) | bool
  retries: "{{ task_poll_retries | int }}"
  delay: "{{ task_poll_delay | int }}"
  ignore_errors: true

- name: Collect access point provisioning failures
  when: _ap_provision_config | default([]) | length > 0
  ansible.builtin.set_fact:
    _ap_provision_failures: >-
      {%- set ns = namespace(result=[]) -%}
      {%- for r in (_ap_provision_task_results.results | default([])) -%}
        {%- set resp = r.json.response | default({}) -%}
        {%- if resp.isError | default(false) | bool or resp.endTime is not defined -%}
          {%- set ns.result = ns.result + [r.item.label ~ ': '
                ~ (resp.failureReason | default(resp.progress | default('timed out'), true))] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: Assert every access point provisioned successfully
  when: _ap_provision_config | default([]) | length > 0
  ansible.builtin.assert:
    that: _ap_provision_failures | length == 0
    fail_msg: >-
      Access point provisioning failed: {{ _ap_provision_failures | join(' | ') }}.
      The AP keeps default-policy-tag / default-site-tag until this succeeds.
      Confirm the AP is a member of {{ _ap_site_map.keys() | list | join(', ') }}
      and that RF profile
      {{ _ap_provision_config | map(attribute='rf_profile') | unique | join(', ') }}
      exists under Design > Network Settings > Wireless > RF Profiles.
    success_msg: >-
      {{ _ap_provision_tasks | length }} access point provisioning task(s)
      completed. Confirm with 'show ap tag summary' on the controller —
      Tag Source should read Static, not Default.

# ── Step G: Summary ───────────────────────────────────────────────────────
- name: Access point provisioning summary
  when: _ap_declared | length > 0
  ansible.builtin.debug:
    msg: >-
      {{ ['┌─────────────────────────────────────────────────────────────────┐']
         + ['│ Access points : ' + (_ap_name_config | length) | string]
         + (_ap_name_config | map(attribute='ap_name')
            | zip(_ap_name_config | map(attribute='mac_address'))
            | map('join', ' → ') | map('regex_replace', '^', '│   ') | list)
         + ['│ Floor         : ' + (_ap_site_map.keys() | list | join(', '))]
         + ['│ Skipped       : ' + (_ap_unresolved | join(', ') | default('none', true))]
         + ['│ Named changed : ' + (_ap_name_result.changed | default(false)) | string]
         + ['│ Newly joined  : ' + (_ap_pending.values() | flatten | join(', ')
                                    | default('none — already members', true))]
         + ['│ Provisioned   : ' + ((_ap_provision_config | default([])
                                     | map(attribute='ap_names') | flatten | join(', '))
                                    | default('none', true))]
         + ['└─────────────────────────────────────────────────────────────────┘'] }}
