[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[defaults]
inventory = inventory/static_inventory.yml
roles_path = roles
host_key_checking = False
deprecation_warnings = False
vault_password_file = ../../../../.vault
vars_plugins = ../../../plugins/vars
interpreter_python = auto_silent
# The roles carry ~107 debug tasks gated behind catc_debug. They print nothing
# on a normal run but still emit a "skipping:" line each, which buried the real
# output. Hiding them keeps -e catc_debug=true fully working.
display_skipped_hosts = False

[privilege_escalation]
become = False
