[inventory]
# CML dynamic inventory is unused in this PseudoCo lab. Keep cml.yml in-tree
# but do not enable cisco.cml.cml_inventory here.
enable_plugins = host_list, script, auto, yaml, ini, toml

[defaults]
inventory = inventory/static_inventory.yml
roles_path = roles
host_key_checking = False
deprecation_warnings = False
vault_password_file = ../../../../.vault
vars_plugins = ../../../plugins/vars
interpreter_python = auto_silent
# CML tags become group names verbatim ("Campus Fabric", "dhcp-server"). Keep them
# as-is: playbooks and backup_cml_tags reference the literal tag strings.
force_valid_group_names = ignore

[privilege_escalation]
become = False
