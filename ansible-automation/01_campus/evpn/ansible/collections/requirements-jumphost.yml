---
# Collection pins for the dCloud jump host, where `install-ansible.sh` builds a
# Python 3.9 venv and Python 3.9 caps ansible-core at 2.15. Each version below
# is the newest release whose `requires_ansible` still admits 2.15 — installing
# the unpinned `requirements.yml` there pulls 2.16-only releases and each one
# emits "Collection <name> does not support Ansible version 2.15.x".
#
# Use requirements.yml instead on a control node running ansible-core 2.17.
#
#   ansible-galaxy collection install -r collections/requirements-jumphost.yml
collections:
  # EXCEPTION — every cisco.catalystcenter release back to 2.7.0 declares
  # requires_ansible >=2.16, so this is an exception to the 2.15 rule above
  # whatever version is chosen. Below 2.4.0 breaks roles that read
  # catalystcenter_response. AP provisioning does not depend on this pin — see
  # requirements.yml. Must match 00_scriptserver_bootstrap.
  # API profile for CatC 3.1.5 is 3.1.3.0 (see connection.yml).
  - name: cisco.catalystcenter
    version: "2.10.2"
  - name: cisco.dnac
    version: "6.46.0"
  # ansible.utils is NOT optional: cisco.catalystcenter action plugins import
  # AnsibleArgSpecValidator from it and fail with "ansible.utils is not
  # installed" without it. cisco.ios and ansible.netcommon were dropped when
  # stage 10 moved from SSH to Catalyst Center Command Runner — no playbook in
  # this folder opens a network_cli connection any more.
  - name: ansible.utils
    version: "5.1.2"
  - name: ansible.posix
    version: "2.1.0"
  - name: community.general
    version: "10.7.9"
