[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
deprecation_warnings = False
vault_password_file = ../../../../.vault
vars_plugins = ../../../plugins/vars
interpreter_python = auto_silent
# Matches the campus collection so output reads the same everywhere. The debug
# tasks behind assurance_debug print nothing on a normal run but still emit a
# "skipping:" line each; hiding them keeps -e assurance_debug=true working.
display_skipped_hosts = False

[privilege_escalation]
become = False
