---
# SSH + sudo to the Splunk host. Credentials come from the vault via the
# lab_access vars plugin, keyed on the inventory hostname, exactly like
# collection 00 does for the script server.
#
# This is a different account from lab_access['Splunk Enterprise'], which is the
# Splunk web/REST admin. Defaulted to an empty dict so a missing vault entry
# surfaces as the preflight assertion rather than an undefined-variable error
# during inventory parsing.
splunk_ssh_credentials: "{{ lab_access[inventory_hostname] | default({}, true) }}"

# paramiko, not the default ssh transport. The OpenSSH transport shells out and
# needs sshpass to feed it a password, and sshpass cannot be installed on the
# Kali image - it pulls libc6 forward and apt refuses against the pinned
# libc6-dev. paramiko does password auth in-process and is already a pinned
# dependency in ansible-automation/requirements.txt, so nothing extra is needed.
ansible_connection: ansible.builtin.paramiko_ssh
ansible_user: "{{ splunk_ssh_credentials.username | default('') }}"
ansible_password: "{{ splunk_ssh_credentials.password | default('') }}"
ansible_become_password: "{{ splunk_ssh_credentials.password | default('') }}"
# The lab host's key is not in known_hosts and ansible.cfg already disables host
# key checking; this is the paramiko-side equivalent.
ansible_paramiko_host_key_auto_add: true
# Password auth only - without this paramiko offers every key in ~/.ssh first and
# a host with MaxAuthTries 3 disconnects before it reaches the password.
ansible_paramiko_look_for_keys: false
# System python: the package and service modules need the distro interpreter,
# not whatever venv happens to be active on the control node.
ansible_python_interpreter: /usr/bin/python3
