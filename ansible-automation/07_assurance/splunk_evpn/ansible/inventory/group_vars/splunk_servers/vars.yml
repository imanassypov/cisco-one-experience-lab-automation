---
# SSH + sudo to the Splunk host. Credentials come from the vault via the
# lab_access vars plugin, keyed on the inventory hostname, exactly like
# collection 00 does for the script server.
ansible_connection: ssh
ansible_user: "{{ lab_access[inventory_hostname].username }}"
ansible_password: "{{ lab_access[inventory_hostname].password }}"
ansible_become_password: "{{ lab_access[inventory_hostname].password }}"
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
# System python: the package and service modules need the distro interpreter,
# not whatever venv happens to be active on the control node.
ansible_python_interpreter: /usr/bin/python3
