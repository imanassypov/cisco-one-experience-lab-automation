# ============================================================================
# otel_collector_deploy / tasks/main.yml  —  Assurance stage 04
# ============================================================================
# Renders the collector config over the one the package ships and restarts the
# service.
#
# The package owns the unit, the binary, the service account and the
# EnvironmentFile, so there is nothing to override here - only the config to
# replace. That is the whole benefit of the package-based install.
#
# Two things are load-bearing and easy to get wrong:
#
#   * The HEC endpoint is loopback. Splunk and the collector share this host and
#     the exporter must not go out and back through the lab network.
#   * The fabric holds long-lived gRPC streams that do not drain on SIGTERM, so
#     a restart waits out TimeoutStopSec before systemd kills the process.
#     Expect a telemetry gap; that is not a failure.
# ============================================================================
---

- name: Require an HEC token
  ansible.builtin.assert:
    that: splunk_hec_token | default('') | length > 0
    fail_msg: >-
      splunk_hec_token is not set. Run stage 02 (02_splunk_index_hec.yml) first,
      or pass -e splunk_hec_token=<token>.

- name: Confirm the collector package is installed
  ansible.builtin.stat:
    path: "{{ otel_binary }}"
  register: _binary

- name: Fail when the collector is missing
  ansible.builtin.assert:
    that: _binary.stat.exists
    fail_msg: >-
      {{ otel_binary }} does not exist. Run stage 03
      (03_install_collector.yml) first.

- name: Read the packaged unit's service account
  become: true
  ansible.builtin.command: "systemctl show -p User --value {{ otel_service_name }}.service"
  changed_when: false
  register: _unit_user

- name: Resolve the account the collector runs as
  ansible.builtin.set_fact:
    _otel_run_as: "{{ _unit_user.stdout | trim | default(otel_package_name, true) or otel_package_name }}"

# 0640 root:<service group> - the file carries the HEC token, and the collector
# reads it as its own unprivileged user.
- name: Render the collector config
  become: true
  no_log: true
  ansible.builtin.template:
    src: "{{ otel_src_dir }}/agent_config.yaml.j2"
    dest: "{{ otel_config_path }}"
    owner: root
    group: "{{ _otel_run_as }}"
    mode: "0640"
  register: _config

# The packaged unit already points at this path through its EnvironmentFile, so
# a reload is only needed if something else edited the unit.
- name: Restart the collector
  become: true
  ansible.builtin.systemd:
    name: "{{ otel_service_name }}"
    state: restarted
    enabled: true
    daemon_reload: true

- name: Wait for the MDT receiver port to open
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ otel_receiver_port }}"
    timeout: 180

- name: Confirm the service is active
  become: true
  ansible.builtin.command: "systemctl is-active {{ otel_service_name }}"
  changed_when: false
  register: _active
  failed_when: _active.stdout | trim != 'active'

- name: Collector deployment summary
  ansible.builtin.debug:
    msg:
      - "unit      : {{ otel_service_name }}.service (running as {{ _otel_run_as }})"
      - "config    : {{ otel_config_path }}"
      - "binary    : {{ otel_binary }}"
      - "listening : {{ ansible_host }}:{{ otel_receiver_port }}"
      - "exporting : {{ splunk_hec_url }} -> index={{ splunk_assurance_index }}"
