# ============================================================================
# otel_collector_build / tasks/main.yml  —  Assurance stage 03
# ============================================================================
# Puts otelcol-yangfix on the Splunk host.
#
# The stock opentelemetry-collector rpm ships a yanggrpcreceiver that silently
# drops numeric YANG list keys (vni, evni, vlan-id), so every per-VNI panel in
# the dashboards comes back empty. The fix is a patched receiver compiled into a
# custom binary — see otel-collector/yanggrpcreceiver-numeric-key-issue.md.
#
# Two modes, because a dCloud Splunk appliance normally has neither a Go
# toolchain nor internet egress:
#
#   otel_build_mode: local   — extract the bundled receiver source and run ocb
#                              on the Splunk host. Needs Go 1.25+ and ocb.
#   otel_build_mode: staged  — copy a binary built elsewhere (for example on the
#                              Kali script server) from otel_staged_binary.
#
# Either way the stage is a no-op when otel_custom_binary already exists, so it
# is safe to re-run.
# ============================================================================
---

- name: Skip the build when the stock collector was requested
  ansible.builtin.meta: end_play
  when: not (otel_use_custom_binary | bool)

- name: Check for an existing custom binary
  ansible.builtin.stat:
    path: "{{ otel_custom_binary }}"
  register: _existing_binary

- name: Report that the binary is already in place
  ansible.builtin.debug:
    msg: "{{ otel_custom_binary }} already present - nothing to build."
  when: _existing_binary.stat.exists

- name: Build or stage the collector
  when: not _existing_binary.stat.exists
  block:
    - name: Stage a prebuilt binary
      when: otel_build_mode == 'staged'
      block:
        - name: Require a staged binary path
          ansible.builtin.assert:
            that: otel_staged_binary | length > 0
            fail_msg: >-
              otel_build_mode is 'staged' but otel_staged_binary is empty.
              Build otelcol-yangfix on a host that has Go 1.25+ and ocb using
              otel-collector/builder.yaml, then re-run with
              -e otel_staged_binary=/path/to/otelcol-yangfix.

        - name: Copy the prebuilt collector into place
          become: true
          ansible.builtin.copy:
            src: "{{ otel_staged_binary }}"
            dest: "{{ otel_custom_binary }}"
            owner: root
            group: root
            mode: "0755"

    - name: Compile the collector on this host
      when: otel_build_mode == 'local'
      block:
        - name: Require the Go toolchain and the collector builder
          ansible.builtin.assert:
            that:
              - _go_present | default(false) | bool
              - _ocb_present | default(false) | bool
            fail_msg: >-
              otel_build_mode is 'local' but this host has no go and/or ocb.
              Build elsewhere and use otel_build_mode=staged.

        - name: Create the build directory
          become: true
          ansible.builtin.file:
            path: "{{ otel_build_dir }}/src"
            state: directory
            mode: "0755"

        - name: Copy the builder manifest and the patched receiver source
          become: true
          ansible.builtin.copy:
            src: "{{ otel_src_dir }}/{{ item }}"
            dest: "{{ otel_build_dir }}/{{ item }}"
            mode: "0644"
          loop:
            - builder.yaml
            - "{{ otel_receiver_bundle }}"

        # builder.yaml replaces the upstream receiver module with ./src/receiver/
        # yanggrpcreceiver, so the tarball must land under src/.
        - name: Unpack the patched receiver source
          become: true
          ansible.builtin.unarchive:
            src: "{{ otel_build_dir }}/{{ otel_receiver_bundle }}"
            dest: "{{ otel_build_dir }}/src"
            remote_src: true
            creates: "{{ otel_build_dir }}/src/receiver/yanggrpcreceiver"

        - name: Run the OpenTelemetry Collector Builder
          become: true
          ansible.builtin.command:
            cmd: ocb --config builder.yaml
            chdir: "{{ otel_build_dir }}"
            creates: "{{ otel_build_dir }}/_build/otelcol-yangfix"

        - name: Install the built collector
          become: true
          ansible.builtin.copy:
            src: "{{ otel_build_dir }}/_build/otelcol-yangfix"
            dest: "{{ otel_custom_binary }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"

# 'components' rather than '--version': an ocb-built distribution does not
# register a version flag, and listing the compiled-in components proves the
# thing that actually matters - that the patched yang_grpc receiver is in there.
- name: List the components compiled into the collector
  become: true
  ansible.builtin.command: "{{ otel_custom_binary }} components"
  changed_when: false
  failed_when: false
  register: _otel_components

- name: Fall back to --help when the build has no components subcommand
  become: true
  when: _otel_components.rc != 0
  ansible.builtin.command: "{{ otel_custom_binary }} --help"
  changed_when: false
  failed_when: false
  register: _otel_help

- name: Confirm the collector binary runs
  ansible.builtin.assert:
    that: _otel_components.rc == 0 or (_otel_help.rc | default(1)) == 0
    fail_msg: >-
      {{ otel_custom_binary }} did not execute. Wrong architecture, or a
      truncated copy. stderr: {{ _otel_components.stderr | default('') }}

- name: Confirm the patched yang_grpc receiver is compiled in
  when: _otel_components.rc == 0
  ansible.builtin.assert:
    that: "'yang_grpc' in _otel_components.stdout"
    fail_msg: >-
      {{ otel_custom_binary }} runs but has no yang_grpc receiver, so the fabric
      has nothing to dial out to. The builder.yaml replaces entry probably did
      not point at the extracted receiver source. Rebuild and check that
      src/receiver/yanggrpcreceiver sits beside builder.yaml.

- name: Collector binary summary
  ansible.builtin.debug:
    msg:
      - "binary   : {{ otel_custom_binary }}"
      - "yang_grpc: {{ 'compiled in' if (_otel_components.rc == 0 and 'yang_grpc' in _otel_components.stdout) else 'could not confirm - no components subcommand' }}"
