# ============================================================================
# splunk_index_hec / tasks/main.yml  —  Assurance stage 02
# ============================================================================
# Creates the two Splunk objects the pipeline writes into:
#
#   1. evpn_assurance   — a METRICS index. The OTel splunk_hec exporter emits
#                         metric points; an event index accepts the HTTP POST
#                         and then silently discards them, which looks exactly
#                         like a broken collector.
#   2. an HEC token     — scoped to that index, used by the collector config.
#
# Both are idempotent: an existing index or token is reused, never recreated,
# so re-running the stage does not invalidate a collector that is already
# streaming.
#
# Every task that puts credentials on a command line is no_log, and none of them
# fail on their own. Each is followed by a check that surfaces rc, stdout and
# stderr with the password scrubbed - no_log on a failing task otherwise hides
# the one thing needed to fix it.
#
# Produced: splunk_hec_token — consumed by otel_collector_deploy
# ============================================================================
---

# Existence is checked over REST, not with 'splunk list index'. That CLI command
# does not report metric indexes, so a metric index that already existed looked
# absent and the create below failed with 'An index with name=... already exists'.
- name: Look for the assurance index
  become: true
  no_log: true
  failed_when: false
  ansible.builtin.uri:
    url: "{{ splunk_mgmt_url }}/services/data/indexes/{{ splunk_assurance_index }}?output_mode=json"
    user: "{{ splunk_admin_username }}"
    password: "{{ splunk_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 404]
  register: _index_probe

- name: Report an unusable response from the index API
  when: _index_probe.status | default(0) not in [200, 404]
  ansible.builtin.fail:
    msg: >-
      Unexpected HTTP {{ _index_probe.status | default('?') }} from
      {{ splunk_mgmt_url }}/services/data/indexes. Check that the
      'Splunk Enterprise' vault credentials are an admin account.

- name: Create the metrics index
  become: true
  no_log: true
  when: _index_probe.status == 404
  ansible.builtin.command: >-
    {{ splunk_bin }} add index {{ splunk_assurance_index }}
    -datatype metric
    -auth {{ splunk_admin_username }}:{{ splunk_admin_password }}
  failed_when: false
  register: _index_created

- name: Report a failure creating the index
  when:
    - _index_created is not skipped
    - _index_created.rc | default(0) != 0
  ansible.builtin.fail:
    msg: |
      Could not create the {{ splunk_assurance_index }} index (rc={{ _index_created.rc }}).
      stdout: {{ _index_created.stdout | default('') | replace(splunk_admin_password, '<redacted>') }}
      stderr: {{ _index_created.stderr | default('') | replace(splunk_admin_password, '<redacted>') }}
      A permissions or ownership complaint usually means the CLI is running as
      the wrong user - check who owns {{ splunk_home }}.

- name: Confirm the index is a metrics index
  become: true
  no_log: true
  failed_when: false
  ansible.builtin.uri:
    url: "{{ splunk_mgmt_url }}/services/data/indexes/{{ splunk_assurance_index }}?output_mode=json"
    user: "{{ splunk_admin_username }}"
    password: "{{ splunk_admin_password }}"
    force_basic_auth: true
    validate_certs: false
  register: _index_info

- name: Verify the index exists and holds metrics
  ansible.builtin.assert:
    that:
      - _index_info.status | default(0) == 200
      - (_index_info.json.entry[0].content.datatype | default('')) == 'metric'
    fail_msg: >-
      {{ splunk_assurance_index }} is
      {{ 'missing (HTTP ' ~ (_index_info.status | default('?')) ~ ')'
         if (_index_info.status | default(0)) != 200
         else 'datatype ' ~ (_index_info.json.entry[0].content.datatype | default('unknown')) ~ ', not metric' }}.
      An event index accepts the collector's HTTP POSTs and then discards every
      metric point, which is indistinguishable from a dead collector.

- name: Enable the HTTP Event Collector
  become: true
  no_log: true
  ansible.builtin.command: >-
    {{ splunk_bin }} http-event-collector enable -uri {{ splunk_mgmt_url }}
    -enable-ssl 1 -port {{ splunk_hec_port }}
    -auth {{ splunk_admin_username }}:{{ splunk_admin_password }}
  failed_when: false
  changed_when: "'already' not in (_hec_enable.stdout | default('') | lower)"
  register: _hec_enable

- name: Report a failure enabling HEC
  when: _hec_enable.rc != 0
  ansible.builtin.fail:
    msg: |
      Could not enable the HTTP Event Collector (rc={{ _hec_enable.rc }}).
      stdout: {{ _hec_enable.stdout | default('') | replace(splunk_admin_password, '<redacted>') }}
      stderr: {{ _hec_enable.stderr | default('') | replace(splunk_admin_password, '<redacted>') }}

- name: Look for an existing HEC token
  become: true
  no_log: true
  failed_when: false
  ansible.builtin.uri:
    url: "{{ splunk_mgmt_url }}/services/data/inputs/http?output_mode=json&count=0"
    user: "{{ splunk_admin_username }}"
    password: "{{ splunk_admin_password }}"
    force_basic_auth: true
    validate_certs: false
  register: _hec_inputs

- name: Report a failure listing HEC tokens
  when: _hec_inputs.status | default(0) != 200
  ansible.builtin.fail:
    msg: >-
      Could not list HEC tokens (HTTP {{ _hec_inputs.status | default('?') }}).
      HEC may not be enabled on this instance.

# The REST name is prefixed with the scheme, so 'evpn-collector' appears as
# 'http://evpn-collector'.
- name: Create the HEC token
  become: true
  no_log: true
  when: >-
    _hec_inputs.json.entry | default([])
    | selectattr('name', 'equalto', 'http://' ~ splunk_hec_token_name)
    | list | length == 0
  ansible.builtin.command: >-
    {{ splunk_bin }} http-event-collector create {{ splunk_hec_token_name }}
    -uri {{ splunk_mgmt_url }}
    -description "OpenTelemetry YANG telemetry from the campus EVPN fabric"
    -index {{ splunk_assurance_index }}
    -indexes {{ splunk_assurance_index }}
    -auth {{ splunk_admin_username }}:{{ splunk_admin_password }}
  failed_when: false
  register: _hec_created

- name: Report a failure creating the HEC token
  when:
    - _hec_created is not skipped
    - _hec_created.rc | default(0) != 0
  ansible.builtin.fail:
    msg: |
      Could not create the {{ splunk_hec_token_name }} HEC token (rc={{ _hec_created.rc }}).
      stdout: {{ _hec_created.stdout | default('') | replace(splunk_admin_password, '<redacted>') }}
      stderr: {{ _hec_created.stderr | default('') | replace(splunk_admin_password, '<redacted>') }}

- name: Read the HEC token back
  become: true
  no_log: true
  failed_when: false
  ansible.builtin.uri:
    url: "{{ splunk_mgmt_url }}/services/data/inputs/http/{{ splunk_hec_token_name | urlencode }}?output_mode=json"
    user: "{{ splunk_admin_username }}"
    password: "{{ splunk_admin_password }}"
    force_basic_auth: true
    validate_certs: false
  register: _hec_token_info

- name: Verify the HEC token was readable
  ansible.builtin.assert:
    that: _hec_token_info.status | default(0) == 200
    fail_msg: >-
      Could not read the {{ splunk_hec_token_name }} HEC token back
      (HTTP {{ _hec_token_info.status | default('?') }}). Without it the
      collector has nothing to authenticate with.

- name: Record the HEC token
  no_log: true
  ansible.builtin.set_fact:
    splunk_hec_token: "{{ _hec_token_info.json.entry[0].content.token }}"

- name: Index and HEC summary
  ansible.builtin.debug:
    msg:
      - "index  : {{ splunk_assurance_index }} (metric)"
      - "HEC    : {{ splunk_hec_url }}"
      - "token  : {{ splunk_hec_token_name }} (value withheld)"
