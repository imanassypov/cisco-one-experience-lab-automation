# ============================================================================
# splunk_preflight / tasks/main.yml  —  Assurance stage 01
# ============================================================================
# Read-only probe of the Splunk host. Every later stage assumes something about
# this box; this stage finds out which of those assumptions hold before anything
# is changed, and fails with a specific message rather than halfway through a
# deploy.
#
# Checks:
#   1. The vault carries both the SSH and the Splunk admin credentials
#   2. sudo works
#   3. Splunk is installed at splunk_home and splunkd is running
#   4. The Splunk admin credentials actually authenticate
#   5. Whether the collector package is already installed, and at what version
#   6. Whether the collector release is downloadable at all
#   7. Nothing else is already listening on the MDT receiver port
#
# Produced facts (consumed by later stages):
#   _splunk_present, _splunk_version, _otel_present, _otel_version,
#   _receiver_port_free
# ============================================================================
---

# Runs before any connection is attempted, so a missing vault entry reports
# itself rather than surfacing as an SSH auth failure.
- name: Require the Splunk host SSH credentials in the vault
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - splunk_ssh_credentials.username | default('') | length > 0
      - splunk_ssh_credentials.password | default('') | length > 0
    fail_msg: >-
      No '{{ inventory_hostname }}' entry in Lab Topology/lab_access.yml. That is
      the Linux account on {{ ansible_host }} used to manage the collector, and it
      is separate from 'Splunk Enterprise', which is the Splunk web/REST admin.
      Add it with: ansible-vault edit "Lab Topology/lab_access.yml"

- name: Require the Splunk admin credentials in the vault
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - lab_access['Splunk Enterprise'] is defined
      - lab_access['Splunk Enterprise'].username | default('') | length > 0
    fail_msg: >-
      No 'Splunk Enterprise' entry in Lab Topology/lab_access.yml. That account
      creates the metrics index, mints the HEC token and installs the app.

- name: Confirm privilege escalation works
  become: true
  ansible.builtin.command: id -u
  changed_when: false
  register: _sudo_probe
  failed_when: _sudo_probe.stdout | trim != "0"

- name: Look for the Splunk binary
  ansible.builtin.stat:
    path: "{{ splunk_bin }}"
  register: _splunk_bin_stat

- name: Fail early when Splunk is not where we expect it
  ansible.builtin.assert:
    that: _splunk_bin_stat.stat.exists
    fail_msg: >-
      No Splunk binary at {{ splunk_bin }} on {{ inventory_hostname }}
      ({{ ansible_host }}). Override splunk_home if Splunk lives elsewhere.

- name: Read the Splunk version
  become: true
  ansible.builtin.command: "{{ splunk_bin }} version --accept-license --answer-yes --no-prompt"
  changed_when: false
  register: _splunk_version_raw

- name: Confirm splunkd is running
  become: true
  ansible.builtin.command: "{{ splunk_bin }} status splunkd"
  changed_when: false
  register: _splunkd_status
  failed_when: "'is running' not in _splunkd_status.stdout"

# Proves the vault credentials work before stage 02 tries to create an index
# with them. no_log because the password is on the argument list; the follow-up
# task surfaces the failure with it scrubbed.
- name: Confirm the Splunk admin credentials authenticate
  become: true
  no_log: true
  ansible.builtin.command: >-
    {{ splunk_bin }} list index -auth {{ splunk_admin_username }}:{{ splunk_admin_password }}
  changed_when: false
  failed_when: false
  register: _splunk_auth

- name: Report a Splunk authentication failure
  when: _splunk_auth.rc != 0
  ansible.builtin.fail:
    msg: |
      The 'Splunk Enterprise' credentials from the vault did not authenticate
      (rc={{ _splunk_auth.rc }}).
      stdout: {{ _splunk_auth.stdout | default('') | replace(splunk_admin_password, '<redacted>') }}
      stderr: {{ _splunk_auth.stderr | default('') | replace(splunk_admin_password, '<redacted>') }}

- name: Look for an installed collector
  ansible.builtin.command: "{{ otel_binary }} --version"
  changed_when: false
  failed_when: false
  register: _otel_installed

# HEADs the real asset, not the release directory - GitHub 404s the directory
# path, which made this report a false negative. follow_redirects is required:
# release assets are a 302 to the CDN.
- name: Confirm the collector release can be reached
  delegate_to: localhost
  become: false
  ansible.builtin.uri:
    url: "{{ otel_package_base_url }}/v{{ otel_package_version }}/{{ otel_package_name }}_{{ otel_package_version }}_linux_amd64.deb"
    method: HEAD
    follow_redirects: all
    status_code: [200, 302, 403, 404]
  changed_when: false
  failed_when: false
  register: _release_reachable

- name: Check whether the MDT receiver port is already in use
  become: true
  ansible.builtin.shell:
    cmd: "ss -lntp | grep -w ':{{ otel_receiver_port }}' || true"
  changed_when: false
  register: _port_probe

- name: Record the preflight facts
  ansible.builtin.set_fact:
    _splunk_present: true
    _splunk_version: "{{ _splunk_version_raw.stdout | trim }}"
    _otel_present: "{{ _otel_installed.rc == 0 }}"
    _otel_version: "{{ _otel_installed.stdout | default('') | trim }}"
    _receiver_port_free: "{{ _port_probe.stdout | trim | length == 0 }}"

- name: Preflight summary
  ansible.builtin.debug:
    msg:
      - "Splunk           : {{ _splunk_version }}"
      - "splunkd          : running"
      - "admin auth       : ok"
      - "collector        : {{ _otel_version if _otel_present else 'not installed - stage 03 will install ' ~ otel_package_name ~ ' ' ~ otel_package_version }}"
      - "release download : {{ 'reachable' if (_release_reachable.status | default(0)) in [200, 302] else 'NOT reachable from the control node' }}"
      - "port {{ otel_receiver_port }}      : {{ 'free' if _receiver_port_free else 'ALREADY IN USE' }}"

# Downloaded on the Splunk host, but an unreachable release URL from the control
# node is a reliable signal that the lab has no path to GitHub at all.
- name: Warn when the collector release cannot be reached
  when:
    - not _otel_present
    - (_release_reachable.status | default(0)) not in [200, 302]
  ansible.builtin.debug:
    msg: >-
      Could not reach {{ otel_package_base_url }} from the control node. If the
      Splunk host also has no route to GitHub, download
      {{ otel_package_name }}_{{ otel_package_version }}_linux_amd64.deb by hand
      and install it before running stage 04.
