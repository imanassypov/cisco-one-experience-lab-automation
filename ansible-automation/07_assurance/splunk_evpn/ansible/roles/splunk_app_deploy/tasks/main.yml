# ============================================================================
# splunk_app_deploy / tasks/main.yml  —  Assurance stage 06
# ============================================================================
# Packages the dashboard app from source and installs it on the Splunk host.
#
# The app is kept as source in splunk-app/ rather than as a committed .spl so
# dashboard changes are reviewable diffs. packaging/build-app.sh tars it into
# a .spl named after the version in default/app.conf, and this stage ships it.
#
# `splunk install app -update 1` overwrites an existing install but does not
# reload the dashboards, so splunkd has to restart afterwards. That is the one
# genuinely disruptive step in this collection: searches in flight are lost.
#
# The build number in default/app.conf is asserted after the restart. Splunk
# will happily keep serving a cached older app if an install half-fails, and
# comparing the build is the only reliable way to notice.
# ============================================================================
---

- name: Build the app package
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    cmd: "{{ splunk_app_build_script }}"
  register: _build
  changed_when: true

- name: Read the app version from app.conf
  delegate_to: localhost
  become: false
  ansible.builtin.set_fact:
    _app_conf: "{{ lookup('file', splunk_app_src ~ '/default/app.conf') }}"

- name: Extract the version and build number
  ansible.builtin.set_fact:
    _app_version: "{{ _app_conf | regex_search('(?m)^version\\s*=\\s*(\\S+)', '\\1') | first }}"
    _app_build: "{{ _app_conf | regex_search('(?m)^build\\s*=\\s*(\\S+)', '\\1') | first }}"

- name: Locate the built package
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ splunk_app_dist_dir }}/{{ splunk_app_name }}-{{ _app_version }}.spl"
  register: _spl

- name: Fail when the package was not produced
  ansible.builtin.assert:
    that: _spl.stat.exists
    fail_msg: "build-app.sh did not produce {{ splunk_app_name }}-{{ _app_version }}.spl"

- name: Upload the package
  ansible.builtin.copy:
    src: "{{ splunk_app_dist_dir }}/{{ splunk_app_name }}-{{ _app_version }}.spl"
    dest: "/tmp/{{ splunk_app_name }}-{{ _app_version }}.spl"
    mode: "0644"

- name: Install the app
  become: true
  no_log: true
  ansible.builtin.command:
    argv:
      - "{{ splunk_bin }}"
      - install
      - app
      - "/tmp/{{ splunk_app_name }}-{{ _app_version }}.spl"
      - -update
      - "1"
      - --accept-license
      - --answer-yes
      - --no-prompt
      - -auth
      - "{{ splunk_admin_username }}:{{ splunk_admin_password }}"
    stdin: ""
  failed_when: false
  register: _install

- name: Report a failure installing the app
  when: _install.rc != 0
  ansible.builtin.fail:
    msg: |
      Could not install {{ splunk_app_name }} (rc={{ _install.rc }}).
      stdout: {{ _install.stdout | default('') | replace(splunk_admin_password, '<redacted>') }}
      stderr: {{ _install.stderr | default('') | replace(splunk_admin_password, '<redacted>') }}

- name: Remove the uploaded package
  ansible.builtin.file:
    path: "/tmp/{{ splunk_app_name }}-{{ _app_version }}.spl"
    state: absent

# 'splunk restart' takes no -auth: its syntax is 'restart [splunkweb]', and an
# unrecognised flag is forwarded to splunkd, which rejects it with 'Bad Option
# -a'. It is a local operation and needs no credentials.
#
# The prompt suppression and the closed stdin are both load-bearing. Without
# them the CLI blocks on a question nobody can answer: the task hangs forever
# with splunkd already stopped, so Splunk stays down rather than merely failing.
# The timeout is the backstop if a future release finds a new way to ask.
- name: Restart splunkd so the new dashboards load
  become: true
  ansible.builtin.command:
    argv:
      - timeout
      - "{{ splunk_restart_timeout }}"
      - "{{ splunk_bin }}"
      - restart
      - --accept-license
      - --answer-yes
      - --no-prompt
    stdin: ""
  failed_when: false
  changed_when: _restart.rc == 0
  register: _restart

# A timeout kills the restart mid-startup and leaves splunkd stopped, which is a
# worse outcome than the failure itself. Bring it back before reporting.
- name: Recover splunkd when the restart did not complete
  when: _restart.rc != 0
  become: true
  ansible.builtin.command:
    argv:
      - timeout
      - "{{ splunk_restart_timeout }}"
      - "{{ splunk_bin }}"
      - start
      - --accept-license
      - --answer-yes
      - --no-prompt
    stdin: ""
  failed_when: false
  register: _recover

- name: Report a failure restarting splunkd
  when: _restart.rc != 0
  ansible.builtin.fail:
    msg: |
      splunkd did not restart cleanly (rc={{ _restart.rc }}{{ ' - timed out after '
      ~ splunk_restart_timeout ~ 's' if _restart.rc == 124 else '' }}).
      Recovery start: {{ 'succeeded, Splunk is up' if _recover.rc == 0
                         else 'ALSO FAILED (rc=' ~ _recover.rc ~ ') - Splunk is DOWN' }}
      stdout: {{ _restart.stdout | default('') | replace(splunk_admin_password, '<redacted>') }}
      stderr: {{ _restart.stderr | default('') | replace(splunk_admin_password, '<redacted>') }}
      To start it by hand:
        sudo {{ splunk_bin }} start --accept-license --answer-yes --no-prompt

- name: Wait for splunkd to come back
  become: true
  ansible.builtin.command: "{{ splunk_bin }} status splunkd"
  register: _splunkd
  until: "'is running' in _splunkd.stdout"
  retries: "{{ (splunk_restart_timeout | int / 10) | round | int }}"
  delay: 10
  changed_when: false

# A half-failed install leaves the previous app in place and Splunk keeps
# serving it, so compare the build number rather than trusting the install rc.
- name: Read the installed app.conf
  become: true
  ansible.builtin.slurp:
    src: "{{ splunk_home }}/etc/apps/{{ splunk_app_name }}/default/app.conf"
  register: _remote_app_conf

# Extracted into a fact rather than inlined in the assert. A double-quoted YAML
# scalar turns \\s into \s, which is what the regex needs; the same text in a
# plain or folded scalar stays \\s and matches nothing. Doing it once keeps the
# working quoting in one place.
- name: Extract the installed build number
  ansible.builtin.set_fact:
    _remote_build: "{{ _remote_app_conf.content | b64decode | regex_search('(?m)^build\\s*=\\s*(\\S+)', '\\1') | default([], true) | first | default('not found', true) }}"

- name: Verify the installed build matches the source
  ansible.builtin.assert:
    that: _remote_build == _app_build
    fail_msg: >-
      Installed build is {{ _remote_build }} but the source says {{ _app_build }}.
      The install did not take effect - Splunk keeps serving the previous app if
      an install half-fails.

- name: App deployment summary
  ansible.builtin.debug:
    msg:
      - "app     : {{ splunk_app_name }} {{ _app_version }} (build {{ _app_build }})"
      - "path    : {{ splunk_home }}/etc/apps/{{ splunk_app_name }}"
      - "operator: hard-refresh Splunk Web (Cmd+Shift+R / Ctrl+Shift+R)"
