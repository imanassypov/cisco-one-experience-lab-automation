---
# =============================================================================
# 01_preflight.yml  —  Assurance stage 01
# =============================================================================
# Read-only. Probes the Splunk host and fails with a specific message if any
# assumption a later stage depends on does not hold.
#
# gather_facts is false so the control-node check below runs before ansible
# attempts an SSH connection. Nothing in this stage needs remote facts.
#
# Sourced:
#   inventory/hosts.yml           — splunk_server (198.18.5.109)
#   group_vars/splunk_servers/    — SSH user/password/become from the vault
#   group_vars/all/assurance.yml  — splunk_home, ports, collector paths
#   Lab Topology/lab_access.yml   — Splunk Enterprise and splunk_server entries
#
# Produced:
#   _splunk_version, _otel_unit_present, _otel_binary_present,
#   _go_present, _ocb_present, _receiver_port_free
#
# Run: ansible-playbook playbooks/01_preflight.yml
# =============================================================================
- name: Probe the Splunk host before changing anything
  hosts: splunk_servers
  gather_facts: false
  pre_tasks:
    # The Splunk host authenticates with a vault password. The default ssh
    # transport would need sshpass, which cannot be installed on the Kali image,
    # so this collection uses paramiko instead - see group_vars/splunk_servers.
    - name: Require paramiko on the control node
      delegate_to: localhost
      become: false
      ansible.builtin.command: "{{ ansible_playbook_python }} -c 'import paramiko'"
      changed_when: false
      failed_when: false
      register: _paramiko

    - name: Explain a missing paramiko
      delegate_to: localhost
      become: false
      ansible.builtin.assert:
        that: _paramiko.rc == 0
        fail_msg: >-
          paramiko is not importable by {{ ansible_playbook_python }}. It is the
          transport this collection uses to reach the Splunk host with a vault
          password, and it is pinned in ansible-automation/requirements.txt.
          Install it into the venv running this playbook with
          'python -m pip install -r ansible-automation/requirements.txt'.
  roles:
    - role: splunk_preflight
