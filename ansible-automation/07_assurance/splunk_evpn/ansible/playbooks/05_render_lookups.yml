---
# =============================================================================
# 05_render_lookups.yml  —  Assurance stage 05
# =============================================================================
# Regenerates the two Splunk lookup CSVs from the campus fabric intent, so the
# dashboards cannot drift from what was actually built.
#
# Runs entirely on the control node: it reads the DEFN-*.j2 templates and
# Settings/settings.json out of 01_campus/evpn and writes into
# splunk-app/campus_evpn_assurance/lookups/. Nothing touches the Splunk host —
# stage 06 packages the result.
#
# The join that matters: evpn_device_inventory.hostname must equal the
# collector's cisco.node_id dimension, which IOS-XE takes from the bare
# `hostname` command. The domain from `ip domain name` is NOT appended, so this
# is the SHORT name (Site_105-Leaf1), not the Catalyst Center inventory FQDN.
# Verified on the fabric 2026-09-19; there is no telemetry option to change it.
# Get it wrong and every panel renders but returns nothing.
# evpn_segment_inventory.overlay_leaves / access_leaves are join keys too -
# executive_overview splits overlay_leaves into cisco.node_id - so the same
# short-name rule applies there.
#
# Sourced: 01_campus/evpn/Catalyst Center Templates/Site BGP EVPN Templates/DEFN-*.j2
#          01_campus/evpn/Settings/settings.json
#          01_campus/evpn/ansible/roles/verify_intent/files/zz-defn-extract-epilogue.j2
#
# Run: ansible-playbook playbooks/05_render_lookups.yml
#      ansible-playbook playbooks/05_render_lookups.yml -e assurance_debug=true
# =============================================================================
- name: Generate the Splunk lookups from fabric intent
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: assurance_lookups
