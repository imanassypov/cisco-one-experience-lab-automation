---
# Galaxy pins for the Kali script-server venv. CatC 3.1.5 uses API profile
# 3.1.3.0; cisco.catalystcenter must be >=2.4.0 (catalystcenter_response).
# Keep cisco.catalystcenter and cisco.dnac in step with
# 01_campus/evpn/ansible/collections/requirements.yml — this file is what
# actually gets installed, so a higher pin there is silently never applied.
collections:
  - name: cisco.ios
    version: 10.1.1
  - name: cisco.catalystcenter
    version: 2.11.0
  - name: cisco.dnac
    version: 6.46.0
  - name: cisco.ise
    version: 2.10.0
  - name: cisco.nxos
    version: 10.2.0
  - name: cisco.meraki
    version: 2.21.0
