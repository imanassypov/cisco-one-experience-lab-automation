---
script_server_venv_path: "{{ ansible_user_dir }}/venv"
script_server_bin_path: "{{ ansible_user_dir }}/bin"
script_server_git_repo: https://github.com/imanassypov/cisco-one-experience-lab-automation.git
script_server_repo_dest: "{{ ansible_user_dir }}/cisco-one-experience-lab-automation"
script_server_git_version: main
script_server_bashrc: "{{ ansible_user_dir }}/.bashrc"
script_server_profile: "{{ ansible_user_dir }}/.profile"
script_server_zshrc: "{{ ansible_user_dir }}/.zshrc"
script_server_zprofile: "{{ ansible_user_dir }}/.zprofile"

# Lab DNS first so corp.pseudoco.com (CatC, ISE, …) resolves. dCloud resolver
# stays as fallback. glibc does not fail over on NXDOMAIN, so the lab server
# must be first. 198.18.5.102 recurses for public names (GitHub/PyPI).
script_server_lab_dns_primary: "198.18.5.102"
script_server_lab_dns_fallback: "198.18.128.1"
script_server_lab_dns_nameservers:
  - "{{ script_server_lab_dns_primary }}"
  - "{{ script_server_lab_dns_fallback }}"
script_server_interfaces_path: /etc/network/interfaces
script_server_resolv_conf_path: /etc/resolv.conf
script_server_lab_dns_check_hosts:
  - cat-center.corp.pseudoco.com

# Pinned for supply-chain consistency. Bump deliberately when upgrading.
script_server_ansible_core_version: "2.17.14"
script_server_paramiko_version: "3.5.1"
script_server_netaddr_version: "1.3.0"
# Official SDKs for CatC 3.1.3.0 API (3.1.5 appliance; no 3.1.5 SDK profile).
script_server_catalystcentersdk_version: "3.1.3.0.1"
script_server_dnacentersdk_version: "2.10.6"

script_server_python_packages:
  - "ansible-core=={{ script_server_ansible_core_version }}"
  - "paramiko=={{ script_server_paramiko_version }}"
  - "netaddr=={{ script_server_netaddr_version }}"
  - "catalystcentersdk=={{ script_server_catalystcentersdk_version }}"
  - "dnacentersdk=={{ script_server_dnacentersdk_version }}"

script_server_cli_binaries:
  - ansible
  - ansible-playbook
  - ansible-galaxy
  - ansible-vault
  - ansible-config
  - ansible-doc
  - ansible-inventory

script_server_debian_packages:
  - git
  - python3
  - python3-pip
  - python3-venv
  - python3-dev
  - gcc
  - libffi-dev
  - libssl-dev
  - sshpass

script_server_redhat_packages:
  - git
  - python3
  - python3-pip
  - python3-devel
  - gcc
  - libffi-devel
  - openssl-devel
