---
script_server_venv_path: "{{ ansible_user_dir }}/venv"
script_server_bin_path: "{{ ansible_user_dir }}/bin"
# The student clones this themselves before running collection 00, so the
# checkout is wherever this playbook lives - not a hardcoded path. Walking up
# from playbooks/ gives the repo root and lets them clone anywhere.
#
# This role never runs git. Keeping the checkout current is a plain `git pull`
# the student runs when a fix is published; the repo URL and branch are not
# role settings because nothing here reads them.
script_server_repo_dest: "{{ playbook_dir | dirname | dirname | dirname }}"
# Repo-root vault password file. Gitignored, created on this host by the
# student. Never put the vault password in this file.
script_server_vault: "{{ script_server_repo_dest }}/.vault"
# Pod-local values (lab_pod_id, lab_ap_macs). Gitignored so the working tree
# stays clean and a plain `git pull` keeps working; seeded from the tracked
# example on first bootstrap and never overwritten after.
script_server_lab_vars: "{{ script_server_repo_dest }}/ansible-automation/01_campus/evpn/ansible/inventory/group_vars/all/lab.yml"
script_server_lab_vars_example: "{{ script_server_lab_vars }}.example"
script_server_bashrc: "{{ ansible_user_dir }}/.bashrc"
script_server_profile: "{{ ansible_user_dir }}/.profile"
script_server_zshrc: "{{ ansible_user_dir }}/.zshrc"
script_server_zprofile: "{{ ansible_user_dir }}/.zprofile"

# ── IOS-XE image HTTP server (feeds campus stage 09 SWIM) ──────────────────
# Catalyst Center pulls software images from here instead of cisco.com. CCO
# import is unusable in this pod: every image is rejected with NCSW10375 "not
# the latest or suggested image from cisco" — even builds CatC's own catalogue
# marks ciscoLatest or recommended=CISCO — and software.cisco.com answers 403
# from the script server. Serving locally also lifts the restriction to
# Cisco-suggested builds, so any image may be used.
script_server_image_http_enabled: true
# Own port rather than 80, so the default nginx site is left alone.
script_server_image_http_port: 8080
script_server_image_root: /var/www/iosxe-images
# Owned by the login user, not root, so a student can scp a .bin straight into
# the web root instead of only via the checkout. nginx reads as www-data and
# only needs 0755/0644 to serve.
script_server_image_owner: "{{ ansible_user_id }}"
# Staged by hand in the checkout and gitignored, exactly like .vault and
# lab.yml — these are hundreds of MB and GitHub rejects anything over 100 MB.
script_server_image_source_dir: "{{ script_server_repo_dest }}/iosxe_images"

# Lab DNS first so corp.pseudoco.com (CatC, ISE, …) resolves. dCloud resolver
# stays as fallback. glibc does not fail over on NXDOMAIN, so the lab server
# must be first. 198.18.5.102 recurses for public names (GitHub/PyPI).
script_server_lab_dns_primary: "198.18.5.102"
script_server_lab_dns_fallback: "198.18.128.1"
script_server_lab_dns_nameservers:
  - "{{ script_server_lab_dns_primary }}"
  - "{{ script_server_lab_dns_fallback }}"
script_server_interfaces_path: /etc/network/interfaces
script_server_resolv_conf_path: /etc/resolv.conf
script_server_lab_dns_check_hosts:
  - cat-center.corp.pseudoco.com

# Shared pins live in ansible-automation/requirements.txt - the same file
# stage-script-server.sh installs - so a bump cannot land in only one of them.
script_server_requirements_file: "{{ script_server_repo_dest }}/ansible-automation/requirements.txt"

# Genie parsers back every stage 12 check. Pinned together because a parser
# schema change renames keys and would silently break checks — the same class of
# drift as an unpinned collection. Kept out of requirements.txt on purpose:
# roughly 700 MB that is not needed to run ansible-playbook, so staging stays
# fast and only the bootstrap pays for it.
script_server_genie_version: "26.8"
script_server_pyats_version: "26.8"

script_server_python_packages:
  - "genie=={{ script_server_genie_version }}"
  - "pyats=={{ script_server_pyats_version }}"

script_server_cli_binaries:
  - ansible
  - ansible-playbook
  - ansible-galaxy
  - ansible-vault
  - ansible-config
  - ansible-doc
  - ansible-inventory

# Deliberately minimal. Versioned venv, never the python3-venv metapackage:
# that one tracks the distro's *next* Python, and this image runs kali-rolling
# alongside kali-last-snapshot, so pulling it would upgrade python3 and break
# the ~120 installed python3-* packages pinned below the next version.
# state: present leaves already-installed packages at their current version.
#
# No compiler or -dev headers: every pinned wheel is prebuilt for this
# interpreter, and on this image libffi-dev / libssl-dev cannot install without
# dragging libc6 forward. If pip ever does need to build, the staging script
# says which packages to add by hand.
script_server_debian_packages:
  - git
  - python3-pip
  - "python{{ ansible_python.version.major }}.{{ ansible_python.version.minor }}-venv"

script_server_redhat_packages:
  - git
  - python3
  - python3-pip
  - python3-devel
  - gcc
  - libffi-devel
  - openssl-devel
