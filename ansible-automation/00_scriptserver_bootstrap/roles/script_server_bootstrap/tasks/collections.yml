---
- name: Copy Galaxy requirements into the virtualenv
  ansible.builtin.copy:
    src: requirements.yml
    dest: "{{ script_server_venv_path }}/requirements.yml"
    mode: "0644"

- name: Install pinned Ansible collections with the venv ansible-galaxy
  ansible.builtin.command:
    cmd: >-
      {{ script_server_venv_path }}/bin/ansible-galaxy collection install
      -r {{ script_server_venv_path }}/requirements.yml
  register: script_server_galaxy
  changed_when: >-
    'Nothing to do.' not in script_server_galaxy.stdout
    and 'is already installed' not in script_server_galaxy.stdout

- name: Remove leftover placeholder working directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/cisco-one-automation"
    state: absent
