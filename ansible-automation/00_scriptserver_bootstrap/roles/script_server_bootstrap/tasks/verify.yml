---
# Named ..._binary_version, not ..._git_version: the latter used to be a role
# default holding the branch to check out, and this register silently shadowed
# it. The default is gone now that the role never runs git, but the two names
# are worth keeping distinct.
- name: Collect git version  # noqa command-instead-of-module
  ansible.builtin.command:
    cmd: git --version
  register: script_server_git_binary_version
  changed_when: false

- name: Collect ansible-core version from the virtualenv
  ansible.builtin.command:
    cmd: "{{ script_server_venv_path }}/bin/ansible --version"
  register: script_server_ansible_version
  changed_when: false

- name: Collect installed Galaxy collections
  ansible.builtin.command:
    cmd: >-
      {{ script_server_venv_path }}/bin/ansible-galaxy collection list
      --format json
  register: script_server_galaxy_list
  changed_when: false

- name: Flatten installed Galaxy collection versions
  ansible.builtin.set_fact:
    script_server_galaxy_versions: >-
      {%- set installed = {} -%}
      {%- for collection_root in (script_server_galaxy_list.stdout | from_json).values() -%}
      {%- for collection_name, metadata in collection_root.items() -%}
      {{- installed.update({collection_name: metadata.version}) or '' -}}
      {%- endfor -%}
      {%- endfor -%}
      {{ installed }}

- name: Verify every pinned Galaxy collection version
  ansible.builtin.assert:
    that:
      - >-
        (script_server_galaxy_versions[item.name] | default(''))
        == (item.version | string)
    fail_msg: >-
      {{ item.name }} is not at the pinned version {{ item.version }}.
      Installed: {{ script_server_galaxy_versions[item.name] | default('missing') }}.
      Re-run the bootstrap so ansible-galaxy reinstalls the pinned requirements.
    success_msg: "{{ item.name }} {{ item.version }} is installed."
  loop: "{{ script_server_collection_requirements.collections }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"

- name: Check Python package dependency consistency
  ansible.builtin.command:
    cmd: "{{ script_server_venv_path }}/bin/python -m pip check"
  register: script_server_pip_check
  changed_when: false
  failed_when: script_server_pip_check.rc != 0

# Exports PATH first on purpose: this proves the binaries resolve once the rc
# file is in effect, NOT that the student's already-open shell can see them.
- name: Confirm ansible-playbook is on PATH via venv and ~/bin
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="{{ script_server_venv_path }}/bin:{{ script_server_bin_path }}:${PATH}"
    command -v ansible
    command -v ansible-playbook
    command -v ansible-galaxy
  args:
    executable: /bin/bash
  register: script_server_path_check
  changed_when: false
  failed_when: script_server_path_check.rc != 0

- name: Confirm lab DNS still resolves CatC
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - cat-center.corp.pseudoco.com
  changed_when: false
  register: script_server_dns_verify

- name: Confirm the vault password file is in place
  ansible.builtin.stat:
    path: "{{ script_server_vault }}"
  register: script_server_vault_verify

- name: Fail when the vault password file is missing
  ansible.builtin.assert:
    that:
      - script_server_vault_verify.stat.exists | default(false)
    fail_msg: >-
      {{ script_server_vault }} is missing. Create it on this host with the lab
      passphrase from your proctor, then chmod 600 it. It is gitignored.

- name: Display bootstrap evidence
  ansible.builtin.debug:
    msg:
      - "{{ script_server_git_binary_version.stdout }}"
      - "{{ script_server_ansible_version.stdout_lines }}"
      - "PATH binaries (resolved with the new PATH applied): {{ script_server_path_check.stdout_lines }}"
      - "DNS: {{ script_server_dns_verify.stdout }}"
      - "Vault password file: {{ script_server_vault }}"
      - "Galaxy collections: {{ script_server_galaxy_versions }}"
      - "Python dependencies: {{ script_server_pip_check.stdout | default('ok') }}"
      - >-
        NEXT: this shell started before PATH was updated, so `ansible-playbook`
        is still not found in it. Run `exec $SHELL -l` here, or open a new SSH
        session, then confirm with `ansible-playbook --version`. If apt offers
        to install ansible-core, say no - that is an unpinned copy outside the
        venv.
