---
- name: Point the resolver at lab DNS
  ansible.builtin.include_tasks: dns.yml

- name: Install OS packages
  ansible.builtin.include_tasks: packages.yml

- name: Create virtualenv and install Ansible binaries
  ansible.builtin.include_tasks: venv.yml

- name: Put venv binaries on PATH
  ansible.builtin.include_tasks: path.yml

- name: Install Galaxy collections
  ansible.builtin.include_tasks: collections.yml

- name: Clone or pull the GitHub repository
  ansible.builtin.include_tasks: sync_repo.yml

- name: Verify bootstrap
  ansible.builtin.include_tasks: verify.yml
