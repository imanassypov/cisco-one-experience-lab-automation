---
- name: Point the resolver at lab DNS
  ansible.builtin.include_tasks: dns.yml

- name: Install OS packages
  ansible.builtin.include_tasks: packages.yml

- name: Create virtualenv and install Ansible binaries
  ansible.builtin.include_tasks: venv.yml

- name: Put venv binaries on PATH
  ansible.builtin.include_tasks: path.yml

- name: Install Galaxy collections
  ansible.builtin.include_tasks: collections.yml

# Deliberately NOT a git pull. This role runs from the checkout it would be
# rewriting, and everything it reads off disk — requirements.txt in venv.yml,
# the Galaxy requirements, this role's own defaults — is already loaded by
# now, so a pull here could not inform the work it follows. It also used to
# abort the entire bootstrap over uncommitted edits, discarding the apt, venv
# and collection work that had already succeeded. Pull with
# playbooks/02_sync_from_git.yml first, then run this.
- name: Seed pod-local files and check the vault
  ansible.builtin.include_tasks: pod_files.yml

# After pod_files, so a first-ever bootstrap publishes any images the student
# staged in the checkout before running it. Tagged so images can be republished
# on their own with --tags image_server, without re-running the apt and venv
# work on a box whose libc6 state makes every apt transaction a risk.
#
# apply: is required. A tag on include_tasks alone selects the include itself
# but not the tasks it pulls in, so --tags image_server ran the include and
# nothing else (ok=2, changed=0).
- name: Serve IOS-XE images over HTTP for SWIM
  ansible.builtin.include_tasks:
    file: http_image_server.yml
    apply:
      tags: [image_server]
  when: script_server_image_http_enabled | bool
  tags: [image_server]

- name: Verify bootstrap
  ansible.builtin.include_tasks: verify.yml
