---
- name: Clone or update the lab automation repository
  ansible.builtin.git:
    repo: "{{ script_server_git_repo }}"
    dest: "{{ script_server_repo_dest }}"
    version: "{{ script_server_git_version }}"
    update: true
    accept_hostkey: true
  register: script_server_git_sync
  # The dCloud VPN path to github.com drops intermittently; a clone failure
  # here aborts the whole bootstrap.
  until: script_server_git_sync is succeeded
  retries: 3
  delay: 5

- name: Show the script-server checkout
  ansible.builtin.debug:
    msg: >-
      {{ script_server_git_repo }} ({{ script_server_git_version }})
      is at {{ script_server_repo_dest }}
      ({{ script_server_git_sync.after | default('updated') }}).
      Test playbooks from that tree; Ansible is already on PATH.

# lab.yml is gitignored, so a fresh clone does not have one and the stages that
# read lab_pod_id / lab_ap_macs would fail on an undefined variable. force: no
# means an existing file — the student's pod values — is never overwritten, so
# this is safe on every re-run.
- name: Seed pod-local lab.yml from the tracked example
  ansible.builtin.copy:
    src: "{{ script_server_lab_vars_example }}"
    dest: "{{ script_server_lab_vars }}"
    remote_src: true
    force: false
    mode: "0644"
  register: script_server_lab_seeded

- name: Remind the student to fill in the pod values
  when: script_server_lab_seeded.changed
  ansible.builtin.debug:
    msg:
      - "Created {{ script_server_lab_vars }} from the example."
      - "Set lab_pod_id to your dCloud pod number before running stage 07."
      - "Add each access point's Ethernet MAC to lab_ap_macs before stage 08."
      - "The file is gitignored, so your values survive every later git pull."

- name: Require the laptop .vault before copying it to Kali
  ansible.builtin.stat:
    path: "{{ script_server_controller_vault }}"
  delegate_to: localhost
  become: false
  register: script_server_controller_vault_stat

- name: Fail when the laptop .vault is missing
  ansible.builtin.assert:
    that:
      - script_server_controller_vault_stat.stat.exists | default(false)
      - script_server_controller_vault_stat.stat.isreg | default(false)
    fail_msg: >-
      Create the gitignored repo-root .vault on the student laptop first
      (cp .vault.example .vault). Bootstrap copies that file to Kali so
      later collections can decrypt lab_access.yml.

- name: Copy the dCloud demo .vault onto the script server checkout
  ansible.builtin.copy:
    src: "{{ script_server_controller_vault }}"
    dest: "{{ script_server_remote_vault }}"
    mode: "0600"
  no_log: true

- name: Remind that the copied .vault is dCloud-demo only
  ansible.builtin.debug:
    msg:
      - "Copied the laptop .vault to {{ script_server_remote_vault }} (mode 0600)."
      - "dCloud PseudoCo demo: the vault password is shared on purpose so Kali can decrypt lab_access.yml."
      - "PRODUCTION: change this. Do not copy a shared vault password onto a remote host. Use a unique password per environment and inject it from a secret store."
