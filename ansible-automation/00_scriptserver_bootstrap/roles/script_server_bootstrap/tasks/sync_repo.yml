---
# Fast-forwards the checkout to pick up lab changes published since the
# student cloned it. Never re-clones, never discards local work.
#
# ONLY 02_sync_from_git.yml includes this. The bootstrap deliberately does not
# pull: it runs from the very checkout it would be rewriting mid-play, and
# everything it reads off disk — requirements.txt in venv.yml, the Galaxy
# requirements, the role's own defaults — is loaded before this point anyway,
# so the pull could never have informed the work it followed. Worse, a dirty
# tree aborted the whole bootstrap over something unrelated to bootstrapping.
# Pull first with 02, then bootstrap.
#
# The dirty-tree case is checked here rather than left to ansible.builtin.git
# because the module's own behaviour is unhelpful twice over. Its message,
# "Local modifications exist in the destination (force=no)", names no files
# and suggests no fix. And the failure is deterministic, so the retry loop
# below — which exists for the dCloud VPN dropping github.com — burns three
# attempts making a config problem look like a network flake.
#
# --untracked-files=no is required for this check to agree with the module.
# ansible.builtin.git runs plain `git status --porcelain` and then filters out
# every `??` line (has_local_mods, git.py:650), so untracked files do not
# block a pull. Without the flag here, a stray scratch file in the checkout
# would fail a pull that git would have been happy to do.
- name: Check whether the checkout has local modifications
  ansible.builtin.command:
    cmd: git status --porcelain --untracked-files=no
    chdir: "{{ script_server_repo_dest }}"
  register: script_server_git_dirty
  changed_when: false
  failed_when: false

- name: Fail on a dirty checkout, naming the files and the fix
  ansible.builtin.fail:
    msg: >-
      {{ script_server_repo_dest }} has uncommitted changes, so it cannot be
      fast-forwarded without discarding them:
      {{ script_server_git_dirty.stdout_lines | join(' | ') }}.
      Keep them with `git -C {{ script_server_repo_dest }} stash`, discard them
      with `git -C {{ script_server_repo_dest }} checkout -- .`, or commit them.
      Only tracked files are listed - .vault, lab.yml and iosxe_images/ are
      gitignored and never block a pull.
  when: script_server_git_dirty.stdout | default('') | trim | length > 0

- name: Update the lab automation checkout
  ansible.builtin.git:
    repo: "{{ script_server_git_repo }}"
    dest: "{{ script_server_repo_dest }}"
    version: "{{ script_server_git_version }}"
    update: true
    accept_hostkey: true
  register: script_server_git_sync
  # The dCloud VPN path to github.com drops intermittently, and by this point
  # a failure can only be that, because the dirty-tree case failed above.
  until: script_server_git_sync is succeeded
  retries: 3
  delay: 5

- name: Show the script-server checkout
  ansible.builtin.debug:
    msg: >-
      {{ script_server_git_repo }} ({{ script_server_git_version }})
      is at {{ script_server_repo_dest }}
      ({{ script_server_git_sync.after | default('unchanged') }}).

- name: Point at the bootstrap when the checkout moved
  ansible.builtin.debug:
    msg: >-
      This checkout advanced to {{ script_server_git_sync.after }}. If the
      update touched pinned collections or Python packages, run
      playbooks/01_bootstrap_script_server.yml to apply them to ~/venv.
  when: script_server_git_sync.changed | default(false)
