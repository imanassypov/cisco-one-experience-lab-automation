---
- name: Fail when the OS family is not Debian or RedHat
  ansible.builtin.fail:
    msg: >-
      Unsupported OS family '{{ ansible_os_family }}'
      (distribution '{{ ansible_distribution }}').
      This role supports Kali Linux, other Debian/Ubuntu, and RedHat/CentOS/Rocky.
  when: ansible_os_family not in ["Debian", "RedHat"]

- name: Find HashiCorp apt sources that break Kali apt update
  ansible.builtin.find:
    paths:
      - /etc/apt/sources.list.d
    patterns: "*"
    contains: 'apt\.releases\.hashicorp\.com'
  become: true
  register: script_server_hashicorp_apt
  when: ansible_distribution == "Kali"

- name: Disable HashiCorp apt sources with no kali-rolling Release file
  ansible.builtin.command:
    argv:
      - mv
      - "{{ item.path }}"
      - "{{ item.path }}.disabled-by-cisco-one"
    creates: "{{ item.path }}.disabled-by-cisco-one"
  become: true
  loop: "{{ script_server_hashicorp_apt.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - ansible_distribution == "Kali"
    - script_server_hashicorp_apt.files | default([]) | length > 0

- name: Install Debian family packages (Kali, Ubuntu, Debian)
  ansible.builtin.apt:
    name: "{{ script_server_debian_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: ansible_os_family == "Debian"

- name: Install RedHat family packages
  ansible.builtin.package:
    name: "{{ script_server_redhat_packages }}"
    state: present
  become: true
  when: ansible_os_family == "RedHat"

- name: Install sshpass on RedHat family when the package exists
  ansible.builtin.package:
    name: sshpass
    state: present
  become: true
  when: ansible_os_family == "RedHat"
  register: script_server_sshpass
  ignore_errors: true

- name: Warn if sshpass is missing on RedHat family
  ansible.builtin.debug:
    msg: >-
      sshpass was not installed. Enable EPEL or install it later if
      password-based SSH from this host is required.
  when:
    - ansible_os_family == "RedHat"
    - script_server_sshpass is failed
