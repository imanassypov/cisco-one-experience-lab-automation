---
- name: Fail when the OS family is not Debian or RedHat
  ansible.builtin.fail:
    msg: >-
      Unsupported OS family '{{ ansible_os_family }}'
      (distribution '{{ ansible_distribution }}').
      This role supports Kali Linux, other Debian/Ubuntu, and RedHat/CentOS/Rocky.
  when: ansible_os_family not in ["Debian", "RedHat"]

# HashiCorp has no kali-rolling Release file. The dCloud image may put that
# repo in sources.list (which find-on-sources.list.d misses) or in a drop-in.
- name: Locate HashiCorp apt sources that break Kali apt update
  ansible.builtin.command:
    argv:
      - grep
      - -Rl
      - --include=*.list
      - --include=*.sources
      - --include=sources.list
      - -E
      - apt\.releases\.hashicorp\.com
      - /etc/apt/sources.list
      - /etc/apt/sources.list.d
  register: script_server_hashicorp_apt
  changed_when: false
  failed_when: script_server_hashicorp_apt.rc not in [0, 1]
  become: true
  when: ansible_distribution == "Kali"

- name: Disable HashiCorp drop-in apt sources
  ansible.builtin.command:
    argv:
      - mv
      - "{{ item }}"
      - "{{ item }}.disabled-by-cisco-one"
    creates: "{{ item }}.disabled-by-cisco-one"
  become: true
  loop: "{{ script_server_hashicorp_apt.stdout_lines | default([]) | select('match', '^/etc/apt/sources\\.list\\.d/') | list }}"
  loop_control:
    label: "{{ item }}"
  when:
    - ansible_distribution == "Kali"
    - item | length > 0

- name: Comment HashiCorp entries in /etc/apt/sources.list
  ansible.builtin.replace:
    path: /etc/apt/sources.list
    regexp: '^([^#\n]*apt\.releases\.hashicorp\.com.*)$'
    replace: '# disabled-by-cisco-one \1'
  become: true
  when:
    - ansible_distribution == "Kali"
    - "'/etc/apt/sources.list' in (script_server_hashicorp_apt.stdout_lines | default([]))"

- name: Install Debian family packages (Kali, Ubuntu, Debian)
  ansible.builtin.apt:
    name: "{{ script_server_debian_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: ansible_os_family == "Debian"

- name: Install RedHat family packages
  ansible.builtin.package:
    name: "{{ script_server_redhat_packages }}"
    state: present
  become: true
  when: ansible_os_family == "RedHat"

- name: Install sshpass on RedHat family when the package exists
  ansible.builtin.package:
    name: sshpass
    state: present
  become: true
  when: ansible_os_family == "RedHat"
  register: script_server_sshpass
  ignore_errors: true

- name: Warn if sshpass is missing on RedHat family
  ansible.builtin.debug:
    msg: >-
      sshpass was not installed. Enable EPEL or install it later if
      password-based SSH from this host is required.
  when:
    - ansible_os_family == "RedHat"
    - script_server_sshpass is failed
