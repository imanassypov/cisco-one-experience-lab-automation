---
# No SSH hop: the student is already on the script server, so there is no
# remote user or password. sudo still needs the account password, which stays
# in the vault rather than on the command line.
ansible_connection: local
# System python, not the venv python - the apt module needs python3-apt, which
# only exists in the system interpreter.
ansible_python_interpreter: /usr/bin/python3
ansible_become_password: "{{ lab_access[inventory_hostname].password }}"
