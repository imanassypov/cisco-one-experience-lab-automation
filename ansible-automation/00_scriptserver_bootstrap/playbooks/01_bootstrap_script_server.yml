---
# Runs on the script server itself. become is enabled at play level because
# DNS and apt need root; everything else drops back to the login user so the
# venv, PATH and checkout stay owned by that account.
- name: Bootstrap the Linux script server
  hosts: script_servers
  gather_facts: true
  become: false
  pre_tasks:
    - name: Fail when the vault did not decrypt
      ansible.builtin.assert:
        that:
          - lab_access is defined
          - lab_access['script_server'] is defined
        fail_msg: >-
          lab_access is empty, so the repo-root .vault is missing or holds the
          wrong passphrase. Run playbooks/00_preflight.yml for the exact fix.
  roles:
    - role: script_server_bootstrap
