---
- name: Require vault credentials before connecting
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Fail when vault SSH credentials are missing
      ansible.builtin.assert:
        that:
          - hostvars['script_server'].ansible_user is defined
          - hostvars['script_server'].ansible_user | length > 0
          - hostvars['script_server'].ansible_password is defined
          - hostvars['script_server'].ansible_password | length > 0
        fail_msg: >-
          Script server credentials come from Lab Topology/lab_access.yml
          (key script_server). Create the repo-root .vault
          (see .vault.example) so ansible.cfg can decrypt that vault.

- name: Sync the GitHub repo onto the script server
  hosts: script_servers
  gather_facts: true
  become: false
  tasks:
    - name: Clone or pull the automation repository
      ansible.builtin.include_role:
        name: script_server_bootstrap
        tasks_from: sync_repo.yml
