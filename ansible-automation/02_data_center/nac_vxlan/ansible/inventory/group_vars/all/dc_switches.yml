---
# Declared DC switch table — the tracked half of the topology.
#
# Hostnames, management addresses, fabric roles and endpoint port-channels are
# identical in every pod (see Lab Topology/PseudoCo_Lab_Access_Lookup.md), so
# they live in git. Serial numbers are pod-specific hardware and are NOT here;
# 02_discover_serials.yml asks Nexus Dashboard for them and renders
# playbooks/host_vars/Pseudoco-DC1/topology_switches.nac.yaml from this table plus the
# discovered serials.
#
# Roles come from the guide: Nexus 9300s default to leaf and 9500s to spine on
# import, but DC-Service-Leaf must be set to border and the two spines must be
# set explicitly rather than trusted to the model-based default.

dc_fabric_name: Pseudoco-DC1

# Seed for the NDFC discovery call. Two hops reaches the spines and the service
# leaf from DC-Leaf1, matching the guide's Add Switches dialog.
dc_discovery_seed_ip: 198.18.128.101
dc_discovery_max_hops: 2
# SNMPv3 auth protocol for discovery. NDFC encodes MD5 as 0; see
# update_create_params() in cisco.dcnm's dcnm_inventory.
dc_discovery_snmp_auth_protocol: 0
dc_discovery_cdp_second_timeout: 5

# Management default gateway for the switch mgmt0 interfaces. Left undefined on
# purpose: NDFC will push whatever is declared here, and the correct value for
# this pod has not been verified against a device. Uncomment only once
# confirmed, otherwise the generated model omits the key entirely.
# dc_management_default_gateway: 198.18.128.1

dc_switches:
  - name: DC-Leaf1
    management_ipv4_address: 198.18.128.101
    role: leaf
    # Three Linux workloads land on DC-Leaf1/DC-Leaf2 as vPCs 3, 4 and 5,
    # one per business segment. Access VLAN is deliberately left unset: the
    # network attachment in networks.nac.yaml is what binds each port-channel
    # to its overlay VLAN, exactly as the guide's Network Attachments step does.
    interfaces:
      - name: Port-channel3
        mode: access
        vpc_id: 3
        description: "MAIN server — vPC3"
        members:
          - Ethernet1/3
      - name: Port-channel4
        mode: access
        vpc_id: 4
        description: "PROD server — vPC4"
        members:
          - Ethernet1/4
      - name: Port-channel5
        mode: access
        vpc_id: 5
        description: "IOT server — vPC5"
        members:
          - Ethernet1/5

  - name: DC-Leaf2
    management_ipv4_address: 198.18.128.102
    role: leaf
    interfaces:
      - name: Port-channel3
        mode: access
        vpc_id: 3
        description: "MAIN server — vPC3"
        members:
          - Ethernet1/3
      - name: Port-channel4
        mode: access
        vpc_id: 4
        description: "PROD server — vPC4"
        members:
          - Ethernet1/4
      - name: Port-channel5
        mode: access
        vpc_id: 5
        description: "IOT server — vPC5"
        members:
          - Ethernet1/5

  - name: DC-SPINE-1
    management_ipv4_address: 198.18.128.11
    role: spine
    interfaces: []

  - name: DC-SPINE-2
    management_ipv4_address: 198.18.128.12
    role: spine
    interfaces: []

  # Border leaf. This is the switch the guide retags from leaf to Border, and
  # the one that will carry the VRF-Lite extensions to the external router.
  - name: DC-Service-Leaf
    management_ipv4_address: 198.18.128.13
    role: border
    interfaces: []
