---
# Stage 02 - build the whole fabric intent on Nexus Dashboard.
#
# This is guide sections 4, 5 and 6 in one play. The validate role reads the
# declarative model in playbooks/host_vars/Pseudoco-DC1/ and checks it against
# the collection's schema, so a data error fails here rather than half way
# through a build; the create role then turns that model into the fabric, the
# switch import, the switch roles, the vPC pair, the port-channels, the VRFs,
# the networks and their attachments.
#
# The stage only stages configuration on the controller - nothing reaches a
# switch until stage 06 - with one exception: importing a switch is itself a
# write, and the import is greenfield. The create role's inventory template
# hardcodes preserve_config: false, so every switch has its running
# configuration erased as it is imported. That is the guide's "uncheck Preserve
# Config" step, and no flag changes it. Expect the inventory step to sit for
# several minutes with no output, because the controller holds one HTTP request
# open per switch role while it discovers and imports the switches.
#
# One file in the model, topology_switches.nac.yaml, is generated by stage 00
# rather than tracked, so the pre_tasks below refuse to start without it.
#
# Run from the collection root, the directory holding ansible.cfg. The paths in
# ansible.cfg that reach the vault and the vars plugin are relative to the
# working directory, so running from playbooks/ breaks authentication:
#
#   cd ansible-automation/02_data_center/nac_vxlan/ansible
#   ansible-playbook playbooks/02_create_dc_fabric.yml
#
# Useful override:
#   --tags cr_manage_fabric   create the fabric object and nothing else, which
#                             is the guide's "Create a VXLAN Fabric" step on
#                             its own. cr_manage_fabric is a per-step tag
#                             inside the create role.
#
# Background: "The data model" in the README.

- name: Stage 02 - create the DC fabric intent
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    dc_switch_model_path: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/topology_switches.nac.yaml"

  pre_tasks:
    # These checks run before either role does. stat asks whether a file exists
    # and register saves the answer for the next task; delegate_to: localhost
    # runs it on this machine rather than against the controller. They are
    # tagged always so that even a --tags run cannot skip them.
    - name: Look for the generated switch model
      ansible.builtin.stat:
        path: "{{ dc_switch_model_path }}"
      register: dc_switch_model
      delegate_to: localhost
      tags: [always]

    - name: Fail with a pointer to stage 00 when the switch model is absent
      ansible.builtin.fail:
        msg: >-
          playbooks/host_vars/{{ inventory_hostname }}/topology_switches.nac.yaml does
          not exist. It is generated, not tracked, because the serial numbers
          belong to one pod. Run
          playbooks/00_discover_dc_switch_serials.yml, which reads the serials
          off the switches and writes it.
      when: not dc_switch_model.stat.exists
      tags: [always]

    # The validate role only checks that serial_number is non-empty, so the
    # REPLACE_ME placeholder passes validation and then fails deep inside the
    # create role. Stage 00 makes the same check on what it writes; this one
    # stands behind it, because the file is on disk and could be edited
    # afterwards. slurp reads a file into a variable, base64-encoded.
    - name: Read the switch model back to check the serials are real
      ansible.builtin.slurp:
        src: "{{ dc_switch_model_path }}"
      register: dc_switch_model_content
      delegate_to: localhost
      tags: [always]

    - name: Fail when a placeholder serial number is still in place
      ansible.builtin.fail:
        msg: >-
          playbooks/host_vars/{{ inventory_hostname }}/topology_switches.nac.yaml still
          contains REPLACE_ME, which means it was not written by a clean stage
          00 run. Re-run playbooks/00_discover_dc_switch_serials.yml - it
          regenerates the file from scratch and refuses to leave a placeholder
          behind. A placeholder passes validation and then fails deep inside
          the create role, which is a much harder failure to read.
      when: "'REPLACE_ME' in (dc_switch_model_content.content | b64decode)"
      tags: [always]

  roles:
    - role: cisco.nac_dc_vxlan.validate
    - role: cisco.nac_dc_vxlan.dtc.create
