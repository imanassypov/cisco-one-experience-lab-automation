---
# Stage 03 - apply the fabric settings Nexus as Code cannot express.
#
# Guide section 4, the Resources tab of the fabric settings. cisco.nac_dc_vxlan
# 0.9.0 has no data model key for any of these, so stage 02 leaves them at
# their Nexus Dashboard defaults. This stage closes that gap.
#
# It runs between create and deploy on purpose. These are fabric parameters,
# not switch configuration: they change what the controller will generate, so
# they have to be in place before stage 04 generates it. Nothing here touches
# a switch, and DEPLOY is false throughout.
#
# The values live in inventory/group_vars/all/dc_advanced_settings.yml. This
# playbook holds none of its own - change the fabric by editing that file.
#
#   ansible-playbook playbooks/03_advanced_settings.yml

- name: Stage 03 - apply advanced fabric settings
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    ndfc_api_root: /appcenter/cisco/ndfc/api/v1/lan-fabric
    # The Nexus Dashboard 4.2 fabric object. A different API from the one
    # above, holding a different set of settings - see the two dictionaries in
    # inventory/group_vars/all/dc_advanced_settings.yml.
    nd_fabric_path: "/api/v1/manage/fabrics/{{ inventory_hostname }}"

  pre_tasks:
    # The ASN is not restated here. cisco.dcnm.dcnm_fabric makes BGP_AS a
    # mandatory key for a VXLAN_EVPN fabric even when the ASN is not what you
    # are changing, and the ASN already has one home: the Nexus as Code model
    # that stage 02 built the fabric from. Reading it back off disk keeps that
    # the only copy.
    - name: Read the fabric ASN out of the Nexus as Code model
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/global.nac.yaml"
        name: dc_nac_global
      tags: [always]

    - name: Look for the fabric on the controller
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ inventory_hostname }}"
      register: dc_fabric_existing
      changed_when: false
      failed_when: false
      tags: [always]

    # Failing here is worth the few seconds it costs. dcnm_fabric's own error
    # for a missing fabric is a key lookup deep inside the module, which reads
    # like a bug in this playbook rather than a stage run out of order.
    - name: Refuse to run against a fabric that does not exist
      ansible.builtin.fail:
        msg: >-
          Nexus Dashboard has no fabric named '{{ inventory_hostname }}', so
          there is nothing for this stage to configure. Run
          playbooks/02_create.yml first - it is what creates the fabric. If
          stage 02 has already run, check that the fabric name in
          host_vars/{{ inventory_hostname }}/global.nac.yaml still matches the
          inventory host name.
      when: >-
        ((dc_fabric_existing.response | default({})).RETURN_CODE
           | default(0) | int) != 200
      tags: [always]

    - name: Require something to apply
      ansible.builtin.assert:
        that:
          - dc_advanced_fabric_settings is defined
          - dc_advanced_fabric_settings | length > 0
          - dc_advanced_nd_fabric_settings is defined
          - dc_advanced_nd_fabric_settings | length > 0
        fail_msg: >-
          dc_advanced_fabric_settings or dc_advanced_nd_fabric_settings is
          empty or undefined. Both should be declared in
          inventory/group_vars/all/dc_advanced_settings.yml. An empty
          dictionary here would make this stage report success while changing
          nothing.
      tags: [always]

  tasks:
    # state: merged is non-destructive on Nexus Dashboard 4.x, and not by
    # accident: the module detects a 4.x controller and rebuilds the update
    # payload from the controller's own nvPairs before overlaying these
    # changes, because ND 4.x rejects a partial fabric update. So the
    # settings Nexus as Code wrote in stage 02 are carried through untouched,
    # and a key that the fabric template does not have fails the task with
    # "Key <name> not found in fabric configuration" rather than being
    # silently dropped.
    #
    # DEPLOY is false because this stage only stages intent. Stage 04 is what
    # pushes configuration to the switches.
    - name: Apply the Easy_Fabric parameters
      cisco.dcnm.dcnm_fabric:
        state: merged
        config:
          - "{{ {'FABRIC_NAME': inventory_hostname,
                 'FABRIC_TYPE': 'VXLAN_EVPN',
                 'BGP_AS': dc_nac_global.vxlan.global.ibgp.bgp_asn,
                 'DEPLOY': false}
                | combine(dc_advanced_fabric_settings) }}"
      register: dc_advanced_fabric_result

    - name: Report what changed in the Easy_Fabric parameters
      ansible.builtin.debug:
        msg: >-
          Easy_Fabric parameters:
          {{ 'updated ' + (dc_advanced_fabric_settings | length | string)
             + ' declared setting(s)'
             if dc_advanced_fabric_result.changed
             else 'already matched the declared intent, nothing sent' }}.

    # License Tier and Telemetry are not nvPairs - neither name appears
    # anywhere in the 423 nvPairs of this fabric - so dcnm_fabric cannot
    # reach them. They are properties of the Nexus Dashboard fabric object,
    # which has no partial update: a PUT replaces the whole object. So this is
    # a read-modify-write.
    #
    # The GET has to happen AFTER the dcnm_fabric task above, and that is the
    # one non-obvious thing in this play. The fabric object carries a
    # camelCase mirror of the nvPairs, so a copy read before dcnm_fabric ran
    # would put the old VRF-Lite values straight back when it is PUT.
    - name: Read the Nexus Dashboard fabric object
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ nd_fabric_path }}"
      register: dc_nd_fabric_read
      changed_when: false

    - name: Keep the fabric object and the declared slice of it side by side
      ansible.builtin.set_fact:
        dc_nd_fabric_object: >-
          {{ (dc_nd_fabric_read.response | default({})).DATA | default({}) }}

    # The same loud failure dcnm_fabric gives for an unknown nvPair. Without
    # it, a mistyped property name would be added to the object by combine
    # below, and Nexus Dashboard would most likely accept the PUT and ignore
    # it - a stage that reports success and changes nothing.
    - name: Require every declared property to exist on the fabric object
      ansible.builtin.assert:
        that:
          - >-
            dc_advanced_nd_fabric_settings.keys() | list
            | difference(dc_nd_fabric_object.keys() | list) | length == 0
        fail_msg: >-
          dc_advanced_nd_fabric_settings names
          {{ dc_advanced_nd_fabric_settings.keys() | list
             | difference(dc_nd_fabric_object.keys() | list) | join(', ') }},
          which the Nexus Dashboard fabric object does not have. Check the
          spelling in inventory/group_vars/all/dc_advanced_settings.yml
          against GET {{ nd_fabric_path }} - these names are camelCase
          properties of that object, not fabric nvPairs.

    - name: Compare the declared properties against the controller
      ansible.builtin.set_fact:
        dc_nd_fabric_observed: >-
          {{ dict(dc_advanced_nd_fabric_settings.keys() | list
                  | zip(dc_advanced_nd_fabric_settings.keys() | list
                        | map('extract', dc_nd_fabric_object) | list)) }}

    # changed_when is explicit because dcnm_rest always reports changed
    # false, whatever it did.
    - name: Apply the license tier and the telemetry setting
      cisco.dcnm.dcnm_rest:
        method: PUT
        path: "{{ nd_fabric_path }}"
        data: >-
          {{ dc_nd_fabric_object
             | combine(dc_advanced_nd_fabric_settings) | to_json }}
      when: dc_nd_fabric_observed != dc_advanced_nd_fabric_settings
      changed_when: true

    - name: Report what changed on the fabric object
      ansible.builtin.debug:
        msg: >-
          Nexus Dashboard fabric object:
          {{ 'applied ' + (dc_advanced_nd_fabric_settings | to_json)
             + ', was ' + (dc_nd_fabric_observed | to_json)
             if dc_nd_fabric_observed != dc_advanced_nd_fabric_settings
             else 'already matched the declared intent, nothing sent' }}.
