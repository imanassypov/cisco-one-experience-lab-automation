---
# Overlay VRFs. Guide section 6, "Create VRF".
#
# These are the data center half of PseudoCo's MAIN / PROD / IOT segmentation,
# matching the campus and SD-WAN VRFs of the same names.
#
# vlan_id is pinned on every VRF, taken in declaration order from the fabric's
# L3 VLAN range 2000-2299 (layer3_vlan_range in the collection's validate
# defaults, which this model does not override). Leaving it out asks Nexus
# Dashboard to allocate, which works for the guide because the GUI proposes one
# VLAN per VRF and saves in between. It does not work for a batched run: the
# resource-manager lookup returns the next free VLAN without reserving it, so
# every VRF in the run is handed 2000, the first attachment wins and the rest
# fail with "Entered VRF VLAN id 2000 is already in use".
vxlan:
  overlay:
    vrfs:
      - name: MAIN
        vrf_id: 50000
        vlan_id: 2000
        vrf_vlan_name: MAIN
        vrf_intf_desc: MAIN
        vrf_description: MAIN
        vrf_attach_group: dc_leaves

      - name: PROD
        vrf_id: 50001
        vlan_id: 2001
        vrf_vlan_name: PROD
        vrf_intf_desc: PROD
        vrf_description: PROD
        vrf_attach_group: dc_leaves

      - name: IOT
        vrf_id: 50002
        vlan_id: 2002
        vrf_vlan_name: IOT
        vrf_intf_desc: IOT
        vrf_description: IOT
        vrf_attach_group: dc_leaves

    vrf_attach_groups:
      # Every switch that carries these three VRFs, the border leaf included.
      #
      # DC-Service-Leaf WAS deliberately omitted here until 2026-09-27, on the
      # reasoning that an entry in this group can name a switch but never the
      # EXTEND: VRF_LITE extension that goes with it, so attaching the border
      # leaf from the model would give it the VRFs without the extension. That
      # reasoning was wrong about the sequence. The manual guide's own section
      # 8 walks through two separate Detach/Attach sliders per VRF: the first
      # attaches the VRF to DC-Service-Leaf, and only then does the second,
      # inside Edit Extension Details, enable the external L3 extension. The
      # plain attachment is the first half of the job, not a broken version of
      # it, and it is squarely inside what this model can express. So the
      # model owns it, and 05_vrf_lite.yml adds the extension on top.
      #
      # WHAT THIS DOES NOT REMOVE. The create role runs dcnm_vrf with
      # state: replaced, and a replaced want that carries no vrf_lite block
      # against a have that has one takes the branch at dcnm_vrf.py lines
      # 1543-1549 - `if replace: found = False` - and pushes the change, which
      # strips the extension. Under merged the same comparison returns
      # found = True and leaves it alone (line 1551). So stage 05 still has to
      # run after stage 02 on every pass. What changed is the scope: stage 02
      # now maintains the ATTACHMENT and only resets the EXTENSION, where
      # before it removed both. 01_dc_deploy.yml already imports them in that
      # order, and 07_verify_fabric.yml fails the run if the extension is
      # missing, so a create-without-05 run is caught rather than discovered
      # later as broken external connectivity.
      - name: dc_leaves
        switches:
          - hostname: DC-Leaf1
          - hostname: DC-Leaf2
          # Border leaf. Carries the same three VRFs as the server leaves,
          # plus the VRF-Lite extensions that 05_vrf_lite.yml adds.
          - hostname: DC-Service-Leaf
