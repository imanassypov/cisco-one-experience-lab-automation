---
# Overlay VRFs. Guide section 6, "Create VRF".
#
# These are the data center half of PseudoCo's MAIN / PROD / IOT segmentation,
# matching the campus and SD-WAN VRFs of the same names.
#
# vlan_id is pinned on every VRF, taken in declaration order from the fabric's
# L3 VLAN range 2000-2299 (layer3_vlan_range in the collection's validate
# defaults, which this model does not override). Leaving it out asks Nexus
# Dashboard to allocate, which works for the guide because the GUI proposes one
# VLAN per VRF and saves in between. It does not work for a batched run: the
# resource-manager lookup returns the next free VLAN without reserving it, so
# every VRF in the run is handed 2000, the first attachment wins and the rest
# fail with "Entered VRF VLAN id 2000 is already in use".
vxlan:
  overlay:
    vrfs:
      - name: MAIN
        vrf_id: 50000
        vlan_id: 2000
        vrf_vlan_name: MAIN
        vrf_intf_desc: MAIN
        vrf_description: MAIN
        vrf_attach_group: dc_leaves

      - name: PROD
        vrf_id: 50001
        vlan_id: 2001
        vrf_vlan_name: PROD
        vrf_intf_desc: PROD
        vrf_description: PROD
        vrf_attach_group: dc_leaves

      - name: IOT
        vrf_id: 50002
        vlan_id: 2002
        vrf_vlan_name: IOT
        vrf_intf_desc: IOT
        vrf_description: IOT
        vrf_attach_group: dc_leaves

    vrf_attach_groups:
      # Only the two server-facing leaves. DC-Service-Leaf is intentionally
      # absent: the guide attaches the VRFs to it as part of the VRF-Lite
      # step, which this model cannot express — an attachment here can name a
      # switch but never the EXTEND: VRF_LITE extension, the sub-interface or
      # the dot1q tag that go with it. Attaching it here anyway would give the
      # border leaf the VRFs without the extension.
      #
      # Note for whoever automates VRF-Lite: the create role runs dcnm_vrf
      # with state: replaced, so it will strip any attachment not listed here.
      # A VRF-Lite stage has to run after create on every pass, not once.
      - name: dc_leaves
        switches:
          - hostname: DC-Leaf1
          - hostname: DC-Leaf2
