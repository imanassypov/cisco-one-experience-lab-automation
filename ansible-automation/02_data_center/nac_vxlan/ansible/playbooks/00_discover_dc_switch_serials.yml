---
# Stage 00 - read each switch's serial number over SSH and write the switch
# half of the data model from it.
#
# cisco.nac_dc_vxlan identifies a switch by serial_number, not by hostname or
# management address, and its validate role fails the run if a switch in the
# model has no serial. Serials are one pod's hardware, so they are not tracked
# in git. This stage reads them and generates
# playbooks/host_vars/<fabric>/topology_switches.nac.yaml.
#
# That generated file is gitignored build output: every run overwrites it with
# no backup, so edits to it are lost. To change what it contains, edit one of
# its two sources and run this stage again - topology_switches.nac.yaml.example
# for the fabric's shape, or inventory/group_vars/all/dc_switches.yml for the
# switch table.
#
# This is the only stage that talks to the switches rather than to Nexus
# Dashboard, so it is the only one that needs the client VPN and SSH
# reachability to 198.18.128.x. It is read-only on the switches: nxos_facts
# issues show commands, and the generated file is the only thing written. It
# does not need the fabric to exist, which is why it runs ahead of stage 02.
#
# Run from the collection root, the directory holding ansible.cfg:
#
#   cd ansible-automation/02_data_center/nac_vxlan/ansible
#   ansible-playbook playbooks/00_discover_dc_switch_serials.yml
#
# Background: "Why serial discovery is a separate stage" in the README.

- name: Stage 00a - build the switch group from the declared table
  hosts: localhost
  gather_facts: false
  connection: local
  any_errors_fatal: true

  tasks:
    - name: Assert the declared switch table is usable
      ansible.builtin.assert:
        that:
          - dc_switches is defined
          - dc_switches | length > 0
          - dc_switches | selectattr('name', 'undefined') | list | length == 0
          - dc_switches | selectattr('management_ipv4_address', 'undefined') | list | length == 0
          - dc_switches | selectattr('role', 'undefined') | list | length == 0
        fail_msg: >-
          inventory/group_vars/all/dc_switches.yml must declare a non-empty
          dc_switches list where every entry has a name,
          management_ipv4_address and role.

    # add_host creates inventory hosts while the play is running, and loop
    # repeats the task once per row of the switch table. Building the group
    # here rather than listing the switches in static_inventory.yml keeps
    # dc_switches.yml the only place their names and addresses are written.
    # The group is declared empty in static_inventory.yml so that
    # inventory/group_vars/dc_fabric_switches/ still binds to these hosts.
    - name: Add each declared switch to the SSH group
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: dc_fabric_switches
        ansible_host: "{{ item.management_ipv4_address }}"
        dc_switch_role: "{{ item.role }}"
      loop: "{{ dc_switches }}"
      loop_control:
        label: "{{ item.name }} ({{ item.management_ipv4_address }})"
      changed_when: false

- name: Stage 00b - read the serial number off each switch
  hosts: dc_fabric_switches
  gather_facts: false
  # Keep going when one switch is unreachable, so the report can show which.
  ignore_unreachable: true

  tasks:
    # gather_subset: min keeps this to `show version`, and Ansible exposes the
    # serial number it finds there as the fact ansible_net_serialnum. Facts are
    # stored per host, so the next play reads them out of hostvars[<switch>].
    # ignore_errors lets a switch that fails the command be named in the report
    # below instead of stopping the play here.
    - name: Gather minimal facts
      cisco.nxos.nxos_facts:
        gather_subset: min
      register: dc_switch_facts
      ignore_errors: true

- name: Stage 00c - generate the switch data model from the serial numbers
  hosts: localhost
  gather_facts: false
  connection: local
  any_errors_fatal: true

  vars:
    # The validate role resolves the data model as
    # {{ playbook_dir }}/host_vars/{{ inventory_hostname }}, so the generated
    # file has to land beside the playbooks rather than beside the inventory.
    dc_switch_model_dir: "{{ playbook_dir }}/host_vars/{{ dc_fabric_name }}"
    dc_switch_model_example: "{{ dc_switch_model_dir }}/topology_switches.nac.yaml.example"
    dc_switch_model_path: "{{ dc_switch_model_dir }}/topology_switches.nac.yaml"
    # Repo-relative form of the same path, for messages the student will
    # retype or paste. Commands in this collection run from the directory
    # holding ansible.cfg, so that is what the paths in output are relative to.
    dc_switch_model_shown: "playbooks/host_vars/{{ dc_fabric_name }}/topology_switches.nac.yaml"

    dc_serial_rows: >-
      {%- set rows = [] -%}
      {%- for sw in dc_switches -%}
      {{- rows.append('%-18s %-16s %-8s %s' | format(
            sw.name,
            sw.management_ipv4_address,
            sw.role,
            hostvars[sw.name].ansible_net_serialnum | default('UNREACHABLE'))) or '' -}}
      {%- endfor -%}
      {{ rows }}

    dc_discovered_serials: >-
      {{ dc_switches | map(attribute='name')
         | map('extract', hostvars, 'ansible_net_serialnum') | list }}

    # The .example is a tracked input and its own header says so, which would
    # read wrongly at the top of the file this stage generates. So the copy
    # below swaps this block in for the .example's leading comments. Keep the
    # "GENERATED BY" line: the check at the end of the play looks for it to
    # prove the swap happened.
    dc_generated_model_header: |
      ---
      # GENERATED BY 00_discover_dc_switch_serials.yml - do not edit this file.
      #
      # Stage 00 SSHes to every switch in inventory/group_vars/all/dc_switches.yml,
      # reads its serial number, then copies topology_switches.nac.yaml.example
      # over this file and substitutes each switch's serial_number and role.
      # Re-running stage 00 overwrites this file without asking and without
      # keeping a backup, so anything you change here is lost on the next run.
      #
      # To change the model, edit one of its two sources and run stage 00 again:
      # topology_switches.nac.yaml.example for the shape (which switches exist,
      # what port-channels they carry), inventory/group_vars/all/dc_switches.yml
      # for the switch table (names, management addresses, roles).
      #
      #   cd ansible-automation/02_data_center/nac_vxlan/ansible
      #   ansible-playbook playbooks/00_discover_dc_switch_serials.yml
      #
      # This file is gitignored. Serial numbers are the hardware of one dCloud
      # pod, so tracking them would leak pod detail into git and leave every
      # student checkout dirty.

    # Only bound after the model has been written and slurped back.
    dc_generated_model_text: "{{ dc_generated_model_raw.content | b64decode }}"

  tasks:
    - name: Show the serial numbers
      ansible.builtin.debug:
        msg: >-
          {{ ['%-18s %-16s %-8s %s' | format('SWITCH', 'MANAGEMENT IP', 'ROLE', 'SERIAL NUMBER')]
             + dc_serial_rows }}

    # Checked before anything is written, so a switch that did not answer can
    # never leave a placeholder behind in the model. The validate role only
    # checks that serial_number is non-empty, so a placeholder or a wrong
    # serial passes validation and then fails deep inside the create role.
    - name: Require a serial for every declared switch
      ansible.builtin.assert:
        that:
          - dc_serial_rows | select('search', 'UNREACHABLE') | list | length == 0
        fail_msg: >-
          At least one declared switch did not return a serial number - see the
          UNREACHABLE rows above. Nothing has been written. This stage SSHes to
          the switches directly, so check that the VPN is up and that you can
          reach 198.18.128.x, that the management address in dc_switches.yml is
          right, and that the switch credentials in the vault are correct.
        success_msg: >-
          Read a serial number from all {{ dc_switches | length }} declared
          switch(es).

    - name: Copy the tracked shape reference over the generated model
      ansible.builtin.copy:
        src: "{{ dc_switch_model_example }}"
        dest: "{{ dc_switch_model_path }}"
        mode: "0644"

    - name: Swap the .example header for one that describes the generated file
      ansible.builtin.replace:
        path: "{{ dc_switch_model_path }}"
        regexp: '\A---\n(?:#[^\n]*\n)+'
        replace: "{{ dc_generated_model_header }}"

    # The replace module edits the file in place. Its regex is anchored on each
    # switch's `- name:` line rather than on position, so reordering either
    # source cannot put a serial on the wrong switch, and it rewrites only the
    # two values that follow - every comment and port-channel copied from the
    # .example survives. The role is substituted from dc_switches.yml so the
    # generated model cannot drift away from that table.
    #
    # Backreferences are written \g<1> rather than \1 on purpose: a Nexus
    # serial can start with a digit, and \1 followed by a digit would read as
    # a two-digit group number.
    - name: Stamp each switch's discovered serial and declared role
      ansible.builtin.replace:
        path: "{{ dc_switch_model_path }}"
        regexp: >-
          ^([ \t]*- name: {{ item.name | regex_escape }}[ \t]*\n[ \t]*serial_number: )[^\n]*(\n[ \t]*role: )[^\n]*
        replace: '\g<1>{{ hostvars[item.name].ansible_net_serialnum }}\g<2>{{ item.role }}'
      loop: "{{ dc_switches }}"
      loop_control:
        label: "{{ item.name }} -> {{ hostvars[item.name].ansible_net_serialnum }}"

    - name: Read the generated model back
      ansible.builtin.slurp:
        src: "{{ dc_switch_model_path }}"
      register: dc_generated_model_raw

    # slurp reads the finished file back so the two checks below judge what was
    # actually written. A regex that matches nothing is not an error to the
    # replace module - it leaves the file alone and reports no change - so the
    # file itself is the only trustworthy evidence.
    - name: Check no placeholder survived and every serial landed
      ansible.builtin.assert:
        that:
          - "'REPLACE_ME' not in dc_generated_model_text"
          - "'# GENERATED BY 00_discover_dc_switch_serials.yml' in dc_generated_model_text"
          - dc_discovered_serials | reject('in', dc_generated_model_text) | list | length == 0
        fail_msg: >-
          {{ dc_switch_model_shown }} was written but is not complete. Either a
          placeholder is still in it, or a serial this stage read never reached
          it, or the generated header is missing. The usual cause is a switch
          name in inventory/group_vars/all/dc_switches.yml that does not match
          the name in topology_switches.nac.yaml.example - the substitution
          anchors on that name, so a mismatch matches nothing at all. Do not
          run stage 02 against this file.

    - name: Check each switch carries its own serial and its declared role
      ansible.builtin.assert:
        that:
          - (dc_generated_model_text | from_yaml).vxlan.topology.switches
            | selectattr('name', 'eq', item.name)
            | selectattr('serial_number', 'eq', hostvars[item.name].ansible_net_serialnum)
            | selectattr('role', 'eq', item.role)
            | list | length == 1
        fail_msg: >-
          {{ dc_switch_model_shown }} does not hold exactly one {{ item.name }}
          entry carrying serial {{ hostvars[item.name].ansible_net_serialnum }}
          and role {{ item.role }}. Check that
          topology_switches.nac.yaml.example declares that switch once and only
          once.
      loop: "{{ dc_switches }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Say what was written
      ansible.builtin.debug:
        msg:
          - "Wrote {{ dc_switch_model_shown }}"
          - "with a serial number for all {{ dc_switches | length }} declared switch(es)."
          - ""
          - "That file is build output. Stage 00 overwrites it on every run, so"
          - "edit topology_switches.nac.yaml.example or dc_switches.yml instead."
          - "It is gitignored, because the serials belong to this pod alone."
          - ""
          - "Next:"
          - "  cd ansible-automation/02_data_center/nac_vxlan/ansible"
          - "  ansible-playbook playbooks/01_dc_deploy.yml"
