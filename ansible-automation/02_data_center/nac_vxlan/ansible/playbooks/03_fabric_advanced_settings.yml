---
# Stage 03 - apply the fabric settings Nexus as Code cannot express.
#
# These are the guide's Resources-tab settings, which cisco.nac_dc_vxlan 0.9.0
# has no data model key for, so stage 02 leaves them at their Nexus Dashboard
# defaults. That matters: at the default, VRF Lite Deployment stays Manual, the
# controller never auto-creates a VRF-Lite inter-fabric link, and external
# connectivity cannot be built at all.
#
# The declared values live in
# inventory/group_vars/all/dc_advanced_settings.yml. This playbook holds none
# of its own, so change the fabric by editing that file.
#
# The stage runs between create and deploy on purpose. These are fabric
# parameters rather than switch configuration: they change what the controller
# will generate, so they must be in place before stage 06 generates it. Nothing
# here touches a switch, DEPLOY is false throughout, and a second run is a
# no-op because both halves compare before they write.
#
# Run from the collection root, the directory holding ansible.cfg:
#
#   cd ansible-automation/02_data_center/nac_vxlan/ansible
#   ansible-playbook playbooks/03_fabric_advanced_settings.yml
#
# Background: "Settings Nexus as Code cannot express" in the README.

- name: Stage 03 - apply advanced fabric settings
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    ndfc_api_root: /appcenter/cisco/ndfc/api/v1/lan-fabric
    # The Nexus Dashboard 4.2 fabric object. A different API from the one
    # above, holding a different set of settings - see the two dictionaries in
    # inventory/group_vars/all/dc_advanced_settings.yml.
    nd_fabric_path: "/api/v1/manage/fabrics/{{ inventory_hostname }}"

  pre_tasks:
    # dcnm_fabric makes BGP_AS a mandatory key on a VXLAN_EVPN fabric even when
    # the ASN is not what you are changing. Rather than restate it here, it is
    # read back out of the model stage 02 built the fabric from, so there is
    # only ever one copy. include_vars loads a YAML file into a variable.
    - name: Read the fabric ASN out of the Nexus as Code model
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/global.nac.yaml"
        name: dc_nac_global
      tags: [always]

    # failed_when: false lets the play continue even if the controller answers
    # 4xx, so the next task can treat a missing fabric as a stage run out of
    # order rather than as a broken call.
    - name: Look for the fabric on the controller
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ inventory_hostname }}"
      register: dc_fabric_existing
      changed_when: false
      failed_when: false
      tags: [always]

    # Checked here because dcnm_fabric's own error for a missing fabric is a
    # key lookup deep inside the module, which reads like a bug in this
    # playbook rather than a stage run out of order.
    - name: Refuse to run against a fabric that does not exist
      ansible.builtin.fail:
        msg: >-
          Nexus Dashboard has no fabric named '{{ inventory_hostname }}', so
          there is nothing for this stage to configure. Run
          playbooks/02_create_dc_fabric.yml first - it is what creates the
          fabric. If stage 02 has already run, check that the fabric name in
          host_vars/{{ inventory_hostname }}/global.nac.yaml still matches the
          inventory host name.
      when: >-
        ((dc_fabric_existing.response | default({})).RETURN_CODE
           | default(0) | int) != 200
      tags: [always]

    - name: Require something to apply
      ansible.builtin.assert:
        that:
          - dc_advanced_fabric_settings is defined
          - dc_advanced_fabric_settings | length > 0
          - dc_advanced_nd_fabric_settings is defined
          - dc_advanced_nd_fabric_settings | length > 0
        fail_msg: >-
          dc_advanced_fabric_settings or dc_advanced_nd_fabric_settings is
          empty or undefined. Both should be declared in
          inventory/group_vars/all/dc_advanced_settings.yml. An empty
          dictionary here would make this stage report success while changing
          nothing.
      tags: [always]

  tasks:
    # These five settings are fabric nvPairs, the same store Nexus as Code
    # writes the rest of the fabric into.
    #
    # state: merged is non-destructive here. Nexus Dashboard 4.x rejects a
    # partial fabric update, so the module rebuilds the whole payload from the
    # controller's own nvPairs before overlaying the declared changes, and
    # everything stage 02 wrote is carried through untouched. A key the fabric
    # template does not have fails the task with "Key <name> not found in
    # fabric configuration" rather than being silently dropped.
    - name: Apply the Easy_Fabric parameters
      cisco.dcnm.dcnm_fabric:
        state: merged
        config:
          - "{{ {'FABRIC_NAME': inventory_hostname,
                 'FABRIC_TYPE': 'VXLAN_EVPN',
                 'BGP_AS': dc_nac_global.vxlan.global.ibgp.bgp_asn,
                 'DEPLOY': false}
                | combine(dc_advanced_fabric_settings) }}"
      register: dc_advanced_fabric_result

    - name: Report what changed in the Easy_Fabric parameters
      ansible.builtin.debug:
        msg: >-
          Easy_Fabric parameters:
          {{ 'updated ' + (dc_advanced_fabric_settings | length | string)
             + ' declared setting(s)'
             if dc_advanced_fabric_result.changed
             else 'already matched the declared intent, nothing sent' }}.

    # The license tier, the telemetry toggle and the location are not nvPairs
    # at all, so dcnm_fabric cannot reach them. They are properties of the
    # Nexus Dashboard fabric object, which has no partial update - a PUT
    # replaces the whole object - so the three tasks below are a
    # read-modify-write of it.
    #
    # This GET has to run after the dcnm_fabric task above. The fabric object
    # carries a camelCase mirror of the nvPairs, so a copy read before
    # dcnm_fabric ran would put the old VRF-Lite values straight back when it
    # is PUT.
    - name: Read the Nexus Dashboard fabric object
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ nd_fabric_path }}"
      register: dc_nd_fabric_read
      changed_when: false

    - name: Keep the fabric object and the declared slice of it side by side
      ansible.builtin.set_fact:
        dc_nd_fabric_object: >-
          {{ (dc_nd_fabric_read.response | default({})).DATA | default({}) }}

    # The same failure dcnm_fabric gives for an unknown nvPair, made by hand on
    # this side. Without it a mistyped property name would simply be added to
    # the object by combine below, and Nexus Dashboard would accept the PUT and
    # ignore it, leaving a stage that reports success and changed nothing.
    - name: Require every declared property to exist on the fabric object
      ansible.builtin.assert:
        that:
          - >-
            dc_advanced_nd_fabric_settings.keys() | list
            | difference(dc_nd_fabric_object.keys() | list) | length == 0
        fail_msg: >-
          dc_advanced_nd_fabric_settings names
          {{ dc_advanced_nd_fabric_settings.keys() | list
             | difference(dc_nd_fabric_object.keys() | list) | join(', ') }},
          which the Nexus Dashboard fabric object does not have. Check the
          spelling in inventory/group_vars/all/dc_advanced_settings.yml
          against GET {{ nd_fabric_path }} - these names are camelCase
          properties of that object, not fabric nvPairs.

    - name: Compare the declared properties against the controller
      ansible.builtin.set_fact:
        dc_nd_fabric_observed: >-
          {{ dict(dc_advanced_nd_fabric_settings.keys() | list
                  | zip(dc_advanced_nd_fabric_settings.keys() | list
                        | map('extract', dc_nd_fabric_object) | list)) }}

    # when: skips the PUT entirely if the controller already holds the declared
    # values. changed_when is set by hand because dcnm_rest always reports
    # changed false, whatever it did.
    - name: Apply the license tier and the telemetry setting
      cisco.dcnm.dcnm_rest:
        method: PUT
        path: "{{ nd_fabric_path }}"
        data: >-
          {{ dc_nd_fabric_object
             | combine(dc_advanced_nd_fabric_settings) | to_json }}
      when: dc_nd_fabric_observed != dc_advanced_nd_fabric_settings
      changed_when: true

    - name: Report what changed on the fabric object
      ansible.builtin.debug:
        msg: >-
          Nexus Dashboard fabric object:
          {{ 'applied ' + (dc_advanced_nd_fabric_settings | to_json)
             + ', was ' + (dc_nd_fabric_observed | to_json)
             if dc_nd_fabric_observed != dc_advanced_nd_fabric_settings
             else 'already matched the declared intent, nothing sent' }}.
