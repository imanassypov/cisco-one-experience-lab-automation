---
# Read-only diagnostic for the stage 05 failure:
#
#   DcnmVrf.update_vrf_attach_vrf_lite_extensions: caller: push_diff_attach.
#   No VRF LITE capable interfaces found on this switch.
#   ip: 198.18.128.13, serial_number: 955T6I5X2D4
#
# Not part of the pipeline, and unnumbered so it cannot be mistaken for a build
# stage. Every call is a GET: nothing is created, modified, deployed or saved,
# so it is safe to run at any point and safe to re-run.
#
#   cd ansible-automation/02_data_center/nac_vxlan/ansible
#   ansible-playbook playbooks/diagnose_vrf_lite.yml 2>&1 | tee /tmp/vrf-lite-diag.txt
#
# Send back the whole file. The decisive output is section 1.
#
# What is being measured. dcnm_vrf raises that error when the controller offers
# the border leaf no extension prototype whose extensionType is VRF_LITE. It
# reads that list from
#
#   GET /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/top-down/fabrics/
#         <fabric>/vrfs/switches?vrf-names=<vrf>&serial-numbers=<serial>
#
# as switchDetailsList[0].extensionPrototypeValues, and extensionType is the
# only filter it applies - no interface name, no link state, no Back2Back
# versus ToExternal distinction. Section 1 makes that exact call.
#
# The prototype list is derived from the VRF-Lite inter-fabric connection (IFC)
# on that interface, so the later sections ask whether such a link exists.
# Section 2 prints every link in both fabrics with its templateName, which for a
# VRF-Lite IFC is ext_fabric_setup; a link on any other template is not one,
# however the deployed interface looks. The deployed parent interface settles
# nothing by itself: "no switchport / mtu 9000 / description connected-to-..."
# with no address and no encapsulation fits an IFC and a plain external link
# converted to Layer 3 equally well.
#
# Two things the sections are shaped around:
#
#   - The module indexes switchDetailsList positionally, at [0], while it looks
#     the same response up by serial number elsewhere, and the ip and serial in
#     the error come from the request. So a response holding more than one
#     switch record could name the border leaf while the empty list belonged to
#     another switch. Section 1b prints every serial returned.
#   - Absent and empty are different answers, so every section prints the whole
#     record with debug var: rather than a summary. A probe built on .get() or
#     Jinja default() cannot tell a missing key from a null or empty one. The
#     summary lines point at the interesting part of the dump above them and
#     ask "key present: true/false" where that distinction matters.
#
# Every endpoint below is one a cisco.dcnm module uses, not an invented path.
# There are no credentials in this file: the httpapi connection and the Nexus
# Dashboard account come from inventory/group_vars/nd/connection.yml, which reads
# them out of vault-encrypted Lab Topology/lab_access.yml.
#
# Background: "What stage 05 needs from the controller" in the README, which
# carries the full path through the module and the two explanations that turned
# out to be wrong.

- name: Diagnose the VRF-Lite precondition on the border leaf
  hosts: Pseudoco-DC1
  gather_facts: false
  # any_errors_fatal is off on purpose, and every call below carries
  # failed_when: false. A section that returns 4xx is itself a finding, and the
  # later sections are still worth collecting.
  any_errors_fatal: false

  vars:
    ndfc_api_root: /appcenter/cisco/ndfc/api/v1/lan-fabric
    # Peer fabric name, as spelled in inventory/static_inventory.yml.
    dc_diag_peer_fabric: External
    # Override if the derived lookup in section 0 picks the wrong switch:
    #   -e dc_diag_border_serial=955T6I5X2D4
    dc_diag_border_serial: ""

  tasks:
    - name: Banner
      ansible.builtin.debug:
        msg:
          - "VRF-Lite diagnostic. READ-ONLY: every call below is a GET."
          - "Fabric: {{ dc_fabric_name }}. Peer fabric: {{ dc_diag_peer_fabric }}."
          - "Border leaf: {{ dc_vrf_lite_border_leaf }}. Parent interface: {{ dc_vrf_lite_interface }}."
          - "VRFs: {{ dc_vrf_lite_extensions | map(attribute='vrf') | join(', ') }}"

    # ================================================================ 0
    # The fabric inventory, so every serial used below is read from the
    # controller rather than pasted in.
    - name: "0a - DC fabric inventory, RAW"
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/inventory/switchesByFabric"
      register: dc_diag_inventory
      changed_when: false
      failed_when: false

    - name: "0a - DC fabric inventory, RAW - output"
      ansible.builtin.debug:
        var: dc_diag_inventory

    - name: Resolve the border leaf serial from the controller's own inventory
      ansible.builtin.set_fact:
        dc_diag_serial: >-
          {{ dc_diag_border_serial
             if (dc_diag_border_serial | length > 0)
             else ((dc_diag_inventory.response | default({})).DATA | default([])
                   | selectattr('logicalName', 'defined')
                   | selectattr('logicalName', 'equalto', dc_vrf_lite_border_leaf)
                   | map(attribute='serialNumber') | list | first | default('')) }}
        dc_diag_all_serials: >-
          {{ ((dc_diag_inventory.response | default({})).DATA | default([])
              | selectattr('serialNumber', 'defined')
              | map(attribute='serialNumber') | list) }}

    - name: "0b - derived serials and switch roles"
      ansible.builtin.debug:
        msg: >-
          {% set inv = (dc_diag_inventory.response | default({})).DATA | default([]) %}
          BORDER SERIAL USED BELOW: '{{ dc_diag_serial }}'
          {% if dc_diag_serial | length == 0 %}
          *** EMPTY. Re-run with -e dc_diag_border_serial=955T6I5X2D4 and send section 0a. ***
          {% endif %}
          ALL SERIALS: {{ dc_diag_all_serials | join(',') }}
          {% for s in inv %}
          {{ s.get('logicalName', '?') }} | {{ s.get('ipAddress', '?') }} | {{ s.get('serialNumber', '?') }} | role={{ s.get('switchRole', '?') }} | roleEnum={{ s.get('switchRoleEnum', '?') }} | cc={{ s.get('ccStatus', '?') }} | managable={{ s.get('managable', '?') }} | {{ s.get('model', '?') }}
          {% endfor %}

    # The role printed above should read Border. dcnm_vrf checks that itself
    # before it looks for prototypes, and the failing run got past that check,
    # so this is a cross-check rather than a suspect.
    #
    # Next the peer fabric's inventory, for the edge router's serial number that
    # section 2d needs to look up the link by switch pair.
    - name: "0c - peer fabric inventory, RAW"
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_diag_peer_fabric }}/inventory/switchesByFabric"
      register: dc_diag_peer_inventory
      changed_when: false
      failed_when: false

    - name: "0c - peer fabric inventory, RAW - output"
      ansible.builtin.debug:
        var: dc_diag_peer_inventory

    - name: Resolve the edge router serial
      ansible.builtin.set_fact:
        dc_diag_peer_serial: >-
          {{ ((dc_diag_peer_inventory.response | default({})).DATA | default([])
              | selectattr('ipAddress', 'defined')
              | selectattr('ipAddress', 'equalto', dc_external_edge_router.ip)
              | map(attribute='serialNumber') | list | first | default('')) }}

    - name: "0d - edge router serial"
      ansible.builtin.debug:
        msg: "Edge router {{ dc_external_edge_router.ip }} serial: '{{ dc_diag_peer_serial }}'"

    # ================================================================ 1
    # The call the module makes, and the whole question. loop repeats it once
    # per declared extension, and the results land in .results.
    - name: "1a - the module's own query, border serial only, RAW"
      cisco.dcnm.dcnm_rest:
        method: GET
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/switches?vrf-names={{ item.vrf }}&serial-numbers={{ dc_diag_serial }}
      register: dc_diag_vrf_switch
      changed_when: false
      failed_when: false
      loop: "{{ dc_vrf_lite_extensions }}"
      loop_control:
        label: "{{ item.vrf }}"

    - name: "1a - the module's own query, RAW - output (READ THIS ONE)"
      ansible.builtin.debug:
        var: dc_diag_vrf_switch.results

    # The same responses reduced to the facts that decide this, printed in
    # addition to the raw dump above rather than instead of it. Key presence is
    # asked directly, because absent and empty are different answers.
    - name: "1b - what line 5126 would have read, per VRF"
      ansible.builtin.debug:
        msg: >-
          {% set resp = item.response | default({}) %}
          {% set data = resp.DATA | default([]) %}
          {% set rec0 = data[0] if (data | length) > 0 else {} %}
          {% set sdl = rec0.get('switchDetailsList', []) if rec0 is mapping else [] %}
          {% set sw0 = sdl[0] if (sdl | length) > 0 else {} %}
          VRF {{ item.item.vrf }}
          RETURN_CODE: {{ resp.get('RETURN_CODE', 'CALL FAILED - see 1a') }}
          DATA key present: {{ 'DATA' in resp }} / DATA length: {{ data | length }}
          DATA[0] keys: {{ (rec0.keys() | list) if rec0 is mapping else 'no DATA[0]' }}
          switchDetailsList key present at DATA[0]: {{ ('switchDetailsList' in rec0) if rec0 is mapping else 'n/a' }}
          switchDetailsList length: {{ sdl | length }}
          serialNumber of EVERY entry in switchDetailsList: {{ sdl | map(attribute='serialNumber') | list }}
          switchDetailsList[0].serialNumber == border leaf: {{ (sw0.get('serialNumber', 'ABSENT') == dc_diag_serial) if sw0 is mapping else 'n/a' }}
          switchDetailsList[0] keys: {{ (sw0.keys() | list) if sw0 is mapping else 'no switchDetailsList[0]' }}
          extensionPrototypeValues KEY PRESENT: {{ ('extensionPrototypeValues' in sw0) if sw0 is mapping else 'n/a' }}
          extensionPrototypeValues length: {{ (sw0.get('extensionPrototypeValues') or []) | length }}
          extensionType of each prototype: {{ (sw0.get('extensionPrototypeValues') or []) | map(attribute='extensionType') | list }}
          VRF_LITE prototypes (0 here is exactly why the module failed): {{ (sw0.get('extensionPrototypeValues') or []) | selectattr('extensionType', 'defined') | selectattr('extensionType', 'equalto', 'VRF_LITE') | list | length }}
          extensionValues KEY PRESENT: {{ ('extensionValues' in sw0) if sw0 is mapping else 'n/a' }}
          lanAttachState on this record: {{ sw0.get('lanAttachState', 'KEY ABSENT') if sw0 is mapping else 'n/a' }}
      loop: "{{ dc_diag_vrf_switch.results | default([]) }}"
      loop_control:
        label: "{{ item.item.vrf }}"

    # The same endpoint, asked for every serial in the fabric. Two things this
    # settles: whether the serial-numbers filter is honoured at all, and whether
    # any other switch carries a VRF_LITE prototype. If one does, the link and
    # the fabric settings are fine and the question becomes which switch record
    # the module read.
    - name: "1c - the same query for ALL serials in the fabric, RAW"
      cisco.dcnm.dcnm_rest:
        method: GET
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/switches?vrf-names={{ item.vrf }}&serial-numbers={{ dc_diag_all_serials | join(',') }}
      register: dc_diag_vrf_switch_all
      changed_when: false
      failed_when: false
      loop: "{{ dc_vrf_lite_extensions }}"
      loop_control:
        label: "{{ item.vrf }}"

    - name: "1c - the same query for ALL serials, RAW - output"
      ansible.builtin.debug:
        var: dc_diag_vrf_switch_all.results

    - name: "1d - per-switch prototype summary from the all-serials query"
      ansible.builtin.debug:
        msg: >-
          {% set resp = item.response | default({}) %}
          {% set data = resp.DATA | default([]) %}
          {% set rec0 = data[0] if (data | length) > 0 else {} %}
          {% set sdl = rec0.get('switchDetailsList', []) if rec0 is mapping else [] %}
          VRF {{ item.item.vrf }} - switchDetailsList length {{ sdl | length }}
          {% for sw in sdl %}
          {{ sw.get('serialNumber', '?') }} | protoKeyPresent={{ 'extensionPrototypeValues' in sw }} | protoTypes={{ (sw.get('extensionPrototypeValues') or []) | map(attribute='extensionType') | list }} | extValKeyPresent={{ 'extensionValues' in sw }} | lanAttachState={{ sw.get('lanAttachState', 'KEY ABSENT') }}
          {% endfor %}
      loop: "{{ dc_diag_vrf_switch_all.results | default([]) }}"
      loop_control:
        label: "{{ item.item.vrf }}"

    # ================================================================ 2
    # The inter-fabric link, which is where the answer most likely is. A
    # VRF-Lite IFC has templateName ext_fabric_setup; anything else on that
    # interface is a different kind of link.
    - name: "2a - every link in the DC fabric, RAW"
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/links/fabrics/{{ dc_fabric_name }}"
      register: dc_diag_links
      changed_when: false
      failed_when: false

    - name: "2a - every link in the DC fabric, RAW - output"
      ansible.builtin.debug:
        var: dc_diag_links

    - name: "2b - one line per link, with templateName"
      ansible.builtin.debug:
        msg: >-
          {% set links = (dc_diag_links.response | default({})).DATA | default([]) %}
          {{ links | length }} link(s) in {{ dc_fabric_name }}. The VRF-Lite template is ext_fabric_setup.
          {% for l in links %}
          {% set s1 = l.get('sw1-info', {}) %}
          {% set s2 = l.get('sw2-info', {}) %}
          template={{ l.get('templateName', 'KEY ABSENT') }} | {{ s1.get('sw-sys-name', '?') }}[{{ s1.get('sw-serial-number', '?') }}] {{ s1.get('if-name', '?') }} ({{ s1.get('fabric-name', '?') }}) -> {{ s2.get('sw-sys-name', '?') }}[{{ s2.get('sw-serial-number', '?') }}] {{ s2.get('if-name', '?') }} ({{ s2.get('fabric-name', '?') }})
          {% endfor %}

    - name: "2c - the parent interface's link, does it exist and what template"
      ansible.builtin.debug:
        msg: >-
          {% set links = (dc_diag_links.response | default({})).DATA | default([]) %}
          {% set ns = namespace(found=[]) %}
          {% for l in links %}
          {% if l.get('sw1-info', {}).get('sw-serial-number') == dc_diag_serial and l.get('sw1-info', {}).get('if-name') == dc_vrf_lite_interface %}
          {% set ns.found = ns.found + [l] %}
          {% endif %}
          {% if l.get('sw2-info', {}).get('sw-serial-number') == dc_diag_serial and l.get('sw2-info', {}).get('if-name') == dc_vrf_lite_interface %}
          {% set ns.found = ns.found + [l] %}
          {% endif %}
          {% endfor %}
          Links on {{ dc_vrf_lite_border_leaf }} {{ dc_vrf_lite_interface }}: {{ ns.found | length }}
          {% for l in ns.found %}
          templateName={{ l.get('templateName', 'KEY ABSENT') }} is ext_fabric_setup: {{ l.get('templateName') == 'ext_fabric_setup' }}
          FULL RECORD: {{ l | to_json }}
          {% endfor %}
          {% if ns.found | length == 0 %}
          NO LINK RECORD on that interface. That alone explains the failure.
          {% endif %}

    # The narrowest possible read of the one link stage 05 depends on: both ends
    # named by serial number and interface. Skipped when the edge router's
    # serial could not be resolved above.
    - name: "2d - the border-leaf-to-edge-router link by switch pair, RAW"
      cisco.dcnm.dcnm_rest:
        method: GET
        path: >-
          {{ ndfc_api_root }}/rest/control/links?switch1Sn={{ dc_diag_serial }}&switch2Sn={{ dc_diag_peer_serial }}&switch1IfName={{ dc_vrf_lite_interface }}&switch2IfName={{ dc_vrf_lite_peer_interface }}
      register: dc_diag_link_pair
      changed_when: false
      failed_when: false
      when: dc_diag_peer_serial | length > 0

    - name: "2d - the link by switch pair, RAW - output"
      ansible.builtin.debug:
        var: dc_diag_link_pair

    # ================================================================ 3
    # The parent interface and the policy attached to it, which shows what
    # produced the deployed "no switchport / mtu 9000 / description
    # connected-to-..." block.
    - name: "3a - the parent interface record and its policy, RAW"
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/interface?serialNumber={{ dc_diag_serial }}&ifName={{ dc_vrf_lite_interface }}"
      register: dc_diag_interface
      changed_when: false
      failed_when: false

    - name: "3a - the parent interface record, RAW - output"
      ansible.builtin.debug:
        var: dc_diag_interface

    # ================================================================ 4
    # Attachment state. The data model owns the border leaf's plain attachment -
    # DC-Service-Leaf is in vrf_attach_groups in
    # playbooks/host_vars/Pseudoco-DC1/vrfs.nac.yaml - so after a stage 02 run it
    # should appear in lanAttachList for all three VRFs.
    #
    # A missing attachment is not the cause of the stage 05 error: the module can
    # add an extension to a switch that has none. But if the border leaf is
    # absent here after a stage 02 run, the model change did not land, and
    # lanAttachState is worth having either way.
    - name: "4a - VRF attachments for the three VRFs, RAW"
      cisco.dcnm.dcnm_rest:
        method: GET
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/attachments?vrf-names={{ dc_vrf_lite_extensions | map(attribute='vrf') | join(',') }}
      register: dc_diag_attachments
      changed_when: false
      failed_when: false

    - name: "4a - VRF attachments, RAW - output"
      ansible.builtin.debug:
        var: dc_diag_attachments

    - name: "4b - is the border leaf attached, and in what state"
      ansible.builtin.debug:
        msg: >-
          {% for v in (dc_diag_attachments.response | default({})).DATA | default([]) %}
          VRF {{ v.get('vrfName', '?') }}
          {% for a in v.get('lanAttachList') or [] %}
          {{ a.get('switchName', '?') }}[{{ a.get('switchSerialNo', '?') }}] role={{ a.get('switchRole', '?') }} lanAttachState={{ a.get('lanAttachState', 'KEY ABSENT') }} isLanAttached={{ a.get('isLanAttached', 'KEY ABSENT') }} vlan={{ a.get('vlanId', '?') }} extensionValuesKeyPresent={{ 'extensionValues' in a }} extensionValues={{ a.get('extensionValues', 'KEY ABSENT') }}
          {% endfor %}
          {% endfor %}

    # ================================================================ 5
    # Monitor Mode as the API reports it, for both fabrics. cisco.dcnm reads this
    # same endpoint and treats readonly true as "no changes allowed on this
    # fabric". Expect false for the DC fabric and true for the External one.
    - name: "5a - access mode of both fabrics, RAW"
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ item }}/accessmode"
      register: dc_diag_accessmode
      changed_when: false
      failed_when: false
      loop:
        - "{{ dc_fabric_name }}"
        - "{{ dc_diag_peer_fabric }}"

    - name: "5a - access mode, RAW - output"
      ansible.builtin.debug:
        var: dc_diag_accessmode.results

    # ================================================================ 6
    # No verdict is asserted, and that is the point: this playbook collects
    # evidence rather than deciding what it means. The reading order below is
    # what turns the raw dumps into an answer.
    - name: How to read this
      ansible.builtin.debug:
        msg:
          - "Send back the WHOLE output, not a summary. The decisive part is 1a/1b."
          - ""
          - "Read 1b first, in this order:"
          - "  1. 'serialNumber of EVERY entry in switchDetailsList'."
          - "     Empty       -> the controller reports no switch record here."
          - "     Not {{ dc_diag_serial }} -> line 5126's positional [0] read the"
          - "                    wrong switch and the error was misattributed."
          - "  2. 'extensionPrototypeValues KEY PRESENT' and its length."
          - "     Key absent     -> the field the module reads does not exist on"
          - "                       this controller's response at all, which would"
          - "                       be an API-shape mismatch on ND 4.2.1.10."
          - "     Present, len 0 -> the controller offers this switch no extension"
          - "                       prototypes. Go to section 2."
          - "  3. 'extensionType of each prototype'. A non-empty list without"
          - "     VRF_LITE in it means some other extension type is offered, and"
          - "     the name of that type is the finding."
          - "  4. Compare with 1d. If another switch carries a VRF_LITE"
          - "     prototype, the fabric settings are fine."
          - ""
          - "Then 2b/2c. If there is no link record on {{ dc_vrf_lite_interface }}, or the"
          - "templateName is anything other than ext_fabric_setup, that is the"
          - "cause: the interface is not part of a VRF-Lite IFC, so no prototype"
          - "is offered, so the module cannot attach an extension - and no"
          - "amount of recalculating, deploying or retrying will change it."
          - ""
          - "Then 5a. readonly should be false for {{ dc_fabric_name }} and true for"
          - "{{ dc_diag_peer_fabric }}. If 2c shows no ext_fabric_setup link, the next"
          - "question is whether Monitor Mode on {{ dc_diag_peer_fabric }} is why the"
          - "controller never auto-created one - Cisco documents that auto IFC"
          - "is supported on Nexus devices only and that a non-Nexus peer needs"
          - "the IFC created manually, and this peer is an IOS-XE Catalyst 8000V."
