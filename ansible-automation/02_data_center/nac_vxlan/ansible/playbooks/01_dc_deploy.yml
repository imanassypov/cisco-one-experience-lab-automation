---
# Build the PseudoCo data center fabric end to end.
#
#   cd ansible-automation/02_data_center/nac_vxlan/ansible
#   ansible-playbook playbooks/01_dc_deploy.yml
#
# Stages, in apply order:
#   02  create the whole intent: the fabric, the switches, their roles, the
#       vPC pair, the port-channels, the VRFs, the networks and their
#       attachments
#   03  apply the fabric settings Nexus as Code cannot express - the VRF-Lite
#       resources, the license tier, the telemetry toggle and the location
#   04  create the External connectivity fabric and put it in Monitor Mode
#   05  attach the VRF-Lite extensions on the border leaf, still as intent
#   06  recalculate and deploy: push that intent to the switches
#   07  verify the result against intent over the Nexus Dashboard API
#
# The numbering carries meaning: 02 through 07 are contiguous because they are
# exactly the stages this orchestrator imports. Everything outside that range -
# the 00 prerequisite described below, and 08 - is something you run by hand.
# So the number on a playbook already tells you whether a plain run of this
# file will touch it.
#
# Stages 03 and 04 both sit ahead of the deploy, for the same reason. Stage 03
# changes fabric parameters, which are inputs to the configuration the
# controller generates. Stage 04 creates the fabric on the far side of the
# VRF-Lite handoff, which is what lets the controller resolve that handoff at
# all. Run either one after stage 05 and the controller would be right while
# the switches were a deploy behind.
#
# BEFORE THE FIRST RUN, get the serial numbers into the data model. This
# orchestrator will not do it for you and stage 02 stops until you have:
#
#   ansible-playbook playbooks/00_discover_dc_switch_serials.yml
#
# That stage reads a serial off each switch and generates
# host_vars/Pseudoco-DC1/topology_switches.nac.yaml from the tracked .example
# beside it. It is not imported here because it SSHes to the switches rather
# than driving Nexus Dashboard, so it is the one stage that needs the switch
# path up, and because it only needs running again when the pod hardware or
# the switch table changes.
#
# Two playbooks are deliberately absent:
#   00_discover_dc_switch_serials.yml  prerequisite, see above
#   08_remove.yml           destructive prune, run by hand with a confirm flag
#
# Five things worth knowing before a plain run:
#   - This is a greenfield build and there is no confirmation prompt. Stage 02
#     imports the five switches with preserveConfig false - hardcoded in
#     cisco.nac_dc_vxlan's inventory template, not something the data model or
#     a flag can change - so each switch has its running configuration erased
#     as it joins the fabric. Point this at a pod you are willing to lose.
#   - Stage 04 targets a different inventory host, External, and reads its
#     settings from inventory/group_vars/all/dc_external_settings.yml rather
#     than from a Nexus as Code model. It creates the External fabric in
#     Monitor Mode and adds the IOS-XE edge router to it over REST, so that
#     router must be reachable and have a vault entry.
#   - Stage 05 can sit and wait for up to two minutes. Nexus Dashboard
#     correlates the CDP adjacency between the border leaf and the edge
#     router asynchronously after stage 04 adds the router, and a VRF-Lite
#     extension cannot be attached until it has. The stage retries rather
#     than failing, so a pause with no output there is normal.
#   - Stage 06 changes running configuration and takes several minutes.
#   - Stage 07 fails the run on any mismatch. Use
#     -e dc_verify_fail_on_mismatch=false to get the report without the
#     failure.

# Intent is built by 02 to 05 and changes nothing on a switch. 06 is the only
# stage that writes running configuration, so the VRF-Lite extensions are
# staged before it and the whole external handoff lands in one deploy.
- import_playbook: 02_create_dc_fabric.yml
- import_playbook: 03_fabric_advanced_settings.yml
- import_playbook: 04_external_fabric.yml
- import_playbook: 05_vrf_lite.yml
- import_playbook: 06_recalculate_and_deploy.yml
- import_playbook: 07_verify_fabric.yml
