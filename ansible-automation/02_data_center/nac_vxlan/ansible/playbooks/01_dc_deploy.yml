---
# Build the PseudoCo data center fabric end to end.
#
#   cd ansible-automation/02_data_center/nac_vxlan/ansible
#   ansible-playbook playbooks/01_dc_deploy.yml
#
# Stages, in apply order:
#   02  create the whole intent: the fabric, the switches, their roles, the
#       vPC pair, the port-channels, the VRFs, the networks and their
#       attachments
#   03  deploy that intent to the switches
#   04  verify the result against intent over the Nexus Dashboard API
#
# The numbering carries meaning: 02 through 04 are contiguous because they are
# exactly the stages this orchestrator imports. Everything outside that range —
# the 00 prerequisite described below, and 05 and 06 — is something you run by
# hand. So the number on a playbook already tells you whether a plain run of
# this file will touch it.
#
# BEFORE THE FIRST RUN, get the serial numbers into the data model. This
# orchestrator will not do it for you and stage 02 stops until you have:
#
#   ansible-playbook playbooks/00_discover_dc_switch_serials.yml
#
# That stage reads a serial off each switch and generates
# host_vars/Pseudoco-DC1/topology_switches.nac.yaml from the tracked .example
# beside it. It is not imported here because it SSHes to the switches rather
# than driving Nexus Dashboard, so it is the one stage that needs the switch
# path up, and because it only needs running again when the pod hardware or
# the switch table changes.
#
# Three other playbooks are deliberately absent:
#   00_discover_dc_switch_serials.yml  prerequisite, see above
#   05_remove.yml           destructive prune, run by hand with a confirm flag
#   06_external_fabric.yml  different inventory host, and in this lab the
#                           External fabric is a manual prerequisite
#
# Three things worth knowing before a plain run:
#   - This is a greenfield build and there is no confirmation prompt. Stage 02
#     imports the five switches with preserveConfig false — hardcoded in
#     cisco.nac_dc_vxlan's inventory template, not something the data model or
#     a flag can change — so each switch has its running configuration erased
#     as it joins the fabric. Point this at a pod you are willing to lose.
#   - Stage 03 changes running configuration and takes several minutes.
#   - Stage 04 fails the run on any mismatch. Use
#     -e dc_verify_fail_on_mismatch=false to get the report without the
#     failure.

- import_playbook: 02_create.yml
- import_playbook: 03_deploy.yml
- import_playbook: 04_verify_fabric.yml
