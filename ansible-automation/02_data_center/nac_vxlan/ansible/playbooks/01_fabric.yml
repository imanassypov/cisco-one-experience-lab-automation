---
# Stage 01 — make sure the VXLAN EVPN fabric object exists on Nexus Dashboard.
#
# Guide section 4, "Create a VXLAN Fabric".
#
# This stage exists to break a chicken-and-egg problem, not because creating a
# fabric deserves its own playbook. Serial number discovery (stage 02) calls
# .../fabrics/{fabric}/inventory/test-reachability, which is scoped to a
# fabric, so the fabric has to exist before any switch can be discovered — but
# the rest of the data model cannot be created until the serials are known.
#
# On a fresh checkout playbooks/host_vars/Pseudoco-DC1/topology_switches.nac.yaml
# does not exist yet (stage 02 generates it and it is gitignored), so the
# create role has no switches to act on and naturally lands only the fabric.
# On a re-run the file is present and this stage converges the whole model,
# which is harmless because create is idempotent. To force fabric-only
# behaviour regardless:
#
#   ansible-playbook playbooks/01_fabric.yml --tags cr_manage_fabric
#
# Run from the collection root (the directory holding ansible.cfg), not from
# playbooks/ — ansible.cfg's relative paths to the vault and the vars plugin
# are resolved against the working directory.

- name: Stage 01 — ensure the DC VXLAN fabric exists
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  roles:
    - role: cisco.nac_dc_vxlan.validate
    - role: cisco.nac_dc_vxlan.dtc.create
