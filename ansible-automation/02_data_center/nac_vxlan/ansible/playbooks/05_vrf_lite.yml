---
# Stage 05 - extend MAIN, PROD and IOT out of the border leaf with VRF-Lite.
#
# Guide section 8, the three "Edit VRF Attachments in VRF <name>" walkthroughs.
# Each of those has TWO Detach/Attach sliders, and the split matters:
#
#   slider 1  attach the VRF itself to DC-Service-Leaf. As of 2026-09-27 the
#             data model owns this. DC-Service-Leaf is listed in the
#             dc_leaves attach group in
#             playbooks/host_vars/Pseudoco-DC1/vrfs.nac.yaml, so stage 02
#             makes the plain attachment.
#   slider 2  inside Edit Extension Details, enable the external L3 extension
#             with the dot1q tag, the sub-interface prefix and the neighbour
#             address. THIS STAGE IS SLIDER 2, and nothing else.
#
# WHY SLIDER 2 IS NOT IN THE NEXUS AS CODE MODEL. It cannot be. A
# vrf_attach_group entry names a switch and nothing else - the model has no
# key for EXTEND: VRF_LITE, for the sub-interface, for the dot1q tag or for
# the neighbour address. So this stage drops to cisco.dcnm's dcnm_vrf
# directly, which does support attach[].vrf_lite[]. The intent still lives in
# git, in inventory/group_vars/all/dc_vrf_lite.yml.
#
# WHY IT SITS HERE, BETWEEN 04 AND THE DEPLOY. This stage writes intent to
# the controller and changes nothing on a switch, which is what stages 02, 03
# and 04 do. Stage 06 is the one stage that touches running configuration.
# Building the extensions before that deploy means the parent interface, the
# three sub-interfaces and their BGP neighbours all land in a single
# Recalculate and Deploy, rather than the guide's deploy-edit-deploy sequence,
# which is an artefact of driving a UI one dialog at a time. That is also why
# deploy defaults to false below.
#
# That ordering is safe, and it is the module's own integration test that
# says so rather than an assumption. In
# tests/integration/targets/dcnm_vrf/tests/dcnm/standalone/merged.yaml,
# TEST.4 (lines 280-330) deletes every VRF first (TEST.3e, line 269) and then,
# in ONE state: merged call, creates a VRF and attaches it with a vrf_lite
# block to a switch that had no attachment at all - asserting changed == true
# and three HTTP 200s. Inside dcnm_vrf.py, push_to_remote (line 5495) runs
# push_diff_create (5547) before push_diff_attach (5548), so at the instant
# the extension is computed the VRF exists and the attachment does not.
# Neither a pre-existing attachment nor a completed config-deploy is a
# precondition for adding an extension.
#
# WHY state: merged AND NOT replaced. Stage 02 attaches each VRF to DC-Leaf1,
# DC-Leaf2 and now DC-Service-Leaf. This stage names only DC-Service-Leaf, and
# merged leaves attachments it does not mention alone - "Properties that can
# be managed by the module but are not specified in the playbook will be
# deleted or defaulted" is the *replaced* contract, not the merged one. Using
# replaced here would detach the two server leaves. Stage 07 re-checks every
# attachment, so a regression on that point fails the pipeline rather than
# going unnoticed.
#
# WHY THIS STILL RUNS ON EVERY PASS, in a narrower sense than it used to.
# Stage 02's create role runs dcnm_vrf with state: replaced. A replaced want
# that carries no vrf_lite block, compared against a have that has one, takes
# the branch at dcnm_vrf.py lines 1543-1549 (`if replace: found = False`) and
# pushes the change, which strips the extension. Under merged the same
# comparison returns found = True at line 1551 and leaves it alone. So every
# stage 02 run resets the EXTENSION and this stage puts it back. It no longer
# resets the ATTACHMENT, which it did while the model omitted the border leaf.
# This stage is idempotent, so re-running it on an already-extended fabric
# reports changed=false.
#
#
# THE ONE PRECONDITION THAT MATTERS, AND THE TWO THEORIES IT REPLACED
#
# dcnm_vrf will not build an extension unless the controller ALREADY offers
# the border leaf a VRF_LITE extension prototype. push_diff_attach reads
#
#   lite_objects["DATA"][0]["switchDetailsList"][0]["extensionPrototypeValues"]
#
# at dcnm_vrf.py lines 5126-5127, from
#
#   GET /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/top-down/fabrics/
#         <fabric>/vrfs/switches?vrf-names=<vrf>&serial-numbers=<serial>
#
# and fails at line 4721 with "No VRF LITE capable interfaces found on this
# switch" when no element of that list has extensionType == "VRF_LITE"
# (the only filter applied, line 4598). That list is derived from the
# VRF-Lite inter-fabric link (IFC) on the interface, so the IFC has to exist.
#
# Two earlier explanations are now known to be wrong, and are recorded here so
# nobody re-derives them:
#
#   NOT a CDP-correlation race. On 2026-09-27 a full, successful
#   06_recalculate_and_deploy.yml - 5/5 switches deployed including the border
#   leaf, check_sync in_sync=True - was followed immediately by a stage 05 run
#   that failed with the byte-identical error. The retry loop this stage used
#   to carry was waiting on a precondition that never becomes true by waiting,
#   so it has been removed. Six identical failures over two minutes told the
#   student nothing the first one had not.
#
#   NOT a missing attachment. TEST.4 above proves an extension can be added
#   with no attachment record at all.
#
# When the precheck below fails, run the read-only diagnostic - it prints what
# the controller actually holds, including whether a link exists on the parent
# interface and what its templateName is:
#
#   ansible-playbook playbooks/diagnose_vrf_lite.yml 2>&1 | tee /tmp/vrf-lite-diag.txt
#
#
# Run from the collection root (the directory holding ansible.cfg), not from
# playbooks/.
#
#   ansible-playbook playbooks/05_vrf_lite.yml
#   ansible-playbook playbooks/05_vrf_lite.yml -e dc_vrf_lite_deploy=true
#   ansible-playbook playbooks/05_vrf_lite.yml -e dc_vrf_lite_precheck=false

- name: Stage 05 - attach the VRF-Lite extensions on the border leaf
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    ndfc_api_root: /appcenter/cisco/ndfc/api/v1/lan-fabric
    # Stage the attachments on the controller and leave the push to stage 06,
    # the same way stages 02 and 03 stage everything else. Set true to make
    # this stage deploy on its own, which is only useful when re-attaching
    # extensions on a fabric that is otherwise already deployed.
    dc_vrf_lite_deploy: false
    # Read the precondition before writing, so the failure names the real
    # cause. Set false to go straight to the module and see its own error,
    # which is the right move if the precheck's own logic is ever suspect.
    dc_vrf_lite_precheck: true

  tasks:
    # --------------------------------------------------- declared intent
    # vrf_id and vlan_id are NOT restated in dc_vrf_lite.yml. They are read
    # back out of the same model stage 02 consumed, so the two can never
    # disagree - a VRF renumbered in vrfs.nac.yaml is renumbered here too.
    - name: Read the declared VRFs
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/vrfs.nac.yaml"
        name: dc_vrf_lite_vrf_model
      delegate_to: localhost

    - name: Flatten the declared VRFs
      ansible.builtin.set_fact:
        dc_vrf_lite_declared_vrfs: "{{ dc_vrf_lite_vrf_model.vxlan.overlay.vrfs | default([]) }}"

    # ------------------------------------------------------- data checks
    # Everything below fails before the first write. A typo in this file is a
    # data error and must read as one, not as a confusing controller
    # rejection.
    - name: Fail when the declared border leaf is not in the switch table
      ansible.builtin.assert:
        that:
          - matching_switches | length == 1
        fail_msg: >-
          DATA MODEL ERROR, not a fabric fault. dc_vrf_lite_border_leaf is
          '{{ dc_vrf_lite_border_leaf }}', which matches
          {{ matching_switches | length }} entries in dc_switches.yml
          (declared switches: {{ dc_switches | map(attribute='name') | join(', ') }}).
          Fix inventory/group_vars/all/dc_vrf_lite.yml.
      vars:
        matching_switches: >-
          {{ dc_switches | selectattr('name', 'equalto', dc_vrf_lite_border_leaf) | list }}

    - name: Resolve the border leaf management address
      ansible.builtin.set_fact:
        dc_vrf_lite_border_ip: >-
          {{ (dc_switches
              | selectattr('name', 'equalto', dc_vrf_lite_border_leaf)
              | list | first).management_ipv4_address }}

    # Cisco scopes VRF-Lite autoconfiguration to "Border role in the VXLAN
    # fabric and Edge Router role in the connected external fabric device".
    # The module enforces the same thing itself, at dcnm_vrf.py line 1712,
    # where it regex-matches \bborder\b against the controller's switchRole
    # and raises "VRF LITE attachments are appropriate only for switches with
    # Border roles". Catching it here says why in terms of this repository's
    # own data model rather than the controller's inventory.
    - name: Fail when the declared border leaf does not hold the border role
      ansible.builtin.assert:
        that:
          - declared_role == 'border'
        fail_msg: >-
          DATA MODEL ERROR. {{ dc_vrf_lite_border_leaf }} is declared with
          role '{{ declared_role }}' in dc_switches.yml, but VRF-Lite
          extensions are only supported from a switch holding the border
          role. Cisco: "Autoconfiguration is supported for the following
          cases: Border role in the VXLAN fabric and Edge Router role in the
          connected external fabric device".
      vars:
        declared_role: >-
          {{ (dc_switches
              | selectattr('name', 'equalto', dc_vrf_lite_border_leaf)
              | list | first).role | default('') }}

    - name: Fail when an extension names a VRF that vrfs.nac.yaml never declares
      ansible.builtin.assert:
        that:
          - undeclared | length == 0
        fail_msg: >-
          DATA MODEL ERROR, not a fabric fault. {{ undeclared | join(', ') }}
          named in dc_vrf_lite.yml but not declared in vrfs.nac.yaml
          (declared VRFs: {{ dc_vrf_lite_declared_vrfs | map(attribute='name') | join(', ') }}).
          Extending a VRF that the fabric does not have cannot work.
      vars:
        declared_names: "{{ dc_vrf_lite_declared_vrfs | map(attribute='name') | list }}"
        undeclared: >-
          {{ dc_vrf_lite_extensions
             | map(attribute='vrf')
             | reject('in', declared_names)
             | list }}

    # The extension is added on top of the attachment the model makes, so the
    # model has to make it. This catches the case where DC-Service-Leaf is
    # dropped from vrf_attach_groups again: without it stage 02 would leave
    # the border leaf unattached and the extension would be the only thing
    # holding the VRF there, which is the arrangement this stage moved away
    # from on 2026-09-27.
    - name: Fail when the model does not attach the border leaf to every extended VRF
      ansible.builtin.assert:
        that:
          - unattached | length == 0
        fail_msg: >-
          DATA MODEL ERROR. {{ dc_vrf_lite_border_leaf }} is not in the
          vrf_attach_group of {{ unattached | join(', ') }} in
          playbooks/host_vars/{{ inventory_hostname }}/vrfs.nac.yaml, so stage
          02 will not attach the VRF to it and this stage has nothing to
          extend. Add '- hostname: {{ dc_vrf_lite_border_leaf }}' to the
          attach group those VRFs name.
      vars:
        dc_vrf_lite_attach_groups: >-
          {{ dc_vrf_lite_vrf_model.vxlan.overlay.vrf_attach_groups | default([]) }}
        unattached: >-
          {%- set missing = [] -%}
          {%- for ext in dc_vrf_lite_extensions -%}
          {%- set declared = (dc_vrf_lite_declared_vrfs
                              | selectattr('name', 'equalto', ext.vrf)
                              | list | first) | default({}) -%}
          {%- set group = (dc_vrf_lite_attach_groups
                           | selectattr('name', 'equalto',
                                        declared.vrf_attach_group | default(''))
                           | list | first) | default({}) -%}
          {%- set hosts = (group.switches | default([]))
                          | map(attribute='hostname') | list -%}
          {%- if dc_vrf_lite_border_leaf not in hosts -%}
          {{- missing.append(ext.vrf) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ missing }}

    # One sub-interface per dot1q tag on one parent interface. Two rows
    # sharing a tag silently collapse into one sub-interface on the switch
    # and the second VRF is left unreachable, which is a slow thing to find.
    # NOTE: this variable cannot be called "tags". That is a reserved task
    # keyword, so Ansible consumes the vars entry as the directive and the
    # expression below then fails with "'tags' is undefined".
    - name: Fail on a duplicate dot1q tag
      ansible.builtin.assert:
        that:
          - dot1q_tags | length == dot1q_tags | unique | length
        fail_msg: >-
          DATA MODEL ERROR. dc_vrf_lite.yml reuses a dot1q tag
          ({{ dot1q_tags | join(', ') }}). Every extension on
          {{ dc_vrf_lite_interface }} needs its own tag.
      vars:
        dot1q_tags: "{{ dc_vrf_lite_extensions | map(attribute='dot1q') | list }}"

    # ------------------------------------------------------ build and apply
    - name: Build the dcnm_vrf configuration
      ansible.builtin.set_fact:
        dc_vrf_lite_config: >-
          {%- set rows = [] -%}
          {%- for ext in dc_vrf_lite_extensions -%}
          {%- set declared = (dc_vrf_lite_declared_vrfs
                              | selectattr('name', 'equalto', ext.vrf)
                              | list | first) -%}
          {{- rows.append({
                'vrf_name': ext.vrf,
                'vrf_id': declared.vrf_id,
                'vlan_id': declared.vlan_id,
                'attach': [{
                  'ip_address': dc_vrf_lite_border_ip,
                  'vrf_lite': [{
                    'peer_vrf': ext.peer_vrf,
                    'interface': dc_vrf_lite_interface,
                    'ipv4_addr': ext.ipv4_addr,
                    'neighbor_ipv4': ext.neighbor_ipv4,
                    'dot1q': ext.dot1q | string
                  }]
                }]
              }) or '' -}}
          {%- endfor -%}
          {{ rows }}

    - name: Show what will be attached
      ansible.builtin.debug:
        msg: >-
          {{ dc_vrf_lite_extensions | length }} VRF-Lite extension(s) on
          {{ dc_vrf_lite_border_leaf }} ({{ dc_vrf_lite_border_ip }})
          {{ dc_vrf_lite_interface }}:
          {% for ext in dc_vrf_lite_extensions %}
          {{ ext.vrf }} dot1q {{ ext.dot1q }} {{ ext.ipv4_addr }} -> {{ ext.neighbor_ipv4 }}{{ '; ' if not loop.last else '' }}
          {%- endfor %}

    # ------------------------------------------------------------- precheck
    # Read the exact thing the module reads, and fail on it here so the
    # message can name the cause. Both calls are GETs.
    #
    # Endpoint: cisco.dcnm 3.13.0 module_utils/network/dcnm/dcnm.py
    # get_fabric_inventory_details(), lines 229-234. Resolved from the
    # controller rather than from the generated topology_switches.nac.yaml so
    # this works on a fresh checkout.
    - name: Read the fabric inventory to resolve the border leaf serial
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/inventory/switchesByFabric"
      register: dc_vrf_lite_inventory
      changed_when: false
      when: dc_vrf_lite_precheck | bool

    - name: Resolve the border leaf serial
      ansible.builtin.set_fact:
        dc_vrf_lite_border_serial: >-
          {{ ((dc_vrf_lite_inventory.response | default({})).DATA | default([])
              | selectattr('ipAddress', 'defined')
              | selectattr('ipAddress', 'equalto', dc_vrf_lite_border_ip)
              | map(attribute='serialNumber') | list | first | default('')) }}
      when: dc_vrf_lite_precheck | bool

    # Endpoint: dcnm_vrf.py GET_VRF_SWITCH, line 1047, as called by
    # get_vrf_lite_objects() at line 2442. One VRF is enough: the prototype
    # list is a property of the switch and its inter-fabric link, not of the
    # VRF, so if it is empty for one VRF it is empty for all three.
    - name: Read the VRF-Lite extension prototypes the controller offers
      cisco.dcnm.dcnm_rest:
        method: GET
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/switches?vrf-names={{ dc_vrf_lite_extensions[0].vrf }}&serial-numbers={{ dc_vrf_lite_border_serial }}
      register: dc_vrf_lite_probe
      changed_when: false
      when:
        - dc_vrf_lite_precheck | bool
        - dc_vrf_lite_border_serial | length > 0

    # The assertion is deliberately the same test the module applies, and no
    # stricter: at least one prototype with extensionType VRF_LITE. The
    # interface name is reported but not asserted on, because the module
    # checks that separately and says so in a different message (line 4758).
    - name: Fail with the real cause when the controller offers no VRF-Lite prototype
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_prototypes | length > 0
        success_msg: >-
          Controller offers {{ dc_vrf_lite_prototypes | length }} VRF_LITE
          extension prototype(s) on {{ dc_vrf_lite_border_leaf }}
          ({{ dc_vrf_lite_border_serial }}), on interface(s)
          {{ dc_vrf_lite_proto_ifs | join(', ') | default('unnamed', true) }}.
          Proceeding.
        fail_msg: >-
          PRECONDITION NOT MET on the controller, and nothing in this
          repository can be edited to fix it.
          Nexus Dashboard offers {{ dc_vrf_lite_border_leaf }}
          ({{ dc_vrf_lite_border_serial }}) no VRF-Lite extension prototype,
          so dcnm_vrf would fail with "No VRF LITE capable interfaces found on
          this switch" (dcnm_vrf.py line 4721). Prototype extensionType(s)
          returned: {{ dc_vrf_lite_proto_types | default([], true) }}.
          A VRF_LITE prototype exists only where a VRF-Lite inter-fabric link
          (template ext_fabric_setup) terminates, so the question is whether
          that link exists on {{ dc_vrf_lite_interface }}. This is NOT a
          timing problem and NOT a missing VRF attachment: a full successful
          06_recalculate_and_deploy.yml does not change it, and the module's
          own TEST.4 adds an extension with no attachment present. Run the
          read-only diagnostic and read section 2:
          ansible-playbook playbooks/diagnose_vrf_lite.yml
          To skip this check and see the module's own error instead,
          re-run with -e dc_vrf_lite_precheck=false.
      vars:
        dc_vrf_lite_switch_record: >-
          {{ (((dc_vrf_lite_probe.response | default({})).DATA | default([])
               | first | default({})).switchDetailsList | default([])
              | first | default({})) }}
        dc_vrf_lite_prototypes: >-
          {{ (dc_vrf_lite_switch_record.extensionPrototypeValues | default([], true))
             | selectattr('extensionType', 'defined')
             | selectattr('extensionType', 'equalto', 'VRF_LITE') | list }}
        dc_vrf_lite_proto_types: >-
          {{ (dc_vrf_lite_switch_record.extensionPrototypeValues | default([], true))
             | map(attribute='extensionType') | list }}
        dc_vrf_lite_proto_ifs: >-
          {{ dc_vrf_lite_prototypes | map(attribute='extensionValues') | list }}
      when:
        - dc_vrf_lite_precheck | bool
        - dc_vrf_lite_border_serial | length > 0

    - name: Warn when the precheck could not run
      ansible.builtin.debug:
        msg: >-
          Precheck skipped: the border leaf serial could not be resolved from
          the controller inventory for {{ dc_vrf_lite_border_ip }}. The
          dcnm_vrf call below will still run and will report its own error.
      when:
        - dc_vrf_lite_precheck | bool
        - dc_vrf_lite_border_serial | default('') | length == 0

    # --------------------------------------------------------------- write
    - name: Attach the VRF-Lite extensions
      block:
        # No until/retries. The precondition this call needs is structural,
        # not eventual - see the header - so a retry only multiplies the same
        # failure. The precheck above is what turns that failure into a
        # sentence worth reading.
        - name: Merge the VRF-Lite attachments on {{ dc_vrf_lite_border_leaf }}
          cisco.dcnm.dcnm_vrf:
            fabric: "{{ dc_fabric_name }}"
            state: merged
            deploy: "{{ dc_vrf_lite_deploy | bool }}"
            config: "{{ dc_vrf_lite_config }}"
          register: dc_vrf_lite_result

      rescue:
        - name: Explain what the controller refused
          ansible.builtin.fail:
            msg: >-
              VRF-Lite attachment failed on {{ dc_vrf_lite_border_leaf }}.
              If the message below is "No VRF LITE capable interfaces found on
              this switch", the controller is offering the border leaf no
              VRF_LITE extension prototype. dcnm_vrf reads that list at
              dcnm_vrf.py lines 5126-5127 from
              top-down/fabrics/{{ dc_fabric_name }}/vrfs/switches and fails at
              line 4721 when nothing in it has extensionType VRF_LITE. A
              prototype exists only where a VRF-Lite inter-fabric link
              (template ext_fabric_setup) terminates, so the thing to check is
              whether that link exists on {{ dc_vrf_lite_interface }}.
              Do NOT re-run hoping for a different answer and do NOT reach for
              Recalculate and Deploy: on 2026-09-27 a full successful stage 06
              (5/5 switches, in_sync=True) was followed by an identical
              failure here. It is also not a missing VRF attachment - the
              model attaches the border leaf and the module can add an
              extension without one.
              Run the read-only diagnostic and read section 2:
              ansible-playbook playbooks/diagnose_vrf_lite.yml
              Controller error: {{ ansible_failed_result.msg | default('see above') }}

    - name: Report the outcome
      ansible.builtin.debug:
        msg: >-
          VRF-Lite {{ 'staged and deployed' if (dc_vrf_lite_deploy | bool) else 'staged on the controller' }}
          for {{ dc_vrf_lite_extensions | map(attribute='vrf') | join(', ') }}
          on {{ dc_vrf_lite_border_leaf }} {{ dc_vrf_lite_interface }}.
          changed={{ dc_vrf_lite_result.changed }}.
          {{ 'Stage 06 will push it to the switch.' if not (dc_vrf_lite_deploy | bool) else '' }}
