---
# Stage 02 — build the whole fabric intent on Nexus Dashboard.
#
# Guide sections 4, 5 and 6: create the fabric, add the switches, set their
# roles, pair the vPC, create the port-channels, create the VRFs and the
# networks, and attach the networks to the port-channels. The create role
# turns the declarative model in playbooks/host_vars/Pseudoco-DC1/ into all of
# that. One file in that directory — topology_switches.nac.yaml — is generated
# by stage 00 rather than tracked, so the pre-tasks below refuse to start
# without it.
#
# Create only *stages* the configuration on the controller. Nothing reaches a
# switch until stage 03 deploys it — with one exception: importing a switch
# into the fabric is itself a write, and the import is greenfield. The create
# role's inventory template hardcodes preserve_config: false, so every switch
# has its running configuration erased as it is imported. That matches the
# guide, which has you uncheck Preserve Config, and there is no flag to
# change it.
#
# To land only the fabric object — the guide's "Create a VXLAN Fabric" step,
# the first thing section 4 has you do, before any switch is added to it:
#
#   ansible-playbook playbooks/02_create.yml --tags cr_manage_fabric
#
# cr_manage_fabric is a real per-step tag inside the create role, so that run
# creates the fabric and does nothing else. The pre-tasks below still run,
# because they are tagged always — so even a fabric-only run refuses to start
# without the generated switch model, and stage 00 remains a hard prerequisite
# for every path through this stage.
#
# Run from the collection root (the directory holding ansible.cfg), not from
# playbooks/ — ansible.cfg's relative paths to the vault and the vars plugin
# are resolved against the working directory.

- name: Stage 02 — create the DC fabric intent
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    dc_switch_model_path: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/topology_switches.nac.yaml"

  pre_tasks:
    - name: Look for the generated switch model
      ansible.builtin.stat:
        path: "{{ dc_switch_model_path }}"
      register: dc_switch_model
      delegate_to: localhost
      tags: [always]

    - name: Fail with a pointer to stage 00 when the switch model is absent
      ansible.builtin.fail:
        msg: >-
          playbooks/host_vars/{{ inventory_hostname }}/topology_switches.nac.yaml does
          not exist. It is generated, not tracked, because the serial numbers
          belong to one pod. Run
          playbooks/00_discover_dc_switch_serials.yml, which reads the serials
          off the switches and writes it.
      when: not dc_switch_model.stat.exists
      tags: [always]

    # Rule 301 in the validate role only checks that serial_number is
    # non-empty, so REPLACE_ME sails through it and fails much later inside
    # the create role. Stage 00 makes the same check on what it writes; this
    # one stands behind it, because the file is on disk and nothing stops
    # somebody editing it after the fact.
    - name: Read the switch model back to check the serials are real
      ansible.builtin.slurp:
        src: "{{ dc_switch_model_path }}"
      register: dc_switch_model_content
      delegate_to: localhost
      tags: [always]

    - name: Fail when a placeholder serial number is still in place
      ansible.builtin.fail:
        msg: >-
          playbooks/host_vars/{{ inventory_hostname }}/topology_switches.nac.yaml still
          contains REPLACE_ME, which means it was not written by a clean stage
          00 run. Re-run playbooks/00_discover_dc_switch_serials.yml — it
          regenerates the file from scratch and refuses to leave a placeholder
          behind. A placeholder passes validation and then fails deep inside
          the create role, which is a much harder failure to read.
      when: "'REPLACE_ME' in (dc_switch_model_content.content | b64decode)"
      tags: [always]

  roles:
    - role: cisco.nac_dc_vxlan.validate
    - role: cisco.nac_dc_vxlan.dtc.create
