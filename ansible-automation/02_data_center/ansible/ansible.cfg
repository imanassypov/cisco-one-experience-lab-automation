[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[defaults]
inventory = inventory/static_inventory.yml
host_key_checking = False
deprecation_warnings = False
vault_password_file = ../../../.vault
vars_plugins = ../../plugins/vars
# EVALUATION BRANCH ONLY (eval/nd-l3out). cisco.nd is installed from the
# unreleased develop branch into the git-ignored .eval_collections at the
# repository root, and only this track searches it. It comes first so it wins
# over any released cisco.nd; the rest is ansible-core's default search path.
# Install command and commit: docs/eval-nd-l3out.md.
collections_path = ../../../.eval_collections:~/.ansible/collections:/usr/share/ansible/collections
interpreter_python = auto_silent
# Matches the campus collection: the roles emit a "skipping:" line per guarded
# task, which buries the real output on a normal run.
display_skipped_hosts = False

[privilege_escalation]
become = False
