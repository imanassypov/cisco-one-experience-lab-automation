[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[defaults]
inventory = inventory/static_inventory.yml
host_key_checking = False
deprecation_warnings = False
vault_password_file = ../../../.vault
vars_plugins = ../../plugins/vars
# Evaluation branch only: look first in .eval_collections (repo root), which holds a
# pre-release cisco.nd collection, then in the normal Ansible collection folders.
collections_path = ../../../.eval_collections:~/.ansible/collections:/usr/share/ansible/collections
interpreter_python = auto_silent
# Hide "skipping" lines so the real output is easier to read.
display_skipped_hosts = False

[privilege_escalation]
become = False
