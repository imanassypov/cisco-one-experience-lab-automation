---
# vPC pair (guide section 5): two leaves act as one switch to dual-homed servers.
# Nexus Dashboard detects the peer-link and picks the vPC domain ID by itself.
# CAUTION: once deployed, a pair cannot be edited, only deleted and recreated.
vxlan:
  topology:
    vpc_peers:
      - peer1: DC-Leaf1
        peer2: DC-Leaf2
