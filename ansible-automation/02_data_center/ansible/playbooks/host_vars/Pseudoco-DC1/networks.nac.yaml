---
# Overlay networks (guide section 6): one subnet per VRF, stretched across the leaves.
# gw_ip_address is the anycast gateway: the same default gateway on every leaf.
# net_id is the L2 VNI. Always set vlan_id yourself (2300-2999) to avoid clashes.
vxlan:
  overlay:
    networks:
      - name: MainNetwork1
        vrf_name: MAIN
        net_id: 30000
        vlan_id: 2300
        is_l2_only: false
        vlan_name: MainNetwork1
        int_desc: MainNetwork1
        gw_ip_address: "10.10.252.1/24"
        network_attach_group: main_vpc3

      - name: ProdNetwork1
        vrf_name: PROD
        net_id: 30001
        vlan_id: 2301
        is_l2_only: false
        vlan_name: ProdNetwork1
        int_desc: ProdNetwork1
        gw_ip_address: "10.101.252.1/24"
        network_attach_group: prod_vpc4

      - name: IOTNetwork1
        vrf_name: IOT
        net_id: 30002
        vlan_id: 2302
        is_l2_only: false
        vlan_name: IOTNetwork1
        int_desc: IOTNetwork1
        gw_ip_address: "10.102.252.1/24"
        network_attach_group: iot_vpc5

    # Attach groups: which server ports each network reaches. Each lists the same
    # vPC port-channel on both leaves; the port-channels are defined in topology_switches.
    network_attach_groups:
      - name: main_vpc3
        switches:
          - hostname: DC-Leaf1
            ports:
              - Port-channel3
          - hostname: DC-Leaf2
            ports:
              - Port-channel3

      - name: prod_vpc4
        switches:
          - hostname: DC-Leaf1
            ports:
              - Port-channel4
          - hostname: DC-Leaf2
            ports:
              - Port-channel4

      - name: iot_vpc5
        switches:
          - hostname: DC-Leaf1
            ports:
              - Port-channel5
          - hostname: DC-Leaf2
            ports:
              - Port-channel5
