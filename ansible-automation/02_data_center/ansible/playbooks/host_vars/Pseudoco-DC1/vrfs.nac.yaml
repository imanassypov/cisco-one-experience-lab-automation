---
# Overlay VRFs (guide section 6): MAIN, PROD and IOT, matching campus and SD-WAN.
# Each VRF is a separate routing table; vrf_id is its L3 VNI across the fabric.
# Always set vlan_id yourself (2000-2299); letting the controller pick clashes.
vxlan:
  overlay:
    vrfs:
      - name: MAIN
        vrf_id: 50000
        vlan_id: 2000
        vrf_vlan_name: MAIN
        vrf_intf_desc: MAIN
        vrf_description: MAIN
        vrf_attach_group: dc_leaves

      - name: PROD
        vrf_id: 50001
        vlan_id: 2001
        vrf_vlan_name: PROD
        vrf_intf_desc: PROD
        vrf_description: PROD
        vrf_attach_group: dc_leaves

      - name: IOT
        vrf_id: 50002
        vlan_id: 2002
        vrf_vlan_name: IOT
        vrf_intf_desc: IOT
        vrf_description: IOT
        vrf_attach_group: dc_leaves

    vrf_attach_groups:
      # Attach group: the switches that get these VRFs, border leaf included.
      # Stage 05 (L3Out) builds the external handoff on top of this attachment,
      # so it must run after stage 02 every time; 01_dc_deploy.yml does this.
      - name: dc_leaves
        switches:
          - hostname: DC-Leaf1
          - hostname: DC-Leaf2
          # Border leaf: same VRFs, plus the external handoff that stage 05 adds.
          - hostname: DC-Service-Leaf
