---
# Fabric-wide settings for the DC VXLAN EVPN fabric (guide section 4).
# A "fabric" is the whole group of spines and leaves Nexus Dashboard manages as one.
# No Jinja ({{ ... }}) here: this file is read as plain data, never templated.
vxlan:
  fabric:
    name: Pseudoco-DC1
    type: VXLAN_EVPN

  global:
    ibgp:
      # BGP AS number shared by every switch (iBGP). Keep the quotes: it must be a string.
      bgp_asn: "65000"
      # The two spines act as BGP route reflectors, so leaves peer only with them.
      route_reflectors: 2
      # Authentication used when Nexus Dashboard discovers the switches (as in the guide).
      auth_proto: MD5

      # The guide's "Add Switches without Reload". Switches are still wiped on import;
      # this only lets that cleanup happen without rebooting each switch.
      # Cisco recommends Enable for Nexus 9000v labs like this one.
      greenfield_cleanup: Enable

      # VNI pools. A VNI is the VXLAN ID that labels a segment across the fabric.
      # Networks (L2) take IDs 30000+ and VRFs (L3) take 50000+; see the overlay files.
      layer2_vni_range:
        from: 30000
        to: 49000
      layer3_vni_range:
        from: 50000
        to: 59000

# The guide's VRF Lite settings (Resources tab) cannot be expressed in this model.
# They live in inventory/group_vars/all/dc_vrf_lite.yml and are applied by stage 03.
# Do not add them here: the model rejects keys it does not know.
