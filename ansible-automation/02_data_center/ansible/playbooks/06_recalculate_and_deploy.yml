---
# Stage 06: "Recalculate and Deploy". WARNING: the only stage that changes the switches' running config.
# Pushes everything stages 02-05 saved on the controller, L3Outs included. Takes several minutes.
# Run from the folder holding ansible.cfg: ansible-playbook playbooks/06_recalculate_and_deploy.yml

- name: Stage 06 - recalculate the DC fabric configuration
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    ndfc_api_root: /appcenter/cisco/ndfc/api/v1/lan-fabric

  roles:
    - role: cisco.nac_dc_vxlan.validate

  tasks:
    # Both calls are needed. The first works out each switch's config; the second makes
    # switches with pending changes show Out-of-Sync. Without it the deploy finds nothing to do.
    - name: Recalculate the intended configuration
      cisco.dcnm.dcnm_rest:
        method: POST
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/config-save"
      changed_when: true

    - name: Refresh each switch's compliance state
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/config-preview?forceShowRun=false&showBrief=true"
      register: dc_recalculate_preview
      changed_when: false

    - name: Report which switches now have pending configuration
      ansible.builtin.debug:
        msg: >-
          {{ ['Compliance after recalculation:', '| Switch | State |',
              '| --- | --- |']
             + dc_recalculate_rows
             + ['Every switch reading Out-of-Sync is deployed below.'] }}
      vars:
        dc_recalculate_rows: >-
          {%- set rows = [] -%}
          {%- for switch in ((dc_recalculate_preview.response | default({})).DATA | default([])) -%}
          {{- rows.append('| ' ~ switch.get('switchName', 'unknown') ~ ' | '
                          ~ switch.get('status', 'unknown') ~ ' |') or '' -}}
          {%- endfor -%}
          {{ rows }}

# A separate play, because roles always run before tasks in the same play.
- name: Stage 06 - push the pending configuration
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  roles:
    - role: cisco.nac_dc_vxlan.dtc.deploy
