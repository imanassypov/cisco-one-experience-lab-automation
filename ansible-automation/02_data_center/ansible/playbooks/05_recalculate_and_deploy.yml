---
# Stage 05 - recalculate and deploy the fabric before VRF-Lite staging.
#
# Named after the UI action it performs: every "Recalculate and Deploy" click.
# Stages 02 to 05 build intent on the controller and change nothing on a
# switch; this is the stage that changes running configuration on DC-Leaf1,
# DC-Leaf2, DC-SPINE-1, DC-SPINE-2 and DC-Service-Leaf.
#
# This first deploy pushes the fabric and makes Nexus Dashboard build the
# VRF-Lite inter-fabric link required by stage 06. Stage 07 performs the second
# deploy after the extensions have been staged.
#
# The validate role re-checks the data model, then the deploy role asks the
# controller which switches have pending configuration and deploys those.
# Expect several minutes, and expect switches to show as out-of-sync while it
# runs. Note that "no switches need deployment" describes the moment the
# controller was asked rather than proving the fabric is complete; stage 08 is
# what settles that.
#
# Run from the collection root, the directory holding ansible.cfg:
#
#   cd ansible-automation/02_data_center/ansible
#   ansible-playbook playbooks/05_recalculate_and_deploy.yml

- name: Stage 05 - recalculate and deploy the DC fabric
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    ndfc_api_root: /appcenter/cisco/ndfc/api/v1/lan-fabric

  roles:
    - role: cisco.nac_dc_vxlan.validate

  tasks:
    # The deploy role below only pushes switches the controller already reports
    # as Out-of-Sync, and intent written through the API does not move that flag
    # by itself. config-save recalculates the intended configuration, and
    # reading config-preview is what refreshes each switch's compliance state -
    # the two halves of the UI action this stage is named for. Without them a
    # staged change stays on the controller while every switch still reads
    # In-Sync and the deploy reports nothing to do.
    - name: Recalculate the intended configuration
      cisco.dcnm.dcnm_rest:
        method: POST
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/config-save"
      changed_when: true

    - name: Refresh each switch's compliance state
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/config-preview?forceShowRun=false&showBrief=true"
      changed_when: false

# A separate play so the deploy role runs after the recalculation above; roles
# in a single play always run before that play's tasks.
- name: Stage 05 - push the pending configuration
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  roles:
    - role: cisco.nac_dc_vxlan.dtc.deploy
