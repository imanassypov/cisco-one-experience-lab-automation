---
# Stage 05 - recalculate and deploy the fabric before VRF-Lite staging.
#
# Named after the UI action it performs: every "Recalculate and Deploy" click.
# Stages 02 to 04 build intent on the controller and change nothing on a
# switch; this is the first stage that changes running configuration on
# DC-Leaf1, DC-Leaf2, DC-SPINE-1, DC-SPINE-2 and DC-Service-Leaf.
#
# It has to deploy, not merely recalculate. Nexus Dashboard builds the VRF-Lite
# inter-fabric link stage 06 depends on from the CDP adjacency it sees on
# Ethernet1/8, and that adjacency only exists once the parent interface has
# actually been configured on the border leaf. Recalculating alone leaves the
# switches untouched, so on a fresh pod no link is built and stage 06 stops
# with "offers no VRF-Lite extension". Measured on 2026-09-27: a build whose
# stage 05 only recalculated failed exactly there.
#
# Why the recalculation is two calls rather than one:
#   - config-save recalculates the intended configuration. On its own it leaves
#     every switch still reporting In-Sync.
#   - reading config-preview is what refreshes each switch's compliance state.
#     Only after it does a switch with pending configuration read Out-of-Sync,
#     which is the flag the deploy role selects on.
# Skipping the second call fails silently: the deploy finds nothing to do and
# reports success while the configuration never reaches a switch.
#
# There is no module for either call. cisco.dcnm has no config-save module -
# dcnm_fabric only does deleted/merged/query/replaced - and cisco.nd is the
# Nexus Dashboard platform collection, with nothing for fabric config actions.
# dcnm_rest is the supported route, and the same one stages 03 and 06 use.
#
# Expect several minutes, and expect switches to show as out-of-sync while it
# runs. Stage 07 performs the second deploy, after stage 06 stages the
# extensions.
#
# Run from the collection root, the directory holding ansible.cfg:
#
#   cd ansible-automation/02_data_center/ansible
#   ansible-playbook playbooks/05_recalculate_and_deploy.yml

- name: Stage 05 - recalculate the DC fabric configuration
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    ndfc_api_root: /appcenter/cisco/ndfc/api/v1/lan-fabric

  roles:
    - role: cisco.nac_dc_vxlan.validate

  tasks:
    - name: Recalculate the intended configuration
      cisco.dcnm.dcnm_rest:
        method: POST
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/config-save"
      changed_when: true

    - name: Refresh each switch's compliance state
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/config-preview?forceShowRun=false&showBrief=true"
      register: dc_recalculate_preview
      changed_when: false

    - name: Report which switches now have pending configuration
      ansible.builtin.debug:
        msg: >-
          {{ ['Compliance after recalculation:', '| Switch | State |',
              '| --- | --- |']
             + dc_recalculate_rows
             + ['Every switch reading Out-of-Sync is deployed below.'] }}
      vars:
        dc_recalculate_rows: >-
          {%- set rows = [] -%}
          {%- for switch in ((dc_recalculate_preview.response | default({})).DATA | default([])) -%}
          {{- rows.append('| ' ~ switch.get('switchName', 'unknown') ~ ' | '
                          ~ switch.get('status', 'unknown') ~ ' |') or '' -}}
          {%- endfor -%}
          {{ rows }}

# A separate play so the deploy role runs after the recalculation above; roles
# in a single play always run before that play's tasks.
- name: Stage 05 - push the pending configuration
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  roles:
    - role: cisco.nac_dc_vxlan.dtc.deploy

# The deploy above is what makes Ethernet1/8 real on the border leaf, and only
# then does CDP report the edge router across it. Nexus Dashboard builds the
# VRF-Lite inter-fabric link from that adjacency during a recalculation, so the
# one that ran before the deploy was too early to see it. Recalculating again
# here is what puts the link in place for stage 06.
#
# Measured on 2026-09-27, on a fabric built from scratch: straight after the
# deploy the controller offered DC-Service-Leaf no extension prototype at all;
# a single further config-save plus config-preview turned that into
# ['VRF_LITE'], with no other change and no waiting.
- name: Stage 05 - recalculate again so the inter-fabric link is built
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    ndfc_api_root: /appcenter/cisco/ndfc/api/v1/lan-fabric

  tasks:
    - name: Recalculate now that the adjacency exists
      cisco.dcnm.dcnm_rest:
        method: POST
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/config-save"
      changed_when: true

    - name: Refresh compliance so stage 07 can see what this produced
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/config-preview?forceShowRun=false&showBrief=true"
      changed_when: false
