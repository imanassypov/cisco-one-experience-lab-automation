---
# Stage 07 - recalculate and deploy the VRF-Lite extensions.
#
# Named after the UI action it performs: every "Recalculate and Deploy" click.
# Stages 02 to 06 build intent on the controller and change nothing on a
# switch; this is the stage that changes running configuration on DC-Leaf1,
# DC-Leaf2, DC-SPINE-1, DC-SPINE-2 and DC-Service-Leaf.
#
# Stage 06 has staged the VRF-Lite extensions. This second deploy pushes the
# parent interface, sub-interfaces, and BGP neighbours to the border leaf.
#
# The validate role re-checks the data model, then the deploy role asks the
# controller which switches have pending configuration and deploys those.
# Expect several minutes, and expect switches to show as out-of-sync while it
# runs. Note that "no switches need deployment" describes the moment the
# controller was asked rather than proving the fabric is complete; stage 08 is
# what settles that.
#
# Run from the collection root, the directory holding ansible.cfg:
#
#   cd ansible-automation/02_data_center/ansible
#   ansible-playbook playbooks/07_recalculate_and_deploy.yml

- name: Stage 07 - recalculate and deploy the DC fabric
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    ndfc_api_root: /appcenter/cisco/ndfc/api/v1/lan-fabric

  roles:
    - role: cisco.nac_dc_vxlan.validate

  tasks:
    # The deploy role only pushes switches the controller already reports as
    # Out-of-Sync, and the attachment stage 06 writes does not move that flag by
    # itself. config-save recalculates the intended configuration, and reading
    # config-preview is what refreshes each switch's compliance state. Without
    # them stage 06's extensions sit on the controller, every switch still reads
    # In-Sync, and this stage reports "no switches need deployment" while the
    # sub-interfaces never reach DC-Service-Leaf.
    - name: Recalculate the intended configuration
      cisco.dcnm.dcnm_rest:
        method: POST
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/config-save"
      changed_when: true

    - name: Refresh each switch's compliance state
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/config-preview?forceShowRun=false&showBrief=true"
      changed_when: false

    - name: Deploy every switch the controller reports as out of sync
      ansible.builtin.include_role:
        name: cisco.nac_dc_vxlan.dtc.deploy
