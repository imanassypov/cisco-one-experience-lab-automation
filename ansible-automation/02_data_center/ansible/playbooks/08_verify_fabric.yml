---
# Stage 08 - verify the deployed fabric against the declared intent.
#
# Read-only throughout: API GETs to Nexus Dashboard and show commands on one
# switch, so it is safe to re-run as often as you like while debugging.
#
# Two sources of truth, deliberately kept apart. Almost every check reads the
# Nexus Dashboard API, which needs no SSH and works when the VPN cannot reach
# the 198.18.128.x management range. One check reads the real BGP session state
# off the border leaf over SSH, because "the controller deployed the extension"
# and "the eBGP session came up" are different claims, and only the second one
# means external connectivity works.
#
# What it compares:
#   - every switch in inventory/group_vars/all/dc_switches.yml is in the
#     fabric, holding the role declared for it
#   - every VRF in vrfs.nac.yaml exists and is attached to every switch in its
#     vrf_attach_group
#   - every network in networks.nac.yaml exists with the declared gateway, and
#     is attached to the declared port-channels
#   - every VRF-Lite extension in inventory/group_vars/all/dc_vrf_lite.yml is
#     attached and DEPLOYED on the border leaf, with the declared interface,
#     dot1q tag and neighbour address. This is what catches a stage 02 re-run
#     that cleared the extensions stage 05 made
#   - every attachment the controller reports as attached (isLanAttached: true)
#     is DEPLOYED. Switches the controller lists but has not attached come back
#     as NA and are not judged - see the comment in Compare VRFs
#   - every VRF-Lite eBGP session declared in dc_vrf_lite.yml is Established on
#     the border leaf. This is the only check that reads a switch instead of the
#     controller, and the only one with three possible answers rather than two:
#     established, down, or not determined because the switch was unreachable.
#     Not determined never counts as down and never fails the run
#
# It writes evidence/stage08-verification.md and fails at the end on any
# mismatch.
#
# Run from the collection root, the directory holding ansible.cfg:
#
#   cd ansible-automation/02_data_center/ansible
#   ansible-playbook playbooks/08_verify_fabric.yml
#
# Useful overrides:
#   -e dc_verify_fail_on_mismatch=false   write the report without failing the
#                                         run
#   -e dc_verify_bgp_sessions=false       skip the SSH read of the BGP sessions
#                                         and compare only what the controller
#                                         knows
#
# Background: "What the verification stage proves" in the README.

- name: Stage 07a - name the border leaf as the target of the BGP session check
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    # Set false to skip the BGP session check. With it off no SSH session is
    # opened at all, and the report says the check was skipped rather than
    # making any claim about the sessions.
    dc_verify_bgp_sessions: true

  tasks:
    # add_host creates an inventory host while the play is running, which is how
    # stage 00 builds its switch group too. The group is dc_fabric_switches
    # because that is where the SSH settings and the vault credentials already
    # live, in inventory/group_vars/dc_fabric_switches/connection.yml, so
    # nothing about the connection is repeated here.
    #
    # The management address is looked up in
    # inventory/group_vars/all/dc_switches.yml, the same table stage 00 reads. A
    # border leaf missing from that table falls back to being resolved by name.
    - name: Add the border leaf to the switch group so it can be read over SSH
      ansible.builtin.add_host:
        name: "{{ dc_vrf_lite_border_leaf }}"
        groups: dc_fabric_switches
        ansible_host: >-
          {{ (dc_switches | default([])
              | selectattr('name', 'eq', dc_vrf_lite_border_leaf)
              | map(attribute='management_ipv4_address')
              | list | first) | default(dc_vrf_lite_border_leaf, true) }}
      changed_when: false
      when:
        - dc_verify_bgp_sessions | bool
        - dc_vrf_lite_extensions | default([]) | length > 0

- name: Stage 07b - read the VRF-Lite BGP session state off the border leaf
  # Only the border leaf carries the VRF-Lite extensions, and the task below is
  # limited to it. The play still names the whole group because that is the one
  # the credentials are attached to, and because stage 00 may already have
  # filled it with all five switches when both stages run from
  # 01_dc_deploy.yml. A task that is skipped opens no SSH session, so naming the
  # group costs nothing.
  hosts: dc_fabric_switches
  gather_facts: false
  # vars declared in one play are not visible in the next, so the default for
  # this flag is repeated in each play that reads it. -e on the command line
  # overrides all of them at once.
  vars:
    dc_verify_bgp_sessions: true
  # A border leaf this play cannot reach must not fail stage 07. Every other
  # check in this stage talks to Nexus Dashboard and does not need the VPN to
  # the switch management range, so an unreachable switch costs one check rather
  # than the whole report. ignore_unreachable lets the play finish anyway; the
  # next play sees an empty result and reports those rows as "not determined".
  ignore_unreachable: true

  tasks:
    # One show command per extension declared in
    # inventory/group_vars/all/dc_vrf_lite.yml, sent in a single SSH session.
    #
    # The command is `show bgp sessions [vrf vrf-name]`, from the "Monitor BGP
    # Statistics" table of the Cisco Nexus 9000 Series NX-OS Unicast Routing
    # Configuration Guide, Release 10.6(x), BGP chapter:
    # https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/unicast-routing-configuration/cisco-nexus-9000-series-nx-os-unicast-routing-configuration-guide/configuring-bgp.html
    # A VRF-Lite peering lives inside its VRF, not in the default VRF and not in
    # the EVPN address family, so the VRF name has to be on the command or the
    # neighbour is not in the output at all. A BGP session is one TCP session per
    # neighbour whatever address families it carries, so the session state is
    # read here rather than per address family.
    #
    # `output: json` asks NX-OS for the machine-readable form of the output, and
    # the module hands back a parsed dictionary. Nothing downstream matches
    # against screen text.
    #
    # A VRF that does not exist on this switch returns an empty string rather
    # than an error, so a fabric that was never built reads as "no session"
    # instead of stopping the run here.
    #
    # ignore_errors leaves the verdict to the next play instead of taking it
    # here: a command that failed has to read as "not determined", not as a down
    # session. register saves the result so the next play can read it out of
    # hostvars.
    - name: Ask the border leaf for the BGP session state of each VRF-Lite VRF
      cisco.nxos.nxos_command:
        commands: "{{ dc_bgp_session_commands }}"
      register: dc_bgp_session_output
      changed_when: false
      ignore_errors: true
      when:
        - dc_verify_bgp_sessions | bool
        - inventory_hostname == dc_vrf_lite_border_leaf
      vars:
        dc_bgp_session_commands: >-
          {%- set cmds = [] -%}
          {%- for ext in dc_vrf_lite_extensions | default([]) -%}
          {{- cmds.append({'command': 'show bgp sessions vrf ' ~ ext.vrf,
                           'output': 'json'}) or '' -}}
          {%- endfor -%}
          {{ cmds }}

- name: Stage 07c - compare the fabric against intent and write the report
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    ndfc_api_root: /appcenter/cisco/ndfc/api/v1/lan-fabric
    dc_verify_fail_on_mismatch: true
    dc_verify_bgp_sessions: true

    # What stage 07b registered on the border leaf. The `in hostvars` test
    # covers the case where the flag is off and that host was never created.
    dc_bgp_output: >-
      {{ (hostvars[dc_vrf_lite_border_leaf].dc_bgp_session_output | default({}))
         if dc_vrf_lite_border_leaf in hostvars else {} }}

    # True only when the border leaf answered. An unreachable switch, a refused
    # login and a failed command all leave stdout empty, and the BGP rows then
    # read "not determined" rather than claiming the sessions are down.
    dc_bgp_determined: >-
      {{ (dc_verify_bgp_sessions | bool)
         and ((dc_bgp_output.stdout | default([]) | length) > 0) }}

    # The transport's own explanation, shown in the report when the read did not
    # happen, so the student is not left guessing between a VPN that is down and
    # a password that is wrong.
    dc_bgp_undetermined_reason: >-
      {{ dc_bgp_output.msg
         | default('stage 07b did not run, so nothing was read', true) }}
    # Same convention as the campus collection: evidence/ sits beside
    # playbooks/, and realpath collapses the ../ hop so the closing summary
    # prints a path worth copying.
    dc_evidence_path: "{{ (playbook_dir ~ '/../evidence/stage08-verification.md') | realpath }}"

  tasks:
    # ------------------------------------------------------- declared intent
    # Read from the same .nac.yaml files the create role consumes, so the report
    # can never drift from what was deployed. include_vars loads a YAML file
    # into a variable; delegate_to: localhost reads it from this machine.
    - name: Read the declared VRFs
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/vrfs.nac.yaml"
        name: dc_declared_vrf_model
      delegate_to: localhost

    - name: Read the declared networks
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/networks.nac.yaml"
        name: dc_declared_network_model
      delegate_to: localhost

    - name: Flatten the declared intent
      ansible.builtin.set_fact:
        dc_declared_vrfs: "{{ dc_declared_vrf_model.vxlan.overlay.vrfs | default([]) }}"
        dc_declared_networks: "{{ dc_declared_network_model.vxlan.overlay.networks | default([]) }}"
        dc_declared_vrf_attach_groups: >-
          {{ dc_declared_vrf_model.vxlan.overlay.vrf_attach_groups | default([]) }}
        dc_declared_network_attach_groups: >-
          {{ dc_declared_network_model.vxlan.overlay.network_attach_groups | default([]) }}

    # Naming no attach group at all is allowed: the object is attached to
    # nothing, and the comparisons below fail its row without help here. Naming
    # a group that does not exist is the dangerous case. The lookup then matches
    # nothing, the declared switch list comes back empty, and the
    # missing-switches and missing-attachments checks pass having proved nothing
    # - so a VRF attached to one leaf of two would be reported as a pass.
    # Checked before the first API call, so a typo reads as a typo. It is
    # deliberately not gated on dc_verify_fail_on_mismatch: that flag means
    # "report the mismatch instead of failing", and a model this stage cannot
    # resolve produces no report worth showing.
    - name: Fail on an attach group that is named but never declared
      ansible.builtin.assert:
        that:
          - unresolved_groups | length == 0
        fail_msg: >-
          DATA MODEL ERROR, not a fabric fault - do not go looking at the
          switches. {{ unresolved_groups | length }} attach group reference(s)
          in playbooks/host_vars/{{ inventory_hostname }} do not resolve.
          {{ unresolved_groups | join('. ') }}.
          Fix the spelling, or declare the missing group, then re-run stage 07.
      vars:
        vrf_group_names: >-
          {{ dc_declared_vrf_attach_groups | map(attribute='name') | list }}
        network_group_names: >-
          {{ dc_declared_network_attach_groups | map(attribute='name') | list }}
        # default('', true) is boolean mode so a key that is present but null
        # reads as absent rather than as a group literally named None.
        unresolved_groups: >-
          {%- set unresolved = [] -%}
          {%- for vrf in dc_declared_vrfs -%}
          {%- set named = vrf.vrf_attach_group | default('', true) -%}
          {%- if named and named not in vrf_group_names -%}
          {{- unresolved.append("VRF " ~ vrf.name ~ " names vrf_attach_group '"
              ~ named ~ "', which vrfs.nac.yaml does not declare (declared groups: "
              ~ (vrf_group_names | join(', ') | default('none', true)) ~ ")") or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {%- for net in dc_declared_networks -%}
          {%- set named = net.network_attach_group | default('', true) -%}
          {%- if named and named not in network_group_names -%}
          {{- unresolved.append("Network " ~ net.name ~ " names network_attach_group '"
              ~ named ~ "', which networks.nac.yaml does not declare (declared groups: "
              ~ (network_group_names | join(', ') | default('none', true)) ~ ")") or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ unresolved }}

    # ------------------------------------------------------- observed state
    - name: Read the fabric inventory
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/inventory/switchesByFabric"
      register: dc_observed_inventory
      changed_when: false

    - name: Read the fabric VRFs
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs"
      register: dc_observed_vrf_response
      changed_when: false

    - name: Read the fabric networks
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/networks"
      register: dc_observed_network_response
      changed_when: false

    - name: Read the VRF attachments
      cisco.dcnm.dcnm_rest:
        method: GET
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/attachments?vrf-names={{
          dc_declared_vrfs | map(attribute='name') | join(',') }}
      register: dc_observed_vrf_attachments
      changed_when: false
      when: dc_declared_vrfs | length > 0

    - name: Read the network attachments
      cisco.dcnm.dcnm_rest:
        method: GET
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/networks/attachments?network-names={{
          dc_declared_networks | map(attribute='name') | join(',') }}
      register: dc_observed_network_attachments
      changed_when: false
      when: dc_declared_networks | length > 0

    - name: Normalise the controller responses
      ansible.builtin.set_fact:
        dc_switches_observed: "{{ (dc_observed_inventory.response | default({})).DATA | default([]) }}"
        dc_vrfs_observed: "{{ (dc_observed_vrf_response.response | default({})).DATA | default([]) }}"
        dc_networks_observed: "{{ (dc_observed_network_response.response | default({})).DATA | default([]) }}"
        dc_vrf_attach_observed: "{{ (dc_observed_vrf_attachments.response | default({})).DATA | default([]) }}"
        dc_net_attach_observed: "{{ (dc_observed_network_attachments.response | default({})).DATA | default([]) }}"

    # ---------------------------------------------------------- comparisons
    # Each comparison loops over the declared objects and appends one result row
    # per object with set_fact, which saves a variable for later tasks. Both
    # sides of an object have to be in scope at once, which is clearer as an
    # explicit loop than as a chain of Jinja filters.
    - name: Compare each switch against intent
      ansible.builtin.set_fact:
        dc_switch_rows: "{{ dc_switch_rows | default([]) + [row] }}"
      loop: "{{ dc_switches }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        observed: >-
          {{ (dc_switches_observed
              | selectattr('ipAddress', 'defined')
              | selectattr('ipAddress', 'eq', item.management_ipv4_address)
              | list | first) | default({}) }}
        row:
          name: "{{ item.name }}"
          ip: "{{ item.management_ipv4_address }}"
          declared_role: "{{ item.role }}"
          observed_role: "{{ observed.switchRole | default('absent') }}"
          serial: "{{ observed.serialNumber | default('absent') }}"
          mode: "{{ observed.mode | default('unknown') }}"
          # ccStatus is reported when Nexus Dashboard supplies it and left as
          # 'not reported' otherwise. It is informational: the authoritative
          # deployment signal in this report is lanAttachState below.
          cc_status: "{{ observed.ccStatus | default('not reported') }}"
          ok: >-
            {{ (observed | length > 0)
               and (observed.switchRole | default('') | lower | replace(' ', '_')
                    == item.role | lower | replace(' ', '_')) }}

    - name: Compare VRFs
      ansible.builtin.set_fact:
        dc_vrf_rows: "{{ dc_vrf_rows | default([]) + [row] }}"
      loop: "{{ dc_declared_vrfs }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        observed: >-
          {{ (dc_vrfs_observed
              | selectattr('vrfName', 'defined')
              | selectattr('vrfName', 'eq', item.name)
              | list | first) | default({}) }}
        attachments: >-
          {{ (dc_vrf_attach_observed
              | selectattr('vrfName', 'defined')
              | selectattr('vrfName', 'eq', item.name)
              | map(attribute='lanAttachList') | flatten | list) }}
        # Nexus Dashboard enumerates every switch that could carry the VRF and
        # reports the ones it does not with isLanAttached: false and
        # lanAttachState: NA. NA is neither a fault nor a pending state, so only
        # the records the boolean calls attached are judged. Every field on an NA
        # record is null, so anything read off one needs default(x, true) - the
        # second argument makes default() substitute for an empty value as well
        # as an undefined one.
        #
        # The border leaf is in the dc_leaves attach group, so it appears here
        # like the two server leaves and a missing attachment on it is a real
        # missing_switches failure rather than a tolerated NA.
        #
        # The VRF-Lite extension is checked separately below. An attach group can
        # name a switch but never an extension, so no amount of model-derived
        # attachment checking can see whether the dot1q sub-interface and its BGP
        # neighbour exist.
        attached: >-
          {{ attachments
             | selectattr('isLanAttached', 'defined')
             | selectattr('isLanAttached') | list }}
        not_attached_switches: >-
          {%- set names = [] -%}
          {%- for a in attachments if not (a.isLanAttached | default(false, true)) -%}
          {{- names.append(a.switchName | default('unknown', true)) or '' -}}
          {%- endfor -%}
          {{ names }}
        attach_states: >-
          {{ attached
             | selectattr('lanAttachState', 'defined')
             | map(attribute='lanAttachState') | list }}
        attach_group_switches: >-
          {{ (dc_declared_vrf_attach_groups
              | selectattr('name', 'eq', item.vrf_attach_group | default(''))
              | map(attribute='switches') | flatten | list) }}
        # Ignoring the NA records would make the check vacuous on its own - a VRF
        # attached to nothing would look like one attached everywhere it was
        # declared - so the declared attach group is compared against the set
        # that is actually attached, the way the networks task compares its
        # switch-and-port pairs. Declared hostnames keep their casing for the
        # report and are compared case-insensitively, because Nexus Dashboard is
        # inconsistent about it.
        attached_switches: >-
          {%- set names = [] -%}
          {%- for a in attached -%}
          {{- names.append((a.switchName | default('', true)) | lower) or '' -}}
          {%- endfor -%}
          {{ names }}
        missing_switches: >-
          {%- set missing = [] -%}
          {%- for sw in attach_group_switches
                if (sw.hostname | default('')) | lower not in attached_switches -%}
          {{- missing.append(sw.hostname | default('')) or '' -}}
          {%- endfor -%}
          {{ missing }}
        row:
          name: "{{ item.name }}"
          declared_id: "{{ item.vrf_id }}"
          observed_id: "{{ observed.vrfId | default('absent') }}"
          declared_switches: "{{ attach_group_switches | map(attribute='hostname') | list }}"
          missing_switches: "{{ missing_switches }}"
          not_attached_switches: "{{ not_attached_switches }}"
          attach_states: "{{ attach_states }}"
          ok: >-
            {{ (observed | length > 0)
               and (observed.vrfId | default(0) | int == item.vrf_id | int)
               and (attached | length > 0)
               and (attach_states | reject('eq', 'DEPLOYED') | list | length == 0)
               and (missing_switches | length == 0) }}

    - name: Compare networks
      ansible.builtin.set_fact:
        dc_network_rows: "{{ dc_network_rows | default([]) + [row] }}"
      loop: "{{ dc_declared_networks }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        observed: >-
          {{ (dc_networks_observed
              | selectattr('networkName', 'defined')
              | selectattr('networkName', 'eq', item.name)
              | list | first) | default({}) }}
        # The gateway lives inside networkTemplateConfig, which Nexus Dashboard
        # returns as a JSON *string*, not as a nested object.
        observed_config: >-
          {{ (observed.networkTemplateConfig | default('{}') | from_json)
             if (observed.networkTemplateConfig | default('')) is string
             else (observed.networkTemplateConfig | default({})) }}
        attachments: >-
          {{ (dc_net_attach_observed
              | selectattr('networkName', 'defined')
              | selectattr('networkName', 'eq', item.name)
              | map(attribute='lanAttachList') | flatten | list) }}
        # Same partition as Compare VRFs: the controller lists every switch
        # that could carry the network and marks the ones it has not attached
        # NA, so only the isLanAttached records are judged.
        attached: >-
          {{ attachments
             | selectattr('isLanAttached', 'defined')
             | selectattr('isLanAttached') | list }}
        not_attached_switches: >-
          {%- set names = [] -%}
          {%- for a in attachments if not (a.isLanAttached | default(false, true)) -%}
          {{- names.append(a.switchName | default('unknown', true)) or '' -}}
          {%- endfor -%}
          {{ names }}
        attach_states: >-
          {{ attached
             | selectattr('lanAttachState', 'defined')
             | map(attribute='lanAttachState') | list }}
        attach_group_switches: >-
          {{ (dc_declared_network_attach_groups
              | selectattr('name', 'eq', item.network_attach_group | default(''))
              | map(attribute='switches') | flatten | list) }}
        # Attachments are compared as switch-and-port pairs, not as a flat list
        # of port names. The guide attaches each port-channel on *both* leaves,
        # and a network that landed on only one of them is a real fault that a
        # fabric-wide "is this port named anywhere" check waves through.
        # Declared pairs keep their original casing so the report reads the way
        # the model is written; the comparison is done case-insensitively
        # because Nexus Dashboard is inconsistent about it.
        declared_attachments: >-
          {%- set pairs = [] -%}
          {%- for sw in attach_group_switches -%}
          {%- for port in sw.ports | default([]) -%}
          {{- pairs.append(sw.hostname ~ '|' ~ port) or '' -}}
          {%- endfor -%}
          {%- endfor -%}
          {{ pairs }}
        # default('', true) is boolean mode on purpose: portNames is present
        # but null on the switches the controller lists without attaching,
        # and plain default() only ever substitutes for undefined.
        observed_attachments: >-
          {%- set pairs = [] -%}
          {%- for a in attached -%}
          {%- for port in (a.portNames | default('', true)).split(',') if port | trim -%}
          {{- pairs.append((a.switchName | default('') ~ '|' ~ port | trim) | lower) or '' -}}
          {%- endfor -%}
          {%- endfor -%}
          {{ pairs }}
        missing_attachments: >-
          {%- set missing = [] -%}
          {%- for pair in declared_attachments if pair | lower not in observed_attachments -%}
          {{- missing.append(pair) or '' -}}
          {%- endfor -%}
          {{ missing }}
        row:
          name: "{{ item.name }}"
          declared_vrf: "{{ item.vrf_name }}"
          observed_vrf: "{{ observed.vrf | default('absent') }}"
          declared_gateway: "{{ item.gw_ip_address }}"
          observed_gateway: "{{ observed_config.gatewayIpAddress | default('absent') }}"
          declared_attachments: "{{ declared_attachments }}"
          missing_attachments: "{{ missing_attachments }}"
          not_attached_switches: "{{ not_attached_switches }}"
          attach_states: "{{ attach_states }}"
          ok: >-
            {{ (observed | length > 0)
               and (observed.vrf | default('') == item.vrf_name)
               and (observed_config.gatewayIpAddress | default('') == item.gw_ip_address)
               and (attached | length > 0)
               and (attach_states | reject('eq', 'DEPLOYED') | list | length == 0)
               and (missing_attachments | length == 0) }}

    # A VRF-Lite extension is the one part of the fabric that stage 02 can
    # silently undo: its create role runs dcnm_vrf with state: replaced, which
    # clears extensionValues on an attachment whose extension the data model
    # cannot describe. An attach group can name the border leaf but never the
    # extension, so without this comparison the regression is invisible here -
    # the VRF exists, all three leaves are attached and DEPLOYED, and external
    # connectivity is simply gone.
    #
    # extensionValues is a JSON document encoded into a string field, and its
    # inner keys (VRF_LITE_CONN, IF_NAME, DOT1Q_ID, IP_MASK, NEIGHBOR_IP) are an
    # NDFC implementation detail rather than a documented contract. So the three
    # declared values are matched as substrings of the raw field rather than by
    # walking a parsed structure. A schema change then costs a false failure
    # that is obvious in the report, rather than a check that silently passes
    # because a renamed key read as absent on both sides.
    - name: Compare the VRF-Lite extensions
      ansible.builtin.set_fact:
        dc_vrf_lite_rows: "{{ dc_vrf_lite_rows | default([]) + [row] }}"
      loop: "{{ dc_vrf_lite_extensions | default([]) }}"
      loop_control:
        label: "{{ item.vrf }}"
      vars:
        border_attachment: >-
          {{ (dc_vrf_attach_observed
              | selectattr('vrfName', 'defined')
              | selectattr('vrfName', 'eq', item.vrf)
              | map(attribute='lanAttachList') | flatten
              | selectattr('switchName', 'defined')
              | selectattr('switchName', 'equalto', dc_vrf_lite_border_leaf)
              | list | first) | default({}) }}
        extension_values: "{{ border_attachment.extensionValues | default('', true) }}"
        row:
          name: "VRF-Lite {{ item.vrf }} on {{ dc_vrf_lite_border_leaf }}"
          attached: "{{ border_attachment.isLanAttached | default(false, true) }}"
          state: "{{ border_attachment.lanAttachState | default('absent', true) }}"
          declared: >-
            {{ dc_vrf_lite_interface }} dot1q {{ item.dot1q }}
            {{ item.ipv4_addr }} -> {{ item.neighbor_ipv4 }}
          interface_seen: "{{ dc_vrf_lite_interface in extension_values }}"
          dot1q_seen: "{{ ('\"' ~ item.dot1q ~ '\"') in extension_values }}"
          neighbor_seen: "{{ item.neighbor_ipv4 in extension_values }}"
          ok: >-
            {{ (border_attachment.isLanAttached | default(false, true) | bool)
               and (border_attachment.lanAttachState | default('', true) == 'DEPLOYED')
               and (dc_vrf_lite_interface in extension_values)
               and (('"' ~ item.dot1q ~ '"') in extension_values)
               and (item.neighbor_ipv4 in extension_values) }}

    # Everything above is the controller's opinion. A VRF-Lite extension that is
    # attached and DEPLOYED means Nexus Dashboard pushed a sub-interface and a
    # neighbour statement; it does not mean the neighbour answered. The two come
    # apart routinely, because the far end of these three links is pre-built by
    # the pod and Nexus Dashboard never writes to it - an address or dot1q tag
    # that does not match the router leaves the leaf configured exactly as
    # declared, with a session that never leaves Idle.
    #
    # So this check reads the switch. Stage 07b collected the output; the work
    # here is picking each declared neighbour out of it.
    #
    # Nexus Dashboard has no API for this. Its LAN API is an intent and
    # provisioning surface plus config compliance, and nothing in it reports
    # routing protocol state - see "Why the BGP check uses SSH" in the README.
    #
    # Three outcomes, and the third is not the second: Established, down (any
    # other state, or no such session on the switch), and not determined,
    # meaning the border leaf did not answer. Only the first two are counted or
    # judged.
    - name: Compare the VRF-Lite BGP sessions against intent
      ansible.builtin.set_fact:
        dc_bgp_rows: "{{ dc_bgp_rows | default([]) + [row] }}"
      loop: "{{ dc_vrf_lite_extensions | default([]) }}"
      loop_control:
        label: "{{ item.vrf }} to {{ item.neighbor_ipv4 }}"
        # index_var exposes the loop position, which is how each command's
        # output is matched to the extension that asked for it.
        index_var: dc_bgp_index
      vars:
        # stdout holds one entry per command sent, in the order they were sent,
        # and that order is the order of dc_vrf_lite_extensions - so entry N
        # belongs to extension N. The length test avoids reading past the end
        # when the read did not happen.
        raw: >-
          {{ (dc_bgp_output.stdout | default([]))[dc_bgp_index]
             if ((dc_bgp_output.stdout | default([]) | length) > dc_bgp_index)
             else '' }}
        # A VRF the switch does not have returns an empty string, so the mapping
        # test is what separates "no such VRF" from a real answer.
        vrf_table: "{{ (raw.TABLE_vrf | default({})) if raw is mapping else {} }}"
        # NX-OS returns ROW_vrf and ROW_neighbor as a single object when there is
        # one of them and as a list when there are several. Both shapes are
        # wrapped into a list so the lookups below do not have to care.
        vrf_rows: >-
          {%- set r = vrf_table.ROW_vrf | default([]) -%}
          {{ [r] if r is mapping else r }}
        # The switch reports vrf-name-out in lower case ("prod") where the data
        # model declares PROD, so the two names are compared case-insensitively.
        vrf_row: >-
          {%- set matched = [] -%}
          {%- for v in vrf_rows
                if ((v['vrf-name-out'] | default('', true)) | lower
                    == item.vrf | lower) -%}
          {{- matched.append(v) or '' -}}
          {%- endfor -%}
          {{ (matched | first) | default({}, true) }}
        neighbor_rows: >-
          {%- set n = (vrf_row.TABLE_neighbor | default({})).ROW_neighbor
                      | default([]) -%}
          {{ [n] if n is mapping else n }}
        # Matched on the exact neighbour address declared in dc_vrf_lite.yml.
        # Every value in this output is a string even where it reads as a number,
        # so the address is compared as text and the peer ASN is reported as
        # text.
        neighbor_row: >-
          {%- set matched = [] -%}
          {%- for n in neighbor_rows
                if (n['neighbor-id'] | default('', true)) == item.neighbor_ipv4 -%}
          {{- matched.append(n) or '' -}}
          {%- endfor -%}
          {{ (matched | first) | default({}, true) }}
        # 'absent' is a distinct answer from a state name: it means the switch
        # answered and has no session to this neighbour in this VRF at all.
        observed_state: "{{ neighbor_row.state | default('absent', true) }}"
        row:
          name: "BGP session {{ item.vrf }} to {{ item.neighbor_ipv4 }}"
          vrf: "{{ item.vrf }}"
          neighbor: "{{ item.neighbor_ipv4 }}"
          expected_state: Established
          observed_state: "{{ observed_state if dc_bgp_determined | bool else 'not determined' }}"
          # The peer ASN is reported, not asserted: dc_vrf_lite.yml declares no
          # ASN, so there is nothing to compare it against. It is here because
          # the wrong AS on the far end is a common reason a session sits in
          # Idle or Active.
          peer_as: >-
            {{ (neighbor_row.remoteas | default('not reported', true))
               if dc_bgp_determined | bool else 'not determined' }}
          determined: "{{ dc_bgp_determined | bool }}"
          ok: "{{ observed_state == 'Established' }}"
      when: dc_verify_bgp_sessions | bool

    # Rows the border leaf never answered for are left out of both the failure
    # list and the total, so an unreachable switch neither fails the run nor
    # inflates the "all checks match" count with checks that were not made.
    - name: Collect the failures
      ansible.builtin.set_fact:
        dc_failed_rows: >-
          {{ (dc_switch_rows | default([]) | rejectattr('ok') | list)
             + (dc_vrf_rows | default([]) | rejectattr('ok') | list)
             + (dc_network_rows | default([]) | rejectattr('ok') | list)
             + (dc_vrf_lite_rows | default([]) | rejectattr('ok') | list)
             + (dc_bgp_rows | default([]) | selectattr('determined')
                | rejectattr('ok') | list) }}
        dc_total_checks: >-
          {{ (dc_switch_rows | default([]) | length)
             + (dc_vrf_rows | default([]) | length)
             + (dc_network_rows | default([]) | length)
             + (dc_vrf_lite_rows | default([]) | length)
             + (dc_bgp_rows | default([]) | selectattr('determined')
                | list | length) }}
        dc_bgp_undetermined_rows: >-
          {{ dc_bgp_rows | default([]) | rejectattr('determined') | list }}

    # ------------------------------------------------------------- evidence
    - name: Make sure the evidence directory exists
      ansible.builtin.file:
        path: "{{ dc_evidence_path | dirname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Write the verification report
      ansible.builtin.template:
        src: templates/stage08-verification.md.j2
        dest: "{{ dc_evidence_path }}"
        mode: "0644"
      delegate_to: localhost
      vars:
        dc_verify_timestamp: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Report the outcome
      ansible.builtin.debug:
        msg: >-
          {{ dc_total_checks | int - dc_failed_rows | length }} of
          {{ dc_total_checks }} check(s) match the declared intent.
          Report: {{ dc_evidence_path }}

    # Said out loud rather than left to the report, because a run that could not
    # read the switch still ends in a green "all checks match" for everything it
    # could read, and that is easy to mistake for a fabric that works.
    - name: Say so when the BGP sessions could not be read
      ansible.builtin.debug:
        msg: >-
          {{ dc_bgp_undetermined_rows | length }} BGP session(s) were NOT
          checked, because {{ dc_vrf_lite_border_leaf }} did not answer:
          {{ dc_bgp_undetermined_reason }}.
          Those sessions are neither up nor down as far as this run knows.
          This stage reaches the switch over SSH, so check that the client VPN
          is up and that {{ dc_vrf_lite_border_leaf }} answers on the management
          address declared for it in
          inventory/group_vars/all/dc_switches.yml. To compare only what the
          controller knows and drop these rows, re-run with
          -e dc_verify_bgp_sessions=false. Everything else in this report came
          from Nexus Dashboard and is unaffected.
      when: dc_bgp_undetermined_rows | length > 0

    - name: Fail on any mismatch
      ansible.builtin.assert:
        that:
          - dc_failed_rows | length == 0
        fail_msg: >-
          {{ dc_failed_rows | length }} check(s) do not match intent:
          {{ dc_failed_rows | map(attribute='name') | join(', ') }}.
          See {{ dc_evidence_path }}.
        success_msg: >-
          All {{ dc_total_checks }} evaluated check(s) match the declared intent.
          {%- if dc_bgp_undetermined_rows | length > 0 %}
          The {{ dc_bgp_undetermined_rows | length }} BGP session check(s) the
          border leaf did not answer for are not among them.
          {%- endif %}
      when: dc_verify_fail_on_mismatch | bool
