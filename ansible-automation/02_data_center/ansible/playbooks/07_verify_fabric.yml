---
# Stage 07 - read-only check that the deployed fabric matches the declared intent; writes reports to evidence/.
# Most checks ask Nexus Dashboard; BGP and sub-interfaces are read off the border leaf ("deployed" is not "BGP is up").
# Run from ansible-automation/02_data_center/ansible: ansible-playbook playbooks/07_verify_fabric.yml

- name: Stage 07a - name the border leaf as the target of the BGP session check
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    # Set false (-e dc_verify_bgp_sessions=false) to skip the SSH read of the switch.
    # The report then says the BGP check was skipped instead of guessing.
    dc_verify_bgp_sessions: true

  tasks:
    # Adds the border leaf to the switch group that already holds the SSH settings
    # and vault credentials, using its management address from dc_switches.yml.
    - name: Add the border leaf to the switch group so it can be read over SSH
      ansible.builtin.add_host:
        name: "{{ dc_vrf_lite_border_leaf }}"
        groups: dc_fabric_switches
        ansible_host: >-
          {{ (dc_switches | default([])
              | selectattr('name', 'eq', dc_vrf_lite_border_leaf)
              | map(attribute='management_ipv4_address')
              | list | first) | default(dc_vrf_lite_border_leaf, true) }}
      changed_when: false
      when:
        - dc_verify_bgp_sessions | bool
        - dc_vrf_lite_extensions | default([]) | length > 0

- name: Stage 07b - read the VRF-Lite BGP session state off the border leaf
  # Only the border leaf is read. The play targets the whole switch group because
  # that is where the SSH credentials live; skipped hosts open no SSH session.
  hosts: dc_fabric_switches
  gather_facts: false
  # Play variables do not carry over to the next play, so defaults are repeated.
  vars:
    dc_verify_bgp_sessions: true
    dc_verify_subinterfaces: true
  # If the border leaf cannot be reached, keep going: every other check uses the
  # controller API, so an unreachable switch is reported as "not determined", not down.
  ignore_unreachable: true

  tasks:
    # Ask the border leaf for each VRF-Lite BGP neighbour's state, as structured JSON.
    # The VRF name is needed because VRF-Lite peerings live inside their VRF.
    # Retries give a session time to come up; errors are left for the next play to judge.
    - name: Ask the border leaf for the BGP session state of each VRF-Lite VRF
      cisco.nxos.nxos_command:
        commands:
          - command: "show bgp sessions vrf {{ item.vrf }}"
            output: json
      loop: "{{ dc_vrf_lite_extensions | default([]) }}"
      loop_control:
        label: "{{ item.vrf }} to {{ item.neighbor_ipv4 }}"
      register: dc_bgp_session_output
      changed_when: false
      ignore_errors: true
      retries: 3
      delay: 5
      until: dc_bgp_session_established | bool
      when:
        - dc_verify_bgp_sessions | bool
        - inventory_hostname == dc_vrf_lite_border_leaf
      vars:
        dc_bgp_session_established: >-
          {%- set raw = (dc_bgp_session_output.stdout | default([]) | first) | default({}) -%}
          {%- set table = raw.get('TABLE_vrf', {}) if raw is mapping else {} -%}
          {%- set vrfs = table.get('ROW_vrf', []) -%}
          {%- set vrfs = [vrfs] if vrfs is mapping else vrfs -%}
          {%- set matched = [] -%}
          {%- for vrf in vrfs
            if (vrf.get('vrf-name-out', '') | lower) == (item.vrf | lower) -%}
          {%- set neighbors = vrf.get('TABLE_neighbor', {}).get('ROW_neighbor', []) -%}
          {%- set neighbors = [neighbors] if neighbors is mapping else neighbors -%}
          {%- for neighbor in neighbors
            if neighbor.get('neighbor-id', '') == item.neighbor_ipv4
           and neighbor.get('state', '') == 'Established' -%}
          {{- matched.append(neighbor) or '' -}}
          {%- endfor -%}
          {%- endfor -%}
          {{ matched | length > 0 }}

    # The controller can say DEPLOYED while the switch disagrees, so read each
    # VRF-Lite sub-interface off the switch too. pyATS/Genie parses the output
    # into named fields (VLAN tag, address, MTU, up/down) instead of screen text.
    - name: Read each VRF-Lite sub-interface off the border leaf
      ansible.utils.cli_parse:
        command: "show interface {{ dc_vrf_lite_interface }}.{{ item.dot1q }}"
        parser:
          name: ansible.netcommon.pyats
      loop: "{{ dc_vrf_lite_extensions | default([]) }}"
      loop_control:
        label: "{{ dc_vrf_lite_interface }}.{{ item.dot1q }}"
      register: dc_subinterface_output
      changed_when: false
      ignore_errors: true
      when:
        - dc_verify_subinterfaces | bool
        - inventory_hostname == dc_vrf_lite_border_leaf

- name: Stage 07c - compare the fabric against intent and write the report
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    ansible_network_os: cisco.nd.nd
    ndfc_api_root: /appcenter/cisco/ndfc/api/v1/lan-fabric
    nd_manage_root: /api/v1/manage
    dc_verify_fail_on_mismatch: true
    dc_verify_bgp_sessions: true
    dc_verify_subinterfaces: true

    # Results that stage 07b saved on the border leaf (empty if it never ran).
    dc_bgp_output: >-
      {{ (hostvars[dc_vrf_lite_border_leaf].dc_bgp_session_output | default({}))
         if dc_vrf_lite_border_leaf in hostvars else {} }}
    dc_bgp_results: "{{ dc_bgp_output.results | default([]) }}"

    dc_subinterface_results: >-
      {{ ((hostvars[dc_vrf_lite_border_leaf].dc_subinterface_output | default({})).results | default([]))
         if dc_vrf_lite_border_leaf in hostvars else [] }}

    # Why the switch could not be read (e.g. VPN down, bad password), shown in the report.
    dc_bgp_undetermined_reason: >-
      {{ (dc_bgp_results | selectattr('msg', 'defined')
          | map(attribute='msg') | unique | join('; '))
         | default(dc_bgp_output.msg
                   | default('stage 07b did not run, so nothing was read', true), true) }}
    # Reports go to evidence/ beside playbooks/, named with the run time.
    dc_evidence_path: "{{ (playbook_dir ~ '/../evidence/stage07-verification-' ~ dc_evidence_run_id ~ '.md') | realpath }}"
    dc_evidence_html_path: "{{ (playbook_dir ~ '/../evidence/stage07-verification-' ~ dc_evidence_run_id ~ '.html') | realpath }}"
    dc_evidence_l3out_path: "{{ (playbook_dir ~ '/../evidence/stage07-l3outs-' ~ dc_evidence_run_id ~ '.json') | realpath }}"

  tasks:
    # ------------------------------------------------------- declared intent
    # Load the same .nac.yaml model files that built the fabric, so the report
    # always compares against exactly what was meant to be deployed.
    - name: Read the declared VRFs
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/vrfs.nac.yaml"
        name: dc_declared_vrf_model
      delegate_to: localhost

    - name: Read the declared networks
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/networks.nac.yaml"
        name: dc_declared_network_model
      delegate_to: localhost

    - name: Flatten the declared intent
      ansible.builtin.set_fact:
        dc_declared_vrfs: "{{ dc_declared_vrf_model.vxlan.overlay.vrfs | default([]) }}"
        dc_declared_networks: "{{ dc_declared_network_model.vxlan.overlay.networks | default([]) }}"
        dc_declared_vrf_attach_groups: >-
          {{ dc_declared_vrf_model.vxlan.overlay.vrf_attach_groups | default([]) }}
        dc_declared_network_attach_groups: >-
          {{ dc_declared_network_model.vxlan.overlay.network_attach_groups | default([]) }}

    # Stop early if a VRF or network names an attach group that does not exist.
    # Otherwise its switch list would be empty and the attachment checks would pass
    # without proving anything. This is a typo in the model, not a fabric fault.
    - name: Fail on an attach group that is named but never declared
      ansible.builtin.assert:
        that:
          - unresolved_groups | length == 0
        fail_msg: >-
          DATA MODEL ERROR, not a fabric fault - do not go looking at the
          switches. {{ unresolved_groups | length }} attach group reference(s)
          in playbooks/host_vars/{{ inventory_hostname }} do not resolve.
          {{ unresolved_groups | join('. ') }}.
          Fix the spelling, or declare the missing group, then re-run stage 07.
      vars:
        vrf_group_names: >-
          {{ dc_declared_vrf_attach_groups | map(attribute='name') | list }}
        network_group_names: >-
          {{ dc_declared_network_attach_groups | map(attribute='name') | list }}
        # A group key that is present but empty counts as "no group named".
        unresolved_groups: >-
          {%- set unresolved = [] -%}
          {%- for vrf in dc_declared_vrfs -%}
          {%- set named = vrf.vrf_attach_group | default('', true) -%}
          {%- if named and named not in vrf_group_names -%}
          {{- unresolved.append("VRF " ~ vrf.name ~ " names vrf_attach_group '"
              ~ named ~ "', which vrfs.nac.yaml does not declare (declared groups: "
              ~ (vrf_group_names | join(', ') | default('none', true)) ~ ")") or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {%- for net in dc_declared_networks -%}
          {%- set named = net.network_attach_group | default('', true) -%}
          {%- if named and named not in network_group_names -%}
          {{- unresolved.append("Network " ~ net.name ~ " names network_attach_group '"
              ~ named ~ "', which networks.nac.yaml does not declare (declared groups: "
              ~ (network_group_names | join(', ') | default('none', true)) ~ ")") or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ unresolved }}

    # ------------------------------------------------------- observed state
    # Read what the controller actually has: switches (with their roles), VRFs,
    # networks, and which switches and ports each one is attached to.
    - name: Read the fabric inventory
      cisco.nd.nd_rest:
        method: get
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/inventory/switchesByFabric"
      register: dc_observed_inventory
      changed_when: false

    - name: Read the fabric VRFs
      cisco.nd.nd_rest:
        method: get
        path: "{{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs"
      register: dc_observed_vrf_response
      changed_when: false

    - name: Read the fabric networks
      cisco.nd.nd_rest:
        method: get
        path: "{{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/networks"
      register: dc_observed_network_response
      changed_when: false

    # One record per switch per VRF, saying whether it is attached and deployed.
    - name: Read the VRF attachments
      cisco.nd.nd_rest:
        method: get
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/attachments?vrf-names={{
          dc_declared_vrfs | map(attribute='name') | join(',') }}
      register: dc_observed_vrf_attachments
      changed_when: false
      when: dc_declared_vrfs | length > 0

    # ------------------------------------------------------------ L3Outs
    # An L3Out is the external VRF-Lite handoff on the border leaf. Rebuild the
    # definitions stage 05 wrote, using the same task file, so they match exactly.
    - name: Build the declared L3Out definitions
      ansible.builtin.include_tasks: tasks/l3out_config.yml
      vars:
        dc_l3out_rows: "{{ dc_vrf_lite_extensions | default([]) }}"
      when: dc_vrf_lite_extensions | default([]) | length > 0

    # check_mode makes the module compare without writing anything:
    # "changed" would mean the controller differs from the declared L3Out.
    - name: Compare the L3Outs on the controller with the declared definitions
      cisco.nd.nd_manage_l3out:
        fabric_name: "{{ dc_fabric_name }}"
        state: merged
        config: "{{ dc_l3out_config }}"
      check_mode: true
      register: dc_observed_l3out
      when: dc_vrf_lite_extensions | default([]) | length > 0

    # Raw read of the L3Outs, kept because it is the only place that says whether
    # each L3Out is attached. It is also saved beside the report as evidence.
    - name: Read the raw L3Out collection
      cisco.nd.nd_rest:
        path: "{{ nd_manage_root }}/l3Outs?fabricName={{ dc_fabric_name }}"
        method: get
      register: dc_observed_l3out_raw
      changed_when: false
      when: dc_vrf_lite_extensions | default([]) | length > 0

    - name: Index the controller's L3Outs by name
      ansible.builtin.set_fact:
        dc_vrf_lite_extension_state: >-
          {{ dict((dc_observed_l3out.before | default([]))
                  | map(attribute='name')
                  | zip(dc_observed_l3out.before | default([]))) }}
      when: dc_vrf_lite_extensions | default([]) | length > 0

    # Same as for VRFs, plus the ports (port-channels) each network uses on each switch.
    - name: Read the network attachments
      cisco.nd.nd_rest:
        method: get
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/networks/attachments?network-names={{
          dc_declared_networks | map(attribute='name') | join(',') }}
      register: dc_observed_network_attachments
      changed_when: false
      when: dc_declared_networks | length > 0

    - name: Normalise the controller responses
      ansible.builtin.set_fact:
        dc_switches_observed: "{{ dc_observed_inventory.jsondata | default([], true) }}"
        dc_vrfs_observed: "{{ dc_observed_vrf_response.jsondata | default([], true) }}"
        dc_networks_observed: "{{ dc_observed_network_response.jsondata | default([], true) }}"
        dc_vrf_attach_observed: "{{ dc_observed_vrf_attachments.jsondata | default([], true) }}"
        dc_net_attach_observed: "{{ dc_observed_network_attachments.jsondata | default([], true) }}"

    # ---------------------------------------------------------- comparisons
    # Each check builds one pass/fail row per declared object. Mismatches are
    # collected and reported first; the run only fails at the very end.
    - name: Compare each switch against intent
      ansible.builtin.set_fact:
        dc_switch_rows: "{{ dc_switch_rows | default([]) + [row] }}"
      loop: "{{ dc_switches }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        observed: >-
          {{ (dc_switches_observed
              | selectattr('ipAddress', 'defined')
              | selectattr('ipAddress', 'eq', item.management_ipv4_address)
              | list | first) | default({}) }}
        row:
          name: "{{ item.name }}"
          ip: "{{ item.management_ipv4_address }}"
          declared_role: "{{ item.role }}"
          observed_role: "{{ observed.switchRole | default('absent') }}"
          serial: "{{ observed.serialNumber | default('absent') }}"
          mode: "{{ observed.mode | default('unknown') }}"
          # Informational only; the deploy state of attachments is the real signal.
          cc_status: "{{ observed.ccStatus | default('not reported') }}"
          ok: >-
            {{ (observed | length > 0)
               and (observed.switchRole | default('') | lower | replace(' ', '_')
                    == item.role | lower | replace(' ', '_')) }}

    - name: Compare VRFs
      ansible.builtin.set_fact:
        dc_vrf_rows: "{{ dc_vrf_rows | default([]) + [row] }}"
      loop: "{{ dc_declared_vrfs }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        observed: >-
          {{ (dc_vrfs_observed
              | selectattr('vrfName', 'defined')
              | selectattr('vrfName', 'eq', item.name)
              | list | first) | default({}) }}
        attachments: >-
          {{ (dc_vrf_attach_observed
              | selectattr('vrfName', 'defined')
              | selectattr('vrfName', 'eq', item.name)
              | map(attribute='lanAttachList') | flatten | list) }}
        # The controller lists every switch that could carry the VRF; ones it has not
        # attached show as NA. Only attached switches are judged for DEPLOYED. The L3Out
        # (external handoff) is checked separately, since attach groups cannot describe it.
        attached: >-
          {{ attachments
             | selectattr('isLanAttached', 'defined')
             | selectattr('isLanAttached') | list }}
        not_attached_switches: >-
          {%- set names = [] -%}
          {%- for a in attachments if not (a.isLanAttached | default(false, true)) -%}
          {{- names.append(a.switchName | default('unknown', true)) or '' -}}
          {%- endfor -%}
          {{ names }}
        attach_states: >-
          {{ attached
             | selectattr('lanAttachState', 'defined')
             | map(attribute='lanAttachState') | list }}
        attach_group_switches: >-
          {{ (dc_declared_vrf_attach_groups
              | selectattr('name', 'eq', item.vrf_attach_group | default(''))
              | map(attribute='switches') | flatten | list) }}
        # A required switch with no attachment is still a failure, so compare the
        # declared attach group with the attached switches (names ignore case).
        attached_switches: >-
          {%- set names = [] -%}
          {%- for a in attached -%}
          {{- names.append((a.switchName | default('', true)) | lower) or '' -}}
          {%- endfor -%}
          {{ names }}
        missing_switches: >-
          {%- set missing = [] -%}
          {%- for sw in attach_group_switches
                if (sw.hostname | default('')) | lower not in attached_switches -%}
          {{- missing.append(sw.hostname | default('')) or '' -}}
          {%- endfor -%}
          {{ missing }}
        row:
          name: "{{ item.name }}"
          declared_id: "{{ item.vrf_id }}"
          observed_id: "{{ observed.vrfId | default('absent') }}"
          declared_switches: "{{ attach_group_switches | map(attribute='hostname') | list }}"
          missing_switches: "{{ missing_switches }}"
          not_attached_switches: "{{ not_attached_switches }}"
          attach_states: "{{ attach_states }}"
          ok: >-
            {{ (observed | length > 0)
               and (observed.vrfId | default(0) | int == item.vrf_id | int)
               and (attached | length > 0)
               and (attach_states | reject('eq', 'DEPLOYED') | list | length == 0)
               and (missing_switches | length == 0) }}

    # A network passes when it exists in the declared VRF with the declared gateway,
    # every declared switch-and-port pair is attached, and every attachment is DEPLOYED.
    - name: Compare networks
      ansible.builtin.set_fact:
        dc_network_rows: "{{ dc_network_rows | default([]) + [row] }}"
      loop: "{{ dc_declared_networks }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        observed: >-
          {{ (dc_networks_observed
              | selectattr('networkName', 'defined')
              | selectattr('networkName', 'eq', item.name)
              | list | first) | default({}) }}
        # The gateway is stored inside a JSON text field, so it is decoded first.
        observed_config: >-
          {{ (observed.networkTemplateConfig | default('{}') | from_json)
             if (observed.networkTemplateConfig | default('')) is string
             else (observed.networkTemplateConfig | default({})) }}
        attachments: >-
          {{ (dc_net_attach_observed
              | selectattr('networkName', 'defined')
              | selectattr('networkName', 'eq', item.name)
              | map(attribute='lanAttachList') | flatten | list) }}
        # Same idea as Compare VRFs: only attached switches are judged.
        attached: >-
          {{ attachments
             | selectattr('isLanAttached', 'defined')
             | selectattr('isLanAttached') | list }}
        not_attached_switches: >-
          {%- set names = [] -%}
          {%- for a in attachments if not (a.isLanAttached | default(false, true)) -%}
          {{- names.append(a.switchName | default('unknown', true)) or '' -}}
          {%- endfor -%}
          {{ names }}
        attach_states: >-
          {{ attached
             | selectattr('lanAttachState', 'defined')
             | map(attribute='lanAttachState') | list }}
        attach_group_switches: >-
          {{ (dc_declared_network_attach_groups
              | selectattr('name', 'eq', item.network_attach_group | default(''))
              | map(attribute='switches') | flatten | list) }}
        # Compare switch-and-port pairs, not just port names: each port-channel must
        # be attached on both leaves, and a network on only one leaf is a real fault.
        declared_attachments: >-
          {%- set pairs = [] -%}
          {%- for sw in attach_group_switches -%}
          {%- for port in sw.ports | default([]) -%}
          {{- pairs.append(sw.hostname ~ '|' ~ port) or '' -}}
          {%- endfor -%}
          {%- endfor -%}
          {{ pairs }}
        # Switches that are listed but not attached have no ports, so treat that as empty.
        observed_attachments: >-
          {%- set pairs = [] -%}
          {%- for a in attached -%}
          {%- for port in (a.portNames | default('', true)).split(',') if port | trim -%}
          {{- pairs.append((a.switchName | default('') ~ '|' ~ port | trim) | lower) or '' -}}
          {%- endfor -%}
          {%- endfor -%}
          {{ pairs }}
        missing_attachments: >-
          {%- set missing = [] -%}
          {%- for pair in declared_attachments if pair | lower not in observed_attachments -%}
          {{- missing.append(pair) or '' -}}
          {%- endfor -%}
          {{ missing }}
        row:
          name: "{{ item.name }}"
          declared_vrf: "{{ item.vrf_name }}"
          observed_vrf: "{{ observed.vrf | default('absent') }}"
          declared_gateway: "{{ item.gw_ip_address }}"
          observed_gateway: "{{ observed_config.gatewayIpAddress | default('absent') }}"
          declared_attachments: "{{ declared_attachments }}"
          missing_attachments: "{{ missing_attachments }}"
          not_attached_switches: "{{ not_attached_switches }}"
          attach_states: "{{ attach_states }}"
          ok: >-
            {{ (observed | length > 0)
               and (observed.vrf | default('') == item.vrf_name)
               and (observed_config.gatewayIpAddress | default('') == item.gw_ip_address)
               and (attached | length > 0)
               and (attach_states | reject('eq', 'DEPLOYED') | list | length == 0)
               and (missing_attachments | length == 0) }}

    # One row per declared L3Out: it must exist, be attached, and match the declared
    # VRFs, interface, VLAN (dot1q) tag, addresses, MTU and peer AS number.
    - name: Compare the L3Outs
      ansible.builtin.set_fact:
        dc_vrf_lite_rows: "{{ dc_vrf_lite_rows | default([]) + [row] }}"
      loop: "{{ dc_vrf_lite_extensions | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        observed: "{{ (dc_vrf_lite_extension_state | default({})).get(item.name, {}) }}"
        link: >-
          {{ ((observed.connectivity_details | default({})).links | default([]) | first) | default({}, true) }}
        leaf: "{{ link.switch1_details | default({}) }}"
        peer: "{{ link.switch2_details | default({}) }}"
        bgp: "{{ (observed.routing_details | default({})).bgp | default({}) }}"
        raw: >-
          {{ ((dc_observed_l3out_raw.jsondata | default({})).l3Outs | default([])
              | selectattr('name', 'equalto', item.name) | list | first) | default({}, true) }}
        row:
          name: "L3Out {{ item.name }} ({{ item.vrf }}) on {{ dc_vrf_lite_border_leaf }}"
          present: "{{ observed | length > 0 }}"
          attached: "{{ raw.attach | default(false) | bool }}"
          state: >-
            {{ 'absent' if observed | length == 0
               else ('matches' if (observed.vrf1_name | default('', true) == item.vrf)
                     and (observed.vrf2_name | default('', true) == item.peer_vrf)
                     and (link.vlan_id | default(-1) | int == item.dot1q | int)
                     and (link.mtu | default(-1) | int == dc_vrf_lite_mtu | int)
                     and (peer.interface_ipv4_address | default('', true) == item.neighbor_ipv4)
                     else 'differs') }}
          declared: >-
            {{ dc_vrf_lite_interface }} dot1q {{ item.dot1q }}
            {{ item.ipv4_addr }} -> {{ item.neighbor_ipv4 }}
            peer {{ item.peer_vrf }} MTU {{ dc_vrf_lite_mtu }}
          vrf_seen: "{{ observed.vrf1_name | default('', true) == item.vrf }}"
          interface_seen: >-
            {{ leaf.interface_name | default('', true)
               in [dc_vrf_lite_interface, dc_vrf_lite_interface ~ '.' ~ item.dot1q] }}
          dot1q_seen: "{{ link.vlan_id | default(-1) | int == item.dot1q | int }}"
          ipv4_seen: >-
            {{ (leaf.interface_ipv4_address | default('', true) ~ '/'
                ~ link.ipv4_mask_length | default('', true)) == item.ipv4_addr }}
          neighbor_seen: "{{ peer.interface_ipv4_address | default('', true) == item.neighbor_ipv4 }}"
          peer_vrf_seen: "{{ observed.vrf2_name | default('', true) == item.peer_vrf }}"
          mtu_seen: "{{ link.mtu | default(-1) | int == dc_vrf_lite_mtu | int }}"
          peer_asn_seen: >-
            {{ (bgp.fabric2_details | default({})).local_asn | default('', true) | string
               == dc_external_fabric_settings.bgp_asn | string }}
          ok: >-
            {{ (observed | length > 0)
               and (raw.attach | default(false) | bool)
               and (observed.vrf1_name | default('', true) == item.vrf)
               and (observed.vrf2_name | default('', true) == item.peer_vrf)
               and (leaf.interface_name | default('', true)
                    in [dc_vrf_lite_interface, dc_vrf_lite_interface ~ '.' ~ item.dot1q])
               and (link.vlan_id | default(-1) | int == item.dot1q | int)
               and ((leaf.interface_ipv4_address | default('', true) ~ '/'
                     ~ link.ipv4_mask_length | default('', true)) == item.ipv4_addr)
               and (peer.interface_ipv4_address | default('', true) == item.neighbor_ipv4)
               and (link.mtu | default(-1) | int == dc_vrf_lite_mtu | int)
               and ((bgp.fabric2_details | default({})).local_asn | default('', true) | string
                    == dc_external_fabric_settings.bgp_asn | string) }}

    # The switch's own view of each sub-interface: it must be up with the declared
    # tag, address and MTU. If the switch and controller disagree, that is the finding.
    - name: Compare the VRF-Lite sub-interfaces on the switch
      ansible.builtin.set_fact:
        dc_subif_rows: "{{ dc_subif_rows | default([]) + [row] }}"
      loop: "{{ dc_vrf_lite_extensions | default([]) }}"
      loop_control:
        label: "{{ dc_vrf_lite_interface }}.{{ item.dot1q }}"
        index_var: dc_subif_index
      vars:
        result: >-
          {{ dc_subinterface_results[dc_subif_index]
             if (dc_subinterface_results | length) > dc_subif_index
             else {} }}
        if_name: "{{ dc_vrf_lite_interface }}.{{ item.dot1q }}"
        detail: "{{ (result.parsed | default({}))[if_name] | default({}, true) }}"
        row:
          name: "Sub-interface {{ if_name }} on {{ dc_vrf_lite_border_leaf }}"
          determined: "{{ detail | length > 0 }}"
          declared: >-
            dot1q {{ item.dot1q }} {{ item.ipv4_addr }} mtu {{ dc_vrf_lite_mtu }}
          oper_status: "{{ detail.oper_status | default('not read', true) }}"
          dot1q_ok: >-
            {{ (detail.encapsulations | default({})).first_dot1q
               | default('', true) | string == item.dot1q | string }}
          address_ok: "{{ item.ipv4_addr in (detail.ipv4 | default({})) }}"
          mtu_ok: "{{ detail.mtu | default(0, true) | int == dc_vrf_lite_mtu | int }}"
          ok: >-
            {{ (detail | length > 0)
               and (detail.oper_status | default('', true) == 'up')
               and ((detail.encapsulations | default({})).first_dot1q
                    | default('', true) | string == item.dot1q | string)
               and (item.ipv4_addr in (detail.ipv4 | default({})))
               and (detail.mtu | default(0, true) | int == dc_vrf_lite_mtu | int) }}
      when: dc_verify_subinterfaces | bool

    # DEPLOYED only means the controller pushed the config, not that the neighbour
    # answered, and Nexus Dashboard has no API for BGP state - so check the switch.
    # Outcomes: Established, down, or "not determined" (switch unreachable, not judged).
    - name: Compare the VRF-Lite BGP sessions against intent
      ansible.builtin.set_fact:
        dc_bgp_rows: "{{ dc_bgp_rows | default([]) + [row] }}"
      loop: "{{ dc_vrf_lite_extensions | default([]) }}"
      loop_control:
        label: "{{ item.vrf }} to {{ item.neighbor_ipv4 }}"
        # index_var pairs each command result with the extension that asked for it.
        index_var: dc_bgp_index
      vars:
        # Each loop result holds the final attempt for one declared extension.
        result: >-
          {{ dc_bgp_results[dc_bgp_index]
             if (dc_bgp_results | length) > dc_bgp_index else {} }}
        raw: >-
          {{ (result.stdout | default([]) | first) | default('') }}
        dc_bgp_determined: >-
          {{ (dc_verify_bgp_sessions | bool)
             and (result.stdout | default([]) | length > 0) }}
        # A VRF the switch does not have returns an empty string, not a table.
        vrf_table: "{{ (raw.TABLE_vrf | default({})) if raw is mapping else {} }}"
        # NX-OS returns one item as an object and several as a list; always use a list.
        vrf_rows: >-
          {%- set r = vrf_table.ROW_vrf | default([]) -%}
          {{ [r] if r is mapping else r }}
        # The switch may print the VRF name in lower case, so compare ignoring case.
        vrf_row: >-
          {%- set matched = [] -%}
          {%- for v in vrf_rows
                if ((v['vrf-name-out'] | default('', true)) | lower
                    == item.vrf | lower) -%}
          {{- matched.append(v) or '' -}}
          {%- endfor -%}
          {{ (matched | first) | default({}, true) }}
        neighbor_rows: >-
          {%- set n = (vrf_row.TABLE_neighbor | default({})).ROW_neighbor
                      | default([]) -%}
          {{ [n] if n is mapping else n }}
        # Find the exact neighbour address declared in dc_vrf_lite.yml.
        neighbor_row: >-
          {%- set matched = [] -%}
          {%- for n in neighbor_rows
                if (n['neighbor-id'] | default('', true)) == item.neighbor_ipv4 -%}
          {{- matched.append(n) or '' -}}
          {%- endfor -%}
          {{ (matched | first) | default({}, true) }}
        # 'absent' means the switch answered but has no session to this neighbour.
        observed_state: "{{ neighbor_row.state | default('absent', true) }}"
        row:
          name: "BGP session {{ item.vrf }} to {{ item.neighbor_ipv4 }}"
          vrf: "{{ item.vrf }}"
          neighbor: "{{ item.neighbor_ipv4 }}"
          expected_state: Established
          observed_state: "{{ observed_state if dc_bgp_determined | bool else 'not determined' }}"
          # Shown, not checked: a wrong AS number on the far end is a common reason
          # a session stays in Idle or Active.
          peer_as: >-
            {{ (neighbor_row.remoteas | default('not reported', true))
               if dc_bgp_determined | bool else 'not determined' }}
          determined: "{{ dc_bgp_determined | bool }}"
          ok: "{{ observed_state == 'Established' }}"
      when: dc_verify_bgp_sessions | bool

    # Checks the border leaf never answered are left out of the failures and the
    # total, so an unreachable switch neither fails the run nor inflates the count.
    - name: Collect the failures
      ansible.builtin.set_fact:
        dc_failed_rows: >-
          {{ (dc_switch_rows | default([]) | rejectattr('ok') | list)
             + (dc_vrf_rows | default([]) | rejectattr('ok') | list)
             + (dc_network_rows | default([]) | rejectattr('ok') | list)
             + (dc_vrf_lite_rows | default([]) | rejectattr('ok') | list)
             + (dc_subif_rows | default([]) | selectattr('determined')
                | rejectattr('ok') | list)
             + (dc_bgp_rows | default([]) | selectattr('determined')
                | rejectattr('ok') | list) }}
        dc_total_checks: >-
          {{ (dc_switch_rows | default([]) | length)
             + (dc_vrf_rows | default([]) | length)
             + (dc_network_rows | default([]) | length)
             + (dc_vrf_lite_rows | default([]) | length)
             + (dc_subif_rows | default([]) | selectattr('determined')
                | list | length)
             + (dc_bgp_rows | default([]) | selectattr('determined')
                | list | length) }}
        dc_bgp_undetermined_rows: >-
          {{ dc_bgp_rows | default([]) | rejectattr('determined') | list }}
        dc_subif_undetermined_rows: >-
          {{ dc_subif_rows | default([]) | rejectattr('determined') | list }}

    # ------------------------------------------------------------- evidence
    - name: Set the verification evidence run ID
      ansible.builtin.set_fact:
        dc_evidence_run_id: "{{ now(utc=true).strftime('%Y%m%dT%H%M%S%fZ') }}"

    - name: Make sure the evidence directory exists
      ansible.builtin.file:
        path: "{{ dc_evidence_path | dirname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Write the verification report
      ansible.builtin.template:
        src: templates/stage07-verification.md.j2
        dest: "{{ dc_evidence_path }}"
        mode: "0644"
      delegate_to: localhost
      vars:
        dc_verify_timestamp: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Write the verification report as HTML
      ansible.builtin.template:
        src: templates/stage07-verification.html.j2
        dest: "{{ dc_evidence_html_path }}"
        mode: "0644"
      delegate_to: localhost
      vars:
        dc_verify_timestamp: "{{ now(utc=true).strftime('%Y-%m-%d %H:%M:%S') }} UTC"

    - name: Save the raw L3Out collection beside the report
      ansible.builtin.copy:
        content: "{{ dc_observed_l3out_raw.jsondata | default({}) | to_nice_json }}"
        dest: "{{ dc_evidence_l3out_path }}"
        mode: "0644"
      delegate_to: localhost
      when: dc_observed_l3out_raw.jsondata is defined

    - name: Report the outcome
      ansible.builtin.debug:
        msg: >-
          {{ dc_total_checks | int - dc_failed_rows | length }} of
          {{ dc_total_checks }} check(s) match the declared intent.
          Markdown: {{ dc_evidence_path }}.
          HTML: {{ dc_evidence_html_path }}

    # Say this on screen: a green result for everything readable is easy to
    # mistake for a working fabric when the BGP sessions were not checked.
    - name: Say so when the BGP sessions could not be read
      ansible.builtin.debug:
        msg: >-
          {{ dc_bgp_undetermined_rows | length }} BGP session(s) were NOT
          checked, because {{ dc_vrf_lite_border_leaf }} did not answer:
          {{ dc_bgp_undetermined_reason }}.
          Those sessions are neither up nor down as far as this run knows.
          This stage reaches the switch over SSH, so check that the client VPN
          is up and that {{ dc_vrf_lite_border_leaf }} answers on the management
          address declared for it in
          inventory/group_vars/all/dc_switches.yml. To compare only what the
          controller knows and drop these rows, re-run with
          -e dc_verify_bgp_sessions=false. Everything else in this report came
          from Nexus Dashboard and is unaffected.
      when: dc_bgp_undetermined_rows | length > 0

    - name: Fail on any mismatch
      ansible.builtin.assert:
        that:
          - dc_failed_rows | length == 0
        fail_msg: >-
          {{ dc_failed_rows | length }} check(s) do not match intent:
          {{ dc_failed_rows | map(attribute='name') | join(', ') }}.
          See {{ dc_evidence_path }}.
        success_msg: >-
          All {{ dc_total_checks }} evaluated check(s) match the declared intent.
          {% if dc_bgp_undetermined_rows | length > 0 %}
          The {{ dc_bgp_undetermined_rows | length }} BGP session check(s) the
          border leaf did not answer for are not among them.
          {% endif %}
      when: dc_verify_fail_on_mismatch | bool
