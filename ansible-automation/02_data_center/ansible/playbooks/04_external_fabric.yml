---
# Stage 04 - create the External connectivity fabric in Monitor Mode, add the
# IOS-XE edge router to it, and build the inter-fabric link the L3Outs ride on.
#
# This is guide section 7: a second fabric, ASN 65531, with Fabric Monitor Mode
# enabled, holding the edge router DC-SITE11-CEDGE8Kv (198.18.133.14). Monitor
# Mode means Nexus Dashboard reads that router and never configures it - the
# router's side of the handoff is pre-built by the pod.
#
# EVALUATION BRANCH (eval/nd-l3out). Every call goes through cisco.nd:
#   nd_manage_fabric_external   the fabric, created already in Monitor Mode
#   nd_manage_switches          discovery and add of the router
#   nd_manage_links             the eBGP VRF-Lite inter-fabric link
# They replace main's dcnm_fabric, five dcnm_rest calls (fabric list, switch
# list, shallowDiscovery, add, poll) and dcnm_links. Each module compares
# before it writes, so the existence checks main did by hand are gone.
#
# Values come from inventory/group_vars/all/dc_external_settings.yml (fabric
# and router) and inventory/group_vars/all/dc_vrf_lite.yml (link). The link
# play reads the DC ASN from host_vars/Pseudoco-DC1/global.nac.yaml.
#
# This fabric is not built from a Nexus as Code model: the collection's create
# role config-saves after its inventory step, and on a switchless fabric the
# controller answers HTTP 500. The fabric also holds no VRFs, networks or
# interfaces, so there is nothing for the model to express.
#
# Run from the collection root as its own ansible-playbook run (see
# 01_dc_deploy.yml for why):
#
#   cd ansible-automation/02_data_center/ansible
#   ansible-playbook playbooks/04_external_fabric.yml
#
# Useful override:
#   -e dc_external_add_edge_router=false   create the fabric, skip the router
#                                          and the link (stage 05 then stops)

- name: Stage 04 - create the External connectivity fabric
  hosts: External
  gather_facts: false
  any_errors_fatal: true

  vars:
    ansible_network_os: cisco.nd.nd
    dc_external_add_edge_router: true
    # Read off the router by stage 00, the same lookup the switches come from.
    dc_external_router_serial: >-
      {{ dc_device_serials[dc_external_edge_router.hostname] | default('') }}

  pre_tasks:
    - name: Require the External fabric settings to be declared
      ansible.builtin.assert:
        that:
          - dc_external_fabric_settings is mapping
          - dc_external_fabric_settings.bgp_asn is defined
          - dc_external_fabric_settings.monitored_mode | default(false) | bool
          - dc_external_edge_router.ip is defined
          - dc_external_edge_router.platform_type is defined
          - dc_external_edge_router.credential_key is defined
        fail_msg: >-
          dc_external_fabric_settings or dc_external_edge_router is incomplete,
          or monitored_mode is not true. Both are expected in
          inventory/group_vars/all/dc_external_settings.yml, and this lab
          never lets Nexus Dashboard write to the edge router.
      tags: [always]

    # The serial is checked against what the controller reports after the
    # add, so a missing stage 00 lookup is worth naming before anything runs.
    - name: Require stage 00 to have read the edge router serial
      ansible.builtin.assert:
        that:
          - dc_external_router_serial | length > 0
        fail_msg: >-
          No serial for {{ dc_external_edge_router.hostname }} in
          inventory/group_vars/all/dc_device_serials.yml. That file is written
          by stage 00. Run playbooks/00_discover_dc_switch_serials.yml first.
      when: dc_external_add_edge_router | bool
      tags: [always]

  tasks:
    # Monitor Mode is set in the same call that creates the fabric, so the
    # fabric is never briefly writable. config_actions is left out, which for
    # this module means no save and no deploy - a deploy on a switchless
    # fabric returns HTTP 500 anyway.
    - name: Create the External fabric with the declared settings
      cisco.nd.nd_manage_fabric_external:
        state: merged
        config:
          - fabric_name: "{{ inventory_hostname }}"
            management: "{{ dc_external_fabric_settings }}"
      register: dc_external_fabric_result

    - name: Report the fabric result
      ansible.builtin.debug:
        msg: >-
          {{ 'Fabric created or updated, Monitor Mode on. Nexus Dashboard will
              not configure devices in this fabric.'
             if dc_external_fabric_result.changed
             else 'Fabric already matches the declared settings. No change
              sent.' }}

    # ---------------------------------------------------------------- router

    # config_actions is set explicitly. For nd_manage_switches the defaults
    # are save: true and deploy: true, unlike every other module this stage
    # uses, and nothing may be deployed toward this router. Monitor Mode is
    # the second guard, not the only one.
    #
    # preserve_config true: the controller must read the router's running
    # configuration, not replace it. The module requires it for External
    # fabrics anyway. No role is sent: the controller assigns edge_router to
    # an IOS-XE device in an External fabric, which is the role the guide
    # specifies, and an omitted role is not enforced as drift.
    #
    # Two discovery settings main sends cannot be set through this module:
    # maxHop (main 0, module 2) and useCredentialForWrite (main false, module
    # unset). Both are listed as risks in docs/eval-nd-l3out.md.
    - name: Discover and add the edge router
      cisco.nd.nd_manage_switches:
        fabric: "{{ inventory_hostname }}"
        state: merged
        config_actions:
          save: false
          deploy: false
        config:
          - seed_ip: "{{ dc_external_edge_router.ip }}"
            username: "{{ lab_access[dc_external_edge_router.credential_key].username }}"
            password: "{{ lab_access[dc_external_edge_router.credential_key].password }}"
            platform_type: "{{ dc_external_edge_router.platform_type }}"
            preserve_config: true
      register: dc_external_router_result
      when: dc_external_add_edge_router | bool

    # Kept as REST: nd_manage_switches was checked, and none of its outputs
    # (before, after, gathered) carries a serial number - only seed_ip, role
    # and platform_type. The check catches a seed address that now answers as
    # a different device, which no module comparison would notice.
    #
    # nd_rest accepts the response as-is, so the assert below is the check.
    - name: Read the External fabric inventory
      cisco.nd.nd_rest:
        path: "/api/v1/manage/fabrics/{{ inventory_hostname }}/switches"
        method: get
      register: dc_external_inventory
      changed_when: false
      when: dc_external_add_edge_router | bool

    - name: Require the added router to be the device stage 00 read
      ansible.builtin.assert:
        that:
          - dc_external_router_row | length == 1
          - dc_external_router_row[0].serialNumber | default(dc_external_router_row[0].switchId | default(''))
            == dc_external_router_serial
        fail_msg: >-
          {{ dc_external_edge_router.ip }} in {{ inventory_hostname }} does not
          match stage 00's serial '{{ dc_external_router_serial }}':
          {{ dc_external_router_row | to_json }}. Either the router never
          joined the fabric or the address now answers as a different device -
          re-run stage 00.
      vars:
        dc_external_router_row: >-
          {{ (dc_external_inventory.jsondata | default({})).switches
             | default([])
             | selectattr('fabricManagementIp', 'defined')
             | selectattr('fabricManagementIp', 'equalto', dc_external_edge_router.ip)
             | list }}
      when: dc_external_add_edge_router | bool

    - name: Report the edge router result
      ansible.builtin.debug:
        msg: >-
          {{ ('Edge router ' + ('added.' if dc_external_router_result.changed
                                else 'already in the fabric. No change sent.'))
             if dc_external_add_edge_router | bool
             else 'Edge router skipped because dc_external_add_edge_router is
                   false. The L3Outs cannot be built until it is in the
                   fabric.' }}

# ---------------------------------------------------------------------------
# The inter-fabric link the L3Outs ride on.
#
# nd_manage_l3out does not create links; its documentation leaves the link
# lifecycle to a separate module. VRF_LITE_AUTOCONFIG is manual, so the
# controller creates none of its own either. This play runs against the DC
# fabric because the link belongs to the source fabric, and after the play
# above because the router has to be in the External fabric first.
#
# Policy ebgpVrfLite is the replacement for main's ext_fabric_setup template.
# Field mapping: ipv4_subnet -> src_ip_address_mask, neighbor_ip ->
# dst_ip_address, src_asn -> src_ebgp_asn, dst_asn -> dst_ebgp_asn, mtu ->
# link_mtu, auto_deploy false -> every auto_gen_config_* option false.
# Whether it produces the same link on the controller is a Phase 3 check.
#
# state: merged, never overridden - overridden deletes every link in scope
# that is not listed here.
- name: Stage 04 - build the inter-fabric link
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    ansible_network_os: cisco.nd.nd
    # Repeated from the play above: play vars do not carry across plays. The
    # link cannot be built without the router - nd_manage_links resolves the
    # far end in the External fabric's inventory and fails if it is absent.
    dc_external_add_edge_router: true

  tasks:
    # The DC fabric's ASN lives in the NAC model rather than in group_vars, so
    # the link cannot contradict the fabric it joins.
    - name: Read the declared fabric ASN
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/global.nac.yaml"
        name: dc_global_model
      delegate_to: localhost

    # auto_gen_config_peer false is main's auto_deploy false: no config is
    # generated for the router. The two default-VRF options stay false so no
    # eBGP session is built on the parent interface in the default VRF; the
    # per-VRF sessions belong to the L3Outs.
    - name: Create the inter-fabric link on {{ dc_vrf_lite_interface }}
      cisco.nd.nd_manage_links:
        fabric_name: "{{ dc_fabric_name }}"
        link_scope: manage
        state: merged
        config:
          - src_fabric_name: "{{ dc_fabric_name }}"
            dst_fabric_name: "{{ dc_external_fabric_name }}"
            src_switch_name: "{{ dc_vrf_lite_border_leaf }}"
            dst_switch_ip: "{{ dc_external_edge_router.ip }}"
            src_interface_name: "{{ dc_vrf_lite_interface }}"
            dst_interface_name: "{{ dc_vrf_lite_peer_interface }}"
            config_data:
              policy_type: ebgpVrfLite
              template_inputs: >-
                {{ dc_vrf_lite_ifc
                   | combine({'src_ebgp_asn': dc_global_model.vxlan.global.ibgp.bgp_asn | string,
                              'dst_ebgp_asn': dc_external_fabric_settings.bgp_asn | string,
                              'auto_gen_config_peer': false,
                              'auto_gen_config_default_vrf': false,
                              'auto_gen_config_nx_peer_default_vrf': false}) }}
      register: dc_external_link
      when: dc_external_add_edge_router | bool

    - name: Report the link result
      ansible.builtin.debug:
        msg: >-
          Inter-fabric link {{ dc_vrf_lite_border_leaf }}
          {{ dc_vrf_lite_interface }} -> {{ dc_external_edge_router.hostname }}
          {{ dc_vrf_lite_peer_interface }}, link MTU
          {{ dc_vrf_lite_ifc.link_mtu }}.
          {{ ('changed=' ~ (dc_external_link.changed | default(false)) ~ '.')
             if dc_external_add_edge_router | bool
             else 'Skipped: dc_external_add_edge_router is false.' }}
