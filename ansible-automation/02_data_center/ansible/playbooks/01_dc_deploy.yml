---
# Builds the whole data centre fabric by running stages 02-07 in order, stopping at the first failure.
# WARNING: stage 02 erases every switch's config; run stage 00 first. Teardown is 08_cleanup.yml.
# Run from the folder holding ansible.cfg: ansible-playbook playbooks/01_dc_deploy.yml

- name: Build the DC fabric, one stage per ansible-playbook process
  hosts: localhost
  gather_facts: false
  connection: local
  any_errors_fatal: true

  vars:
    # Order matters: each stage builds on the one before it.
    dc_deploy_stages:
      - 02_create_dc_fabric.yml  # fabric, switches, VRFs, networks (wipes switches)
      - 03_fabric_advanced_settings.yml  # extra fabric settings
      - 04_external_fabric.yml  # edge router fabric and the link to it
      - 05_l3out.yml  # per-VRF handoff to the edge router
      - 06_recalculate_and_deploy.yml  # pushes config to the switches
      - 07_verify_fabric.yml  # read-only checks and report
    dc_deploy_extra_vars: {}  # extra -e variables passed to every stage
    dc_deploy_root: "{{ (playbook_dir ~ '/..') | realpath }}"

  tasks:
    # Save the timestamp once, so every stage logs into the same folder.
    - name: Name this run's log directory
      ansible.builtin.set_fact:
        dc_deploy_log_dir: >-
          {{ dc_deploy_root }}/evidence/dc-deploy-{{ now(utc=true).strftime('%Y%m%dT%H%M%SZ') }}

    - name: Make the log directory
      ansible.builtin.file:
        path: "{{ dc_deploy_log_dir }}"
        state: directory
        mode: "0755"

    # Each stage runs as its own ansible-playbook process; its output shows when it finishes.
    - name: Run each stage
      ansible.builtin.include_tasks: tasks/run_stage.yml
      loop: "{{ dc_deploy_stages }}"
      loop_control:
        loop_var: dc_stage
