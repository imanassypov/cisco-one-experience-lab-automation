---
# Build the PseudoCo data center fabric end to end. This playbook runs no
# tasks of its own: import_playbook pulls in the other stages and runs them in
# order, as if you had run them by hand.
#
# Run from the collection root, the directory holding ansible.cfg:
#
#   cd ansible-automation/02_data_center/ansible
#   ansible-playbook playbooks/01_dc_deploy.yml
#
# Stage 00 is a prerequisite and is not imported here. It reads a serial number
# off each switch over SSH and generates
# playbooks/host_vars/Pseudoco-DC1/topology_switches.nac.yaml, and stage 02
# refuses to start without that file. Run it once per pod, and again whenever
# the pod hardware or the switch table changes:
#
#   ansible-playbook playbooks/00_discover_dc_switch_serials.yml
#
# Stages, in apply order:
#
#   02  the whole fabric intent: the fabric, the switches, their roles, the
#       vPC pair, the port-channels, the VRFs, the networks and their
#       attachments
#   03  the fabric settings Nexus as Code cannot express: the VRF-Lite
#       resources, the license tier, the telemetry toggle and the location
#   04  the External connectivity fabric, in Monitor Mode, with the IOS-XE
#       edge router added to it, and the VRF-Lite inter-fabric link between
#       the border leaf and that router
#   05  first deploy: pushes the fabric to the switches
#   06  the VRF-Lite extensions on the border leaf, as intent
#   07  second deploy: pushes those extensions to the border leaf
#   08  verify the result, against Nexus Dashboard and against the switch
#
# The deploy runs before stage 06 because stage 06 depends on it.
#
# Stage 06 can only add an extension where Nexus Dashboard is already offering
# the border leaf one, and it offers one only where a VRF-Lite inter-fabric
# link terminates. Stage 04 creates that link explicitly, with dcnm_links and
# the ext_fabric_setup template, from dc_vrf_lite_ifc in
# inventory/group_vars/all/dc_vrf_lite.yml. Nothing is left to the controller:
# dc_advanced_settings.yml sets VRF_LITE_AUTOCONFIG to Manual, so Nexus
# Dashboard never invents a link or picks an address of its own.
#
# The link still needs a deploy before the extension can be attached, because
# the controller only offers the prototype once the parent interface has been
# configured on the switch. So the first deploy has to come first.
#
# The deploy runs again after stage 06 because stage 06 only stages intent.
#
# Stage 06 writes intent to the controller and changes no running
# configuration. Without a deploy after it, the three dot1q sub-interfaces and
# their BGP neighbours stay staged and never reach the switch. This is the
# deploy, edit, deploy sequence the manual guide walks through in section 8.
#
# Four things to expect from a plain run:
#   - It is a greenfield build with no confirmation prompt. Stage 02 imports
#     the five switches with preserveConfig false, which erases each switch's
#     running configuration as it joins the fabric. No flag changes that, so
#     point this at a pod you are willing to rebuild.
#   - Stage 04 targets the External inventory host and reads its settings from
#     inventory/group_vars/all/dc_external_settings.yml rather than from a
#     Nexus as Code model, so the edge router must answer SSH and have a vault
#     entry.
#   - Both deploys change running configuration and take several minutes.
#     Switches show as out of sync while they run.
#   - Stage 08 fails the run on any mismatch; add
#     -e dc_verify_fail_on_mismatch=false for the report without the failure.
#
# To tear it all down again, including the sub-interfaces stage 07 wrote onto
# the border leaf, run:
#
#   ansible-playbook playbooks/09_cleanup.yml -e dc_cleanup_confirm=CLEANUP_OK
#
# On a re-run the inter-fabric link already exists, so stage 04 converges it
# rather than creating it. The first deploy is still needed: stage 02 runs
# dcnm_vrf with state: replaced, which clears the VRF-Lite extension off the
# border leaf, and the first deploy pushes that removal. Stage 06 then puts the
# extension back and the second deploy restores it, so external connectivity is
# down for the few minutes between the two deploys.
#
# Background: "What stage 06 needs from the controller" in the README.

- import_playbook: 02_create_dc_fabric.yml
- import_playbook: 03_fabric_advanced_settings.yml
- import_playbook: 04_external_fabric.yml

# First deploy. Pushes the fabric, and configures the parent interface of the
# inter-fabric link - which is what makes the controller offer stage 06 a
# VRF-Lite prototype to build on.
- import_playbook: 05_recalculate_and_deploy.yml

- import_playbook: 06_vrf_lite.yml

# Second deploy. Pushes the sub-interfaces and BGP neighbours stage 06 staged.
- import_playbook: 07_recalculate_and_deploy.yml

- import_playbook: 08_verify_fabric.yml
