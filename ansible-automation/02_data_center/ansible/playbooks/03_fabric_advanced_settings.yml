---
# Stage 03 - apply the fabric settings Nexus as Code cannot express.
#
# These are the guide's Resources-tab and General-tab settings that
# cisco.nac_dc_vxlan 0.9.0 has no data model key for: VRF-Lite deployment
# mode and subnet pool, license tier, telemetry and location. Values live in
# inventory/group_vars/all/dc_vrf_lite.yml (dc_vrf_lite_fabric_settings) and
# inventory/group_vars/all/dc_advanced_settings.yml
# (dc_advanced_nd_fabric_settings). This playbook holds none of its own.
#
# EVALUATION BRANCH (eval/nd-l3out). One cisco.nd.nd_manage_fabric_ibgp_vxlan
# task replaces main's dcnm_fabric call and its read-modify-write of the
# fabric object over dcnm_rest. state: merged sends only the keys declared
# here: the module's argument spec carries no defaults, unset options are
# stripped before the diff, and the update starts from the controller's own
# copy of the fabric. So everything stage 02 wrote is left alone, and a second
# run sends nothing.
#
# config_actions is left out, which for this module means no save and no
# deploy. Nothing here touches a switch.
#
# Run from the collection root, the directory holding ansible.cfg, as its own
# ansible-playbook run (see 01_dc_deploy.yml for why):
#
#   cd ansible-automation/02_data_center/ansible
#   ansible-playbook playbooks/03_fabric_advanced_settings.yml

- name: Stage 03 - apply advanced fabric settings
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    # cisco.nd modules need their own httpapi plugin. Stage 02 needs
    # cisco.dcnm.dcnm, which group_vars/nd/connection.yml sets.
    ansible_network_os: cisco.nd.nd

  pre_tasks:
    - name: Require something to apply
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_fabric_settings is mapping
          - dc_vrf_lite_fabric_settings | length > 0
          - dc_advanced_nd_fabric_settings is mapping
          - dc_advanced_nd_fabric_settings | length > 0
        fail_msg: >-
          dc_vrf_lite_fabric_settings or dc_advanced_nd_fabric_settings is
          empty or undefined. Declare them in
          inventory/group_vars/all/dc_vrf_lite.yml and
          inventory/group_vars/all/dc_advanced_settings.yml.
      tags: [always]

    # Read first because state: merged would otherwise try to CREATE a missing
    # fabric, and fail on the absent BGP ASN with a message that reads like a
    # bug here rather than a stage run out of order.
    - name: Look for the fabric on the controller
      cisco.nd.nd_manage_fabric_ibgp_vxlan:
        state: gathered
        config:
          - fabric_name: "{{ inventory_hostname }}"
      register: dc_fabric_existing
      tags: [always]

    - name: Refuse to run against a fabric that does not exist
      ansible.builtin.assert:
        that:
          - dc_fabric_existing.gathered | default([]) | length > 0
        fail_msg: >-
          Nexus Dashboard has no iBGP VXLAN fabric named
          '{{ inventory_hostname }}'. Run playbooks/02_create_dc_fabric.yml
          first - it is what creates the fabric. If stage 02 has already run,
          check that the fabric name in
          host_vars/{{ inventory_hostname }}/global.nac.yaml still matches the
          inventory host name.
      tags: [always]

  tasks:
    - name: Apply the fabric settings Nexus as Code cannot express
      cisco.nd.nd_manage_fabric_ibgp_vxlan:
        state: merged
        config:
          - "{{ {'fabric_name': inventory_hostname,
                 'management': dc_vrf_lite_fabric_settings}
                | combine(dc_advanced_nd_fabric_settings) }}"
      register: dc_fabric_settings_result

    - name: Report what changed
      ansible.builtin.debug:
        msg: >-
          Fabric settings:
          {{ 'updated to the declared values'
             if dc_fabric_settings_result.changed
             else 'already matched the declared intent, nothing sent' }}.
