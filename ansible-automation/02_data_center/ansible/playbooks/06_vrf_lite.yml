---
# Stage 06 - extend MAIN, PROD and IOT out of the border leaf with VRF-Lite.
#
# Guide section 8 gives each VRF two Detach/Attach sliders. The first attaches
# the VRF itself to DC-Service-Leaf, and the data model owns that half: the
# border leaf is listed in the dc_leaves attach group in
# playbooks/host_vars/Pseudoco-DC1/vrfs.nac.yaml, so stage 02 makes the plain
# attachment. This stage is the second slider and nothing else - the external
# L3 extension, with its dot1q tag, sub-interface prefix and neighbour address.
#
# The model cannot express that second half. A vrf_attach_group entry names a
# switch and nothing else, with no key for EXTEND: VRF_LITE, the sub-interface,
# the tag or the neighbour address. So this stage writes the attachment itself,
# from the intent declared in inventory/group_vars/all/dc_vrf_lite.yml.
#
# It posts to the controller's own attachments endpoint rather than calling
# cisco.dcnm's dcnm_vrf. The module sends seven extension fields and no others -
# DOT1Q_ID, IF_NAME, IP_MASK, IPV6_MASK, IPV6_NEIGHBOR, NEIGHBOR_IP and
# PEER_VRF_NAME - so it cannot carry the sub-interface MTU or the neighbour
# ASN, and it hardcodes the Nexus template Ext_VRF_Lite_Jython where this pod's
# IOS-XE peer is offered ios_xe_Ext_VRF_Lite_Jython. The UI's Edit Extension
# Details dialog writes all of them in one payload, and so does this stage.
#
# Like stages 02 to 04, it writes intent to the controller and changes nothing
# on a switch, so a deploy has to follow it before the sub-interfaces and BGP
# neighbours reach DC-Service-Leaf.
#
# Two things to know before running it:
#   - It has to run after stage 02 on every pass. Stage 02's create role runs
#     dcnm_vrf with state: replaced, which clears an extension the model cannot
#     describe. This stage rewrites only the border leaf's attachment for the
#     three VRFs it owns, and only where a field differs, so a second run on an
#     already-extended fabric sends nothing.
#   - It has to run after a deploy, not before one. Nexus Dashboard offers the
#     border leaf a VRF-Lite extension only where a VRF-Lite inter-fabric link
#     terminates on the parent interface, and it builds that link itself during
#     a Recalculate and Deploy, once the edge router stage 04 adds is in the
#     External fabric. Without that link there is no prototype to build the
#     payload from, and this stage says so. So run 05_recalculate_and_deploy.yml
#     first, then this stage, then the deploy again. 01_dc_deploy.yml already
#     imports the stages in that order.
#
# Run from the collection root, the directory holding ansible.cfg:
#
#   cd ansible-automation/02_data_center/ansible
#   ansible-playbook playbooks/06_vrf_lite.yml
#
# Background: "What stage 06 needs from the controller" in the README.

- name: Stage 06 - attach the VRF-Lite extensions on the border leaf
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    ndfc_api_root: /appcenter/cisco/ndfc/api/v1/lan-fabric

  tasks:
    # --------------------------------------------------- declared intent
    # dc_vrf_lite.yml does not restate vrf_id or vlan_id. They are read back out
    # of the same model stage 02 consumed, so the two files cannot disagree: a
    # VRF renumbered in vrfs.nac.yaml is renumbered here too. include_vars loads
    # a YAML file into a variable, and delegate_to: localhost reads it from this
    # machine rather than from the controller.
    - name: Read the declared VRFs
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/vrfs.nac.yaml"
        name: dc_vrf_lite_vrf_model
      delegate_to: localhost

    - name: Flatten the declared VRFs
      ansible.builtin.set_fact:
        dc_vrf_lite_declared_vrfs: "{{ dc_vrf_lite_vrf_model.vxlan.overlay.vrfs | default([]) }}"

    # ------------------------------------------------------- data checks
    # Every assert below runs before the first write, so a typo in the declared
    # intent reads as a data error rather than as a confusing controller
    # rejection. assert stops the play when its conditions are not all true.
    - name: Fail when the declared border leaf is not in the switch table
      ansible.builtin.assert:
        that:
          - matching_switches | length == 1
        fail_msg: >-
          DATA MODEL ERROR, not a fabric fault. dc_vrf_lite_border_leaf is
          '{{ dc_vrf_lite_border_leaf }}', which matches
          {{ matching_switches | length }} entries in dc_switches.yml
          (declared switches: {{ dc_switches | map(attribute='name') | join(', ') }}).
          Fix inventory/group_vars/all/dc_vrf_lite.yml.
      vars:
        matching_switches: >-
          {{ dc_switches | selectattr('name', 'equalto', dc_vrf_lite_border_leaf) | list }}

    # Cisco scopes VRF-Lite autoconfiguration to a "Border role in the VXLAN
    # fabric and Edge Router role in the connected external fabric device", so
    # the controller only ever offers the extension on a border switch.
    # Checking it here explains the problem in terms of this repository's own
    # switch table instead of as an empty prototype list.
    - name: Fail when the declared border leaf does not hold the border role
      ansible.builtin.assert:
        that:
          - declared_role == 'border'
        fail_msg: >-
          DATA MODEL ERROR. {{ dc_vrf_lite_border_leaf }} is declared with
          role '{{ declared_role }}' in dc_switches.yml, but VRF-Lite
          extensions are only supported from a switch holding the border
          role. Cisco: "Autoconfiguration is supported for the following
          cases: Border role in the VXLAN fabric and Edge Router role in the
          connected external fabric device".
      vars:
        declared_role: >-
          {{ (dc_switches
              | selectattr('name', 'equalto', dc_vrf_lite_border_leaf)
              | list | first).role | default('') }}

    - name: Fail when an extension names a VRF that vrfs.nac.yaml never declares
      ansible.builtin.assert:
        that:
          - undeclared | length == 0
        fail_msg: >-
          DATA MODEL ERROR, not a fabric fault. {{ undeclared | join(', ') }}
          named in dc_vrf_lite.yml but not declared in vrfs.nac.yaml
          (declared VRFs: {{ dc_vrf_lite_declared_vrfs | map(attribute='name') | join(', ') }}).
          Extending a VRF that the fabric does not have cannot work.
      vars:
        declared_names: "{{ dc_vrf_lite_declared_vrfs | map(attribute='name') | list }}"
        undeclared: >-
          {{ dc_vrf_lite_extensions
             | map(attribute='vrf')
             | reject('in', declared_names)
             | list }}

    # The extension is added on top of the attachment the model makes, so the
    # model has to make it. This catches a border leaf dropped out of
    # vrf_attach_groups: stage 02 would then leave it unattached, and the
    # extension would be the only thing holding the VRF there.
    - name: Fail when the model does not attach the border leaf to every extended VRF
      ansible.builtin.assert:
        that:
          - unattached | length == 0
        fail_msg: >-
          DATA MODEL ERROR. {{ dc_vrf_lite_border_leaf }} is not in the
          vrf_attach_group of {{ unattached | join(', ') }} in
          playbooks/host_vars/{{ inventory_hostname }}/vrfs.nac.yaml, so stage
          02 will not attach the VRF to it and this stage has nothing to
          extend. Add '- hostname: {{ dc_vrf_lite_border_leaf }}' to the
          attach group those VRFs name.
      vars:
        dc_vrf_lite_attach_groups: >-
          {{ dc_vrf_lite_vrf_model.vxlan.overlay.vrf_attach_groups | default([]) }}
        unattached: >-
          {%- set missing = [] -%}
          {%- for ext in dc_vrf_lite_extensions -%}
          {%- set declared = (dc_vrf_lite_declared_vrfs
                              | selectattr('name', 'equalto', ext.vrf)
                              | list | first) | default({}) -%}
          {%- set group = (dc_vrf_lite_attach_groups
                           | selectattr('name', 'equalto',
                                        declared.vrf_attach_group | default(''))
                           | list | first) | default({}) -%}
          {%- set hosts = (group.switches | default([]))
                          | map(attribute='hostname') | list -%}
          {%- if dc_vrf_lite_border_leaf not in hosts -%}
          {{- missing.append(ext.vrf) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ missing }}

    # One sub-interface per dot1q tag on one parent interface. Two rows sharing
    # a tag collapse into a single sub-interface on the switch, leaving the
    # second VRF unreachable with nothing to show for it.
    #
    # The variable below cannot be called "tags": that is a reserved task
    # keyword, so Ansible would read the vars entry as the directive and the
    # expression would fail with "'tags' is undefined".
    - name: Fail on a duplicate dot1q tag
      ansible.builtin.assert:
        that:
          - dot1q_tags | length == dot1q_tags | unique | length
        fail_msg: >-
          DATA MODEL ERROR. dc_vrf_lite.yml reuses a dot1q tag
          ({{ dot1q_tags | join(', ') }}). Every extension on
          {{ dc_vrf_lite_interface }} needs its own tag.
      vars:
        dot1q_tags: "{{ dc_vrf_lite_extensions | map(attribute='dot1q') | list }}"

    # ------------------------------------------------------------- preview
    - name: Show what will be attached
      ansible.builtin.debug:
        msg: >-
          {{ ['VRF-Lite extensions on ' ~ dc_vrf_lite_border_leaf ~ ', interface '
              ~ dc_vrf_lite_interface ~ ':']
             + dc_vrf_lite_attachment_table }}
      vars:
        dc_vrf_lite_attachment_table: >-
          {%- set rows = ['| VRF | Dot1q | Local address | Neighbor | MTU |',
                          '| --- | ---: | --- | --- | ---: |'] -%}
          {%- for ext in dc_vrf_lite_extensions -%}
          {{- rows.append('| ' ~ ext.vrf ~ ' | ' ~ ext.dot1q ~ ' | '
                          ~ ext.ipv4_addr ~ ' | ' ~ ext.neighbor_ipv4 ~ ' | '
                          ~ dc_vrf_lite_mtu ~ ' |') or '' -}}
          {%- endfor -%}
          {{ rows }}

    # --------------------------------------------------------- border serial
    # Stage 00 reads the serials off the switches and writes them into the
    # model, so the controller does not have to be asked for them again.
    - name: Read the switch model stage 00 generated
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/topology_switches.nac.yaml"
        name: dc_vrf_lite_switch_model
      delegate_to: localhost

    - name: Resolve the border leaf serial
      ansible.builtin.set_fact:
        dc_vrf_lite_border_serial: >-
          {{ (dc_vrf_lite_switch_model.vxlan.topology.switches | default([])
              | selectattr('name', 'equalto', dc_vrf_lite_border_leaf)
              | map(attribute='serial_number') | list | first | default('')) }}

    # Every read and write below is keyed on this serial, so an empty one would
    # skip them all and leave the stage reporting success with nothing done.
    - name: Fail when the generated model carries no serial for the border leaf
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_border_serial | length > 0
        fail_msg: >-
          DATA MODEL ERROR. playbooks/host_vars/{{ inventory_hostname }}/topology_switches.nac.yaml
          declares no serial_number for {{ dc_vrf_lite_border_leaf }}. Re-run
          playbooks/00_discover_dc_switch_serials.yml, which reads the serials
          off the switches and regenerates that file.

    # ----------------------------------------------------- read the current
    # The controller's prototype carries the fields only it knows: the
    # neighbour ASN and the Jython template both come from the inter-fabric
    # link. Starting from it, rather than building a connection from scratch,
    # is what keeps ios_xe_Ext_VRF_Lite_Jython on an IOS-XE peer.
    #
    # The same response also carries the extension currently in place, which is
    # what makes a re-run a no-op. The attachments endpoint does NOT return
    # extensionValues, so reading the current state from there finds nothing
    # and rewrites the extension on every run.
    - name: Read the VRF-Lite prototypes and the extensions in place
      cisco.dcnm.dcnm_rest:
        method: GET
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/switches?vrf-names={{ dc_vrf_lite_extensions | map(attribute='vrf') | join(',') }}&serial-numbers={{ dc_vrf_lite_border_serial }}
      register: dc_vrf_lite_switch_read
      changed_when: false

    # The VLAN and the per-switch instance values come from the attachments
    # endpoint. The response above reports the VLAN as -1 and returns no
    # instance values, and posting either of those back would damage the
    # attachment stage 02 made.
    - name: Read the current attachments
      cisco.dcnm.dcnm_rest:
        method: GET
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/attachments?vrf-names={{ dc_vrf_lite_extensions | map(attribute='vrf') | join(',') }}
      register: dc_vrf_lite_attach_read
      changed_when: false

    # extensionValues nests JSON inside JSON, and the controller is not
    # consistent about it: the prototype's copy arrives as a string while the
    # switch's own arrives as a mapping whose values are strings. Hence the
    # from_json plus 'is mapping' guard at each level.
    - name: Index the controller state by VRF
      ansible.builtin.set_fact:
        dc_vrf_lite_state: >-
          {%- set state = {} -%}
          {%- for record in ((dc_vrf_lite_switch_read.response | default({})).DATA | default([])) -%}
          {%- set switch = (record.get('switchDetailsList', []) | first | default({})) -%}
          {%- set proto = namespace(values={}) -%}
          {%- for candidate in switch.get('extensionPrototypeValues', []) -%}
          {%- if candidate.get('extensionType', '') == 'VRF_LITE' and proto.values == {} -%}
          {%- set raw = candidate.get('extensionValues', '') -%}
          {%- set decoded = (raw | from_json) if raw is string and raw | length > 0 else raw -%}
          {%- if decoded is mapping -%}
          {%- set proto.values = decoded -%}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set raw_values = switch.get('extensionValues', '') -%}
          {%- set values = (raw_values | from_json) if raw_values is string and raw_values | length > 0 else raw_values -%}
          {%- set raw_conn = values.get('VRF_LITE_CONN', '') if values is mapping else '' -%}
          {%- set conn_doc = (raw_conn | from_json) if raw_conn is string and raw_conn | length > 0 else raw_conn -%}
          {%- set connections = conn_doc.get('VRF_LITE_CONN', []) if conn_doc is mapping else [] -%}
          {%- set _ = state.update({record.get('vrfName', ''): {
                'prototype': proto.values,
                'current': (connections | first | default({})),
                'multisite': ((values.get('MULTISITE_CONN') or '{"MULTISITE_CONN":[]}')
                              if values is mapping else '{"MULTISITE_CONN":[]}'),
                'freeform': switch.get('freeformConfig') or ''}}) -%}
          {%- endfor -%}
          {{ state }}

    - name: Fail when the controller offers no VRF-Lite extension
      ansible.builtin.assert:
        that:
          - without_prototype | length == 0
        fail_msg: >-
          Nexus Dashboard offers {{ dc_vrf_lite_border_leaf }}
          ({{ dc_vrf_lite_border_serial }}) no VRF-Lite extension for
          {{ without_prototype | join(', ') }}, so there is no neighbour ASN or
          peer template to build the attachment from. An extension is offered
          only where a VRF-Lite inter-fabric link terminates on
          {{ dc_vrf_lite_interface }}, and the controller builds that link
          during a Recalculate and Deploy once the edge router is in the
          External fabric. Run stage 05, then re-run this stage.
      vars:
        without_prototype: >-
          {{ dc_vrf_lite_extensions | map(attribute='vrf')
             | reject('in', dc_vrf_lite_state
                            | dict2items
                            | selectattr('value.prototype')
                            | map(attribute='key') | list)
             | list }}

    # ---------------------------------------------------------------- write
    - name: Fail when stage 02 has not attached the VRFs to the border leaf
      ansible.builtin.assert:
        that:
          - unattached | length == 0
        fail_msg: >-
          The controller has no attachment for {{ dc_vrf_lite_border_leaf }} on
          {{ unattached | join(', ') }}, so there is no VLAN to extend. Run
          stage 02 before this stage.
      vars:
        unattached: >-
          {%- set records = ((dc_vrf_lite_attach_read.response | default({})).DATA | default([])) -%}
          {%- set missing = [] -%}
          {%- for ext in dc_vrf_lite_extensions -%}
          {%- set record = (records | selectattr('vrfName', 'equalto', ext.vrf)
                            | list | first | default({})) -%}
          {%- if (record.get('lanAttachList', [])
                  | selectattr('switchSerialNo', 'equalto', dc_vrf_lite_border_serial)
                  | selectattr('vlanId', 'defined') | list | length) == 0 -%}
          {{- missing.append(ext.vrf) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ missing }}

    # One payload for all three VRFs, carrying the declared values and the MTU
    # together - the same write the UI's Edit Extension Details dialog makes.
    # Only the fields declared here are compared against the controller, so
    # fields it adds of its own do not make every run look like a change.
    - name: Build the attachment payload
      ansible.builtin.set_fact:
        dc_vrf_lite_payload: >-
          {%- set records = ((dc_vrf_lite_attach_read.response | default({})).DATA | default([])) -%}
          {%- set rows = [] -%}
          {%- for ext in dc_vrf_lite_extensions -%}
          {%- set record = (records | selectattr('vrfName', 'equalto', ext.vrf)
                            | list | first | default({})) -%}
          {%- set attachment = (record.get('lanAttachList', [])
                                | selectattr('switchSerialNo', 'equalto', dc_vrf_lite_border_serial)
                                | list | first | default({})) -%}
          {%- set state = dc_vrf_lite_state.get(ext.vrf, {}) -%}
          {%- set current = state.get('current', {}) -%}
          {%- set declared_fields = {
                'IF_NAME': dc_vrf_lite_interface,
                'DOT1Q_ID': ext.dot1q | string,
                'IP_MASK': ext.ipv4_addr,
                'NEIGHBOR_IP': ext.neighbor_ipv4,
                'PEER_VRF_NAME': ext.peer_vrf,
                'MTU': dc_vrf_lite_mtu | string} -%}
          {%- set desired = state.get('prototype', {}) | combine(declared_fields) -%}
          {%- set drift = [] -%}
          {%- for key, value in declared_fields.items() -%}
          {%- if current.get(key, '') | string != value | string -%}
          {{- drift.append(key) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {%- if drift | length > 0 -%}
          {{- rows.append({
                'vrfName': ext.vrf,
                'lanAttachList': [{
                  'fabric': dc_fabric_name,
                  'vrfName': ext.vrf,
                  'serialNumber': dc_vrf_lite_border_serial,
                  'vlan': attachment.get('vlanId'),
                  'deployment': true,
                  'instanceValues': attachment.get('instanceValues') or '',
                  'freeformConfig': state.get('freeform', ''),
                  'extensionValues': ({'VRF_LITE_CONN': ({'VRF_LITE_CONN': [desired]} | to_json),
                                       'MULTISITE_CONN': state.get('multisite', '{\"MULTISITE_CONN\":[]}')}) | to_json
                }]
              }) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Attach the VRF-Lite extensions on {{ dc_vrf_lite_border_leaf }}
      cisco.dcnm.dcnm_rest:
        method: POST
        path: "{{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/attachments"
        data: "{{ dc_vrf_lite_payload | to_json }}"
      register: dc_vrf_lite_result
      when: dc_vrf_lite_payload | length > 0

    - name: Report the outcome
      ansible.builtin.debug:
        msg: >-
          {{ dc_vrf_lite_payload | map(attribute='vrfName') | join(', ')
             | default('nothing', true) }} written on
          {{ dc_vrf_lite_border_leaf }} {{ dc_vrf_lite_interface }} with MTU
          {{ dc_vrf_lite_mtu }}.
          {{ 'Stage 07 will push it to the switch.'
             if dc_vrf_lite_payload | length > 0
             else 'Every extension already matched the declared intent.' }}
