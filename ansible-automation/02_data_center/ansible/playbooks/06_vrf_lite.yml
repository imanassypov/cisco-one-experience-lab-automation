---
# Stage 06 - extend MAIN, PROD and IOT out of the border leaf with VRF-Lite.
#
# Guide section 8 gives each VRF two Detach/Attach sliders. The first attaches
# the VRF itself to DC-Service-Leaf, and the data model owns that half: the
# border leaf is listed in the dc_leaves attach group in
# playbooks/host_vars/Pseudoco-DC1/vrfs.nac.yaml, so stage 02 makes the plain
# attachment. This stage is the second slider and nothing else - the external
# L3 extension, with its dot1q tag, sub-interface prefix and neighbour address.
#
# The model cannot express that second half. A vrf_attach_group entry names a
# switch and nothing else, with no key for EXTEND: VRF_LITE, the sub-interface,
# the tag or the neighbour address. So this stage calls cisco.dcnm's dcnm_vrf
# directly, which does support attach[].vrf_lite[], using the intent declared
# in inventory/group_vars/all/dc_vrf_lite.yml.
#
# Like stages 02 to 04, it writes intent to the controller and changes nothing
# on a switch, so a deploy has to follow it before the sub-interfaces and BGP
# neighbours reach DC-Service-Leaf.
#
# Two things to know before running it:
#   - It has to run after stage 02 on every pass. Stage 02's create role runs
#     dcnm_vrf with state: replaced, which clears an extension the model cannot
#     describe. This stage uses state: merged, so the DC-Leaf1 and DC-Leaf2
#     attachments stage 02 made survive, and it is idempotent: a second run on
#     an already-extended fabric reports changed=false.
#   - It has to run after a deploy, not before one. Nexus Dashboard offers the
#     border leaf a VRF-Lite extension only where a VRF-Lite inter-fabric link
#     terminates on the parent interface, and it builds that link itself during
#     a Recalculate and Deploy, once the edge router stage 04 adds is in the
#     External fabric. Without it dcnm_vrf fails with "No VRF LITE capable
#     interfaces found on this switch". So run 05_recalculate_and_deploy.yml
#     first, then this stage, then the deploy again. 01_dc_deploy.yml already
#     imports the stages in that order.
#
# The precheck below reads that condition before writing, and retries for a
# short while in case a deploy has only just finished. When it still fails, the
# task reports that stage 05 must run before this stage.
#
# Run from the collection root, the directory holding ansible.cfg:
#
#   cd ansible-automation/02_data_center/ansible
#   ansible-playbook playbooks/06_vrf_lite.yml
#
# Useful overrides:
#   -e dc_vrf_lite_deploy=true      deploy now rather than leaving the push to
#                                   stage 05
#   -e dc_vrf_lite_precheck=false   skip the precondition read and let dcnm_vrf
#                                   report its own error
#   -e dc_vrf_lite_retries=12       wait longer for the controller to offer the
#                                   extension
#
# Background: "What stage 06 needs from the controller" in the README.

- name: Stage 06 - attach the VRF-Lite extensions on the border leaf
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    ndfc_api_root: /appcenter/cisco/ndfc/api/v1/lan-fabric
    # Stage the attachments on the controller and leave the push to stage 07,
    # the same way stages 02 and 03 stage everything else. Setting this true is
    # only useful when re-attaching extensions to a fabric that is otherwise
    # already deployed.
    dc_vrf_lite_deploy: false
    # Read the precondition before writing so the failure names the real cause.
    # Set false to go straight to the module and see its own error instead.
    dc_vrf_lite_precheck: true
    # How long the precheck waits for the controller to offer the extension.
    # The inter-fabric link is built during a deploy and the controller
    # finishes it in its own time, so a run started right after a deploy can
    # arrive a little early. Two minutes by default.
    dc_vrf_lite_retries: 6
    dc_vrf_lite_delay: 20

  tasks:
    # --------------------------------------------------- declared intent
    # dc_vrf_lite.yml does not restate vrf_id or vlan_id. They are read back out
    # of the same model stage 02 consumed, so the two files cannot disagree: a
    # VRF renumbered in vrfs.nac.yaml is renumbered here too. include_vars loads
    # a YAML file into a variable, and delegate_to: localhost reads it from this
    # machine rather than from the controller.
    - name: Read the declared VRFs
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/vrfs.nac.yaml"
        name: dc_vrf_lite_vrf_model
      delegate_to: localhost

    - name: Flatten the declared VRFs
      ansible.builtin.set_fact:
        dc_vrf_lite_declared_vrfs: "{{ dc_vrf_lite_vrf_model.vxlan.overlay.vrfs | default([]) }}"

    # ------------------------------------------------------- data checks
    # Every assert below runs before the first write, so a typo in the declared
    # intent reads as a data error rather than as a confusing controller
    # rejection. assert stops the play when its conditions are not all true.
    - name: Fail when the declared border leaf is not in the switch table
      ansible.builtin.assert:
        that:
          - matching_switches | length == 1
        fail_msg: >-
          DATA MODEL ERROR, not a fabric fault. dc_vrf_lite_border_leaf is
          '{{ dc_vrf_lite_border_leaf }}', which matches
          {{ matching_switches | length }} entries in dc_switches.yml
          (declared switches: {{ dc_switches | map(attribute='name') | join(', ') }}).
          Fix inventory/group_vars/all/dc_vrf_lite.yml.
      vars:
        matching_switches: >-
          {{ dc_switches | selectattr('name', 'equalto', dc_vrf_lite_border_leaf) | list }}

    - name: Resolve the border leaf management address
      ansible.builtin.set_fact:
        dc_vrf_lite_border_ip: >-
          {{ (dc_switches
              | selectattr('name', 'equalto', dc_vrf_lite_border_leaf)
              | list | first).management_ipv4_address }}

    # Cisco scopes VRF-Lite autoconfiguration to a "Border role in the VXLAN
    # fabric and Edge Router role in the connected external fabric device", and
    # dcnm_vrf enforces the same rule: it matches "border" against the role the
    # controller reports and refuses with "VRF LITE attachments are appropriate
    # only for switches with Border roles". Checking it here explains the
    # problem in terms of this repository's own switch table instead.
    - name: Fail when the declared border leaf does not hold the border role
      ansible.builtin.assert:
        that:
          - declared_role == 'border'
        fail_msg: >-
          DATA MODEL ERROR. {{ dc_vrf_lite_border_leaf }} is declared with
          role '{{ declared_role }}' in dc_switches.yml, but VRF-Lite
          extensions are only supported from a switch holding the border
          role. Cisco: "Autoconfiguration is supported for the following
          cases: Border role in the VXLAN fabric and Edge Router role in the
          connected external fabric device".
      vars:
        declared_role: >-
          {{ (dc_switches
              | selectattr('name', 'equalto', dc_vrf_lite_border_leaf)
              | list | first).role | default('') }}

    - name: Fail when an extension names a VRF that vrfs.nac.yaml never declares
      ansible.builtin.assert:
        that:
          - undeclared | length == 0
        fail_msg: >-
          DATA MODEL ERROR, not a fabric fault. {{ undeclared | join(', ') }}
          named in dc_vrf_lite.yml but not declared in vrfs.nac.yaml
          (declared VRFs: {{ dc_vrf_lite_declared_vrfs | map(attribute='name') | join(', ') }}).
          Extending a VRF that the fabric does not have cannot work.
      vars:
        declared_names: "{{ dc_vrf_lite_declared_vrfs | map(attribute='name') | list }}"
        undeclared: >-
          {{ dc_vrf_lite_extensions
             | map(attribute='vrf')
             | reject('in', declared_names)
             | list }}

    # The extension is added on top of the attachment the model makes, so the
    # model has to make it. This catches a border leaf dropped out of
    # vrf_attach_groups: stage 02 would then leave it unattached, and the
    # extension would be the only thing holding the VRF there.
    - name: Fail when the model does not attach the border leaf to every extended VRF
      ansible.builtin.assert:
        that:
          - unattached | length == 0
        fail_msg: >-
          DATA MODEL ERROR. {{ dc_vrf_lite_border_leaf }} is not in the
          vrf_attach_group of {{ unattached | join(', ') }} in
          playbooks/host_vars/{{ inventory_hostname }}/vrfs.nac.yaml, so stage
          02 will not attach the VRF to it and this stage has nothing to
          extend. Add '- hostname: {{ dc_vrf_lite_border_leaf }}' to the
          attach group those VRFs name.
      vars:
        dc_vrf_lite_attach_groups: >-
          {{ dc_vrf_lite_vrf_model.vxlan.overlay.vrf_attach_groups | default([]) }}
        unattached: >-
          {%- set missing = [] -%}
          {%- for ext in dc_vrf_lite_extensions -%}
          {%- set declared = (dc_vrf_lite_declared_vrfs
                              | selectattr('name', 'equalto', ext.vrf)
                              | list | first) | default({}) -%}
          {%- set group = (dc_vrf_lite_attach_groups
                           | selectattr('name', 'equalto',
                                        declared.vrf_attach_group | default(''))
                           | list | first) | default({}) -%}
          {%- set hosts = (group.switches | default([]))
                          | map(attribute='hostname') | list -%}
          {%- if dc_vrf_lite_border_leaf not in hosts -%}
          {{- missing.append(ext.vrf) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ missing }}

    # One sub-interface per dot1q tag on one parent interface. Two rows sharing
    # a tag collapse into a single sub-interface on the switch, leaving the
    # second VRF unreachable with nothing to show for it.
    #
    # The variable below cannot be called "tags": that is a reserved task
    # keyword, so Ansible would read the vars entry as the directive and the
    # expression would fail with "'tags' is undefined".
    - name: Fail on a duplicate dot1q tag
      ansible.builtin.assert:
        that:
          - dot1q_tags | length == dot1q_tags | unique | length
        fail_msg: >-
          DATA MODEL ERROR. dc_vrf_lite.yml reuses a dot1q tag
          ({{ dot1q_tags | join(', ') }}). Every extension on
          {{ dc_vrf_lite_interface }} needs its own tag.
      vars:
        dot1q_tags: "{{ dc_vrf_lite_extensions | map(attribute='dot1q') | list }}"

    # ------------------------------------------------------ build and apply
    - name: Build the dcnm_vrf configuration
      ansible.builtin.set_fact:
        dc_vrf_lite_config: >-
          {%- set rows = [] -%}
          {%- for ext in dc_vrf_lite_extensions -%}
          {%- set declared = (dc_vrf_lite_declared_vrfs
                              | selectattr('name', 'equalto', ext.vrf)
                              | list | first) -%}
          {{- rows.append({
                'vrf_name': ext.vrf,
                'vrf_id': declared.vrf_id,
                'vlan_id': declared.vlan_id,
                'attach': [{
                  'ip_address': dc_vrf_lite_border_ip,
                  'vrf_lite': [{
                    'peer_vrf': ext.peer_vrf,
                    'interface': dc_vrf_lite_interface,
                    'ipv4_addr': ext.ipv4_addr,
                    'neighbor_ipv4': ext.neighbor_ipv4,
                    'dot1q': ext.dot1q | string
                  }]
                }]
              }) or '' -}}
          {%- endfor -%}
          {{ rows }}

    - name: Show what will be attached
      ansible.builtin.debug:
        msg: "{{ dc_vrf_lite_extensions | length }} VRF-Lite extension(s) on {{ dc_vrf_lite_border_leaf }} ({{ dc_vrf_lite_border_ip }}) {{ dc_vrf_lite_interface }}:\n{{ dc_vrf_lite_attachment_table }}"
      vars:
        dc_vrf_lite_attachment_table: >-
          {%- set rows = ['| VRF | Dot1q | Local address | Neighbor |',
                          '| --- | ---: | --- | --- |'] -%}
          {%- for ext in dc_vrf_lite_extensions -%}
          {{- rows.append('| ' ~ ext.vrf ~ ' | ' ~ ext.dot1q ~ ' | '
                          ~ ext.ipv4_addr ~ ' | ' ~ ext.neighbor_ipv4 ~ ' |') or '' -}}
          {%- endfor -%}
          {{ rows | join('\n') }}

    # ------------------------------------------------------------- precheck
    # These two tasks read exactly what the module will read, so that a missing
    # precondition is reported by name rather than as the module's own error.
    # Both are GETs and change nothing; changed_when: false stops Ansible
    # reporting them as changes, and the when: lines let
    # -e dc_vrf_lite_precheck=false skip them.
    #
    # The serial is resolved from the controller's inventory rather than from
    # the generated topology_switches.nac.yaml, so this works on a fresh
    # checkout.
    - name: Read the fabric inventory to resolve the border leaf serial
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/fabrics/{{ dc_fabric_name }}/inventory/switchesByFabric"
      register: dc_vrf_lite_inventory
      changed_when: false
      when: dc_vrf_lite_precheck | bool

    - name: Resolve the border leaf serial
      ansible.builtin.set_fact:
        dc_vrf_lite_border_serial: >-
          {{ ((dc_vrf_lite_inventory.response | default({})).DATA | default([])
              | selectattr('ipAddress', 'defined')
              | selectattr('ipAddress', 'equalto', dc_vrf_lite_border_ip)
              | map(attribute='serialNumber') | list | first | default('')) }}
      when: dc_vrf_lite_precheck | bool

    # This is the call dcnm_vrf makes to find out which extensions the
    # controller is offering. Querying one VRF is enough: the prototype list is
    # a property of the switch and its inter-fabric link rather than of the VRF,
    # so if it is empty for one VRF it is empty for all three.
    #
    # until/retries repeat the GET until the controller offers a VRF_LITE
    # extension or the attempts run out, which covers a run started while the
    # controller is still finishing the inter-fabric link after a deploy.
    # failed_when: false lets the assert below report the outcome instead of
    # Ansible's generic retry failure.
    - name: Read the VRF-Lite extension prototypes the controller offers
      cisco.dcnm.dcnm_rest:
        method: GET
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/switches?vrf-names={{ dc_vrf_lite_extensions[0].vrf }}&serial-numbers={{ dc_vrf_lite_border_serial }}
      register: dc_vrf_lite_probe
      changed_when: false
      failed_when: false
      until: >-
         (((((dc_vrf_lite_probe.response | default({})).DATA | default([])
           | first | default({})).switchDetailsList | default([])
          | first | default({})).extensionPrototypeValues | default([], true))
         | selectattr('extensionType', 'defined')
         | selectattr('extensionType', 'equalto', 'VRF_LITE')
         | list | length) > 0
      retries: "{{ dc_vrf_lite_retries }}"
      delay: "{{ dc_vrf_lite_delay }}"
      when:
        - dc_vrf_lite_precheck | bool
        - dc_vrf_lite_border_serial | length > 0

    # A successful deploy and in_sync=True do not prove that Nexus Dashboard
    # created the VRF-Lite inter-fabric connection. If the prototype is absent,
    # include the actual link record on Ethernet1/8 in the failure below.
    - name: Read controller links for the border fabric
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ ndfc_api_root }}/rest/control/links/fabrics/{{ dc_fabric_name }}"
      register: dc_vrf_lite_links
      changed_when: false
      failed_when: false
      when:
        - dc_vrf_lite_precheck | bool
        - dc_vrf_lite_border_serial | length > 0

    # The same test the module applies, and no stricter: at least one prototype
    # whose extensionType is VRF_LITE. The interface name is reported but not
    # asserted on, because the module checks that separately and reports it in a
    # different message, "No matching interfaces with vrf_lite extensions found
    # on switch".
    - name: Fail with the real cause when the controller offers no VRF-Lite prototype
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_prototypes | length > 0
        success_msg: >-
          Controller offers {{ dc_vrf_lite_prototypes | length }} VRF_LITE
          extension prototype(s) on {{ dc_vrf_lite_border_leaf }}
          ({{ dc_vrf_lite_border_serial }}):
          {{ dc_vrf_lite_proto_summary | join('; ') | default('details unavailable', true) }}.
          Proceeding.
        fail_msg: >-
          Nexus Dashboard is not offering {{ dc_vrf_lite_border_leaf }}
          ({{ dc_vrf_lite_border_serial }}) a VRF-Lite extension, so the
          attachment cannot be made and dcnm_vrf would fail with "No VRF LITE
          capable interfaces found on this switch". Extension type(s) offered:
          {{ dc_vrf_lite_proto_types | default([], true) }}.
          Controller link(s) on {{ dc_vrf_lite_border_leaf }}
          {{ dc_vrf_lite_interface }}:
          {{ dc_vrf_lite_parent_link_summary | join('; ') | default('none found or link query failed', true) }}.
          A VRF-Lite IFC should have templateName=ext_fabric_setup.
          A successful deploy and in_sync=True only confirm switch deployment;
          they do not confirm IFC creation. Verify that stage 03 left
          VRF_LITE_AUTOCONFIG=Back2Back&ToExternal on Pseudoco-DC1, that the
          router is present in the External fabric with the Edge Router role,
          and that CDP shows the physical adjacency.
          An extension is offered only where a VRF-Lite inter-fabric link
          terminates on {{ dc_vrf_lite_interface }}. The controller builds that
          link itself during a Recalculate and Deploy, once the edge router is
          in the External fabric. This check already waited
          {{ (dc_vrf_lite_retries | int) * (dc_vrf_lite_delay | int) }}s for the
          link to appear; raise that with -e dc_vrf_lite_retries=12.
          To skip this check and see the module's own error instead, re-run
          with -e dc_vrf_lite_precheck=false.
      vars:
        dc_vrf_lite_switch_record: >-
          {{ (((dc_vrf_lite_probe.response | default({})).DATA | default([])
               | first | default({})).switchDetailsList | default([])
              | first | default({})) }}
        dc_vrf_lite_prototypes: >-
          {{ (dc_vrf_lite_switch_record.extensionPrototypeValues | default([], true))
             | selectattr('extensionType', 'defined')
             | selectattr('extensionType', 'equalto', 'VRF_LITE') | list }}
        dc_vrf_lite_proto_types: >-
          {{ (dc_vrf_lite_switch_record.extensionPrototypeValues | default([], true))
             | map(attribute='extensionType') | list }}
        dc_vrf_lite_proto_summary: >-
          {%- set lines = [] -%}
          {%- for prototype in dc_vrf_lite_prototypes -%}
          {%- set values = prototype.get('extensionValues', {}) -%}
          {{- lines.append(
                'interface=' ~ values.get('INTF_NAME', values.get('IF_NAME', 'unknown')) ~
                ', dot1q=' ~ values.get('DOT1Q_ID', 'unknown') ~
                ', local=' ~ values.get('IP_MASK', 'unknown') ~
                ', peer=' ~ values.get('NEIGHBOR_IP', 'unknown') ~
                ', peer_as=' ~ values.get('NEIGHBOR_ASN', 'unknown') ~
                ', template=' ~ values.get('VRF_LITE_JYTHON_TEMPLATE', 'unknown')) or '' -}}
          {%- endfor -%}
          {{ lines }}
        dc_vrf_lite_parent_link_summary: >-
          {%- set links = ((dc_vrf_lite_links.response | default({})).DATA | default([])) -%}
          {%- set rows = [] -%}
          {%- for link in links -%}
          {%- set side1 = link.get('sw1-info', {}) -%}
          {%- set side2 = link.get('sw2-info', {}) -%}
          {%- set on_parent =
              (side1.get('sw-serial-number', '') | string == dc_vrf_lite_border_serial | string
               and side1.get('if-name', '') | string | lower == dc_vrf_lite_interface | string | lower)
              or (side2.get('sw-serial-number', '') | string == dc_vrf_lite_border_serial | string
                  and side2.get('if-name', '') | string | lower == dc_vrf_lite_interface | string | lower) -%}
          {%- if on_parent -%}
          {{- rows.append(
                'template=' ~ link.get('templateName', 'unknown') ~ ': '
                ~ side1.get('sw-sys-name', '?') ~ ' ' ~ side1.get('if-name', '?')
                ~ ' -> ' ~ side2.get('sw-sys-name', '?') ~ ' ' ~ side2.get('if-name', '?')) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}
      when:
        - dc_vrf_lite_precheck | bool
        - dc_vrf_lite_border_serial | length > 0

    - name: Warn when the precheck could not run
      ansible.builtin.debug:
        msg: >-
          Precheck skipped: the border leaf serial could not be resolved from
          the controller inventory for {{ dc_vrf_lite_border_ip }}. The
          dcnm_vrf call below will still run and will report its own error.
      when:
        - dc_vrf_lite_precheck | bool
        - dc_vrf_lite_border_serial | default('') | length == 0

    # A previous dcnm_vrf call can have committed one or more attachments
    # before a later row failed. Reading the attachment list before posting is
    # therefore required for idempotency: the prototype query above only says
    # that VRF-Lite is possible, not that each declared extension is absent.
    - name: Read existing VRF-Lite attachments before merging
      cisco.dcnm.dcnm_rest:
        method: GET
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/attachments?vrf-names={{ dc_vrf_lite_extensions | map(attribute='vrf') | join(',') }}
      register: dc_vrf_lite_existing_attachments
      changed_when: false
      when: dc_vrf_lite_border_serial | default('') | length > 0

    - name: Classify existing VRF-Lite attachments
      ansible.builtin.set_fact:
        dc_vrf_lite_reconciliation: >-
          {%- set rows = [] -%}
          {%- set records = ((dc_vrf_lite_existing_attachments.response | default({})).DATA | default([])) -%}
          {%- for ext in dc_vrf_lite_extensions -%}
          {%- set exact = [] -%}
          {%- set existing_for_vrf = [] -%}
          {%- set collisions = [] -%}
          {%- for record in records -%}
          {%- set record_vrf = record.get('vrfName', '') | string | lower -%}
          {%- for attachment in record.get('lanAttachList', []) -%}
          {%- if attachment.get('switchSerialNo', '') | string == dc_vrf_lite_border_serial | string -%}
          {%- set raw_values = attachment.get('extensionValues', '') -%}
          {%- set values = (raw_values | from_json) if raw_values is string and raw_values | length > 0 else {} -%}
          {%- set raw_connections = values.get('VRF_LITE_CONN', '{}') if values is mapping else '{}' -%}
          {%- set connection_data = (raw_connections | from_json) if raw_connections is string and raw_connections | length > 0 else {} -%}
          {%- set connections = connection_data.get('VRF_LITE_CONN', []) if connection_data is mapping else [] -%}
          {%- if record_vrf == ext.vrf | string | lower and connections | length > 0 -%}
          {{- existing_for_vrf.extend(connections) or '' -}}
          {%- endif -%}
          {%- for conn in connections -%}
          {%- set same_link = (conn.get('IF_NAME', conn.get('INTF_NAME', '')) | string | lower == dc_vrf_lite_interface | string | lower)
                              and conn.get('DOT1Q_ID', '') | string == ext.dot1q | string
                              and conn.get('IP_MASK', '') == ext.ipv4_addr
                              and conn.get('NEIGHBOR_IP', '') == ext.neighbor_ipv4 -%}
          {%- if same_link and record_vrf == ext.vrf | string | lower and conn.get('PEER_VRF_NAME', '') | string | lower == ext.peer_vrf | string | lower -%}
          {{- exact.append(conn) or '' -}}
          {%- elif same_link -%}
          {{- collisions.append({'owner': record.get('vrfName', 'unknown'), 'connection': conn}) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {{- rows.append({'vrf': ext.vrf,
                           'state': 'exact' if exact | length > 0 else ('conflict' if existing_for_vrf | length > 0 or collisions | length > 0 else 'missing'),
                           'collision_owners': collisions | map(attribute='owner') | list}) or '' -}}
          {%- endfor -%}
          {{ rows }}
      when: dc_vrf_lite_border_serial | default('') | length > 0

    - name: Fail when an existing VRF-Lite extension conflicts with intent
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_conflicts | length == 0
        fail_msg: >-
          DATA MODEL CONFLICT, not a missing prototype. Nexus Dashboard already
          has a VRF-Lite extension for {{ dc_vrf_lite_conflicts | map(attribute='vrf') | join(', ') }}
          on {{ dc_vrf_lite_border_leaf }}, but its interface, dot1q tag, IP
          address, neighbor, or peer VRF differs from dc_vrf_lite.yml. The
          playbook will not overwrite an existing extension. Reconcile the
          controller or the declared values before re-running stage 06.
      vars:
        dc_vrf_lite_conflicts: >-
          {{ dc_vrf_lite_reconciliation | default([])
             | selectattr('state', 'equalto', 'conflict') | list }}
      when: dc_vrf_lite_reconciliation is defined

    - name: Select only missing VRF-Lite extensions for the module merge
      ansible.builtin.set_fact:
        dc_vrf_lite_config_to_apply: >-
          {{ dc_vrf_lite_config
             | selectattr('vrf_name', 'in',
                          dc_vrf_lite_reconciliation | selectattr('state', 'equalto', 'missing')
                          | map(attribute='vrf') | list)
             | list }}
      when: dc_vrf_lite_reconciliation is defined

    - name: Use the complete configuration when attachment readback is unavailable
      ansible.builtin.set_fact:
        dc_vrf_lite_config_to_apply: "{{ dc_vrf_lite_config }}"
      when: dc_vrf_lite_config_to_apply is not defined

    # --------------------------------------------------------------- write
    # block groups tasks so that rescue can run if one of them fails. Here the
    # rescue turns the controller's message into an explanation of what it
    # means.
    - name: Attach the VRF-Lite extensions
      block:
        # The precheck above has already waited for the extension to be on
        # offer, so this call does not retry: if it fails here, the cause is
        # what the controller says it is rather than something still settling.
        - name: Merge missing VRF-Lite attachments on {{ dc_vrf_lite_border_leaf }}
          cisco.dcnm.dcnm_vrf:
            fabric: "{{ dc_fabric_name }}"
            state: merged
            deploy: "{{ dc_vrf_lite_deploy | bool }}"
            config: "{{ dc_vrf_lite_config_to_apply }}"
          register: dc_vrf_lite_result
          when: dc_vrf_lite_config_to_apply | length > 0

      rescue:
        - name: Explain what the controller refused
          ansible.builtin.fail:
            msg: >-
              VRF-Lite attachment failed on {{ dc_vrf_lite_border_leaf }}.
              Controller error: {{ ansible_failed_result.msg | default('see above') }}
              If the error says "No VRF LITE capable interfaces found", run
              stage 05 first so Nexus Dashboard can create the inter-fabric
              link, then re-run stage 06.

    # ------------------------------------------------- sub-interface MTU
    # dcnm_vrf has no key for the sub-interface MTU, and the controller's VRF
    # extension template falls back to 9216 when the field is empty. The parent
    # Ethernet1/8 is 9000, and a switch rejects a sub-interface larger than its
    # parent with "MTU of sub-interface greater than parent interface
    # detected", so the deploy that follows this stage would fail. These two
    # tasks put dc_vrf_lite_mtu, from dc_vrf_lite.yml, into the extension the
    # module just wrote. That value is 1500, the IP MTU the edge router
    # carries on its side of the same three links.
    #
    # The current extension is read back rather than rebuilt, because the
    # controller adds fields of its own to it - the neighbour ASN and the
    # auto-VRF-Lite flag come from the inter-fabric link - and re-posting a
    # hand-built copy would drop them.
    - name: Read back the extensions so the MTU can be added to them
      cisco.dcnm.dcnm_rest:
        method: GET
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/switches?vrf-names={{ item.vrf }}&serial-numbers={{ dc_vrf_lite_border_serial }}
      register: dc_vrf_lite_mtu_read
      changed_when: false
      loop: "{{ dc_vrf_lite_extensions }}"
      loop_control:
        label: "{{ item.vrf }}"
      when: dc_vrf_lite_border_serial | default('') | length > 0

    # The VLAN and the per-switch instance values are read from the attachments
    # endpoint rather than from the response above, which reports the VLAN as
    # -1 and returns no instance values. Posting either of those back would
    # damage the attachment the module just made.
    - name: Read the attachments for the VLAN and instance values
      cisco.dcnm.dcnm_rest:
        method: GET
        path: >-
          {{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/attachments?vrf-names={{ dc_vrf_lite_extensions | map(attribute='vrf') | join(',') }}
      register: dc_vrf_lite_attach_read
      changed_when: false
      when: dc_vrf_lite_border_serial | default('') | length > 0

    # One POST per VRF whose sub-interface MTU is not already the declared
    # value, so a second run of this stage sends nothing. extensionValues is a
    # JSON document stored inside a JSON string, which is why it is decoded
    # with from_json and re-encoded with to_json rather than edited as text.
    - name: Set the sub-interface MTU to {{ dc_vrf_lite_mtu }}
      cisco.dcnm.dcnm_rest:
        method: POST
        path: "{{ ndfc_api_root }}/rest/top-down/fabrics/{{ dc_fabric_name }}/vrfs/attachments"
        data: "{{ [{'vrfName': item.vrf, 'lanAttachList': [item.attach]}] | to_json }}"
      loop: "{{ dc_vrf_lite_mtu_updates }}"
      loop_control:
        label: "{{ item.vrf }}"
      when: dc_vrf_lite_mtu_updates | length > 0
      vars:
        dc_vrf_lite_mtu_updates: >-
          {%- set rows = [] -%}
          {%- for r in dc_vrf_lite_mtu_read.results | default([]) -%}
          {%- set sw = (((r.response | default({})).DATA | default([])
                         | first | default({})).switchDetailsList | default([])
                        | first | default({})) -%}
          {%- if sw.get('extensionValues', '') | length > 0 -%}
          {%- set ev = sw.extensionValues | from_json -%}
          {%- set conns = (ev.get('VRF_LITE_CONN', '{}') | from_json).get('VRF_LITE_CONN', []) -%}
          {%- set fixed = [] -%}
          {%- for c in conns -%}
          {{- fixed.append(c | combine({'MTU': dc_vrf_lite_mtu | string})) or '' -}}
          {%- endfor -%}
          {%- set att = (((dc_vrf_lite_attach_read.response | default({})).DATA | default([])
                          | selectattr('vrfName', 'equalto', r.item.vrf) | list
                          | first | default({})).lanAttachList | default([])
                         | selectattr('switchSerialNo', 'equalto', dc_vrf_lite_border_serial)
                         | list | first | default({})) -%}
          {%- if conns | length > 0
                 and att.get('vlanId') is not none
                 and (conns | map(attribute='MTU', default='') | list) != ([dc_vrf_lite_mtu | string] * (conns | length)) -%}
          {{- rows.append({
                'vrf': r.item.vrf,
                'attach': {
                  'fabric': dc_fabric_name,
                  'vrfName': r.item.vrf,
                  'serialNumber': dc_vrf_lite_border_serial,
                  'vlan': att.get('vlanId'),
                  'deployment': true,
                  'instanceValues': att.get('instanceValues', ''),
                  'freeformConfig': sw.get('freeformConfig', ''),
                  'extensionValues': ({'VRF_LITE_CONN': ({'VRF_LITE_CONN': fixed} | to_json),
                                       'MULTISITE_CONN': ev.get('MULTISITE_CONN', '{"MULTISITE_CONN":[]}')}) | to_json
                }
              }) or '' -}}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Report the outcome
      ansible.builtin.debug:
        msg: >-
          VRF-Lite {{ 'staged and deployed' if (dc_vrf_lite_deploy | bool) else 'staged on the controller' }}
          for {{ dc_vrf_lite_extensions | map(attribute='vrf') | join(', ') }}
          on {{ dc_vrf_lite_border_leaf }} {{ dc_vrf_lite_interface }}.
          changed={{ dc_vrf_lite_result.changed | default(false) }}.
          {{ 'Stage 06 will push it to the switch.' if not (dc_vrf_lite_deploy | bool) else '' }}
