---
# Stage 06 - extend MAIN, PROD and IOT out of the border leaf with VRF-Lite.
#
# Guide section 8 gives each VRF two Detach/Attach sliders. The first attaches
# the VRF itself to DC-Service-Leaf, and the data model owns that half: the
# border leaf is listed in the dc_leaves attach group in
# playbooks/host_vars/Pseudoco-DC1/vrfs.nac.yaml, so stage 02 makes the plain
# attachment. This stage is the second slider and nothing else - the external
# L3 extension, with its dot1q tag, sub-interface prefix and neighbour address.
#
# The model cannot express that second half. A vrf_attach_group entry names a
# switch and nothing else, with no key for EXTEND: VRF_LITE, the sub-interface,
# the tag or the neighbour address. So this stage writes the attachment itself,
# from the intent declared in inventory/group_vars/all/dc_vrf_lite.yml.
#
# It uses cisco.dcnm.dcnm_rest with Nexus Dashboard's Manage API because
# cisco.nd 1.5.0 has no VRF/resource-manager module and its nd_rest rejects
# HTTP 207. The unreleased cisco.nd 2.0.0 Manage modules should be reconsidered
# when they ship; their documented VRF attach options do not yet expose these
# VRF-Lite extension fields. The Manage API stores typed extensionValues and
# has no template field in that structure.
#
# Like stages 02 to 04, it writes intent to the controller and changes nothing
# on a switch, so a deploy has to follow it before the sub-interfaces and BGP
# neighbours reach DC-Service-Leaf.
#
# Two things to know before running it:
#   - It has to run after stage 02 on every pass. Stage 02's create role runs
#     dcnm_vrf with state: replaced, which clears an extension the model cannot
#     describe. This stage rewrites only the border leaf's attachment for the
#     three VRFs it owns, and only where a field differs, so a second run on an
#     already-extended fabric sends nothing.
#   - Stage 04 creates the External fabric, onboards the edge router, and
#     explicitly creates or reconciles the VRF-Lite IFC with dcnm_links and
#     ext_fabric_setup. Manual mode means this pipeline does not rely on
#     controller auto-creation of that link. Stage 05 deploys the parent-link
#     configuration and recalculates the fabric. Stage 06 checks that Manage
#     returns the stage-04 DCI link resource and an attached VRF with a VLAN;
#     stage 07 deploys the resulting sub-interfaces and BGP neighbours.
#     Run stages 04 -> 05 -> 06 -> 07. 01_dc_deploy.yml already imports them
#     in that order. Keeping IFC creation in stage 04 puts it before the
#     stage 05 deployment boundary; stage 06 does not create the IFC itself.
#   - 2026-11-10, observed on ND 4.2.1.10: the UI's Edit VRF attachment page
#     showed the IFC default address pair (192.168.252.1/30, 192.168.252.2)
#     while MAIN's saved Manage record contained .13/30 and .14. Cancel that
#     page; do not Save. Verify saved values with stage 08 or vrfAttachments/query.
#     Whether Save persists the displayed defaults is untested.
#
# Run from the collection root, the directory holding ansible.cfg:
#
#   cd ansible-automation/02_data_center/ansible
#   ansible-playbook playbooks/06_vrf_lite.yml
#
# Background: "What stage 06 needs from the controller" in the README.

- name: Stage 06 - attach the VRF-Lite extensions on the border leaf
  hosts: Pseudoco-DC1
  gather_facts: false
  any_errors_fatal: true

  vars:
    nd_manage_root: /api/v1/manage

  tasks:
    # --------------------------------------------------- declared intent
    # dc_vrf_lite.yml does not restate vrf_id or vlan_id. They are read back out
    # of the same model stage 02 consumed, so the two files cannot disagree: a
    # VRF renumbered in vrfs.nac.yaml is renumbered here too. include_vars loads
    # a YAML file into a variable, and delegate_to: localhost reads it from this
    # machine rather than from the controller.
    - name: Read the declared VRFs
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/vrfs.nac.yaml"
        name: dc_vrf_lite_vrf_model
      delegate_to: localhost

    - name: Flatten the declared VRFs
      ansible.builtin.set_fact:
        dc_vrf_lite_declared_vrfs: "{{ dc_vrf_lite_vrf_model.vxlan.overlay.vrfs | default([]) }}"

    # ------------------------------------------------------- data checks
    # Every assert below runs before the first write, so a typo in the declared
    # intent reads as a data error rather than as a confusing controller
    # rejection. assert stops the play when its conditions are not all true.
    - name: Fail when the declared border leaf is not in the switch table
      ansible.builtin.assert:
        that:
          - matching_switches | length == 1
        fail_msg: >-
          DATA MODEL ERROR, not a fabric fault. dc_vrf_lite_border_leaf is
          '{{ dc_vrf_lite_border_leaf }}', which matches
          {{ matching_switches | length }} entries in dc_switches.yml
          (declared switches: {{ dc_switches | map(attribute='name') | join(', ') }}).
          Fix inventory/group_vars/all/dc_vrf_lite.yml.
      vars:
        matching_switches: >-
          {{ dc_switches | selectattr('name', 'equalto', dc_vrf_lite_border_leaf) | list }}

    # Cisco scopes VRF-Lite autoconfiguration to a "Border role in the VXLAN
    # fabric and Edge Router role in the connected external fabric device", so
    # the controller only ever offers the extension on a border switch.
    # Checking it here explains the problem in terms of this repository's own
    # switch table instead of as an empty prototype list.
    - name: Fail when the declared border leaf does not hold the border role
      ansible.builtin.assert:
        that:
          - declared_role == 'border'
        fail_msg: >-
          DATA MODEL ERROR. {{ dc_vrf_lite_border_leaf }} is declared with
          role '{{ declared_role }}' in dc_switches.yml, but VRF-Lite
          extensions are only supported from a switch holding the border
          role. Cisco: "Autoconfiguration is supported for the following
          cases: Border role in the VXLAN fabric and Edge Router role in the
          connected external fabric device".
      vars:
        declared_role: >-
          {{ (dc_switches
              | selectattr('name', 'equalto', dc_vrf_lite_border_leaf)
              | list | first).role | default('') }}

    - name: Fail when an extension names a VRF that vrfs.nac.yaml never declares
      ansible.builtin.assert:
        that:
          - undeclared | length == 0
        fail_msg: >-
          DATA MODEL ERROR, not a fabric fault. {{ undeclared | join(', ') }}
          named in dc_vrf_lite.yml but not declared in vrfs.nac.yaml
          (declared VRFs: {{ dc_vrf_lite_declared_vrfs | map(attribute='name') | join(', ') }}).
          Extending a VRF that the fabric does not have cannot work.
      vars:
        declared_names: "{{ dc_vrf_lite_declared_vrfs | map(attribute='name') | list }}"
        undeclared: >-
          {{ dc_vrf_lite_extensions
             | map(attribute='vrf')
             | reject('in', declared_names)
             | list }}

    # The extension is added on top of the attachment the model makes, so the
    # model has to make it. This catches a border leaf dropped out of
    # vrf_attach_groups: stage 02 would then leave it unattached, and the
    # extension would be the only thing holding the VRF there.
    - name: Fail when the model does not attach the border leaf to every extended VRF
      ansible.builtin.assert:
        that:
          - unattached | length == 0
        fail_msg: >-
          DATA MODEL ERROR. {{ dc_vrf_lite_border_leaf }} is not in the
          vrf_attach_group of {{ unattached | join(', ') }} in
          playbooks/host_vars/{{ inventory_hostname }}/vrfs.nac.yaml, so stage
          02 will not attach the VRF to it and this stage has nothing to
          extend. Add '- hostname: {{ dc_vrf_lite_border_leaf }}' to the
          attach group those VRFs name.
      vars:
        dc_vrf_lite_attach_groups: >-
          {{ dc_vrf_lite_vrf_model.vxlan.overlay.vrf_attach_groups | default([]) }}
        unattached: >-
          {%- set missing = [] -%}
          {%- for ext in dc_vrf_lite_extensions -%}
          {%- set declared = (dc_vrf_lite_declared_vrfs
                              | selectattr('name', 'equalto', ext.vrf)
                              | list | first) | default({}) -%}
          {%- set group = (dc_vrf_lite_attach_groups
                           | selectattr('name', 'equalto',
                                        declared.vrf_attach_group | default(''))
                           | list | first) | default({}) -%}
          {%- set hosts = (group.switches | default([]))
                          | map(attribute='hostname') | list -%}
          {%- if dc_vrf_lite_border_leaf not in hosts -%}
          {{- missing.append(ext.vrf) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ missing }}

    # One sub-interface per dot1q tag on one parent interface. Two rows sharing
    # a tag collapse into a single sub-interface on the switch, leaving the
    # second VRF unreachable with nothing to show for it.
    #
    # The variable below cannot be called "tags": that is a reserved task
    # keyword, so Ansible would read the vars entry as the directive and the
    # expression would fail with "'tags' is undefined".
    - name: Fail on a duplicate dot1q tag
      ansible.builtin.assert:
        that:
          - dot1q_tags | length == dot1q_tags | unique | length
        fail_msg: >-
          DATA MODEL ERROR. dc_vrf_lite.yml reuses a dot1q tag
          ({{ dot1q_tags | join(', ') }}). Every extension on
          {{ dc_vrf_lite_interface }} needs its own tag.
      vars:
        dot1q_tags: "{{ dc_vrf_lite_extensions | map(attribute='dot1q') | list }}"

    - name: Select VRFs for this run
      ansible.builtin.set_fact:
        dc_vrf_lite_selected_extensions: >-
          {{ dc_vrf_lite_extensions
             if dc_vrf_lite_only | string | lower == 'all'
             else dc_vrf_lite_extensions
                  | selectattr('vrf', 'in',
                      [dc_vrf_lite_only] if dc_vrf_lite_only is string
                      else dc_vrf_lite_only | list)
                  | list }}

    - name: Fail when dc_vrf_lite_only selects no declared VRFs
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_selected_extensions | length > 0
        fail_msg: >-
          dc_vrf_lite_only={{ dc_vrf_lite_only }} selects no declared VRFs.
          Use 'all' or one or more names from
          {{ dc_vrf_lite_extensions | map(attribute='vrf') | join(', ') }}.

    # ------------------------------------------------------------- preview
    - name: Show what will be attached
      ansible.builtin.debug:
        msg: >-
          {{ ['VRF-Lite extensions on ' ~ dc_vrf_lite_border_leaf ~ ', interface '
              ~ dc_vrf_lite_interface ~ ':']
             + dc_vrf_lite_attachment_table }}
      vars:
        dc_vrf_lite_attachment_table: >-
          {%- set rows = ['| VRF | Dot1q | Local address | Neighbor | MTU |',
                          '| --- | ---: | --- | --- | ---: |'] -%}
          {%- for ext in dc_vrf_lite_selected_extensions -%}
          {{- rows.append('| ' ~ ext.vrf ~ ' | ' ~ ext.dot1q ~ ' | '
                          ~ ext.ipv4_addr ~ ' | ' ~ ext.neighbor_ipv4 ~ ' | '
                          ~ dc_vrf_lite_mtu ~ ' |') or '' -}}
          {%- endfor -%}
          {{ rows }}

    # --------------------------------------------------------- border serial
    # Stage 00 reads the serials off the switches and writes them into the
    # model, so the controller does not have to be asked for them again.
    - name: Read the switch model stage 00 generated
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/topology_switches.nac.yaml"
        name: dc_vrf_lite_switch_model
      delegate_to: localhost

    - name: Resolve the border leaf serial
      ansible.builtin.set_fact:
        dc_vrf_lite_border_serial: >-
          {{ (dc_vrf_lite_switch_model.vxlan.topology.switches | default([])
              | selectattr('name', 'equalto', dc_vrf_lite_border_leaf)
              | map(attribute='serial_number') | list | first | default('')) }}

    # Every read and write below is keyed on this serial, so an empty one would
    # skip them all and leave the stage reporting success with nothing done.
    - name: Fail when the generated model carries no serial for the border leaf
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_border_serial | length > 0
        fail_msg: >-
          DATA MODEL ERROR. playbooks/host_vars/{{ inventory_hostname }}/topology_switches.nac.yaml
          declares no serial_number for {{ dc_vrf_lite_border_leaf }}. Re-run
          playbooks/00_discover_dc_switch_serials.yml, which reads the serials
          off the switches and regenerates that file.

    - name: Probe the Manage API through dcnm_rest
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ nd_manage_root }}/fabrics/{{ dc_fabric_name }}/pools"
      register: dc_probe
      changed_when: false
      check_mode: false
      tags: [manage_api_probe]

    - name: Fail when the Manage API probe has an unexpected response
      ansible.builtin.assert:
        that:
          - dc_probe.response.RETURN_CODE | default(0) | int == 200
          - dc_probe.response.DATA is mapping
          - dc_probe.response.DATA.pools is defined
          - dc_probe.response.DATA.pools is sequence
          - dc_probe.response.DATA.pools is not string
          - "'topDownL3Dot1q' in (dc_probe.response.DATA.pools | map(attribute='poolName') | list)"
        fail_msg: >-
          The Manage API probe through cisco.dcnm.dcnm_rest did not return
          HTTP 200 with response.DATA.pools including topDownL3Dot1q. Stop here
          and inspect the probe response before changing Resource Manager state.
      tags: [manage_api_probe]

    # ------------------------------------------------- reconcile dot1q tags
    - name: Read the Manage resources
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ nd_manage_root }}/fabrics/{{ dc_fabric_name }}/resources?max=1000"
      register: dc_vrf_lite_resource_read
      changed_when: false
      check_mode: false

    - name: Validate the Manage resources response
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_resource_read.response.RETURN_CODE | default(0) | int == 200
          - dc_vrf_lite_resource_read.response.DATA is mapping
          - dc_vrf_lite_resource_read.response.DATA.resources is defined
          - dc_vrf_lite_resource_read.response.DATA.resources is sequence
          - dc_vrf_lite_resource_read.response.DATA.resources is not string
        fail_msg: >-
          The Manage resources request did not return HTTP 200 with
          response.DATA.resources. Stop and inspect the response before
          changing Resource Manager state.

    # 2026-11-10, observed on ND 4.2.1.10: this link row uses scopeType=link,
    # srcSwitchId and srcInterfaceName. It is stage-04 state and is never edited.
    - name: Require the stage-05 DCI link resource
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_link_resources | length > 0
        fail_msg: >-
          Manage has no DCI subnet pool link resource for
          {{ dc_vrf_lite_border_leaf }} {{ dc_vrf_lite_interface }}. Run stage
          05, then re-run stage 06.
      vars:
        dc_vrf_lite_link_resources: >-
          {%- set links = [] -%}
          {%- for r in dc_vrf_lite_resource_read.response.DATA.resources
                if r.get('poolName', '') == 'DCI subnet pool'
                   and r.get('scopeDetails', {}).get('scopeType', '') == 'link'
                   and r.get('scopeDetails', {}).get('srcSwitchId', '') == dc_vrf_lite_border_serial
                   and r.get('scopeDetails', {}).get('srcInterfaceName', '') == dc_vrf_lite_interface -%}
          {{- links.append(r) or '' -}}
          {%- endfor -%}
          {{ links }}

    - name: Select dot1q resources owned by the selected VRFs on this border leaf
      ansible.builtin.set_fact:
        dc_vrf_lite_pool_rows: >-
          {%- set declared = dc_vrf_lite_selected_extensions | map(attribute='vrf') | list -%}
          {%- set rows = [] -%}
          {%- for r in dc_vrf_lite_resource_read.response.DATA.resources
                if r.get('poolName', '') == 'topDownL3Dot1q'
                   and r.get('scopeDetails', {}).get('switchId', '') == dc_vrf_lite_border_serial
                   and r.get('entityName', '') in declared -%}
          {{- rows.append(r) or '' -}}
          {%- endfor -%}
          {{ rows }}

    - name: Work out held and stale dot1q resources
      ansible.builtin.set_fact:
        dc_vrf_lite_pool_held: >-
          {%- set declared = {} -%}
          {%- set held = [] -%}
          {%- for e in dc_vrf_lite_selected_extensions -%}
          {{- declared.update({e.vrf: e.dot1q | string}) or '' -}}
          {%- endfor -%}
          {%- for r in dc_vrf_lite_pool_rows
                if r.get('entityName', '') in declared
                   and (r.get('resourceValue', '') | string) == declared[r.get('entityName', '')] -%}
          {{- held.append(r.get('entityName')) or '' -}}
          {%- endfor -%}
          {{ held | unique | list }}
        dc_vrf_lite_pool_stale: >-
          {%- set declared = {} -%}
          {%- set stale = [] -%}
          {%- for e in dc_vrf_lite_selected_extensions -%}
          {{- declared.update({e.vrf: e.dot1q | string}) or '' -}}
          {%- endfor -%}
          {%- for r in dc_vrf_lite_pool_rows
                if r.get('entityName', '') in declared
                   and (r.get('resourceValue', '') | string) != declared[r.get('entityName', '')] -%}
          {{- stale.append(r.get('resourceId')) or '' -}}
          {%- endfor -%}
          {{ stale }}

    - name: Release stale dot1q resources
      cisco.dcnm.dcnm_rest:
        method: DELETE
        path: "{{ nd_manage_root }}/fabrics/{{ dc_fabric_name }}/resources/{{ item }}"
      loop: "{{ dc_vrf_lite_pool_stale }}"
      register: dc_vrf_lite_release_result
      changed_when: true
      when: not ansible_check_mode
      failed_when: >-
        (dc_vrf_lite_release_result.response.RETURN_CODE | default(0) | int)
        not in [200, 204, 207]
        or ((dc_vrf_lite_release_result.response.RETURN_CODE | default(0) | int) == 207
          and ((dc_vrf_lite_release_result.response.DATA.results | default([])) is not sequence
             or (dc_vrf_lite_release_result.response.DATA.results | default([])) is string
             or (dc_vrf_lite_release_result.response.DATA.results | default([]) | length != 1)
             or ((dc_vrf_lite_release_result.response.DATA.results | default([]))
               | rejectattr('status', 'equalto', 'success') | list | length > 0)))

    - name: Reserve the selected VRFs' declared dot1q tags
      cisco.dcnm.dcnm_rest:
        method: POST
        path: "{{ nd_manage_root }}/fabrics/{{ dc_fabric_name }}/resources"
        data: "{{ dc_vrf_lite_resource_payload | to_json }}"
      vars:
        dc_vrf_lite_resource_payload:
          resources: >-
            {%- set resources = [] -%}
            {%- for e in dc_vrf_lite_selected_extensions if e.vrf not in dc_vrf_lite_pool_held -%}
            {{- resources.append({
                 'poolName': 'topDownL3Dot1q',
                 'entityName': e.vrf,
                 'resourceValue': e.dot1q | string,
                 'isPreAllocated': true,
                 'scopeDetails': {
                   'scopeType': 'deviceInterface',
                   'switchId': dc_vrf_lite_border_serial,
                   'interfaceName': dc_vrf_lite_interface}}) or '' -}}
            {%- endfor -%}
            {{ resources }}
      register: dc_vrf_lite_pool_create
      changed_when: true
      when: not ansible_check_mode and (dc_vrf_lite_selected_extensions
             | rejectattr('vrf', 'in', dc_vrf_lite_pool_held) | list) | length > 0

    - name: Validate Manage resource reservation results
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_pool_create.response.RETURN_CODE | default(0) | int in [200, 207]
          - dc_vrf_lite_pool_create.response.RETURN_CODE | int != 207 or (dc_vrf_lite_create_results is sequence and dc_vrf_lite_create_results is not string)
          - dc_vrf_lite_pool_create.response.RETURN_CODE | int != 207 or (dc_vrf_lite_create_results | length) == (dc_vrf_lite_reservation_count | int)
          - dc_vrf_lite_create_failures | length == 0
        fail_msg: >-
          {{ dc_vrf_lite_selected_extensions | map(attribute='vrf') | join(', ') }}
          could not be reserved in TOP_DOWN_L3_DOT1Q on {{ dc_vrf_lite_border_leaf }}
          ({{ dc_vrf_lite_border_serial }}). HTTP
          {{ dc_vrf_lite_pool_create.response.RETURN_CODE | default(0) | int }};
          results returned: {{ dc_vrf_lite_create_results | length }};
          expected: {{ dc_vrf_lite_reservation_count | int }}.
          Non-success messages:
          {{ dc_vrf_lite_create_failures | map(attribute='message') | join('; ') or 'none' }}.
          {% if dc_vrf_lite_create_failures | length > 0 %}
          Check Resource Manager for a conflicting allocation of the same ID to another entity.
          {% endif %}
      vars:
        dc_vrf_lite_reservation_count: >-
          {{ dc_vrf_lite_selected_extensions
             | rejectattr('vrf', 'in', dc_vrf_lite_pool_held) | list | length }}
        dc_vrf_lite_create_results: >-
          {{ (dc_vrf_lite_pool_create.response | default({})).DATA.results | default([]) }}
        dc_vrf_lite_create_failures: >-
          {{ dc_vrf_lite_create_results
             | rejectattr('status', 'equalto', 'success') | list }}
      when: dc_vrf_lite_pool_create is not skipped

    - name: Read Manage resources back
      cisco.dcnm.dcnm_rest:
        method: GET
        path: "{{ nd_manage_root }}/fabrics/{{ dc_fabric_name }}/resources?max=1000"
      register: dc_vrf_lite_pool_confirm
      changed_when: false
      check_mode: false

    - name: Validate the Manage resource read-back response
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_pool_confirm.response.RETURN_CODE | default(0) | int == 200
          - dc_vrf_lite_pool_confirm.response.DATA is mapping
          - dc_vrf_lite_pool_confirm.response.DATA.resources is defined
          - dc_vrf_lite_pool_confirm.response.DATA.resources is sequence
          - dc_vrf_lite_pool_confirm.response.DATA.resources is not string
        fail_msg: >-
          The Manage resource read-back did not return HTTP 200 with
          response.DATA.resources. Stop and inspect the response.

    - name: Fail when a selected VRF's declared dot1q tag is not held
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_unheld | length == 0
        fail_msg: >-
          {{ dc_vrf_lite_unheld | join(', ') }} could not be reserved in
          TOP_DOWN_L3_DOT1Q on {{ dc_vrf_lite_border_leaf }}
          ({{ dc_vrf_lite_border_serial }}). Attaching the extensions now
          would let the controller pick its own tags, so this stops here.
          Check the pool under Resource Manager for an allocation of the same
          ID to another entity.
      vars:
        dc_vrf_lite_unheld: >-
          {%- set missing = [] -%}
          {%- set resources = dc_vrf_lite_pool_confirm.response.DATA.resources -%}
          {%- for e in dc_vrf_lite_selected_extensions -%}
          {%- set found = [] -%}
          {%- for r in resources
                if r.get('poolName', '') == 'topDownL3Dot1q'
                   and r.get('scopeDetails', {}).get('switchId', '') == dc_vrf_lite_border_serial
                   and r.get('entityName', '') == e.vrf
                   and (r.get('resourceValue', '') | string) == (e.dot1q | string) -%}
          {{- found.append(r) or '' -}}
          {%- endfor -%}
          {%- if found | length == 0 -%}
          {{- missing.append(e.vrf ~ '=' ~ e.dot1q) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ missing }}

    # -------------------------------------------------- read attachments
    - name: Query the Manage VRF attachments
      cisco.dcnm.dcnm_rest:
        method: POST
        path: "{{ nd_manage_root }}/fabrics/{{ dc_fabric_name }}/vrfAttachments/query"
        data: "{{ dc_vrf_lite_query | to_json }}"
      vars:
        dc_vrf_lite_query:
          switchIds:
            - "{{ dc_vrf_lite_border_serial }}"
          vrfNames: "{{ dc_vrf_lite_selected_extensions | map(attribute='vrf') | list }}"
      register: dc_vrf_lite_attach_read
      changed_when: false
      check_mode: false

    - name: Validate the Manage attachment query response
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_attach_read.response.RETURN_CODE | default(0) | int == 200
          - dc_vrf_lite_attach_read.response.DATA is mapping
          - dc_vrf_lite_attach_read.response.DATA.attachments is defined
          - dc_vrf_lite_attach_read.response.DATA.attachments is sequence
          - dc_vrf_lite_attach_read.response.DATA.attachments is not string
        fail_msg: >-
          The Manage VRF attachment query did not return HTTP 200 with
          response.DATA.attachments. Stop and inspect the response.

    - name: Index Manage attachments by VRF
      ansible.builtin.set_fact:
        dc_vrf_lite_state: >-
          {%- set state = {} -%}
          {%- set declared = dc_vrf_lite_selected_extensions | map(attribute='vrf') | list -%}
          {%- for record in dc_vrf_lite_attach_read.response.DATA.attachments
                if record.get('switchId', '') == dc_vrf_lite_border_serial
                   and record.get('vrfName', '') in declared -%}
          {{- state.update({record.get('vrfName'): record}) or '' -}}
          {%- endfor -%}
          {{ state }}

    - name: Fail when stage 02 has not attached the VRFs to the border leaf
      ansible.builtin.assert:
        that:
          - unattached | length == 0
        fail_msg: >-
          The controller has no attachment for {{ dc_vrf_lite_border_leaf }} on
          {{ unattached | join(', ') }}, so there is no VLAN to extend. Run
          stage 02 before this stage.
      vars:
        unattached: >-
          {%- set missing = [] -%}
          {%- for ext in dc_vrf_lite_selected_extensions -%}
          {%- set record = dc_vrf_lite_state.get(ext.vrf, {}) -%}
          {%- if 'vlanId' not in record or record.get('vlanId') is none -%}
          {{- missing.append(ext.vrf) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ missing }}

    - name: Fail when a Manage attachment omits preserved context
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_missing_context | length == 0
          - dc_vrf_lite_malformed_extensions | length == 0
        fail_msg: >-
          The Manage attachment query omitted instanceValues or extraConfig,
          or returned extensionValues in an unexpected shape for
          {{ dc_vrf_lite_missing_context | union(dc_vrf_lite_malformed_extensions) | join(', ') }}.
          Stop and inspect the response rather than replacing those values.
      vars:
        dc_vrf_lite_missing_context: >-
          {%- set missing = [] -%}
          {%- for ext in dc_vrf_lite_selected_extensions -%}
          {%- set record = dc_vrf_lite_state.get(ext.vrf, {}) -%}
          {%- if 'instanceValues' not in record or 'extraConfig' not in record -%}
          {{- missing.append(ext.vrf) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ missing }}
        dc_vrf_lite_malformed_extensions: >-
          {%- set malformed = [] -%}
          {%- for ext in dc_vrf_lite_selected_extensions -%}
          {%- set values = dc_vrf_lite_state.get(ext.vrf, {}).get('extensionValues', []) -%}
          {%- if values is not sequence or values is string -%}
          {{- malformed.append(ext.vrf) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ malformed }}

    - name: Build typed Manage attachment rows for changed VRFs
      ansible.builtin.set_fact:
        dc_vrf_lite_payload_attachments: >-
          {%- set rows = [] -%}
          {%- for ext in dc_vrf_lite_selected_extensions -%}
          {%- set attachment = dc_vrf_lite_state.get(ext.vrf, {}) -%}
          {%- set current = attachment.get('extensionValues', []) | first | default({}) -%}
          {%- set drift = [] -%}
          {%- if current.get('interfaceName', '') | string != dc_vrf_lite_interface | string -%}
          {{- drift.append('interfaceName') or '' -}}
          {%- endif -%}
          {%- if current.get('dot1qId', -1) | int != ext.dot1q | int -%}
          {{- drift.append('dot1qId') or '' -}}
          {%- endif -%}
          {%- if current.get('ipv4Address', '') != ext.ipv4_addr -%}
          {{- drift.append('ipv4Address') or '' -}}
          {%- endif -%}
          {%- if current.get('neighborIpv4Address', '') != ext.neighbor_ipv4 -%}
          {{- drift.append('neighborIpv4Address') or '' -}}
          {%- endif -%}
          {%- if current.get('peerVrfName', '') != ext.peer_vrf -%}
          {{- drift.append('peerVrfName') or '' -}}
          {%- endif -%}
          {%- if current.get('mtu', -1) | int != dc_vrf_lite_mtu | int -%}
          {{- drift.append('mtu') or '' -}}
          {%- endif -%}
          {%- if drift | length > 0 -%}
          {{- rows.append({
                'vrfName': ext.vrf,
                'switchId': dc_vrf_lite_border_serial,
                'vlanId': attachment.get('vlanId') | int,
                'attach': true,
                'instanceValues': attachment.get('instanceValues'),
                'extraConfig': attachment.get('extraConfig'),
                'extensionValues': [{
                  'interfaceName': dc_vrf_lite_interface,
                  'dot1qId': ext.dot1q | int,
                  'ipv4Address': ext.ipv4_addr,
                  'neighborIpv4Address': ext.neighbor_ipv4,
                  'neighborAsn': current.get('neighborAsn')
                                 | default(dc_external_fabric_settings.BGP_AS, true)
                                 | string,
                  'mtu': dc_vrf_lite_mtu | int,
                  'peerVrfName': ext.peer_vrf,
                  'autoPeerConfig': false}]}) or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Report the check-mode plan
      ansible.builtin.debug:
        msg:
          - "Would release resource IDs: {{ dc_vrf_lite_pool_stale | join(', ') | default('none', true) }}"
          - "Would reserve VRFs: {{ dc_vrf_lite_selected_extensions | rejectattr('vrf', 'in', dc_vrf_lite_pool_held) | map(attribute='vrf') | join(', ') | default('none', true) }}"
          - "Would write VRFs: {{ dc_vrf_lite_payload_attachments | map(attribute='vrfName') | join(', ') | default('none', true) }}"
      when: ansible_check_mode

    - name: Write changed VRF-Lite extensions on {{ dc_vrf_lite_border_leaf }}
      cisco.dcnm.dcnm_rest:
        method: POST
        path: "{{ nd_manage_root }}/fabrics/{{ dc_fabric_name }}/vrfAttachments"
        data: "{{ dc_vrf_lite_payload | to_json }}"
      vars:
        dc_vrf_lite_payload:
          attachments: "{{ dc_vrf_lite_payload_attachments }}"
      register: dc_vrf_lite_result
      changed_when: true
      when: not ansible_check_mode and dc_vrf_lite_payload_attachments | length > 0

    - name: Validate Manage attachment write results
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_result.response.RETURN_CODE | default(0) | int in [200, 207]
          - dc_vrf_lite_result.response.RETURN_CODE | int != 207 or (dc_vrf_lite_write_results is sequence and dc_vrf_lite_write_results is not string)
          - dc_vrf_lite_result.response.RETURN_CODE | int != 207 or dc_vrf_lite_write_results | length == dc_vrf_lite_payload_attachments | length
          - dc_vrf_lite_write_failures | length == 0
        fail_msg: >-
          Manage failed to write the VRF-Lite attachment payload
          (HTTP {{ dc_vrf_lite_result.response.RETURN_CODE | default('unknown') }}).
          Failing items: {{ dc_vrf_lite_write_failures | map(attribute='message') | join('; ') }}
      vars:
        dc_vrf_lite_write_results: >-
          {{ ((dc_vrf_lite_result.response | default({})).DATA | default({})).results | default([]) }}
        dc_vrf_lite_write_failures: >-
          {{ dc_vrf_lite_write_results
             | rejectattr('status', 'equalto', 'success') | list }}
      when: dc_vrf_lite_result is not skipped

    - name: Read back VRF-Lite attachments from Manage
      cisco.dcnm.dcnm_rest:
        method: POST
        path: "{{ nd_manage_root }}/fabrics/{{ dc_fabric_name }}/vrfAttachments/query"
        data: "{{ dc_vrf_lite_readback_query | to_json }}"
      vars:
        dc_vrf_lite_readback_query:
          switchIds:
            - "{{ dc_vrf_lite_border_serial }}"
          vrfNames: "{{ dc_vrf_lite_selected_extensions | map(attribute='vrf') | list }}"
      register: dc_vrf_lite_readback
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Validate the Manage attachment read-back response
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_readback.response.RETURN_CODE | default(0) | int == 200
          - dc_vrf_lite_readback.response.DATA is mapping
          - dc_vrf_lite_readback.response.DATA.attachments is defined
          - dc_vrf_lite_readback.response.DATA.attachments is sequence
          - dc_vrf_lite_readback.response.DATA.attachments is not string
        fail_msg: >-
          The Manage attachment read-back did not return HTTP 200 with
          response.DATA.attachments. Stop and inspect the response.
      when: not ansible_check_mode

    - name: Index Manage read-back by VRF
      when: not ansible_check_mode
      ansible.builtin.set_fact:
        dc_vrf_lite_readback_state: >-
          {%- set state = {} -%}
          {%- set declared = dc_vrf_lite_selected_extensions | map(attribute='vrf') | list -%}
          {%- for record in dc_vrf_lite_readback.response.DATA.attachments
                if record.get('switchId', '') == dc_vrf_lite_border_serial
                   and record.get('vrfName', '') in declared -%}
          {{- state.update({record.get('vrfName'): record}) or '' -}}
          {%- endfor -%}
          {{ state }}

    - name: Fail when a Manage read-back differs from intent
      ansible.builtin.assert:
        that:
          - dc_vrf_lite_readback_mismatches | length == 0
        fail_msg: >-
          Manage read-back does not match the declared VRF-Lite extension fields:
          {{ dc_vrf_lite_readback_mismatches | join('; ') }}.
      when: not ansible_check_mode
      vars:
        dc_vrf_lite_readback_mismatches: >-
          {%- set mismatches = [] -%}
          {%- for ext in dc_vrf_lite_selected_extensions -%}
          {%- set record = dc_vrf_lite_readback_state.get(ext.vrf, {}) -%}
          {%- set current = record.get('extensionValues', []) | first | default({}) -%}
          {%- set drift = [] -%}
          {%- if current.get('interfaceName', '') | string != dc_vrf_lite_interface | string -%}
          {{- drift.append('interfaceName') or '' -}}
          {%- endif -%}
          {%- if current.get('dot1qId', -1) | int != ext.dot1q | int -%}
          {{- drift.append('dot1qId') or '' -}}
          {%- endif -%}
          {%- if current.get('ipv4Address', '') != ext.ipv4_addr -%}
          {{- drift.append('ipv4Address') or '' -}}
          {%- endif -%}
          {%- if current.get('neighborIpv4Address', '') != ext.neighbor_ipv4 -%}
          {{- drift.append('neighborIpv4Address') or '' -}}
          {%- endif -%}
          {%- if current.get('peerVrfName', '') != ext.peer_vrf -%}
          {{- drift.append('peerVrfName') or '' -}}
          {%- endif -%}
          {%- if current.get('mtu', -1) | int != dc_vrf_lite_mtu | int -%}
          {{- drift.append('mtu') or '' -}}
          {%- endif -%}
          {%- if drift | length > 0 -%}
          {{- mismatches.append(ext.vrf ~ ' (' ~ (drift | join(', ')) ~ ')') or '' -}}
          {%- endif -%}
          {%- endfor -%}
          {{ mismatches }}

    - name: Report the Manage read-back
      ansible.builtin.debug:
        msg: >-
          Read back on {{ dc_vrf_lite_border_leaf }} {{ dc_vrf_lite_interface }}:
          {{ dc_vrf_lite_readback_summary }}.
          {{ 'Stage 07 will deploy the staged changes.'
             if dc_vrf_lite_payload_attachments | length > 0
             else 'No attachment write was needed; saved extensions matched intent.' }}
      when: not ansible_check_mode
      vars:
        dc_vrf_lite_readback_summary: >-
          {%- set summary = [] -%}
          {%- for ext in dc_vrf_lite_selected_extensions -%}
          {%- set record = dc_vrf_lite_readback_state.get(ext.vrf, {}) -%}
          {%- set values = record.get('extensionValues', []) | first | default({}) -%}
          {{- summary.append(ext.vrf ~ ': dot1q ' ~ values.get('dot1qId', 'absent')
              ~ ', ' ~ values.get('ipv4Address', 'absent') ~ ' -> '
              ~ values.get('neighborIpv4Address', 'absent') ~ ', peer '
              ~ values.get('peerVrfName', 'absent') ~ ', MTU '
              ~ values.get('mtu', 'absent')) or '' -}}
          {%- endfor -%}
          {{ summary | join('; ') }}
