---
# Stage 00 - SSH to each switch (read-only), read its serial number, and generate topology_switches.nac.yaml.
# Nexus Dashboard identifies switches by serial, so the data model needs them. Needs the lab VPN; run first.
# Run: cd ansible-automation/02_data_center/ansible && ansible-playbook playbooks/00_discover_dc_switch_serials.yml

- name: Stage 00a - build the switch group from the declared table
  hosts: localhost
  gather_facts: false
  connection: local
  any_errors_fatal: true

  tasks:
    - name: Assert the declared switch table is usable
      ansible.builtin.assert:
        that:
          - dc_switches is defined
          - dc_switches | length > 0
          - dc_switches | selectattr('name', 'undefined') | list | length == 0
          - dc_switches | selectattr('management_ipv4_address', 'undefined') | list | length == 0
          - dc_switches | selectattr('role', 'undefined') | list | length == 0
        fail_msg: >-
          inventory/group_vars/all/dc_switches.yml must declare a non-empty
          dc_switches list where every entry has a name,
          management_ipv4_address and role.

    # add_host adds a host to the inventory while the playbook runs; loop does it once per switch.
    # This keeps dc_switches.yml the single place where switch names and addresses are written.
    - name: Add each declared switch to the SSH group
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: dc_fabric_switches
        ansible_host: "{{ item.management_ipv4_address }}"
        dc_switch_role: "{{ item.role }}"
      loop: "{{ dc_switches }}"
      loop_control:
        label: "{{ item.name }} ({{ item.management_ipv4_address }})"
      changed_when: false

    # The edge router is outside the VXLAN fabric, but stage 04 also needs its serial.
    # It runs IOS-XE, not NX-OS, so it gets its own group and its own credentials.
    - name: Add the declared edge router to its own SSH group
      ansible.builtin.add_host:
        name: "{{ dc_external_edge_router.hostname }}"
        groups: dc_edge_routers
        ansible_host: "{{ dc_external_edge_router.ip }}"
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_user: "{{ lab_access[dc_external_edge_router.credential_key].username }}"
        ansible_password: "{{ lab_access[dc_external_edge_router.credential_key].password }}"
        ansible_command_timeout: 60
        ansible_connect_timeout: 60
      changed_when: false
      no_log: true

- name: Stage 00b2 - read the serial number off the edge router
  hosts: dc_edge_routers
  gather_facts: false
  ignore_unreachable: true

  tasks:
    # Use the chassis serial from `show inventory`; other modules have different serials.
    # The next task takes the "SN:" value from the line after the "Chassis" line.
    - name: Read the chassis serial number
      cisco.ios.ios_command:
        commands:
          - show inventory
      register: dc_edge_inventory
      ignore_errors: true
      changed_when: false

    - name: Keep the chassis serial for the next play
      ansible.builtin.set_fact:
        dc_switch_serial: >-
          {%- set lines = (dc_edge_inventory.stdout | default([]) | first | default('')).split('\n') -%}
          {%- set found = namespace(serial='') -%}
          {%- for index in range(lines | length) -%}
          {%- if 'Chassis' in lines[index] and found.serial == '' -%}
          {%- set next_line = lines[index + 1] | default('') -%}
          {%- if 'SN:' in next_line -%}
          {%- set found.serial = (next_line.split('SN:') | last) | trim -%}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {{ found.serial }}
      when: dc_edge_inventory is succeeded

- name: Stage 00b - read the serial number off each switch
  hosts: dc_fabric_switches
  gather_facts: false
  # Keep going when one switch is unreachable, so the report can show which.
  ignore_unreachable: true

  tasks:
    # Nexus Dashboard knows a switch by its chassis serial, so read that, not `show version`.
    # `| json` returns structured output that is easy to search. If a switch fails,
    # ignore_errors lets the run continue so the report below can name that switch.
    - name: Read the chassis serial number
      cisco.nxos.nxos_command:
        commands:
          - show inventory | json
      register: dc_switch_inventory
      ignore_errors: true
      changed_when: false

    - name: Keep the chassis serial for the next play
      ansible.builtin.set_fact:
        dc_switch_serial: >-
          {{ ((dc_switch_inventory.stdout | default([]) | first | default({})).TABLE_inv.ROW_inv
              | default([], true)
              | selectattr('name', 'defined')
              | selectattr('name', 'search', 'Chassis')
              | map(attribute='serialnum') | list | first | default('')) }}
      when: dc_switch_inventory is succeeded

- name: Stage 00c - generate the switch data model from the serial numbers
  hosts: localhost
  gather_facts: false
  connection: local
  any_errors_fatal: true

  vars:
    # The data model lives in playbooks/host_vars/, beside the playbooks, so the file is written there.
    dc_switch_model_dir: "{{ playbook_dir }}/host_vars/{{ dc_fabric_name }}"
    dc_switch_model_example: "{{ dc_switch_model_dir }}/topology_switches.nac.yaml.example"
    dc_switch_model_path: "{{ dc_switch_model_dir }}/topology_switches.nac.yaml"
    # The same path written short, for messages you may copy and paste.
    dc_switch_model_shown: "playbooks/host_vars/{{ dc_fabric_name }}/topology_switches.nac.yaml"

    # A name-to-serial list in group_vars/all, which Ansible loads for every later stage.
    dc_serial_lookup_path: "{{ playbook_dir }}/../inventory/group_vars/all/dc_device_serials.yml"
    dc_serial_lookup_shown: "inventory/group_vars/all/dc_device_serials.yml"
    dc_serial_lookup_names: >-
      {{ (dc_switches | map(attribute='name') | list)
         + [dc_external_edge_router.hostname] }}

    dc_serial_rows: >-
      {%- set rows = [] -%}
      {%- for sw in dc_switches -%}
      {{- rows.append('%-18s %-16s %-8s %s' | format(
            sw.name,
            sw.management_ipv4_address,
            sw.role,
            hostvars[sw.name].dc_switch_serial | default('', true) or 'UNREACHABLE')) or '' -}}
      {%- endfor -%}
      {{ rows }}

    dc_discovered_serials: >-
      {{ dc_switches | map(attribute='name')
         | map('extract', hostvars, 'dc_switch_serial') | list }}

    # Header placed at the top of the generated file instead of the .example's header.
    # Keep the "GENERATED BY" line: a check at the end of the play looks for it.
    dc_generated_model_header: |
      ---
      # GENERATED BY 00_discover_dc_switch_serials.yml - do not edit this file.
      # Re-running stage 00 overwrites it. To change the model, edit
      # topology_switches.nac.yaml.example or dc_switches.yml and run stage 00 again.

    # The text of the generated file, used only after it has been written and read back.
    dc_generated_model_text: "{{ dc_generated_model_raw.content | b64decode }}"

  tasks:
    - name: Show the serial numbers
      ansible.builtin.debug:
        msg: >-
          {{ ['%-18s %-16s %-8s %s' | format('SWITCH', 'MANAGEMENT IP', 'ROLE', 'SERIAL NUMBER')]
             + dc_serial_rows }}

    # Stop before writing anything if any switch did not answer.
    # A missing or wrong serial would only fail much later, when the fabric is built.
    - name: Require a serial for every declared switch
      ansible.builtin.assert:
        that:
          - dc_serial_rows | select('search', 'UNREACHABLE') | list | length == 0
        fail_msg: >-
          At least one declared switch did not return a serial number - see the
          UNREACHABLE rows above. Nothing has been written. This stage SSHes to
          the switches directly, so check that the VPN is up and that you can
          reach 198.18.128.x, that the management address in dc_switches.yml is
          right, and that the switch credentials in the vault are correct.
        success_msg: >-
          Read a serial number from all {{ dc_switches | length }} declared
          switch(es).

    - name: Copy the tracked shape reference over the generated model
      ansible.builtin.copy:
        src: "{{ dc_switch_model_example }}"
        dest: "{{ dc_switch_model_path }}"
        mode: "0644"

    - name: Swap the .example header for one that describes the generated file
      ansible.builtin.replace:
        path: "{{ dc_switch_model_path }}"
        regexp: '\A---\n(?:#[^\n]*\n)+'
        replace: "{{ dc_generated_model_header }}"

    # Find each switch by its `- name:` line and fill in its serial and role; nothing else changes.
    # Switch names must be spelled the same in dc_switches.yml and the .example file.
    - name: Stamp each switch's discovered serial and declared role
      ansible.builtin.replace:
        path: "{{ dc_switch_model_path }}"
        regexp: >-
          ^([ \t]*- name: {{ item.name | regex_escape }}[ \t]*\n[ \t]*serial_number: )[^\n]*(\n[ \t]*role: )[^\n]*
        replace: '\g<1>{{ hostvars[item.name].dc_switch_serial }}\g<2>{{ item.role }}'
      loop: "{{ dc_switches }}"
      loop_control:
        label: "{{ item.name }} -> {{ hostvars[item.name].dc_switch_serial }}"

    - name: Read the generated model back
      ansible.builtin.slurp:
        src: "{{ dc_switch_model_path }}"
      register: dc_generated_model_raw

    # Check the finished file itself, because a failed text substitution does not report an error.
    - name: Check no placeholder survived and every serial landed
      ansible.builtin.assert:
        that:
          - "'REPLACE_ME' not in dc_generated_model_text"
          - "'# GENERATED BY 00_discover_dc_switch_serials.yml' in dc_generated_model_text"
          - dc_discovered_serials | reject('in', dc_generated_model_text) | list | length == 0
        fail_msg: >-
          {{ dc_switch_model_shown }} was written but is not complete. Either a
          placeholder is still in it, or a serial this stage read never reached
          it, or the generated header is missing. The usual cause is a switch
          name in inventory/group_vars/all/dc_switches.yml that does not match
          the name in topology_switches.nac.yaml.example - the substitution
          anchors on that name, so a mismatch matches nothing at all. Do not
          run stage 02 against this file.

    - name: Check each switch carries its own serial and its declared role
      ansible.builtin.assert:
        that:
          - (dc_generated_model_text | from_yaml).vxlan.topology.switches
            | selectattr('name', 'eq', item.name)
            | selectattr('serial_number', 'eq', hostvars[item.name].dc_switch_serial)
            | selectattr('role', 'eq', item.role)
            | list | length == 1
        fail_msg: >-
          {{ dc_switch_model_shown }} does not hold exactly one {{ item.name }}
          entry carrying serial {{ hostvars[item.name].dc_switch_serial }}
          and role {{ item.role }}. Check that
          topology_switches.nac.yaml.example declares that switch once and only
          once.
      loop: "{{ dc_switches }}"
      loop_control:
        label: "{{ item.name }}"

    # One name-to-serial list for all switches and the edge router, used by later stages.
    - name: Write the serial lookup every later stage reads
      ansible.builtin.copy:
        dest: "{{ dc_serial_lookup_path }}"
        mode: "0644"
        content: |
          ---
          # GENERATED BY 00_discover_dc_switch_serials.yml - do not edit this file.
          # Serial numbers read off each device; stage 00 overwrites this file.
          # Not tracked in git, because the serials belong to this pod only.
          dc_device_serials:
          {% for name in dc_serial_lookup_names %}
            {{ name }}: "{{ hostvars[name].dc_switch_serial | default('') }}"
          {% endfor %}

    - name: Require a serial for the edge router too
      ansible.builtin.assert:
        that:
          - hostvars[dc_external_edge_router.hostname].dc_switch_serial | default('') | length > 0
        fail_msg: >-
          No serial was read from the edge router
          {{ dc_external_edge_router.hostname }} at
          {{ dc_external_edge_router.ip }}. Stage 04 needs it to add the router
          to the External fabric. Check that the device is reachable and that
          its credentials are declared under
          '{{ dc_external_edge_router.credential_key }}' in the vault.
        success_msg: >-
          Edge router {{ dc_external_edge_router.hostname }} serial
          {{ hostvars[dc_external_edge_router.hostname].dc_switch_serial }}.

    - name: Say what was written
      ansible.builtin.debug:
        msg:
          - "Wrote {{ dc_switch_model_shown }}"
          - "with a serial number for all {{ dc_switches | length }} declared switch(es),"
          - "and {{ dc_serial_lookup_shown }} with those plus the edge router."
          - ""
          - "Both are build output. Stage 00 overwrites them on every run, so"
          - "edit topology_switches.nac.yaml.example or dc_switches.yml instead."
          - "They are gitignored, because the serials belong to this pod alone."
          - ""
          - "Next:"
          - "  cd ansible-automation/02_data_center/ansible"
          - "  ansible-playbook playbooks/01_dc_deploy.yml"
