---
# Fabric settings that the Nexus as Code data model cannot express. Stage 03 applies them.
# VRF-Lite settings live separately in dc_vrf_lite.yml.

# Properties of the Pseudoco-DC1 fabric in Nexus Dashboard (fabric settings in the UI).
dc_advanced_nd_fabric_settings:
  # "License Tier": Premier, as the guide selects (the fabric starts as Essentials).
  license_tier: premier

  # "Telemetry": off, so the fabric does not stream data into Insights.
  # Already off on a new fabric; declaring it stops a later UI click drifting unnoticed.
  telemetry_collection: false

  # "Location": San Jose, California, US. Nexus Dashboard stores only coordinates,
  # so this comment is the only place the city name is kept. Give both values together.
  location:
    latitude: 37.3382
    longitude: -121.8863

# "Add Switches without Reload" is deliberately not here: Nexus as Code already sets it
# (greenfield_cleanup in global.nac.yaml), and two files setting one value would drift.
