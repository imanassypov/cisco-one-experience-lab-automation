---
# Fabric settings the guide sets that Nexus as Code cannot express.
#
# cisco.nac_dc_vxlan 0.9.0 has no data model key for any of the settings
# below. They are not optional extras: the guide's Resources tab sets the
# VRF-Lite values, and without them a VRF-Lite extension to the external
# router cannot be built. Stage 03 applies them directly, which is why it
# exists at all.
#
# This file is the declared intent. Stage 03 is the mechanism and holds no
# values of its own, so a change to the fabric is a change here.
#
# Two dictionaries, because Nexus Dashboard 4.2 keeps these settings in two
# different places and they are written through two different APIs. Which one
# a setting belongs to is not a judgement call - it was established by reading
# the live fabric back, and a setting in the wrong dictionary fails loudly
# rather than silently doing nothing.

# --------------------------------------------------------------------------
# Easy_Fabric template parameters, written with cisco.dcnm.dcnm_fabric.
#
# These are nvPairs on the fabric: the same store Nexus as Code writes the
# rest of the fabric into. Names are the controller's own nvPair names, not
# the UI labels, because that is what the module sends. Values may be written
# as natural YAML types - dcnm_fabric converts a boolean to "true"/"false" and
# an integer to its string form before comparing against the controller, so a
# second run of stage 03 is correctly a no-op.
# --------------------------------------------------------------------------
dc_advanced_fabric_settings:
  # UI: Resources tab, "VRF Lite Deployment". Guide step: "select
  # Back2BackAndToExternal".
  #
  # Cisco, "Editing Data Center VXLAN Fabric Settings", Nexus Dashboard
  # 4.2.1: "Specify the VRF Lite method for extending inter fabric
  # connections. The VRF Lite Subnet IP Range field specifies resources
  # reserved for IP address used for VRF Lite when VRF Lite IFCs are
  # auto-created. If you select Back2Back&ToExternal, then VRF Lite IFCs are
  # auto-created."
  # https://www.cisco.com/c/en/us/td/docs/dcn/nd/4x/articles-421/editing-fabric-settings-data-center-vxlan.html
  #
  # Cisco, "Nexus Dashboard Fabric Controller - VRF Lite", 12.2.1, on this
  # value specifically: "Use this option to automatically configure VRF Lite
  # IFCs between a border switch and the edge or core switches in external
  # fabric or between back-to-back border switches in VXLAN EVPN fabric."
  # The default is Manual, under which no IFC is ever auto-created.
  # https://www.cisco.com/c/en/us/td/docs/dcn/ndfc/1221/articles/ndfc-vrf-lite/vrf-lite.html
  #
  # The same article bounds which devices this applies to: "Autoconfiguration
  # is supported for the following cases: Border role in the VXLAN fabric and
  # Edge Router role in the connected external fabric device; Border Gateway
  # role in the VXLAN fabric and Edge Router role in the connected external
  # fabric device; Border role to another Border role directly."
  #
  # That sentence is why only DC-Service-Leaf ever reacts to this setting: it
  # is the one switch in dc_switches.yml with role: border, and the edge
  # router stage 04 adds is the one device with the edgeRouter role. The two
  # leaves and the two spines are outside the supported cases and are never
  # touched by it. See "What stage 05 needs from the controller" in the
  # collection README.
  #
  # The ampersand is the controller's own spelling of the nvPair value, not a
  # typo, and it differs from the UI label the guide quotes
  # ("Back2BackAndToExternal"). The nvPair is what dcnm_fabric sends, so the
  # nvPair spelling is the one that belongs here.
  VRF_LITE_AUTOCONFIG: "Back2Back&ToExternal"

  # UI: Resources tab, "Auto Deploy for Peer". Guide step: "Check the Auto
  # Deploy for Peer check box".
  #
  # Cisco, "Editing Data Center VXLAN Fabric Settings", Nexus Dashboard
  # 4.2.1: "This check box is applicable for VRF Lite deployment. When you
  # select this checkbox, auto-created VRF Lite IFCs will have the Auto
  # Generate Configuration for Peer field in the VRF Lite tab set. ... This
  # configuration only affects the new auto-created IFCs and does not affect
  # the existing IFCs."
  #
  # So this setting writes no configuration itself. It is a default carried
  # onto each IFC at the moment the IFC is auto-created, and the Cisco text
  # is explicit that flipping it later does not reach an IFC that already
  # exists.
  #
  # What the field it presets does, from the same VRF Lite article: "Auto
  # Generate Configuration for Peer - Specifies to auto generate a VRF-Lite
  # configuration for managed NX-OS neighbor devices. This knob autoconfigures
  # the neighbor VRF on the neighboring managed device."
  #
  # ON THIS POD IT HAS NO EFFECT, for two independently sufficient reasons,
  # and it is declared anyway because the guide declares it and this file
  # mirrors the guide's fabric settings:
  #
  #   - The peer is not NX-OS. DC-SITE11-CEDGE8Kv is an IOS-XE Catalyst
  #     8000V. Cisco's guidelines for automatic VRF Lite (IFC) configuration
  #     state "Auto IFC is supported on Cisco Nexus devices only" and "If the
  #     device in the External fabric is non-Nexus, you must create IFC
  #     manually." The student guide says the same thing in its own note
  #     beside this checkbox: "Nexus Dashboard can automate configuration on
  #     the external device if it is NXOS or ASR9k."
  #   - The External fabric is in Monitor Mode. Cisco: "To deploy
  #     configurations in the external fabric, you must uncheck the Fabric
  #     Monitor Mode check box in the external fabric settings. When an
  #     external fabric is set to Fabric Monitor Mode Only, you cannot deploy
  #     configurations on the switches." dc_external_settings.yml sets
  #     IS_READ_ONLY: true deliberately, because the lab's edge router is
  #     pre-configured and must not be overwritten.
  #
  # The practical consequence is that VRF-Lite automation in this lab stops
  # at the border leaf. Everything beyond it was configured by hand before
  # the pod was handed over.
  #
  # nvPair-to-UI mapping confirmed against the CiscoDevNet NDFC Terraform
  # provider, which documents auto_symmetric_vrf_lite as "Whether to auto
  # generate VRF LITE sub-interface and BGP peering configuration on managed
  # neighbor devices. If set, auto created VRF Lite IFC links will have Auto
  # Deploy for Peer enabled."
  # https://registry.terraform.io/providers/CiscoDevNet/ndfc/latest/docs/data-sources/fabric
  AUTO_SYMMETRIC_VRF_LITE: true

  # UI: Resources tab, "Auto Allocation of Unique IP on VRF Extension over
  # VRF Lite IFC". Gives every VRF extension its own /30 out of the range
  # below rather than reusing one subnet across VRFs.
  AUTO_UNIQUE_VRF_LITE_IP_PREFIX: true

  # UI: Resources tab, "VRF Lite Subnet IP Range" and "VRF Lite Subnet Mask".
  # The pool the per-extension point-to-point links are cut from. The default
  # is 10.33.0.0/16, which overlaps nothing in this pod but is not the value
  # the guide uses.
  DCI_SUBNET_RANGE: 192.168.252.0/24
  DCI_SUBNET_TARGET_MASK: 30

# --------------------------------------------------------------------------
# Nexus Dashboard fabric object properties, written with cisco.dcnm.dcnm_rest.
#
# These two are NOT nvPairs. Neither name appears anywhere in the 423 nvPairs
# of the live fabric; they live on the Nexus Dashboard 4.2 fabric object at
# /api/v1/manage/fabrics/<fabric>, alongside a camelCase mirror of the
# nvPairs. dcnm_fabric cannot reach them, so stage 03 does a read-modify-write
# on that object instead. Names and values here are exactly as the API
# returns them, lower case included.
# --------------------------------------------------------------------------
dc_advanced_nd_fabric_settings:
  # UI: fabric settings, "License Tier". Premier is the tier the guide
  # selects; the fabric is created as essentials.
  licenseTier: premier

  # UI: fabric settings, "Telemetry". Unchecked, so Nexus Dashboard does not
  # stream fabric telemetry into Insights. Already false on a freshly created
  # fabric, so declaring it here is enforcement rather than a change - it
  # stops a later UI click from drifting away unnoticed.
  telemetryCollection: false

  # UI: fabric settings, "Location". San Jose, California, US.
  #
  # Coordinates, not a place name, and that is not a shortcut taken here:
  # Nexus Dashboard has no field for the name. There is no city, country or
  # address key anywhere on the fabric object, in its management sub-object or
  # among the fabric's 423 nvPairs - checked, not assumed. The UI's location
  # picker geocodes whatever you type and stores only these two numbers, then
  # drops a pin on the fabric map. So the place name lives in this comment and
  # nowhere else, which is the reason the comment is here.
  #
  # Both keys have to be given together. The stage applies this dictionary
  # with a non-recursive combine, so a partial location would replace the
  # whole object and leave the other coordinate at zero.
  location:
    latitude: 37.3382
    longitude: -121.8863

# --------------------------------------------------------------------------
# Deliberately NOT here
#
# "Add Switches without Reload" is the Advanced-tab dropdown behind the
# GRFIELD_DEBUG_FLAG nvPair, and Nexus as Code does model it - as
# vxlan.global.ibgp.greenfield_cleanup in
# playbooks/host_vars/Pseudoco-DC1/global.nac.yaml, already set to Enable.
# It is not duplicated here on purpose. Two files setting one nvPair is a
# drift bug waiting to happen, and the rule for this stage is that it carries
# only what Nexus as Code cannot express.
# --------------------------------------------------------------------------
