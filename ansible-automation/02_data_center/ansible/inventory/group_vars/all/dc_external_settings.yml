---
# Declared intent for the External connectivity fabric - guide section 7,
# "Create an External Fabric". 04_external_fabric.yml is the mechanism and
# holds no values; this file holds the values and no mechanism.
#
# Unlike Pseudoco-DC1, this fabric has no Nexus as Code data model, because
# the collection's create role cannot build it. The role always runs a
# config-save after its inventory step, and on a fabric with no switches
# Nexus Dashboard returns HTTP 500 "Fabric External cannot be deployed
# without any switches". The fabric also holds no VRFs, networks or
# interfaces, so there is nothing for the collection to express.
#
# EVALUATION BRANCH (eval/nd-l3out): stage 04 creates the fabric with
# cisco.nd.nd_manage_fabric_external and adds the edge router with
# cisco.nd.nd_manage_switches, both from this file. Keys under
# dc_external_fabric_settings are that module's config.management options,
# passed through unchanged, so Ansible's argument check rejects a typo before
# anything is sent.
#
# Everything not listed here is left at the controller default. That is
# deliberate: the fewer values declared, the fewer that can drift from a
# controller upgrade.

# The fabric's name, matching the host it is driven through in
# inventory/static_inventory.yml. Declared so a play that is not running
# against that host - stage 04's link play runs against the DC fabric - can
# still name it.
dc_external_fabric_name: External

dc_external_fabric_settings:
  # Guide: ASN 65531. Distinct from the DC fabric's 65000 - this is the other
  # side of the eBGP VRF-Lite handoff, so the two must differ.
  bgp_asn: "65531"

  # Fabric Monitor Mode. The guide leaves it checked so Nexus Dashboard reads
  # the external device and never writes to it. It is set at creation rather
  # than afterwards so the fabric is never briefly writable.
  monitored_mode: true

# The IOS-XE edge router that lives in this fabric. Guide section 7, "Add
# Switches": Seed IP 198.18.133.14, Device Type "IOS XE and CSR/CAT8K".
#
# platform_type is nd_manage_switches' spelling of that Device Type dropdown.
# It selects the discovery protocol rather than labelling the device: without
# it the module defaults to nx-os and the seed gets the NX-OS SNMPv3 path,
# which this router does not answer.
#
# model, software version and serial number are not declared here. They are
# pod-specific; the module discovers them, and stage 04 checks the serial it
# reports against the one stage 00 read off the router.
#
# credential_key names the vault entry holding the router's login. The
# credential itself stays in the vault-encrypted lab_access.yml; nothing in
# this tree holds a password.
dc_external_edge_router:
  ip: 198.18.133.14
  hostname: DC-SITE11-CEDGE8Kv
  platform_type: ios-xe
  credential_key: DC-SITE11-CEDGE8Kv
