---
# Settings for the External fabric (guide section 7): a fabric that holds only the edge router.
# Stage 04 (04_external_fabric.yml) reads these values to create it and add the router.
# Anything not listed is left at the Nexus Dashboard default.

# The fabric's name; it matches the External host in inventory/static_inventory.yml.
dc_external_fabric_name: External

dc_external_fabric_settings:
  # The router's BGP AS. It must differ from the DC fabric's 65000 because the handoff is eBGP.
  bgp_asn: "65531"

  # Monitor Mode: Nexus Dashboard only reads the router and never writes to it.
  # Set at creation so the fabric is never writable, even briefly.
  monitored_mode: true

# The IOS-XE edge router that lives in this fabric (guide: "Add Switches").
# platform_type matches the guide's Device Type "IOS XE and CSR/CAT8K" and decides how it is discovered.
# credential_key names the router's entry in the vault; no password is stored here.
dc_external_edge_router:
  ip: 198.18.133.14
  hostname: DC-SITE11-CEDGE8Kv
  platform_type: ios-xe
  credential_key: DC-SITE11-CEDGE8Kv
