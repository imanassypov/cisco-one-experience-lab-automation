---
# VRF-Lite handoff: how each DC VRF leaves the fabric to the edge router (guide section 8).
# VRF-Lite means one routed sub-interface plus one eBGP session per VRF on a shared wire.
# Evaluation branch: the handoffs are built as Nexus Dashboard "L3Out" objects (stages 03-05).

# Fabric-wide VRF-Lite behaviour. "manual" stops Nexus Dashboard picking its own VLAN tags,
# which would not match the pre-built router. The subnet values are the controller's
# default address pool; every address below is pinned, so they are a fallback only.
dc_vrf_lite_fabric_settings:
  vrf_lite_auto_config: manual
  vrf_lite_subnet_range: 192.168.252.0/24
  vrf_lite_subnet_target_mask: 30

# The border leaf that carries every handoff, and its port that faces the edge router.
dc_vrf_lite_border_leaf: DC-Service-Leaf
dc_vrf_lite_interface: Ethernet1/8

# The router's end of the same wire. Nothing is ever written to the router (Monitor Mode).
dc_vrf_lite_peer_interface: GigabitEthernet2

# The inter-fabric link: the physical cable between the two fabrics, created by stage 04.
# The parent ports carry no IP; these addresses are only defaults that each L3Out overrides.
# link_mtu must match the router's GigabitEthernet2 (1500) so both ends of the wire agree.
dc_vrf_lite_ifc:
  src_ip_address_mask: 192.168.252.1/30
  dst_ip_address: 192.168.252.2
  link_mtu: 1500

# MTU on the three sub-interfaces. The router's side is fixed at 1500, so ours must match,
# and a sub-interface can never be larger than its parent (link_mtu above).
dc_vrf_lite_mtu: 1500

# Sub-interface names are written as parent.tag, e.g. Ethernet1/8.2 (Nexus Dashboard requires it).
dc_vrf_lite_interface_form: subinterface

# Which handoffs stages 05 and 07 act on: all, or one or more VRF names.
dc_vrf_lite_only: all

# The three handoffs, one L3Out each. Addresses and tags are pinned because the edge router
# is pre-built and cannot be changed: it already expects these peers in AS 65000 (the DC ASN).
# dot1q = sub-interface VLAN tag; ipv4_addr = leaf side; neighbor_ipv4 = router side.
dc_vrf_lite_extensions:
  - name: PROD-External
    vrf: PROD
    peer_vrf: PROD
    dot1q: 2
    ipv4_addr: 192.168.252.5/30
    neighbor_ipv4: 192.168.252.6

  - name: IOT-External
    vrf: IOT
    peer_vrf: IOT
    dot1q: 3
    ipv4_addr: 192.168.252.9/30
    neighbor_ipv4: 192.168.252.10

  - name: MAIN-External
    vrf: MAIN
    peer_vrf: MAIN
    dot1q: 4
    ipv4_addr: 192.168.252.13/30
    neighbor_ipv4: 192.168.252.14
