---
# VRF-Lite fabric settings, inter-fabric link, and extensions out of the border
# leaf. Guide section 8, "Create VRF-Lite Connections to External".
#
# This file exists because the Nexus as Code data model cannot express a
# VRF-Lite EXTENSION. A vrf_attach_group entry in vrfs.nac.yaml can name a
# switch and nothing else - there is no key for EXTEND: VRF_LITE, for the
# sub-interface, for the dot1q tag or for the neighbour address. So the
# VRF-Lite settings and extensions are declared here and applied by stages 03,
# 04, and 06.
#
# Stage 06 does NOT use dcnm_vrf. That module's vrf_lite block accepts only
# DOT1Q_ID, IF_NAME, IP_MASK, IPV6_MASK, IPV6_NEIGHBOR, NEIGHBOR_IP and
# PEER_VRF_NAME - it has no key for MTU, and it hardcodes the Jython template
# to Ext_VRF_Lite_Jython, which is wrong for an IOS-XE peer. Stage 06 posts to
# rest/top-down/fabrics/<fabric>/vrfs/attachments directly instead, starting
# from the prototype the controller offers so that the neighbour ASN and the
# template come from the inter-fabric link rather than from a guess.
#
# The plain ATTACHMENT is a different matter and is NOT declared here. Since
# 2026-09-27 DC-Service-Leaf is listed in vrfs.nac.yaml's dc_leaves attach
# group, so the model owns the attachment and stage 06 only adds the extension
# on top of it. That mirrors the manual guide, whose section 8 has two
# separate Detach/Attach sliders per VRF: attach the VRF to the border leaf
# first, then enable the external L3 extension inside Edit Extension Details.
#
# ORDERING. Stage 06 sits between the two deploys. It writes intent to the
# controller and touches no switch, the same thing stages 02, 03 and 04 do, so
# the three dot1q sub-interfaces and their BGP neighbours all land in the
# second Recalculate and Deploy, which is stage 07.
#
# Stage 06 must run after stage 02 on every pass. Stage 02's create role runs
# dcnm_vrf with state: replaced, and a replaced want with no vrf_lite against a
# have that has one takes dcnm_vrf.py lines 1543-1549 and pushes the change,
# stripping the extension; merged takes line 1551 and leaves it alone. So
# stage 02 maintains the attachment and resets only the extension. Stage 08
# asserts the extensions exist, so a create-without-06 run fails rather than
# being discovered later as broken external connectivity.
#
# What stage 06 depends on, which is not any of the above. The controller will
# not offer a VRF-Lite extension on this interface until a VRF-Lite
# inter-fabric link terminates there and the parent interface has actually been
# configured on the switch. Stage 04 creates the link from dc_vrf_lite_ifc
# below; stage 05 deploys it. So stage 05 has to run before stage 06 on a fresh
# build. If the prototype is missing, stage 06 says so and names stage 05.
#
# The dot1q tags below are also RESERVED by stage 06 before it attaches
# anything, out of the TOP_DOWN_L3_DOT1Q pool. Left to itself the controller
# allocates its own tags during the attachment POST and the run dies half way
# through with "Id[3]is already allocated to MAIN"; see the comment on that
# block in playbooks/06_vrf_lite.yml.
#
# The parent interface the sub-interfaces below sit on is built by the
# controller from dc_vrf_lite_ifc, not declared per sub-interface here. It
# appears in the Pending Config dialog as:
#
#   interface ethernet1/8
#     no switchport
#     mtu 1500
#     description connected-to-DC-SITE11-CEDGE8Kv-GigabitEthernet2
#     no shutdown
#
# Note what that does NOT prove. It has no ip address and no encapsulation,
# so it is equally consistent with an ext_fabric_setup VRF-Lite IFC and with
# a plain discovered external link that the controller converted to Layer 3.
# Only the link's templateName distinguishes them; stage 06 reports when the
# required prototype is absent.

# Fabric-wide VRF-Lite behavior and allocation pool. Stage 03 applies these
# Easy_Fabric nvPairs; they live here with the link and extensions they govern.
# Manual prevents Nexus Dashboard from auto-creating an IFC with controller-
# chosen tags. The explicit link and per-VRF values below must match the
# pre-configured router. The subnet range and target mask define the pool and
# prefix size used for the point-to-point links.
#
# AUTO_SYMMETRIC_VRF_LITE and AUTO_UNIQUE_VRF_LITE_IP_PREFIX are deliberately
# absent: under Manual the controller rejects them.
dc_vrf_lite_fabric_settings:
  VRF_LITE_AUTOCONFIG: "Manual"
  DCI_SUBNET_RANGE: 192.168.252.0/24
  DCI_SUBNET_TARGET_MASK: 30

# The border leaf that carries every extension, and the interface on it that
# faces the edge router. Ethernet1/8 is not chosen here - Nexus Dashboard
# detects it over CDP and the guide confirms it: "the interfaces connecting
# your border leaf and external router are automatically detected with being
# Ethernet1/8 and GigabitEthernet2". It is declared so the run is
# deterministic and so stage 07 has something to assert against.
dc_vrf_lite_border_leaf: DC-Service-Leaf
dc_vrf_lite_interface: Ethernet1/8

# The far end of the same physical link, on DC-SITE11-CEDGE8Kv. Detected over
# CDP exactly as Ethernet1/8 is, and named in the controller's own generated
# description (connected-to-DC-SITE11-CEDGE8Kv-GigabitEthernet2). Nothing is
# written to it - the External fabric is in Monitor Mode. It is declared
# because the declared peer interface documents the other end of the
# inter-fabric link.
dc_vrf_lite_peer_interface: GigabitEthernet2

# THE INTER-FABRIC LINK ITSELF, which this collection now creates rather than
# letting the controller auto-create.
#
# With VRF_LITE_AUTOCONFIG set to Back2Back&ToExternal the controller builds
# this link on its own - and, while doing so, allocates a dot1q ID per VRF out
# of TOP_DOWN_L3_DOT1Q in an order of its own choosing. Measured on
# 2026-09-27 it handed PROD 2, MAIN 3 and IOT 4, where the pre-built router
# needs PROD 2, IOT 3 and MAIN 4. Stage 06 then cannot write the declared tags
# because they are a permutation of the controller's: MAIN cannot take 4 while
# IOT holds it, and the controller answers HTTP 500 "Id[3] is already
# allocated to MAIN". Nothing in the payload can resolve that, because the
# allocation happens before stage 06 runs.
#
# So dc_vrf_lite_fabric_settings sets VRF_LITE_AUTOCONFIG to Manual and the
# values below are declared. Nothing
# is auto-allocated, and the data model is authoritative end to end.
#
# These are the parent link's own addresses, not a VRF's. The controller used
# 192.168.252.0/30 for it, the first /30 of DCI_SUBNET_RANGE, and the router's
# GigabitEthernet2 carries no address at all - the peering that matters is
# per-VRF on the sub-interfaces below.
dc_vrf_lite_ifc:
  ipv4_addr: 192.168.252.1/30
  neighbor_ipv4: 192.168.252.2
  # The parent interface MTU, which becomes Link MTU on the IFC. Set to match
  # GigabitEthernet2 on the router, which is at the IOS-XE default of 1500 and
  # carries no mtu line of its own. The controller's own convention for an IFC
  # is 9000, and that works - the parent carries no address and no untagged
  # traffic, so nothing can generate a frame the router would drop - but it
  # leaves the two ends of one wire disagreeing. Matching them means a future
  # untagged service on this link cannot inherit a silent mismatch.
  #
  # Every sub-interface has to stay at or below this; dc_vrf_lite_mtu further
  # down is 1500, so the two are equal rather than nested.
  mtu: 1500

# WHY THE ADDRESSES ARE PINNED RATHER THAN LEFT TO THE CONTROLLER.
#
# If Nexus Dashboard auto-created an IFC with unique-IP allocation enabled, it
# could draw addresses from DCI_SUBNET_RANGE. This pipeline uses Manual mode
# and declares the link and each extension explicitly instead. The addresses
# are pinned because the router is already configured and cannot be changed by
# this controller.
#
# The External fabric is in Monitor Mode (IS_READ_ONLY: true), so Nexus
# Dashboard will never write to DC-SITE11-CEDGE8Kv. Its side of these three
# links is pre-built by the pod. If the leaf picked its own addresses they
# would not match the router and BGP would never come up.
#
# The router's side is built and running. "show ip interface brief" on it
# lists GigabitEthernet2.2, .3 and .4 up/up with 192.168.252.6, .10 and .14,
# which are exactly the three neighbor_ipv4 values below, and it has an eBGP
# neighbour configured for each of .5, .9 and .13 in AS 65000.
#
# peer_vrf is the name Nexus Dashboard would give the VRF on the router if it
# configured the far end, which in Monitor Mode it never does. The router's
# own VRFs are numbered - "show vrf" on it returns 10, 101 and 102, because
# vManage names them by SD-WAN VPN id - so these rows carry the fabric's own
# VRF name on both sides. That is what the controller stores and what stage 07
# checks; nothing compares it to the router.
#
# MTU on the three sub-interfaces, declared here because leaving it out breaks
# the deploy.
#
# Nexus Dashboard builds each sub-interface from the VRF extension template
# Default_VRF_Extension_Universal, which has a per-extension "Subinterface MTU"
# field and falls back to 9216 when that field is empty. dcnm_vrf never fills
# it in - its vrf_lite block accepts only peer_vrf, interface, ipv4_addr,
# neighbor_ipv4, ipv6_addr, neighbor_ipv6 and dot1q - so the template takes the
# fallback and asks for 9216.
#
# The parent Ethernet1/8 takes its MTU from dc_vrf_lite_ifc.mtu above, which
# becomes Link MTU on the inter-fabric link, and the switch refuses a
# sub-interface larger than its parent:
#
#   Delivery failed with message: MTU of sub-interface greater than parent
#   interface detected
#
# That rules 9216 out but does not pick a value. The router picks it. This is
# a routed link, so both ends have to agree on how large an IP packet may be,
# and DC-SITE11-CEDGE8Kv reports 1500 on all three of its sub-interfaces:
#
#   DC-SITE11-CEDGE8Kv# show ip interface GigabitEthernet2.2
#     Internet address is 192.168.252.6/30
#     MTU is 1500 bytes
#
# They inherit it from GigabitEthernet2, which is MTU 1500 and carries no mtu
# or ip mtu line of its own. Monitor Mode means the controller can never raise
# the router to meet a larger value, so anything above 1500 would leave the
# two ends disagreeing: packets the leaf is willing to send would be too big
# for the router to accept, and they would be dropped rather than fragmented.
#
# 06_vrf_lite.yml applies this after dcnm_vrf, over the attachments API,
# because the module has no key for it.
dc_vrf_lite_mtu: 1500

# dot1q is a string, not an integer: dcnm_vrf declares it type: str. Quoting
# it here keeps the playbook from relying on YAML's implicit int-to-str
# coercion at module boundary.
#
# The order below is the order the guide works through - PROD, then IOT, then
# MAIN - which is also ascending dot1q and ascending address.
dc_vrf_lite_extensions:
  - vrf: PROD
    peer_vrf: PROD
    dot1q: "2"
    ipv4_addr: 192.168.252.5/30
    neighbor_ipv4: 192.168.252.6

  - vrf: IOT
    peer_vrf: IOT
    dot1q: "3"
    ipv4_addr: 192.168.252.9/30
    neighbor_ipv4: 192.168.252.10

  - vrf: MAIN
    peer_vrf: MAIN
    dot1q: "4"
    ipv4_addr: 192.168.252.13/30
    neighbor_ipv4: 192.168.252.14
