---
# The DC switch list: names, management addresses and fabric roles (the same in every pod).
# Serial numbers differ per pod, so stage 00 reads them off the switches instead of storing them.
# This is the single source for the switch list; names must match topology_switches.nac.yaml.example.

dc_fabric_name: Pseudoco-DC1

# Default gateway for the switches' management (mgmt0) ports. Left commented out because
# the right value for this pod is not yet confirmed; Nexus Dashboard would push it as-is.
# dc_management_default_gateway: 198.18.128.1

dc_switches:
  - name: DC-Leaf1
    management_ipv4_address: 198.18.128.101
    role: leaf

  - name: DC-Leaf2
    management_ipv4_address: 198.18.128.102
    role: leaf

  - name: DC-SPINE-1
    management_ipv4_address: 198.18.128.11
    role: spine

  - name: DC-SPINE-2
    management_ipv4_address: 198.18.128.12
    role: spine

  # Border leaf: the guide changes its role from leaf to border, and it carries
  # the VRF-Lite handoffs to the edge router.
  - name: DC-Service-Leaf
    management_ipv4_address: 198.18.128.13
    role: border
