---
# How Ansible connects to Nexus Dashboard (the "nd" group) over its HTTPS API.
# Credentials come only from the vault-encrypted Lab Topology/lab_access.yml.
# Do not reintroduce environment variables and do not put passwords in this file.
ansible_connection: ansible.netcommon.httpapi
ansible_network_os: cisco.dcnm.dcnm
ansible_httpapi_port: 443
ansible_httpapi_use_ssl: true
ansible_httpapi_validate_certs: false
ansible_httpapi_login_domain: local

# Nexus Dashboard login.
ansible_user: "{{ lab_access['Cisco Nexus Dashboard'].username }}"
ansible_password: "{{ lab_access['Cisco Nexus Dashboard'].password }}"

# The login Nexus Dashboard uses to reach and manage the switches.
# All DC switches share one account, so the DC-Leaf1 entry stands for all of them.
ndfc_switch_username: "{{ lab_access['DC-Leaf1'].username }}"
ndfc_switch_password: "{{ lab_access['DC-Leaf1'].password }}"

# Long timeouts (seconds): adding switches to the fabric can take minutes.
# With the 30 s default the run fails with an error that looks like a bad password.
ansible_command_timeout: 1000
ansible_connect_timeout: 1000
