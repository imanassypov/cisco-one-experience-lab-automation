---
# SSH settings for logging in to the DC switches directly.
# Only stage 00 (reading serial numbers) uses them; every other stage talks to Nexus Dashboard.
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: cisco.nxos.nxos

# Login from the vault; all DC switches share the DC-Leaf1 account. No passwords in this file.
ansible_user: "{{ lab_access['DC-Leaf1'].username }}"
ansible_password: "{{ lab_access['DC-Leaf1'].password }}"

# NX-OS has no enable mode, and the lab account is already an administrator.
ansible_become: false

# Extra time (seconds) because the switches are reached over the lab VPN.
ansible_command_timeout: 60
ansible_connect_timeout: 60
