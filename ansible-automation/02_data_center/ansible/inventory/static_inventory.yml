---
# Inventory. Each "host" in the nd group is a FABRIC, not a device; Ansible reaches it
# through Nexus Dashboard. A fabric's data model is in playbooks/host_vars/<host name>/.
# The host name must equal the fabric name.
all:
  children:
    nd:
      hosts:
        # The Data Center VXLAN EVPN fabric that the guide builds.
        Pseudoco-DC1:
          ansible_host: ndfc.corp.pseudoco.com
        # The External fabric holding the edge router, created in Monitor Mode by stage 04.
        # It has no data model; its settings are in group_vars/all/dc_external_settings.yml.
        External:
          ansible_host: ndfc.corp.pseudoco.com

    # The DC switches themselves, reached over SSH by stage 00 only.
    # Empty on purpose: stage 00 adds them at run time from group_vars/all/dc_switches.yml,
    # so the switch list lives in one place.
    dc_fabric_switches:
      hosts: {}
