---
# Ansible collections (add-on modules) this project needs, pinned for Nexus Dashboard 4.2.1.10.
# cisco.nac_dc_vxlan turns the data model into config; it needs cisco.dcnm 3.13.0 or later.
# Keep identical to the script server bootstrap's requirements.yml, which does the install.
collections:
  - name: cisco.nac_dc_vxlan
    version: "0.9.0"
  - name: cisco.dcnm
    version: "3.13.0"
  - name: cisco.nxos
    version: "10.2.0"
  - name: ansible.netcommon
    version: "7.1.0"
  - name: ansible.utils
    version: "5.1.2"
  - name: ansible.posix
    version: "2.0.0"
  - name: community.general
    version: "10.1.0"
